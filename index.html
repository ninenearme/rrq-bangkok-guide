<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>RRQ Bangkok Survival Guide</title>
<meta name="description" content="An independent Bangkok companion for Indonesian-speaking esports players and staff: Thai phrasebook, food explorer, transport, experiences, hidden gems and emergency essentials.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#08080a;--bg2:#121115;--surface:#1a181d;--surface2:#232026;
  --gold:#E8A317;--gold-hi:#FFC23A;--champ:#FFE2A0;--orange:#FF7A1A;
  --text:#F8F8F8;--muted:#A8A3A0;--line:#2f2b30;
  --danger:#e5484d;--ok:#5fbf8a;
  --f-ui:"Inter","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"Rajdhani","Noto Sans Thai",system-ui,sans-serif;
  --r:10px;--r-sm:8px;--gut:16px;--hdr:60px;--bnav:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;color-scheme:dark}
body{background:var(--bg);color:var(--text);font:400 15px/1.6 var(--f-ui);min-height:100svh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.12;letter-spacing:-.01em;font-weight:600}
p{color:#d4d4d4}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px;border-radius:6px}
::selection{background:var(--gold);color:#000}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{flex:none}
.muted{color:var(--muted)}
.gold{color:var(--gold-hi)}
.hide{display:none!important}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 var(--gut)}
@media(min-width:900px){:root{--gut:32px}}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:50;height:var(--hdr);background:rgba(8,8,10,.82);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line)}
.hdr::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold-hi) 50%,var(--gold) 80%,transparent);opacity:.55}
.hdr .wrap{display:flex;align-items:center;height:100%;gap:10px}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--f-head);font-weight:700;letter-spacing:.08em;white-space:nowrap}
.brand b{color:var(--gold-hi);font-size:20px;letter-spacing:.14em}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.22em;font-weight:500}
.nav{display:none;gap:2px;margin-left:18px;flex:1}
.nav a{position:relative;padding:8px 11px;font-size:13px;font-weight:500;color:#cfcfcf;letter-spacing:.02em;border-radius:8px;transition:color .2s}
.nav a::after{content:"";position:absolute;left:11px;right:11px;bottom:2px;height:1.5px;background:var(--gold-hi);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
.nav a:hover,.nav a.on{color:#fff}.nav a:hover::after,.nav a.on::after{transform:scaleX(1)}
.hdr__r{margin-left:auto;display:flex;align-items:center;gap:6px}
.icon-btn{width:42px;height:42px;display:inline-grid;place-items:center;border-radius:50%;color:#ddd;transition:background .2s,color .2s}
.icon-btn:hover{background:var(--surface);color:var(--gold-hi)}
.langsw{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--bg2)}
.langsw button{padding:5px 12px;font-size:12px;font-weight:600;border-radius:999px;color:var(--muted);min-height:36px}
.langsw button.on{background:var(--gold);color:#0a0a0a}
@media(min-width:1180px){.nav{display:flex}.menu-btn{display:none}}

/* drawer */
.drawer{position:fixed;inset:0;z-index:80;visibility:hidden}
.drawer.open{visibility:visible}
.drawer__scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .3s}
.drawer.open .drawer__scrim{opacity:1}
.drawer__p{position:absolute;top:0;bottom:0;right:0;width:min(88vw,380px);background:var(--bg2);border-left:1px solid var(--line);padding:18px 16px calc(24px + var(--safe-b));overflow:auto;transform:translateX(100%);transition:transform .35s var(--ease)}
.drawer.open .drawer__p{transform:none}
.drawer h4{font-size:11px;letter-spacing:.22em;color:var(--gold-hi);margin:18px 6px 8px;text-transform:uppercase;font-weight:600}
.drawer a{display:flex;align-items:center;gap:12px;padding:13px 10px;border-radius:12px;font-weight:500;min-height:48px}
.drawer a:hover,.drawer a.on{background:var(--surface);color:var(--champ)}
.drawer a .ic{color:var(--gold-hi)}
.drawer .langsw{margin:6px;width:max-content}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:60;height:calc(var(--bnav) + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(16,14,18,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}
.bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--muted);min-height:var(--bnav);letter-spacing:.02em;position:relative}
.bnav .on{color:var(--gold-hi)}
.bnav .on::before{content:"";position:absolute;top:0;width:28px;height:2px;background:var(--gold-hi);border-radius:2px}
@media(min-width:1180px){.bnav{display:none}}
main{padding-bottom:calc(var(--bnav) + var(--safe-b) + 24px);min-height:70svh}
@media(min-width:1180px){main{padding-bottom:60px}}

.sos{position:fixed;right:14px;bottom:calc(var(--bnav) + var(--safe-b) + 14px);z-index:55;display:flex;align-items:center;gap:8px;height:48px;padding:0 16px 0 13px;border-radius:999px;background:#b3262b;color:#fff;font-weight:700;font-size:13px;letter-spacing:.06em;box-shadow:0 8px 24px rgba(179,38,43,.45);border:1px solid rgba(255,255,255,.18);transition:transform .2s}
.sos:hover{transform:translateY(-2px)}
@media(min-width:1180px){.sos{bottom:22px;right:22px}}
@media(max-width:420px){.sos span{display:none}.sos{padding:0 13px;width:48px;justify-content:center}}

/* ---------- view transition ---------- */
.view{animation:vin .45s var(--ease) both}
@keyframes vin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.section{padding:36px 0}
.shead{padding:34px 0 18px}
.kicker{display:inline-flex;align-items:center;gap:10px;font:600 11px var(--f-head);letter-spacing:.28em;text-transform:uppercase;color:var(--gold-hi)}
.kicker::before{content:"";width:28px;height:1px;background:var(--gold)}
.display{font-size:clamp(34px,7.2vw,72px);font-weight:700;letter-spacing:-.025em;margin:12px 0 10px;text-wrap:balance}
.lead{max-width:680px;color:#bdbdbd;font-size:clamp(15px,2vw,18px)}
h2.h2{font-size:clamp(22px,3.4vw,34px);margin:0 0 6px}
.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.rule{height:1px;background:linear-gradient(90deg,var(--gold),transparent);border:0;margin:28px 0;opacity:.5}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-top:20px;min-height:40px}
.back:hover{color:var(--gold-hi)}

/* ---------- hero ---------- */
.hero{position:relative;min-height:min(86svh,820px);display:flex;align-items:flex-end;overflow:hidden;isolation:isolate;border-bottom:1px solid var(--line)}
.hero__bg{position:absolute;inset:-4% 0;z-index:-2;background:#0c0c0c center/cover no-repeat;will-change:transform}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,8,10,.55) 0%,rgba(8,8,10,.35) 30%,rgba(8,8,10,.82) 78%,var(--bg) 100%),linear-gradient(90deg,rgba(8,8,10,.78),transparent 70%)}
.hero__in{padding:90px var(--gut) 28px;width:100%}
.hero h1{font-size:clamp(40px,10.5vw,118px);font-weight:700;letter-spacing:-.035em;line-height:.95;max-width:12ch;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--gold-hi)}
.hero__tag{font:600 clamp(12px,2.2vw,15px) var(--f-head);letter-spacing:.3em;color:var(--champ);margin:22px 0 14px;display:flex;align-items:center;gap:12px}
.hero__tag::before{content:"";width:44px;height:1px;background:var(--gold-hi)}
.hero p.lead{max-width:560px;color:#d9d9d9;margin-bottom:24px}
.hero__cta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:34px}
.shimmer{position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold-hi),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:shim 5s linear infinite;opacity:.8}
@keyframes shim{from{background-position:-40% 0}to{background-position:140% 0}}
.strip{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;backdrop-filter:blur(10px)}
.strip>*{background:rgba(16,14,18,.86);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.strip small{font:600 10px var(--f-head);letter-spacing:.2em;color:var(--gold-hi);text-transform:uppercase}
.strip b{font:600 17px var(--f-head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip a{color:#ff8b8f}
@media(min-width:900px){.strip{grid-template-columns:repeat(5,1fr)}}

/* ---------- buttons / chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;font-weight:600;font-size:14px;letter-spacing:.04em;transition:transform .2s var(--ease),background .2s,border-color .2s,color .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn--gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#0a0a0a;border:1px solid var(--champ)}
.btn--gold:hover{background:var(--champ)}
.btn--ghost{border:1px solid var(--line);background:rgba(255,255,255,.03);color:#eee}
.btn--ghost:hover{border-color:var(--gold);color:var(--champ)}
.btn--sm{min-height:38px;padding:0 14px;font-size:12.5px}
.btn--block{width:100%}
.btn--danger{background:#b3262b;border:1px solid rgba(255,255,255,.2);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row--between{justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px var(--gut) 10px;margin:0 calc(-1 * var(--gut));scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-inline:var(--gut)}
.chips::-webkit-scrollbar{display:none}
.chips--wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:4px 0 10px}
.chip{flex:none;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);font-size:13px;font-weight:500;color:#cfcfcf;display:inline-flex;align-items:center;gap:6px;transition:all .2s;scroll-snap-align:start}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--gold);border-color:var(--champ);color:#0a0a0a;font-weight:600}
.chip small{opacity:.7;font-size:11px}
.filters{position:relative;margin-bottom:12px}
.filters h5{font:600 10.5px var(--f-head);letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin:10px 0 2px}
.search{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:0 16px;min-height:48px;transition:border-color .2s}
.search:focus-within{border-color:var(--gold)}
.search input{flex:1;background:none;border:0;color:#fff;font:inherit;outline:0;min-width:0;min-height:44px}
.search .ic{color:var(--gold-hi)}
select,input[type=text],input[type=date],input[type=time],input[type=number]{background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:#fff;font:inherit;min-height:46px;padding:0 14px;width:100%}
select:focus,input:focus{border-color:var(--gold);outline:0}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:500}
input[type=range]{width:100%;accent-color:var(--gold-hi)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-bottom:20px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:13px 16px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center;min-height:48px}
.tab.on{color:var(--champ);border-color:var(--gold-hi)}

/* ---------- cards ---------- */
.grid{display:grid;gap:14px}
.grid--cards{grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.grid--2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.grid--3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .35s var(--ease),border-color .3s,box-shadow .3s;text-align:left}
.card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 14px 40px rgba(232,163,23,.14)}
.card__b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:7px;flex:1}
.card h3{font-size:18px}
.card .th{font:500 15px var(--f-ui);color:var(--champ)}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);align-items:center}
.card p{font-size:13.5px;color:#bbb;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .heart{position:absolute;top:10px;right:10px;z-index:2}
.card__link{position:absolute;inset:0;z-index:1}
.card .btn,.card .heart{position:relative;z-index:2}
.card .heart{position:absolute}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:#cfcfcf;background:rgba(255,255,255,.03)}
.tag--gold{border-color:var(--gold);color:var(--champ)}
.tag--warn{border-color:#7a3a3d;color:#ff9a9e}
.tag--ok{border-color:#2f6b4c;color:#8fdcb1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.ph{position:relative;aspect-ratio:4/3;background:#151515;overflow:hidden;width:100%}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
.card:hover .ph img{transform:scale(1.06)}
.ph--none,.ph--err{display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#2e1d08,#121212 70%)}
.ph__mono{font:700 56px var(--f-head);color:var(--gold);opacity:.5}
.ph__tag{position:absolute;left:10px;bottom:10px;font-size:10.5px;letter-spacing:.06em;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(8,8,10,.72);color:var(--champ);border:1px solid rgba(255,194,58,.35);backdrop-filter:blur(6px)}
.ph--err::after{content:attr(data-x)}
.heart{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(8,8,10,.62);backdrop-filter:blur(8px);color:#fff;border:1px solid rgba(255,255,255,.14);transition:transform .2s}
.heart:hover{color:var(--gold-hi)}
.heart.on{color:#ff5470;background:rgba(8,8,10,.8)}
.heart.on svg{fill:currentColor}
.heart.pop{animation:pop .5s var(--ease)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.4)}70%{transform:scale(.9)}100%{transform:scale(1)}}
.flames{display:inline-flex;gap:3px;vertical-align:middle}
.flames i{width:8px;height:14px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:#3a3a3a}
.flames i.on{background:linear-gradient(180deg,var(--gold-hi),#d9534f)}
.baht{font-weight:600;color:var(--champ)}.baht i{font-style:normal;color:#444}
.credit{display:block;font-size:11px;color:var(--muted);margin-top:8px}
.credit:hover{color:var(--gold-hi)}

/* bento */
.bento{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
.tile{position:relative;min-height:150px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;justify-content:flex-end;padding:16px;isolation:isolate;transition:transform .35s var(--ease),border-color .3s}
.tile:hover{transform:translateY(-3px);border-color:var(--gold)}
.tile .bgimg{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;opacity:.75;transition:transform .8s var(--ease)}
.tile:hover .bgimg{transform:scale(1.06)}
.tile::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,8,10,0) 20%,rgba(8,8,10,.92))}
.tile .n{position:absolute;top:12px;left:14px;font:600 11px var(--f-head);letter-spacing:.2em;color:var(--gold-hi)}
.tile h3{font-size:19px}
.tile small{color:#bdbdbd;font-size:12px;margin-top:3px}
.tile--wide{grid-column:span 2}
.tile--plain{background:linear-gradient(145deg,#20150a,#121212)}.tile--plain[href="#/emergency"]{background:radial-gradient(120% 140% at 85% 20%,rgba(179,38,43,.55),transparent 60%),linear-gradient(145deg,#2a0e10,#121212);border-color:rgba(179,38,43,.45)}
@media(min-width:760px){.bento{grid-template-columns:repeat(4,1fr)}.tile{min-height:190px}.tile--tall{grid-row:span 2}.tile--wide{grid-column:span 2}}

/* sheet */
.sheet{position:fixed;inset:0;z-index:90;visibility:hidden}
.sheet.open{visibility:visible}
.sheet__scrim{position:absolute;inset:0;background:rgba(0,0,0,.72);opacity:0;transition:opacity .3s;backdrop-filter:blur(3px)}
.sheet.open .sheet__scrim{opacity:1}
.sheet__panel{position:absolute;left:0;right:0;bottom:0;max-height:94svh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;transform:translateY(100%);transition:transform .4s var(--ease);outline:0;padding-bottom:calc(24px + var(--safe-b));overscroll-behavior:contain}
.sheet.open .sheet__panel{transform:none}
.sheet__x{position:sticky;top:12px;float:right;margin:12px 12px -52px 0;z-index:5;width:44px;height:44px;border-radius:50%;background:rgba(8,8,10,.75);display:grid;place-items:center;backdrop-filter:blur(8px);border:1px solid var(--line)}
.sheet__body{padding:20px var(--gut) 8px}
.sheet__hero{aspect-ratio:16/10;max-height:46svh}
.sheet__hero .ph{aspect-ratio:auto;height:100%}
.sheet h2{font-size:clamp(26px,5vw,40px);margin-bottom:4px}
@media(min-width:900px){.sheet__panel{left:50%;right:auto;bottom:auto;top:50%;width:min(880px,94vw);max-height:90svh;border:1px solid var(--line);border-radius:26px;transform:translate(-50%,-46%);opacity:0;transition:transform .4s var(--ease),opacity .3s}.sheet.open .sheet__panel{transform:translate(-50%,-50%);opacity:1}.sheet__panel.wide{width:min(1060px,96vw)}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;margin:14px 0}
.facts>div{background:var(--surface);padding:11px 14px}
.facts small{display:block;font:600 10px var(--f-head);letter-spacing:.18em;text-transform:uppercase;color:var(--gold-hi);margin-bottom:3px}
.facts span{font-size:14px}
.blk{margin:18px 0}
.blk h4{font:600 11px var(--f-head);letter-spacing:.22em;text-transform:uppercase;color:var(--gold-hi);margin-bottom:6px}
.blk ul{padding-left:18px;color:#cfcfcf}.blk li{margin:3px 0}
.note{border-left:2px solid var(--gold);background:rgba(232,163,23,.08);padding:10px 14px;border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:13.5px;color:#e9dcc8}
.note--warn{border-color:#b3262b;background:rgba(179,38,43,.1);color:#f0c4c6}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--bnav) + var(--safe-b) + 74px);transform:translate(-50%,20px);z-index:120;display:flex;gap:10px;align-items:center;padding:12px 18px;background:#26190b;border:1px solid var(--gold);color:var(--champ);border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .35s var(--ease);max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:1180px){#toast{bottom:32px}}

/* search overlay */
.sov{position:fixed;inset:0;z-index:95;background:rgba(8,8,10,.97);visibility:hidden;opacity:0;transition:opacity .25s;overflow:auto}
.sov.open{visibility:visible;opacity:1}
.sov .wrap{max-width:820px;padding-top:16px;padding-bottom:60px}
.sres{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.sres h5{font:600 11px var(--f-head);letter-spacing:.22em;color:var(--gold-hi);text-transform:uppercase;margin:20px 4px 6px}
.sres a{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;min-height:56px}
.sres a:hover,.sres a:focus-visible{background:var(--surface)}
.sres .t{font-weight:600}.sres .s{font-size:12.5px;color:var(--muted)}
.sres .thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#1a1a1a;flex:none}

/* welcome */
.welcome{margin:14px 0 0;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px 12px 18px;border:1px solid var(--gold);border-radius:var(--r);background:linear-gradient(90deg,rgba(232,163,23,.18),rgba(232,163,23,.04));font:600 12px var(--f-head);letter-spacing:.16em;color:var(--champ)}

/* footer */
.foot{border-top:1px solid var(--line);padding:36px 0 calc(var(--bnav) + var(--safe-b) + 90px);color:var(--muted);font-size:12.5px;background:var(--bg2)}
.foot .brand{margin-bottom:10px}
.foot p{color:var(--muted);max-width:760px;margin:8px 0}
.foot a{color:var(--champ);text-decoration:underline;text-underline-offset:3px}
@media(min-width:1180px){.foot{padding-bottom:50px}}

/* skeleton */
.sk .sk__img,.sk .sk__l{background:linear-gradient(90deg,#1a1a1a,#262626,#1a1a1a);background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:10px}
.sk__img{aspect-ratio:4/3;border-radius:0!important}.sk__l{height:14px;margin:14px 16px 0}.sk__l.s{width:50%;margin-bottom:16px}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;padding:56px 20px;border:1px dashed var(--line);border-radius:var(--r);background:var(--bg2)}
.empty__mark{color:var(--gold);margin-bottom:10px;display:grid;place-items:center}
.empty p{color:var(--muted);max-width:420px;margin:6px auto 18px}

/* accordion */
details.acc{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);margin:8px 0;overflow:hidden}
details.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;font-weight:600;min-height:54px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .ic:first-child{color:var(--gold-hi)}
details.acc summary .chev{margin-left:auto;transition:transform .3s}
details.acc[open] summary .chev{transform:rotate(180deg)}
details.acc[open]{border-color:var(--gold)}
.acc__b{padding:0 16px 16px;animation:vin .35s var(--ease)}

/* phrases */
.phr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;position:relative}
.phr__en{font-size:12px;color:var(--muted);letter-spacing:.04em}
.phr__th{font:600 26px/1.35 var(--f-ui);color:var(--champ)}
.phr__rom{font-style:italic;color:#d8d8d8}
.phr__ko{font-size:15px}
.phr__ctx{font-size:12.5px;color:var(--muted)}
.phr__act{display:flex;gap:2px;margin:4px -8px -6px;flex-wrap:wrap;align-items:center}
.phr .heart{position:static;background:none;border:0;backdrop-filter:none}
.lvl{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);align-self:flex-start}
.lvl--slang{border-color:#8a5a12;color:var(--champ)}.lvl--caution{border-color:#b3262b;color:#ff9a9e}.lvl--casual{border-color:#3d4a66;color:#a9bde8}
.tts{display:none}
.has-th-voice .tts{display:inline-grid}
.show-local{position:fixed;inset:0;z-index:110;background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center}
.show-local .big{font:700 clamp(44px,13vw,150px)/1.25 var(--f-ui);color:#fff;text-wrap:balance}
.show-local .rom{font-size:clamp(18px,4vw,32px);color:var(--gold-hi);font-style:italic}
.show-local .en{color:var(--muted);font-size:clamp(14px,2.6vw,20px)}
.show-local .x{position:absolute;top:14px;right:14px}

/* flashcards */
.fc{perspective:1400px;max-width:560px;margin:0 auto}
.fc__in{position:relative;min-height:320px;transform-style:preserve-3d;transition:transform .6s var(--ease)}
.fc.flip .fc__in{transform:rotateY(180deg)}
.fc__f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--gold);border-radius:24px;background:linear-gradient(160deg,#22170b,#151515);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.fc__b{transform:rotateY(180deg)}
.fc .big{font:600 38px/1.3 var(--f-ui);color:var(--champ)}

/* quiz */
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin:8px 0;min-height:54px;transition:all .2s;font-weight:500}
.opt:hover{border-color:var(--gold)}
.opt.right{border-color:var(--ok);background:rgba(95,191,138,.12)}
.opt.wrong{border-color:var(--danger);background:rgba(229,72,77,.12)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-hi));transition:width .5s var(--ease)}

/* roulette */
.rl{display:grid;gap:24px}
@media(min-width:900px){.rl{grid-template-columns:minmax(380px,520px) 1fr;align-items:start}}
.wheelbox{position:relative;width:min(92vw,520px);aspect-ratio:1;margin:0 auto}
.wheelbox canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 12px 40px rgba(232,163,23,.25))}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:3;width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:32px solid var(--champ);filter:drop-shadow(0 2px 4px #000)}
.spin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24%;aspect-ratio:1;border-radius:50%;z-index:3;background:radial-gradient(circle at 35% 30%,var(--champ),var(--gold-hi) 45%,var(--gold));color:#0a0a0a;font:700 clamp(13px,3.4vw,20px) var(--f-head);letter-spacing:.12em;border:4px solid #0a0a0a;box-shadow:0 0 0 2px var(--gold-hi),0 8px 24px rgba(0,0,0,.6);transition:transform .15s}
.spin:active{transform:translate(-50%,-50%) scale(.94)}
.spin[disabled]{filter:grayscale(.5);cursor:wait}
.result{border:1px solid var(--gold);border-radius:var(--r);overflow:hidden;background:var(--surface);animation:vin .5s var(--ease)}
.result .ph{aspect-ratio:16/10}
.result__b{padding:16px}

/* bingo */
.bingo{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:640px;margin:0 auto}
.bc{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:6px;font-size:clamp(9.5px,2.5vw,13px);line-height:1.25;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:500;transition:all .25s;overflow:hidden}
.bc:hover{border-color:var(--gold)}
.bc.on{background:linear-gradient(145deg,var(--gold),#8c5b13);color:#0a0a0a;border-color:var(--champ);font-weight:700}
.bc.on::after{content:"✓";position:absolute;top:2px;right:5px;font-size:12px}
.bc.line{box-shadow:0 0 0 2px var(--champ),0 0 18px rgba(255,194,58,.6)}
.sparkle{position:fixed;pointer-events:none;z-index:130;width:8px;height:8px;border-radius:50%;background:var(--gold-hi);animation:spark 1.2s var(--ease) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

/* passport */
.pass{background:linear-gradient(160deg,#1b1107,#0e0e0e);border:1px solid var(--gold);border-radius:22px;padding:20px;position:relative;overflow:hidden}
.pass::before{content:"";position:absolute;inset:8px;border:1px solid rgba(255,194,58,.25);border-radius:16px;pointer-events:none}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:12px}
.stamp{aspect-ratio:1;border:1.5px dashed #4a4a4a;border-radius:50%;display:grid;place-items:center;text-align:center;font-size:10.5px;padding:10px;color:#777;line-height:1.2;transition:all .3s;position:relative}
.stamp.on{border:2px solid var(--gold-hi);color:var(--champ);background:radial-gradient(circle,rgba(255,194,58,.18),transparent 70%);transform:rotate(-6deg);animation:stamp .5s var(--ease)}
@keyframes stamp{0%{transform:scale(2) rotate(-20deg);opacity:0}60%{transform:scale(.9) rotate(-6deg);opacity:1}100%{transform:scale(1) rotate(-6deg)}}
.badge{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);opacity:.5}
.badge.on{opacity:1;border-color:var(--gold)}
.badge__i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#262626;color:#666}
.badge.on .badge__i{background:linear-gradient(145deg,var(--gold-hi),var(--gold));color:#0a0a0a}

/* planner */
.tl{position:relative;padding-left:26px;display:flex;flex-direction:column;gap:14px}
.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:1px;background:linear-gradient(var(--gold),transparent)}
.stop{position:relative;display:grid;grid-template-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stop::before{content:"";position:absolute;left:-23px;top:20px;width:11px;height:11px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 0 4px rgba(255,194,58,.18)}
.stop .ph{aspect-ratio:16/8}
.stop__b{padding:14px 16px}
.stop__t{font:600 12px var(--f-head);letter-spacing:.16em;color:var(--gold-hi)}
.stop__act{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.travel{font-size:12px;color:var(--muted);padding:2px 0 0 4px;display:flex;gap:8px;align-items:center}
@media(min-width:720px){.stop{grid-template-columns:240px 1fr}.stop .ph{aspect-ratio:auto;height:100%;min-height:170px}}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel--gold{border-color:var(--gold);background:linear-gradient(160deg,#1f1408,#161616)}
.preset{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);transition:all .25s;min-height:96px}
.preset:hover,.preset.on{border-color:var(--gold-hi);background:#231609}
.preset b{font:600 15px var(--f-head);letter-spacing:.03em}.preset small{color:var(--muted);font-size:12.5px;line-height:1.45}
.preset .n{font:600 10.5px var(--f-head);color:var(--gold-hi);letter-spacing:.2em}

/* tables / misc */
.cmp{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.cmp th,.cmp td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp th{font:600 10.5px var(--f-head);letter-spacing:.18em;text-transform:uppercase;color:var(--gold-hi);background:var(--bg2);position:sticky;top:0}
.scroll-x{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.meter{display:inline-flex;gap:3px}.meter i{width:12px;height:6px;border-radius:2px;background:#383838}.meter i.on{background:var(--gold-hi)}
.num{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-height:76px;transition:all .2s}
.num:hover{border-color:#b3262b;background:#201212}
.num b{font:700 34px var(--f-head);color:#ff8b8f;min-width:90px;letter-spacing:.02em}
.num span{color:#ddd;font-size:14px}
.card-th{background:#050505;border:1px solid var(--gold);border-radius:var(--r);padding:20px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.card-th .big{font:700 clamp(30px,7vw,52px)/1.3 var(--f-ui);color:#fff;text-wrap:balance}
.mapbox{height:min(68svh,640px);border-radius:var(--r);border:1px solid var(--line);overflow:hidden;background:#111}
.leaflet-popup-content-wrapper{background:#1d1d1d;color:#eee;border:1px solid var(--gold);border-radius:14px}
.leaflet-popup-tip{background:#1d1d1d}.leaflet-popup-content{margin:12px 14px;font:13px/1.5 var(--f-ui)}
.leaflet-popup-content a{color:var(--champ)}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--gold-hi);border:2px solid #0a0a0a;box-shadow:0 2px 8px rgba(0,0,0,.6);display:block}
.pin i{display:block;width:8px;height:8px;margin:6px;border-radius:50%;background:#0a0a0a}
.pin--saved{background:#ff5470}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0}
.split{display:grid;gap:22px}@media(min-width:900px){.split{grid-template-columns:1.15fr .85fr}}
.stat{font:700 36px var(--f-head);color:var(--champ)}
.vibe-card{border:1px solid var(--gold);border-radius:24px;padding:26px;background:radial-gradient(circle at 80% 0,#30200a,#101010 65%);text-align:center}
.vibe-card h2{font-size:clamp(30px,7vw,48px);color:var(--champ);margin:8px 0}
.mtx{display:grid;gap:10px}
.hood-hero{position:relative;min-height:min(60svh,520px);display:flex;align-items:flex-end;isolation:isolate;overflow:hidden;border-bottom:1px solid var(--line)}
.hood-hero .bgimg{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover}
.hood-hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,8,10,.3),rgba(8,8,10,.95))}
.hood-card{min-height:240px}
.route{counter-reset:r;list-style:none;padding:0}
.route li{counter-increment:r;position:relative;padding:8px 0 14px 44px;border-left:1px dashed var(--gold);margin-left:14px}
.route li::before{content:counter(r);position:absolute;left:-15px;top:6px;width:28px;height:28px;border-radius:50%;background:var(--gold-hi);color:#0a0a0a;font:700 13px var(--f-head);display:grid;place-items:center}
.route li:last-child{border-color:transparent}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.shimmer{display:none}}
@media print{.hdr,.bnav,.sos,.foot{display:none}}

/* compact language control on phones (full switcher lives in the menu + home strip) */
.langcycle{display:none;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--gold);background:rgba(232,163,23,.14);color:var(--champ);font-weight:600;font-size:12.5px}
@media(max-width:600px){.hdr .langsw{display:none}.langcycle{display:inline-flex}.hdr__r{gap:2px}}
@media(max-width:400px){.brand span{display:none}}

.skip:focus{position:fixed;left:12px;top:12px;width:auto;height:auto;clip:auto;z-index:200;padding:12px 18px;background:var(--gold);color:#0a0a0a;border-radius:999px;font-weight:700}
/* hero fallback when no photo is available (offline / not yet cached) */
.hero__bg:not([style]){background:radial-gradient(900px 520px at 78% 18%,rgba(232,163,23,.30),transparent 62%),radial-gradient(600px 400px at 10% 90%,rgba(255,194,58,.10),transparent 60%),linear-gradient(160deg,#1b1207,#090909 72%)}

.leaflet-container{background:#141414!important}.mapbox{position:relative}

/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: none;
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}

sweet basil in Italian food. Pork (moo sap) is the default; chicken (gai), beef (nuea) and crispy pork (moo krob) are common swaps, so ask for chicken if you don\'t eat pork. It is usually spicy, so say "mai phet" or "phet nit noi" (a little spicy) on your first try. Indonesians will feel at home with a plate of rice topped with a fried egg.',idn:'Basilnya adalah holy basil yang aromanya pedas seperti merica dan cengkih, bukan sweet basil ala masakan Italia. Standarnya pakai babi (moo sap), tapi bisa diganti ayam (gai), sapi (nuea), atau babi garing (moo krob) — kalau tidak makan babi, minta ayam. Biasanya cukup pedas, jadi untuk pertama kali bilang "mai phet" (tidak pedas) atau "phet nit noi" (sedikit pedas). Nasi dengan telur ceplok di atasnya pasti cocok di lidah orang Indonesia.'},order:{en:'Say the dish, the meat, then "kai dao" for the fried egg. Rice is included.',idn:'Sebut menunya + dagingnya + "kai dao" (telur ceplok). Nasi sudah termasuk.',th:"ขอผัดกะเพราหมูสับไข่ดาว ไม่เผ็ด{P}",rom:"khor phat ka-phrao moo sap khai dao mai phet {P}"},fact:{en:'Thais are strict about it: real pad kra pao uses holy basil and no vegetables like beans or carrots. If you want long beans in it, ask for "tua fak yao" (yard-long beans) and most stalls will add them.',idn:"Orang Thai cukup ketat soal menu ini: pad kra pao asli pakai holy basil dan tanpa sayuran seperti buncis atau wortel. Kalau mau kacang panjang (tua fak yao), bilang saja — kebanyakan warung mau menambahkannya."},where:[{name:"Any street stall or made-to-order shop (aharn tam sang)",area:"other",note:{en:"Found on practically every block, often until late evening. Look for a wok on a flaming burner and a stack of egg cartons.",idn:"Ada di hampir setiap gang, dan banyak yang buka sampai malam. Cari warung dengan wajan di atas api besar dan tumpukan rak telur."}}],imgQuery:"Pad kra pao",imgAlt:"Phat kaphrao: minced meat stir-fried with holy basil over rice, topped with a fried egg",mapsQuery:"pad kra pao restaurant Bangkok"},{id:"pad-thai",cat:"classics",name:{en:"Pad Thai",th:"ผัดไทย",idn:"Pad thai (mi beras goreng ala Thai)"},rom:"phat thai",desc:{en:"Thin rice noodles stir-fried with tamarind, fish sauce and palm sugar, egg, tofu and dried shrimp, then finished with bean sprouts, garlic chives and crushed peanuts. Sweet-sour-savory with a squeeze of lime.",idn:"Mi beras tipis ditumis dengan saus asam jawa, kecap ikan, dan gula aren, bersama telur, tahu, dan ebi, lalu diberi taoge, daun kucai, dan kacang tanah tumbuk. Asam-manis-gurih, makin enak dengan perasan jeruk nipis."},ingredients:{en:["rice noodles (sen chan)","tamarind","fish sauce","palm sugar","egg","firm tofu","dried shrimp","bean sprouts","garlic chives","crushed peanuts","lime"],idn:["Mi beras (sen chan)","Asam jawa","Kecap ikan","Gula aren","Telur","Tahu keras","Ebi (udang kering)","Taoge","Daun kucai","Kacang tanah tumbuk","Jeruk nipis"]},spice:1,price:[60,150],allergens:["peanut","egg","shellfish","fish","soy"],pork:"no",seafood:"optional",veg:"option",tags:["street","local-fav","beginner","sweet","kr-familiar"],beginner:{en:"The standard recipe already contains dried shrimp and fish sauce even if the topping is chicken, so it is not truly vegetarian unless you ask. It is more sweet-sour than spicy; add chili flakes from the caddy if you want heat. Shrimp (goong sot) is the classic topping. A safe first dish and one many Indonesians already know from Thai restaurants back home.",idn:"Meskipun topping-nya ayam, resep standarnya sudah pakai ebi dan kecap ikan, jadi tidak benar-benar vegetarian kecuali kamu minta. Rasanya lebih asam-manis daripada pedas; kalau mau pedas, tambahkan cabai bubuk dari bumbu meja. Topping klasiknya udang (goong sot). Aman untuk makanan pertama, dan banyak orang Indonesia sudah kenal menu ini dari restoran Thai di tanah air."},order:{en:'Say pad thai plus the topping. Ask for it "ho khai" if you want it wrapped in a thin egg crepe.',idn:'Sebut pad thai + topping-nya. Kalau mau dibungkus dadar telur tipis, minta "ho khai".',th:"ขอผัดไทยกุ้งสด ไม่ใส่ถั่ว{P}",rom:"khor phat thai goong sot mai sai thua {P}"},fact:{en:"Pad thai spread as a national dish in the late 1930s and 1940s, when the government promoted noodles and a unified Thai food identity.",idn:"Pad thai menyebar sebagai hidangan nasional pada akhir 1930-an dan 1940-an, saat pemerintah mempromosikan konsumsi mi beras dan identitas kuliner Thai yang seragam."},where:[{name:"Thip Samai (Pad Thai Pratu Pi)",area:"other",note:{en:"Legendary pad thai on Maha Chai Road in the Old Town, open since the 1960s. Known for the egg-wrapped version and long queues at peak hours.",idn:"Warung pad thai legendaris di Jalan Maha Chai, Kota Tua, buka sejak 1960-an. Terkenal dengan pad thai bungkus telur dan antrean panjang di jam ramai."}},{name:"Any street stall in Yaowarat",area:"yaowarat",note:{en:"Evening stalls in Chinatown often serve a cheaper, smokier version.",idn:"Warung malam di Chinatown sering menjual versi yang lebih murah dan lebih smoky."}}],imgQuery:"Pad Thai",imgAlt:"A plate of pad thai with shrimp, bean sprouts, peanuts and a lime wedge",mapsQuery:"Thip Samai Pad Thai Bangkok"},{id:"khao-man-gai",cat:"classics",name:{en:"Khao Man Gai",th:"ข้าวมันไก่",idn:"Khao man gai (nasi ayam ala Thai)"},rom:"khao man gai",desc:{en:"Tender poached chicken over rice cooked in chicken fat, garlic and ginger, with a cup of clear broth and a punchy dipping sauce of fermented soybean, ginger and chili. Mild, comforting and very filling.",idn:"Ayam rebus yang empuk di atas nasi yang dimasak dengan lemak ayam, bawang putih, dan jahe, disajikan dengan kuah bening dan saus cocolan dari tauco, jahe, dan cabai. Rasanya lembut, menenangkan, dan mengenyangkan."},ingredients:{en:["poached chicken","rice cooked in chicken fat","garlic","ginger","fermented soybean dipping sauce","chili","cucumber","clear broth"],idn:["Ayam rebus","Nasi yang dimasak dengan lemak ayam","Bawang putih","Jahe","Saus tauco","Cabai","Mentimun","Kaldu ayam bening"]},spice:1,price:[50,90],allergens:["soy"],pork:"no",seafood:"no",veg:"no",tags:["street","local-fav","post-practice","high-protein","beginner","kr-familiar"],beginner:{en:"Close cousin of Hainanese chicken rice. The sauce is where the flavor is, so spoon it over the chicken and rice. Order boiled (tom), fried (thot) or a mix. The dark cubes in the soup bowl at some shops are chicken blood curd; ask to leave them out if you prefer. Very close to the nasi ayam Hainan comfort food that is popular in Indonesia too.",idn:"Sepupu dekat nasi ayam Hainan. Kunci rasanya ada di saus, jadi siram banyak-banyak ke ayam dan nasinya. Pilih ayam rebus (tom), goreng (thot), atau campur. Beberapa warung menaruh potongan darah ayam beku di kuahnya; minta tidak usah kalau kamu tidak mau. Rasanya mirip nasi ayam Hainan yang juga populer di Indonesia."},order:{en:'Ask for khao man gai and choose boiled (tom), fried (thot) or mixed (phasom). Add "phiset" for extra chicken.',idn:'Pesan khao man gai lalu pilih ayam rebus (tom), goreng (thot), atau campur (phasom). Tambahkan "phiset" untuk porsi ayam lebih banyak.',th:"ขอข้าวมันไก่ต้ม{P}",rom:"khor khao man gai tom {P}"},fact:{en:"Thai khao man gai comes from the Hainanese chicken rice of Chinese immigrants, but the Thai version adds a fermented-soybean and ginger sauce with chili.",idn:"Khao man gai berasal dari nasi ayam Hainan yang dibawa imigran Tionghoa, tapi versi Thai mengembangkan saus sendiri dari tauco, jahe, dan cabai."},where:[{name:"Go-Ang Kaiton Pratunam",area:"other",note:{en:"Pratunam's famous khao man gai shop near the market; expect a queue at lunch.",idn:"Warung khao man gai terkenal di dekat Pasar Pratunam. Saat makan siang bisa antre."}},{name:"Any street stall or food court",area:"other",note:{en:"Easy to find everywhere, usually the cheapest filling meal after training.",idn:"Gampang ditemukan di mana-mana, dan biasanya jadi menu mengenyangkan paling hemat setelah latihan."}}],imgQuery:"Khao man gai",imgAlt:"Poached chicken sliced over rice with a bowl of soup and dipping sauce",mapsQuery:"khao man gai Bangkok"},{id:"khao-pad",cat:"classics",name:{en:"Khao Pad",th:"ข้าวผัด",idn:"Khao pad (nasi goreng ala Thai)"},rom:"khao phat",desc:{en:"Thai fried rice wok-tossed with egg, onion, tomato and scallion, seasoned with soy, oyster and fish sauce. Served with cucumber, a lime wedge and chilies in fish sauce (prik nam pla).",idn:"Nasi goreng Thai yang ditumis di api besar dengan telur, bawang bombai, tomat, dan daun bawang, dibumbui kecap asin, saus tiram, dan kecap ikan. Disajikan dengan mentimun, irisan jeruk nipis, dan cabai dalam kecap ikan (prik nam pla)."},ingredients:{en:["jasmine rice","egg","onion","tomato","scallion","soy sauce","oyster sauce","fish sauce","pork, chicken, shrimp or crab"],idn:["Nasi jasmine","Telur","Bawang bombai","Tomat","Daun bawang","Kecap asin","Saus tiram","Kecap ikan","Babi·ayam·udang·kepiting"]},spice:1,price:[50,100],allergens:["egg","soy","fish","shellfish"],pork:"optional",seafood:"optional",veg:"option",tags:["street","local-fav","late-night","beginner","kr-familiar"],beginner:{en:'The mildest "real Thai" plate you can order. Squeeze the lime and spoon on the chilies in fish sauce only if you want salt and heat. Popular proteins are pork (moo), chicken (gai), shrimp (goong) and crab (pu).',idn:"Salah satu masakan Thai asli yang paling tidak pedas. Peras jeruk nipis dan tambahkan cabai dalam kecap ikan kalau mau lebih asin dan pedas. Topping populer: babi (moo), ayam (gai), udang (goong), dan kepiting (pu). Beda dengan nasi goreng Indonesia, rasanya lebih ringan dan tanpa kecap manis."},order:{en:'Say khao pad plus the protein. Add "mai sai phrik" if you want it with no chili.',idn:'Sebut khao pad + topping-nya. Kalau tanpa cabai, tambahkan "mai sai phrik".',th:"ขอข้าวผัดไก่ ไม่ใส่พริก{P}",rom:"khor khao phat gai mai sai phrik {P}"},fact:{en:'Thais eat fried rice with a fork and spoon, and the cucumber slices on the side are meant to cool each bite. A retro favorite is "khao pad americana", with fried chicken, sausage and a fried egg.',idn:'Orang Thai makan nasi goreng dengan sendok dan garpu (sama seperti di Indonesia), dan irisan mentimun di sampingnya untuk menyegarkan mulut. Ada juga menu retro favorit "khao pad americana" dengan ayam goreng, sosis, dan telur ceplok.'},where:[{name:"Any street stall or shophouse restaurant",area:"other",note:{en:"Standard everywhere; late-night Chinese-Thai places serve it with a crab option.",idn:"Menu standar di mana-mana. Restoran Chinese-Thai yang buka sampai larut juga menjual nasi goreng kepiting."}}],imgQuery:"Khao pad Thai fried rice",imgAlt:"Thai fried rice with a cucumber slice and lime wedge",mapsQuery:"khao pad fried rice Bangkok"},{id:"pad-see-ew",cat:"classics",name:{en:"Pad See Ew",th:"ผัดซีอิ๊ว",idn:"Pad see ew (mi goreng kecap)"},rom:"phat see-iew",desc:{en:"Wide, flat rice noodles stir-fried in sweet dark soy and light soy sauce with egg and Chinese broccoli (kana), with a smoky char from the wok. Savory-sweet and not spicy.",idn:"Kwetiau lebar ditumis di api besar dengan kecap hitam manis dan kecap asin, telur, dan kailan (kana) sampai beraroma smoky. Gurih-manis dan tidak pedas."},ingredients:{en:["wide rice noodles (sen yai)","dark soy sauce","light soy sauce","oyster sauce","egg","Chinese broccoli (kana)","garlic","pork, chicken or shrimp"],idn:["Kwetiau lebar (sen yai)","Kecap hitam","Kecap asin","Saus tiram","Telur","Kailan (kana)","Bawang putih","Babi·ayam·udang"]},spice:0,price:[50,100],allergens:["egg","soy","shellfish"],pork:"optional",seafood:"optional",veg:"option",tags:["street","local-fav","beginner","sweet","post-practice","kr-familiar"],beginner:{en:"No chili inside at all; seasoning is up to you with the caddy (sugar, fish sauce, chili vinegar, chili flakes). The slightly sweet soy flavor reminds many Indonesians of kwetiau goreng or bakmi goreng. Pork (moo) is the most common protein; ask for chicken (gai) if you don't eat pork.",idn:"Sama sekali tanpa cabai di dalamnya; kamu sendiri yang mengatur rasa dengan bumbu meja (gula, kecap ikan, cuka cabai, cabai bubuk). Rasa kecapnya yang agak manis mirip kwetiau goreng atau bakmi goreng, jadi gampang disukai orang Indonesia. Daging paling umum adalah babi (moo) — minta ayam (gai) kalau tidak makan babi."},order:{en:'Say pad see ew plus the meat. Add "mai sai kai" if you do not want the egg.',idn:'Sebut pad see ew + dagingnya. Kalau tanpa telur, tambahkan "mai sai kai".',th:"ขอผัดซีอิ๊วหมู{P}",rom:"khor phat see-iew moo {P}"},fact:{en:'The name just means "stir-fried soy sauce"; "see-iew" comes from the Chinese word for soy sauce, a sign of its Thai-Chinese roots.',idn:'Namanya berarti "tumis kecap". Kata "see-iew" berasal dari kata Tionghoa untuk kecap, tanda akar kuliner Chinese-Thai.'},where:[{name:"Any street stall or Chinese-Thai noodle shop",area:"other",note:{en:"Look for a stall with a very hot wok; the char matters. Yaowarat shops are reliable.",idn:"Pilih warung yang wajannya sangat panas — aroma gosongnya itu kuncinya. Warung di Yaowarat bisa diandalkan."}}],imgQuery:"Pad see ew",imgAlt:"Stir-fried wide rice noodles with Chinese broccoli and egg in dark soy sauce",mapsQuery:"pad see ew restaurant Bangkok"},{id:"pad-kee-mao",cat:"classics",name:{en:"Pad Kee Mao (Drunken Noodles)",th:"ผัดขี้เมา",idn:"Pad kee mao (drunken noodles)"},rom:"phat khee mao",desc:{en:"Wide rice noodles stir-fried at ferocious heat with holy basil, garlic, fresh chilies, baby corn and your choice of pork, chicken or seafood. Fiery, herbal and smoky.",idn:"Kwetiau lebar ditumis di api sangat besar dengan holy basil, bawang putih, cabai segar, jagung muda, dan pilihan babi, ayam, atau seafood. Smoky, wangi herba, dan pedasnya nendang."},ingredients:{en:["wide rice noodles (sen yai)","holy basil","garlic","bird's-eye chilies","baby corn","green peppercorn or bell pepper","oyster sauce","soy sauce","pork, chicken, or seafood"],idn:["Kwetiau lebar (sen yai)","Holy basil","Bawang putih","Cabai rawit","Jagung muda","Lada hijau atau paprika","Saus tiram","Kecap asin","Babi·ayam·seafood"]},spice:4,price:[60,120],allergens:["soy","shellfish","fish"],pork:"optional",seafood:"optional",veg:"option",tags:["street","late-night","local-fav","kr-familiar"],beginner:{en:'Cousin of pad see ew but the dark soy is replaced by chili and basil, so it is much spicier. Ask for "phet nit noi" on a first try. The seafood version (talay) is common at restaurants.',idn:'Mirip sepupu pad see ew, tapi kecap manisnya diganti cabai dan basil, jadi jauh lebih pedas. Untuk pertama kali, coba "phet nit noi" (sedikit pedas). Di restoran, versi seafood (talay) juga umum.'},order:{en:"Say pad kee mao plus the protein and the spice level.",idn:"Sebut pad kee mao + dagingnya + level pedas.",th:"ขอผัดขี้เมาหมู เผ็ดน้อย{P}",rom:"khor phat khee mao moo phet noi {P}"},fact:{en:'The name "drunken" is folklore: either it is spicy enough to sober you up, or it is what you cook with whatever is left in the fridge after drinking. It is a classic late-night order.',idn:'Nama "mabuk" itu cuma cerita rakyat: katanya cukup pedas untuk bikin sadar dari mabuk, atau dimasak dari sisa isi kulkas setelah minum-minum. Ini menu klasik untuk pesanan larut malam.'},where:[{name:"Raan Jay Fai",area:"other",note:{en:"Michelin-starred street-food legend on Maha Chai Road known for seafood drunken noodles cooked over charcoal. A splurge with limited seating; check current booking and queue practice before going.",idn:"Legenda street food berbintang Michelin di Jalan Maha Chai, terkenal dengan drunken noodles seafood yang dimasak di atas arang. Harganya mahal dan tempat duduknya terbatas, jadi cek sistem reservasi dan antrean terbaru sebelum datang."}},{name:"Any street stall around Yaowarat",area:"yaowarat",note:{en:"Evening wok stalls give a good budget version.",idn:"Warung wajan yang buka malam hari menyajikan versi yang ramah budget."}}],imgQuery:"Pad kee mao",imgAlt:"Drunken noodles with wide rice noodles, basil and chilies",mapsQuery:"pad kee mao drunken noodles Bangkok"},{id:"khao-kha-moo",cat:"classics",name:{en:"Khao Kha Moo",th:"ข้าวขาหมู",idn:"Khao kha moo (nasi kaki babi)"},rom:"khao kha moo",desc:{en:"Pork trotter slow-braised in a sweet soy and five-spice broth until it falls apart, served over rice with a braised egg, pickled mustard greens and a garlic-chili vinegar sauce.",idn:"Kaki babi direbus lama dalam kuah kecap manis dan ngohiong sampai empuk, disajikan di atas nasi dengan telur kecap, sawi asin, dan saus cuka bawang putih-cabai."},ingredients:{en:["braised pork leg","five-spice soy broth","braised egg","pickled mustard greens","garlic","chili vinegar sauce","rice"],idn:["Kaki babi rebus empuk","Kuah kecap ngohiong","Telur kecap","Sawi asin (phak kat dong)","Bawang putih","Saus cuka cabai","Nasi putih"]},spice:1,price:[50,100],allergens:["egg","soy"],pork:"yes",seafood:"no",veg:"no",tags:["street","local-fav","post-practice","high-protein"],beginner:{en:"Rich and gelatinous, a bit like Indonesian semur (or babi kecap, for those who eat pork) but served over rice with a sweet-soy gravy. The pickled greens and the garlic-chili sauce cut through the fat, so use them. The sauce on the side is spicy; the pork itself is not. This is a pork dish, so skip it if you eat halal.",idn:"Kaya rasa dan kenyal, agak mirip semur (atau babi kecap bagi yang makan babi), tapi disajikan di atas nasi dengan saus kecap manis. Sawi asin dan saus bawang putih-cabai menetralkan lemaknya, jadi wajib dimakan bareng. Sausnya pedas, tapi dagingnya sendiri tidak pedas. Ini hidangan babi, jadi lewati kalau kamu makan halal."},order:{en:'Say khao kha moo. You can ask for more skin ("nang") or more lean meat ("nuea").',idn:"Pesan khao kha moo. Kamu bisa minta lebih banyak kulit (\"nang\") atau daging tanpa lemak (\"nuea\").",th:"ขอข้าวขาหมู ไข่ต้มด้วย{P}",rom:"khor khao kha moo khai tom duay {P}"},fact:{en:'A Thai-Chinese braise: the "pa lo" style stew is the same family of cooking as Chinese lu-wei, simmered in a pot that is sometimes decades old.',idn:'Masakan rebus kecap ala Chinese-Thai. Masih satu keluarga dengan "lu-wei" Tiongkok, dan ada warung yang terus memakai kuah yang sama selama puluhan tahun.'},where:[{name:"Any khao kha moo cart around Yaowarat",area:"yaowarat",note:{en:"Chinatown stalls specialize in braised pork; look for the big pot with pork legs on display.",idn:"Banyak warung di Chinatown khusus menjual babi kecap. Cari panci besar dengan kaki babi yang dipajang."}}],imgQuery:"Khao kha moo",imgAlt:"Braised pork leg over rice with a boiled egg and pickled greens",mapsQuery:"khao kha moo Bangkok"},{id:"khao-moo-daeng",cat:"classics",name:{en:"Khao Moo Daeng",th:"ข้าวหมูแดง",idn:"Khao moo daeng (nasi babi merah)"},rom:"khao moo daeng",desc:{en:"Sliced Thai-Chinese red roast pork (char siu style) over rice with sweet brown sauce, often with crispy pork belly, Chinese sausage and cucumber.",idn:"Irisan babi panggang merah ala Chinese-Thai (gaya char siu) di atas nasi dengan saus cokelat manis. Banyak warung menambahkan babi garing, sosis Tionghoa, dan mentimun."},ingredients:{en:["red roast pork (moo daeng)","crispy pork belly (moo krob)","Chinese sausage (goon chiang)","sweet brown sauce","cucumber","egg","rice"],idn:["Babi merah (moo daeng)","Babi garing (moo krob)","Sosis Tionghoa (kun chiang)","Saus cokelat manis","Mentimun","Telur","Nasi putih"]},spice:0,price:[50,90],allergens:["soy","egg"],pork:"yes",seafood:"no",veg:"no",tags:["street","local-fav","post-practice","high-protein","beginner","sweet"],beginner:{en:'Totally non-spicy and sweet, which makes it a safe pick for picky eaters. Order "moo daeng moo krob" to get both roast and crispy pork. The chili vinegar on the table is optional.',idn:'Sama sekali tidak pedas dan rasanya manis, jadi aman untuk yang pemilih soal makanan. Pesan "moo daeng moo krob" untuk dapat babi merah dan babi garing sekaligus. Cuka cabai di meja opsional. Cocok kalau kamu suka nasi campur ala chinese food (bagi yang makan babi — menu ini tidak halal).'},order:{en:'Ask for khao moo daeng; add "moo krob" for crispy pork and "kai tom" for an egg.',idn:'Pesan khao moo daeng, tambah "moo krob" untuk babi garing dan "kai tom" untuk telur.',th:"ขอข้าวหมูแดงหมูกรอบ{P}",rom:"khor khao moo daeng moo krob {P}"},fact:{en:"Shops hang the glossy roast pork in the window. In Bangkok's Chinatown many are family shops that have run for generations.",idn:"Warung menggantung babi panggang yang mengilap di etalase kaca. Di Chinatown Bangkok banyak warung keluarga yang sudah turun-temurun."},where:[{name:"Any roast-meat shop around Yaowarat",area:"yaowarat",note:{en:"Look for glossy roast pork and crispy pork hanging in the window.",idn:"Cari warung dengan babi merah mengilap dan babi garing yang tergantung di etalase."}}],imgQuery:"Khao moo daeng",imgAlt:"Red roast pork slices with crispy pork and Chinese sausage over rice",mapsQuery:"khao moo daeng Yaowarat Bangkok"},{id:"khao-soi",cat:"classics",name:{en:"Khao Soi",th:"ข้าวซอย",idn:"Khao soi (mi kari ala utara)"},rom:"khao soi",desc:{en:"Northern Thai curry noodle soup: egg noodles in a rich, mildly spicy coconut-curry broth with chicken or beef, topped with crispy fried noodles and served with pickled mustard greens, shallot and lime.",idn:"Mi kari khas Thailand utara: mi telur dalam kuah kari santan yang kental dan sedikit pedas, dengan ayam atau sapi, diberi mi goreng renyah di atasnya, plus sawi asin, bawang merah, dan jeruk nipis."},ingredients:{en:["egg noodles","coconut curry broth","chicken or beef","crispy fried noodles","pickled mustard greens","shallot","lime","chili oil"],idn:["Mi telur","Kuah kari santan","Ayam atau sapi","Mi goreng renyah","Sawi asin","Bawang merah","Jeruk nipis","Minyak cabai"]},spice:2,price:[70,130],allergens:["gluten","egg","fish","shellfish"],pork:"optional",seafood:"no",veg:"no",tags:["local-fav","beginner","kr-familiar"],beginner:{en:"Creamy, slightly sweet and not too hot, with the crunchy noodles on top for texture. Squeeze lime and add the pickled greens a little at a time. A bit like a curry udon. Curry paste often contains shrimp paste, so it is not strictly vegetarian.",idn:"Creamy, sedikit manis, dan tidak terlalu pedas; mi renyah di atasnya bikin teksturnya seru. Tambahkan jeruk nipis dan sawi asin sedikit demi sedikit. Rasanya agak mirip mi kari atau laksa. Pasta karinya sering mengandung terasi, jadi tidak sepenuhnya vegetarian."},order:{en:"Say khao soi plus chicken (gai) or beef (nuea).",idn:"Sebut khao soi + ayam (gai) atau sapi (nuea).",th:"ขอข้าวซอยไก่{P}",rom:"khor khao soi gai {P}"},fact:{en:"Khao soi comes from Chiang Mai and the north, with Burmese and Yunnan-Muslim influences. Bangkok has many Lanna-style restaurants that serve it.",idn:"Khao soi berasal dari Chiang Mai dan wilayah utara, dengan pengaruh Myanmar dan Muslim Yunnan. Di Bangkok juga banyak restoran gaya utara (Lanna) yang menyajikannya."},where:[{name:"Northern Thai (Lanna) restaurants in Ari and Thonglor",area:"ari",note:{en:"Look for Lanna-style places for the most authentic bowl.",idn:"Untuk rasa paling autentik, cari restoran gaya utara (Lanna)."}}],imgQuery:"Khao soi",imgAlt:"A bowl of khao soi with crispy noodles on top and lime on the side",mapsQuery:"khao soi restaurant Bangkok"},{id:"rad-na",cat:"classics",name:{en:"Rad Na",th:"ราดหน้า",idn:"Rad na (kwetiau siram)"},rom:"rat na",desc:{en:"Wide rice noodles pan-charred until smoky, then covered in a thick savory gravy with Chinese broccoli and pork, chicken or seafood. Silky, glossy and gently salty.",idn:"Kwetiau lebar dipanggang di wajan sampai beraroma smoky, lalu disiram kuah kental dengan kailan dan babi, ayam, atau seafood. Lembut, mengilap, dan gurihnya pas."},ingredients:{en:["wide rice noodles (sen yai)","Chinese broccoli","fermented soybean","tapioca-thickened gravy","pork, chicken, or seafood","garlic"],idn:["Kwetiau lebar (sen yai)","Kailan","Tauco","Kuah kental tepung kanji","Babi·ayam·seafood","Bawang putih"]},spice:0,price:[60,110],allergens:["soy","fish"],pork:"optional",seafood:"optional",veg:"option",tags:["street","local-fav","beginner","late-night","kr-familiar"],beginner:{en:'Rad na means "pour over the top". It is mild and comforting; add chili vinegar (prik nam som) for brightness. Reminiscent of the kwetiau siram (Chinese-Indonesian noodles in thick gravy) you know from home.',idn:'Rad na artinya "disiram di atasnya". Rasanya lembut dan menenangkan; tambahkan cuka cabai (prik nam som) supaya lebih segar. Kuahnya yang kental mengingatkan pada kwetiau siram di restoran chinese food di Indonesia.'},order:{en:"Say rad na plus pork (moo), chicken (gai) or seafood (talay).",idn:"Sebut rad na + babi (moo), ayam (gai), atau seafood (talay).",th:"ขอราดหน้าหมู เส้นใหญ่{P}",rom:"khor rat na moo sen yai {P}"},fact:{en:"The best versions char the noodles first, so the gravy meets slightly burnt rice noodle edges. It is a Thai-Chinese classic found in Yaowarat shophouses.",idn:"Versi terbaik membakar mi lebih dulu, jadi kuahnya bertemu pinggiran mi yang sedikit gosong dan smoky. Ini menu klasik Chinese-Thai yang banyak ditemukan di ruko-ruko Yaowarat."},where:[{name:"Any Chinese-Thai shophouse restaurant in Yaowarat",area:"yaowarat",note:{en:"Many evening shophouse kitchens serve it; look for a smoking wok at the front.",idn:"Banyak dapur ruko yang buka malam menjualnya. Cari yang ada wajan berasap di bagian depan."}}],imgQuery:"Rat na",imgAlt:"Wide rice noodles topped with thick gravy and Chinese broccoli",mapsQuery:"rad na restaurant Bangkok"},{id:"thai-sukiyaki",cat:"classics",name:{en:"Thai Sukiyaki (Suki Nam / Suki Haeng)",th:"สุกี้",idn:"Thai suki (suki nam / suki haeng)"},rom:"suki nam / suki haeng",desc:{en:"A Thai-Chinese hot pot: glass noodles, greens, egg and your choice of meat and seafood in a light broth (suki nam) or stir-fried dry (suki haeng), eaten with a tangy red chili-fermented tofu dipping sauce.",idn:"Hot pot ala Chinese-Thai: soun, sayuran, telur, dan pilihan daging serta seafood, direbus dalam kuah bening (suki nam) atau ditumis tanpa kuah (suki haeng), lalu dicocol saus merah yang asam-pedas."},ingredients:{en:["glass noodles","napa cabbage and morning glory","egg","sliced pork, beef or chicken","shrimp, squid, fish balls","suki dipping sauce (chili, fermented tofu, garlic)"],idn:["Soun","Sawi putih·kangkung","Telur","Babi·sapi·ayam","Udang·cumi·bakso ikan","Saus suki (cabai, tahu fermentasi, bawang putih)"]},spice:2,price:[100,350],allergens:["egg","soy","fish","shellfish","sesame"],pork:"optional",seafood:"optional",veg:"option",tags:["local-fav","post-practice","high-protein","kr-familiar"],beginner:{en:"Not the Japanese beef sukiyaki. Think of it as a light, clean-tasting hot pot or shabu-shabu (both popular in Indonesia too). The dipping sauce is the point: spoon it over everything. Great for groups because you order the platters to share.",idn:"Beda dengan sukiyaki sapi ala Jepang. Lebih mirip hot pot atau shabu-shabu yang ringan. Kuncinya ada di saus merahnya, jadi cocol banyak-banyak setiap suapan. Cocok untuk makan rame-rame karena kamu memesan piring isian untuk dibagi."},order:{en:'Choose soup (nam) or dry (haeng), then pick your meat and a platter. Say "mai phet" if you want the sauce mild.',idn:'Pilih berkuah (nam) atau tumis (haeng), lalu pilih daging dan piring isian campur. Kalau mau sausnya tidak pedas, bilang "mai phet".',th:"ขอสุกี้น้ำหมู{P}",rom:"khor suki nam moo {P}"},fact:{en:"Thai suki is a very popular family and group meal, and chains made it a staple in malls. The sauce recipe is a closely guarded signature at each chain.",idn:"Suki di Thailand adalah menu andalan untuk makan bareng keluarga dan rombongan, dan berkat jaringan restorannya jadi menu wajib di mal-mal. Resep sausnya adalah rahasia dapur tiap jaringan."},where:[{name:"Coca Restaurant (Coca Suki)",area:"siam",note:{en:"Long-running Thai suki chain with Siam-area and mall branches; reliable for groups.",idn:"Jaringan restoran suki yang sudah lama berdiri, punya cabang di kawasan Siam dan di mal. Aman untuk rombongan."}}],imgQuery:"Thai suki",imgAlt:"Thai suki hot pot with glass noodles, vegetables and a red dipping sauce",mapsQuery:"Coca Suki Bangkok"},{id:"tom-yum-noodles",cat:"classics",name:{en:"Tom Yum Noodles",th:"ก๋วยเตี๋ยวต้มยำ",idn:"Tom yum kuay teow (mi tom yum)"},rom:"kuay-tiew tom yum",desc:{en:"Rice noodles in a sweet-sour-spicy broth with minced pork, pork or fish balls, sliced pork, lime juice, chili flakes and a handful of crushed peanuts. Bright, tangy and addictive.",idn:"Mi beras dalam kuah asam-manis-pedas dengan babi cincang, bakso daging dan bakso ikan, air jeruk nipis, cabai bubuk, dan kacang tanah tumbuk. Segar dan bikin nagih."},ingredients:{en:["rice noodles","minced pork and sliced pork","pork or fish balls","lime juice","chili flakes","crushed peanuts","sugar","fish sauce"],idn:["Mi beras","Babi cincang dan irisan daging","Bakso daging·ikan","Air jeruk nipis","Cabai bubuk","Kacang tanah tumbuk","Gula","Kecap ikan"]},spice:3,price:[50,90],allergens:["peanut","fish"],pork:"yes",seafood:"optional",veg:"no",tags:["street","local-fav","beginner","kr-familiar"],beginner:{en:'Different from tom yum goong soup: here the broth is a noodle shop pork broth made sour and spicy at the table. Tell them "mai phet" if you are unsure, then adjust with the caddy.',idn:'Beda dengan sup tom yum goong. Ini mi dengan kaldu babi khas warung mi yang dibumbui asam-pedas. Kalau ragu, pesan "mai phet" lalu atur sendiri dengan bumbu meja.'},order:{en:'Say the noodle type, "tom yum", then the meat. Ask for "haeng" for dry.',idn:'Sebut jenis mi + "tom yum" + dagingnya. Untuk versi tanpa kuah, bilang "haeng".',th:"ขอเส้นเล็กต้มยำหมู ไม่เผ็ด{P}",rom:"khor sen lek tom yum moo mai phet {P}"},fact:{en:"Many noodle shops sell this alongside clear soup and boat noodles. The crunchy peanuts on top are a signature touch.",idn:"Banyak warung mi menjualnya bersama mi kuah bening dan boat noodles. Taburan kacang di atasnya jadi ciri khas."},where:[{name:"Any noodle shop around Victory Monument",area:"other",note:{en:"The area has dozens of noodle stalls; tom yum noodles are on most menus.",idn:"Di sekitar Monumen Kemenangan ada puluhan warung mi, dan kebanyakan punya menu ini."}}],imgQuery:"Tom yum noodle",imgAlt:"A bowl of tom yum noodle soup with ground peanuts and coriander",mapsQuery:"tom yum noodles Bangkok"},{id:"yen-ta-fo",cat:"classics",name:{en:"Yen Ta Fo",th:"เย็นตาโฟ",idn:"Yen ta fo (mi merah muda)"},rom:"yen-ta-fo",desc:{en:"The pink noodle soup: rice noodles with fish balls, squid, fried tofu and morning glory in a sweet-sour broth colored by fermented red bean curd. Slightly spicy-tangy and unlike any other bowl.",idn:"Sup mi berwarna merah muda: mi beras dengan bakso ikan, cumi, tahu goreng, dan kangkung dalam kuah asam-manis yang diwarnai tahu fermentasi merah. Sedikit pedas dan asam, beda dari mi lainnya."},ingredients:{en:["rice noodles","fermented red bean curd","fish balls","squid","fried tofu","morning glory","fried wonton","lime","chili"],idn:["Mi beras","Tahu fermentasi merah","Bakso ikan","Cumi","Tahu goreng","Kangkung","Pangsit goreng","Jeruk nipis","Cabai"]},spice:1,price:[50,90],allergens:["fish","shellfish","soy","gluten"],pork:"optional",seafood:"yes",veg:"no",tags:["street","local-fav"],beginner:{en:'The pink color is natural and comes from fermented red bean curd, not food dye. The flavor is tangy and a little funky if you are new to fermented tofu. Some shops add pork blood cubes; say "mai ao leuat" to skip.',idn:'Warna merah mudanya alami, berasal dari tahu fermentasi merah. Kalau belum terbiasa dengan tahu fermentasi, aromanya mungkin agak asing. Beberapa warung menambahkan potongan darah babi; bilang "mai ao leuat" kalau tidak mau.'},order:{en:'Say yen ta fo and the noodle type. Add "haeng" for the dry style, which comes with a small side of broth.',idn:'Sebut yen ta fo + jenis mi. Untuk versi tanpa kuah, tambahkan "haeng" — kuahnya akan disajikan sedikit di mangkuk terpisah.',th:"ขอเย็นตาโฟเส้นเล็ก ไม่ใส่เลือด{P}",rom:"khor yen-ta-fo sen lek mai sai leuat {P}"},fact:{en:"It is a Thai-Chinese noodle that became popular street food. The soup's color is why Thais call it the pink noodle.",idn:'Ini mi Chinese-Thai yang jadi street food populer. Karena warna kuahnya, orang Thai menyebutnya "mi merah muda".'},where:[{name:"Any noodle shop around Victory Monument",area:"other",note:{en:"Easy to find at busy noodle alleys.",idn:"Gampang ditemukan di gang-gang mi yang ramai."}}],imgQuery:"Yen ta fo",imgAlt:"A bowl of yen ta fo: pink noodle soup with fish balls, fried tofu and morning glory",mapsQuery:"yen ta fo noodles Bangkok"},{id:"boat-noodles",cat:"classics",name:{en:"Boat Noodles (Kuay Teow Reua)",th:"ก๋วยเตี๋ยวเรือ",idn:"Boat noodles (kuay teow ruea)"},rom:"kuay-tiew reua",desc:{en:"A dark, intensely savory pork or beef noodle soup, thickened and enriched with blood, spiced with garlic and served in tiny bowls. Very bold, and since the bowls are tiny, most people eat three to five at a time.",idn:"Sup mi babi atau sapi yang pekat dan sangat gurih, dikentalkan dengan darah, kaya bawang putih dan rempah, disajikan dalam mangkuk kecil — biasanya orang makan 3–5 mangkuk sekaligus."},ingredients:{en:["rice noodles","dark spiced broth with blood","pork or beef","meatballs","morning glory","bean sprouts","crispy pork rind","fried garlic"],idn:["Mi beras","Kuah rempah pekat dengan darah","Babi atau sapi","Bakso","Kangkung","Taoge","Kerupuk kulit babi","Bawang putih goreng"]},spice:3,price:[15,40],allergens:["soy","fish"],pork:"yes",seafood:"no",veg:"no",tags:["street","local-fav"],beginner:{en:"The price is per bowl, and each bowl is only a few spoonfuls. The broth is thick with blood, which tastes deep and slightly earthy; if that worries you, try yen ta fo or tom yum noodles first. Most shops put the crispy pork rind on the table. Even beef versions typically use blood.",idn:"Harganya per mangkuk, dan satu mangkuk cuma beberapa suap. Kuahnya mengandung darah, jadi rasanya dalam dan sedikit \"earthy\"; kalau ragu, coba yen ta fo atau mi tom yum dulu. Kebanyakan warung menaruh kerupuk kulit babi di meja. Versi sapi pun biasanya tetap pakai darah, jadi bukan pilihan halal."},order:{en:'Say how many bowls, the noodle type and the meat. Ask "mai ao leuat" to skip the pig’s blood in the broth.',idn:'Sebut jumlah mangkuk, jenis mi, dan dagingnya. Untuk kuah tanpa darah babi, bilang "mai ao leuat".',th:"ขอก๋วยเตี๋ยวเรือหมู เส้นเล็ก สามชาม{P}",rom:"khor kuay-tiew reua moo sen lek saam chaam {P}"},fact:{en:"The bowls are tiny because the first vendors sold from boats on Bangkok's canals, where a small bowl was easier to pass across the water and spilled less.",idn:"Mangkuknya kecil karena dulu pedagang pertama berjualan dari perahu di kanal-kanal Bangkok, dan mangkuk kecil lebih mudah diserahkan di atas air dan tidak gampang tumpah."},where:[{name:"Boat Noodle Alley, Victory Monument",area:"other",note:{en:"Famous alley beside Victory Monument packed with boat noodle shops. Best around lunch and evening.",idn:"Gang terkenal di samping Monumen Kemenangan yang penuh warung boat noodles. Paling seru saat makan siang dan malam."}}],imgQuery:"Boat noodles Thailand",imgAlt:"Several small bowls of Thai boat noodles",mapsQuery:"Boat Noodle Alley Victory Monument Bangkok"},{id:"khao-tom",cat:"classics",name:{en:"Khao Tom",th:"ข้าวต้ม",idn:"Khao tom (sup nasi ala Thai)"},rom:"khao tom",desc:{en:"Rice simmered in a light, clear broth, eaten with a spread of salty, sour and fried side dishes. A late-night classic at Thai-Chinese eateries, plain and soothing.",idn:"Nasi yang direbus dalam kuah bening yang ringan, dimakan dengan aneka lauk asin, asam, dan gorengan. Menu klasik larut malam di rumah makan Chinese-Thai, sederhana dan menenangkan perut."},ingredients:{en:["rice in clear broth","pork or fish or shrimp","ginger","fried garlic","egg","preserved radish","side dishes (stir-fried veg, salted egg)"],idn:["Nasi rebus kuah bening","Babi·ikan·udang","Jahe","Bawang putih goreng","Telur","Lobak asin","Lauk (tumis sayur, telur asin, dll.)"]},spice:0,price:[40,150],allergens:["egg","soy","fish"],pork:"optional",seafood:"optional",veg:"option",tags:["late-night","local-fav","beginner","kr-familiar"],beginner:{en:'Unlike jok, the rice grains stay whole and the broth is thin. Share a few dishes ("kap khao") on the side and spoon them into the soup bowl as you go. Prices are for the soup; side dishes are ordered separately.',idn:'Beda dengan jok, butiran nasinya masih utuh dan kuahnya encer. Pesan beberapa lauk ("kap khao") untuk dimakan bareng, lalu sendokkan ke mangkuk sup sambil makan. Harga yang tertera untuk supnya; lauk dipesan terpisah. Rasanya seperti semangkuk nasi dengan sop hangat — pas untuk perut setelah begadang.'},order:{en:"Ask for khao tom with the meat or fish you want, then point to side dishes in the display or on the menu.",idn:"Pesan khao tom dengan daging atau ikan pilihanmu, lalu tunjuk lauk di etalase atau di menu.",th:"ขอข้าวต้มปลา{P}",rom:"khor khao tom pla {P}"},fact:{en:"Khao tom restaurants (khao tom kui) are a Bangkok after-midnight tradition where friends order a table of side dishes and eat slowly.",idn:"Rumah makan khao tom (khao tom kui) adalah tradisi lewat tengah malam di Bangkok: teman-teman memesan semeja lauk dan makan pelan-pelan."},where:[{name:"Late-night khao tom restaurants around Yaowarat",area:"yaowarat",note:{en:"Chinatown has several late-night khao tom shops; look for open-air tables and display counters.",idn:"Di Chinatown ada beberapa warung khao tom yang buka sampai larut. Cari meja terbuka dan etalase lauk."}}],imgQuery:"Khao tom",imgAlt:"A bowl of Thai rice soup khao tom with side dishes",mapsQuery:"khao tom late night Bangkok"},{id:"jok",cat:"classics",name:{en:"Jok",th:"โจ๊ก",idn:"Jok (bubur ala Thai)"},rom:"jok",desc:{en:"Smoo
