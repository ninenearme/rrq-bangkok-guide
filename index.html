trepreneur, set in a lush garden next to a quiet canal. The same site includes the Jim Thompson Art Center, a shop and a café.",idn:"Jim Thompson House adalah museum berisi rumah-rumah jati tradisional Thailand yang dikumpulkan oleh seorang pengusaha sutra asal Amerika. Letaknya di taman rimbun di tepi kanal yang tenang, dan di area yang sama ada Jim Thompson Art Center, toko, dan kafe."},special:{en:"A calm, shaded escape just a few minutes from Siam with beautiful architecture, antiques and a garden. A good pick for a quiet, photo-friendly hour.",idn:"Tempat kabur yang tenang dan teduh, hanya beberapa menit dari Siam. Arsitektur cantik, barang antik, dan tamannya bikin pas untuk satu jam santai sambil foto-foto."},bestTime:["morning","afternoon"],timeText:{en:"Typically open in daytime with guided house visits; hours and photo rules change, so check Google Maps and the official site",idn:"Biasanya buka siang hari dengan tur berpemandu ke dalam rumah. Jam buka dan aturan foto bisa berubah, jadi cek Google Maps dan situs resminya"},cost:{min:150,max:400},costNote:{en:"The house tour ticket is about 200–250 THB for foreign visitors; the café and shop are extra (estimate).",idn:"Tiket tur rumah untuk wisatawan asing sekitar 200–250 THB, kafe dan toko terpisah (perkiraan)."},duration:[1,2],area:"siam",locationText:{en:"Jim Thompson House, Soi Kasemsan 2, Pathum Wan",idn:"Jim Thompson House, Soi Kasemsan 2, Pathum Wan"},transit:{en:"BTS National Stadium, then a short walk to Soi Kasemsan 2. (Confirm exit on Google Maps.)",idn:"BTS National Stadium, lalu jalan kaki sebentar ke Soi Kasemsan 2. (Cek pintu keluar di Google Maps.)"},indoor:"both",crowd:"both",energy:1,tags:["photo","relaxing","hidden-gem","date-night"],weather:{en:"The garden is outdoors and shaded; the house tour is indoors, so a drizzle is not a problem but a downpour can slow the walk.",idn:"Tamannya di luar ruangan tapi teduh, dan tur rumahnya di dalam ruangan, jadi gerimis nggak masalah. Kalau hujan deras, jalan kaki jadi agak repot."},tips:{en:"Photography is often restricted inside the house, so ask or look for signs. Remove shoes at the house entrance if asked. Dress modestly.",idn:"Di dalam rumah sering dilarang memotret, jadi tanya atau lihat papan petunjuk. Kalau diminta lepas sepatu di pintu masuk, ikuti saja. Pakai baju yang sopan."},geoQuery:"Jim Thompson House, Bangkok",mapsQuery:"Jim Thompson House Bangkok",imgQuery:"Jim Thompson House",imgAlt:"Traditional Thai teak houses in the garden of the Jim Thompson House museum in Bangkok",imgIllustrative:!1},{id:"fashion-siam-square-streetwear",group:"fashion",title:{en:"Siam Square & Siam Center: local streetwear and designer labels",idn:"Siam Square & Siam Center: streetwear lokal dan label desainer"},desc:{en:"Siam Center and the Siam Square sois are the heart of Bangkok's youth fashion: Thai designer labels, streetwear boutiques, sneaker and accessory shops, plus international brands in the connected malls. It is where Bangkok's trendsetters shop.",idn:"Siam Center dan gang-gang (soi) di Siam Square adalah pusat fashion anak muda Bangkok: label desainer Thailand, butik streetwear, toko sneaker dan aksesori, plus brand internasional di mal-mal yang terhubung. Di sinilah para trendsetter Bangkok belanja."},special:{en:"You can shop Thai labels you will not find at home, all in air-conditioning, and everything is within walking distance of BTS Siam. Mix with photo booths and cafés nearby.",idn:"Kamu bisa belanja brand Thailand yang nggak ada di Indonesia, semuanya ber-AC, dan semua bisa dijangkau jalan kaki dari BTS Siam. Gabungkan dengan photo booth dan kafe di sekitarnya biar harimu makin seru."},bestTime:["afternoon","evening"],timeText:{en:"12:00–20:00; malls usually open around 10:00–22:00 but small Siam Square shops vary (check Google Maps)",idn:"Disarankan 12:00–20:00. Mal biasanya buka sekitar 10:00–22:00, tapi toko-toko kecil di Siam Square jamnya beda-beda (cek Google Maps)"},cost:{min:0,max:3e3},costNote:{en:"Window-shopping is free; local-brand tees and accessories are typically around 500–2,500 THB, so set a budget before you go (estimates).",idn:"Cuci mata gratis. Kaos dan aksesori brand lokal biasanya sekitar 500–2.500 THB, jadi tentukan budget sebelum berangkat (perkiraan)."},duration:[2,4],area:"siam",locationText:{en:"Siam Center, Siam Discovery and Siam Square",idn:"Siam Center, Siam Discovery, dan Siam Square"},transit:{en:"BTS Siam; skywalk and street-level routes connect the malls and Siam Square. (Confirm exit on Google Maps.)",idn:"BTS Siam. Skywalk dan jalur di permukaan jalan menghubungkan mal-mal dan Siam Square. (Cek pintu keluar di Google Maps.)"},indoor:"both",crowd:"both",energy:2,tags:["rainy-day","team-bonding","photo","after-practice"],weather:{en:"Malls are cool inside, but walking between them and Siam Square is outdoors and hot; use the skywalk where possible.",idn:"Di dalam mal adem, tapi jalan antara mal dan Siam Square itu di luar ruangan dan panas. Pakai skywalk kalau bisa."},tips:{en:"Compare prices across floors and try on before buying. Tourist tax refund (VAT) rules apply at some stores; ask at the till. Bring your original passport.",idn:"Bandingkan harga antarlantai dan coba dulu sebelum beli. Beberapa toko melayani pengembalian pajak (VAT refund) untuk turis, tanyakan di kasir. Untuk klaimnya kamu perlu paspor asli."},geoQuery:"Siam Center, Bangkok",mapsQuery:"Siam Center Bangkok",imgQuery:"Siam Center Bangkok",imgAlt:"The exterior of the Siam Center shopping mall in Bangkok",imgIllustrative:!1},{id:"fashion-chatuchak-weekend-market",group:"fashion",title:{en:"Chatuchak Weekend Market: vintage, handmade and local brands",idn:"Chatuchak Weekend Market: vintage, handmade, dan brand lokal"},desc:{en:"Chatuchak is one of the world's biggest weekend markets, with thousands of stalls selling vintage clothing, secondhand jeans and jackets, handmade accessories and small local fashion brands, alongside home goods, plants and street food.",idn:"Chatuchak adalah salah satu pasar akhir pekan terbesar di dunia, dengan ribuan lapak yang menjual baju vintage, jin dan jaket bekas, aksesori handmade, brand fashion lokal kecil, sampai perabot rumah, tanaman, dan jajanan kaki lima."},special:{en:"The best place in Bangkok for one-off vintage and indie pieces at low prices; haggling is part of the fun. Bring cash and a big bag.",idn:"Tempat terbaik di Bangkok untuk berburu barang vintage dan indie yang unik dengan harga murah. Menawar itu bagian dari keseruannya. Bawa uang tunai dan tas besar."},bestTime:["morning","afternoon"],timeText:{en:"Mainly Saturday and Sunday, from morning until early evening; some sections also open Friday evening. Check Google Maps for current hours. Go before noon to beat heat and crowds",idn:"Utamanya Sabtu dan Minggu, dari pagi sampai sore, dan sebagian area juga buka Jumat malam. Cek jam buka terbaru di Google Maps. Datang sebelum tengah hari biar terhindar dari panas dan keramaian"},cost:{min:200,max:2e3},costNote:{en:"Secondhand tees and tops often start around 100–300 THB; jackets and designer pieces cost more (estimates; prices are negotiable).",idn:"Kaos dan atasan bekas biasanya mulai sekitar 100–300 THB, jaket dan barang desainer lebih mahal (perkiraan, harga bisa ditawar)."},duration:[3,5],area:"other",locationText:{en:"Chatuchak Weekend Market, Chatuchak district",idn:"Chatuchak Weekend Market, distrik Chatuchak"},transit:{en:"MRT Kamphaeng Phet or MRT Chatuchak Park, or BTS Mo Chit. (Confirm exit on Google Maps.)",idn:"MRT Kamphaeng Phet atau MRT Chatuchak Park, atau BTS Mo Chit. (Cek pintu keluar di Google Maps.)"},indoor:"outdoor",crowd:"both",energy:3,tags:["adventurous","team-bonding","photo"],weather:{en:"Very hot and humid with a maze of covered lanes; crowds peak at midday. Bring water, sunscreen and a hand fan. Heavy rain can flood parts of the lanes.",idn:"Sangat panas dan lembap, dengan gang-gang beratap seperti labirin. Paling ramai saat tengah hari. Bawa air minum, sunscreen, dan kipas tangan. Saat hujan deras, sebagian gang bisa tergenang."},tips:{en:"Pickpocketing happens in crowds, so keep bags zipped and in front. The market is a maze, so save a pin to the exit or your meeting point. Try on clothes only where it is allowed and bargain politely.",idn:"Ada copet di tengah keramaian, jadi tutup ritsleting tas dan pakai di depan badan. Pasarnya seperti labirin, jadi simpan pin pintu keluar atau titik kumpul di Google Maps. Coba baju hanya di tempat yang membolehkan, dan menawarlah dengan sopan."},geoQuery:"Chatuchak Weekend Market, Bangkok",mapsQuery:"Chatuchak Weekend Market Bangkok",imgQuery:"Chatuchak Weekend Market",imgAlt:"Crowded lanes of stalls at Chatuchak Weekend Market in Bangkok",imgIllustrative:!1},{id:"fashion-mbk-art-toys",group:"fashion",title:{en:"MBK Center & Siam art-toy hunt",idn:"MBK Center & berburu art toy di Siam"},desc:{en:"Bangkok has a lively designer-toy scene, with blind boxes, collectible figures and gashapon at shops in MBK Center, Siam Center and other malls. Browse resale and collector stalls in MBK and branded stores in the nearby malls.",idn:"Bangkok punya kultur designer toy yang hidup: blind box, figure koleksi, dan gacha bisa kamu temukan di MBK Center, Siam Center, dan mal lainnya. Di MBK kamu bisa lihat-lihat lapak resell dan kolektor, sementara di mal sekitarnya ada toko resmi brand."},special:{en:"A fun treasure hunt where you can find both mainstream blind boxes and rare collector pieces, and compare prices across floors. Great for fans of figures and anime-style merch.",idn:"Serunya seperti berburu harta karun: dari blind box populer sampai barang koleksi langka, sambil membandingkan harga antarlantai. Cocok banget buat penggemar figure dan merchandise bergaya anime."},bestTime:["afternoon","evening"],timeText:{en:"12:00–20:00; MBK is usually open until about 21:00–22:00 but stall hours vary (check Google Maps)",idn:"Disarankan 12:00–20:00. MBK biasanya buka sampai sekitar 21:00–22:00, tapi jam tiap lapak beda-beda (cek Google Maps)"},cost:{min:0,max:2e3},costNote:{en:"Blind boxes typically cost a few hundred THB each; collector pieces and resale items can be much more (estimates). Set a budget before you start.",idn:"Blind box biasanya beberapa ratus THB per buah, sedangkan barang koleksi dan resell bisa jauh lebih mahal (perkiraan). Tentukan budget sebelum mulai."},duration:[1.5,3],area:"siam",locationText:{en:"MBK Center and Siam Center, Pathum Wan",idn:"MBK Center dan Siam Center, Pathum Wan"},transit:{en:"BTS National Stadium for MBK Center (direct walkway); BTS Siam for Siam Center. (Confirm exit on Google Maps.)",idn:"BTS National Stadium untuk MBK Center (terhubung langsung lewat jembatan), BTS Siam untuk Siam Center. (Cek pintu keluar di Google Maps.)"},indoor:"indoor",crowd:"both",energy:2,tags:["rainy-day","team-bonding","after-practice","adventurous"],tips:{en:"Inspect items for authenticity and sealed packaging; counterfeits exist at lower-end stalls. Fixed-price brand stores do not haggle; MBK market stalls often do. Ask about tax-refund eligibility if you spend a lot.",idn:"Periksa keaslian barang dan segelnya. Di lapak murah bisa ada barang palsu. Toko resmi brand harganya pas, sedangkan lapak di MBK sering bisa ditawar. Kalau belanja banyak, tanyakan juga soal VAT refund."},geoQuery:"MBK Center, Bangkok",mapsQuery:"art toy shop MBK Center Bangkok",imgQuery:"MBK Center Bangkok",imgAlt:"The MBK Center shopping mall in Bangkok",imgIllustrative:!0},{id:"fashion-tcdc-grand-postal",group:"fashion",title:{en:"TCDC at the Grand Postal Building: Thai design hub",idn:"TCDC di Grand Postal Building: pusat desain Thailand"},desc:{en:"The Thailand Creative & Design Center (TCDC) sits in the historic Grand Postal Building on Charoen Krung Road. It runs design exhibitions, a materials library and a design shop, and often hosts talks and events for creatives.",idn:"TCDC (Thailand Creative & Design Center) ada di gedung bersejarah Grand Postal Building di Charoen Krung Road. Tempat ini punya pameran desain, perpustakaan material, dan toko desain, serta sering mengadakan talk dan acara untuk para kreator."},special:{en:"A quiet, air-conditioned way to see how Thai designers think, great for fashion, graphics and product-design fans. Also a great base for the Charoen Krung creative district.",idn:"Cara tenang dan ber-AC untuk melihat ide-ide para desainer Thailand. Cocok buat penggemar fashion, desain grafis, dan desain produk, sekaligus jadi titik awal yang pas untuk menjelajahi kawasan kreatif Charoen Krung."},bestTime:["afternoon"],timeText:{en:"Daytime hours; some areas are closed on certain days, so check Google Maps and the current exhibition schedule",idn:"Buka siang hari, dan beberapa area tutup di hari tertentu. Cek Google Maps dan jadwal pameran yang sedang berjalan"},cost:{min:0,max:300},costNote:{en:"Exhibitions and the library may be free or low-cost; budget for a coffee or a design-shop item (estimate; check current entry rules).",idn:"Pameran dan perpustakaan bisa gratis atau murah. Siapkan budget untuk kopi atau barang dari toko desain (perkiraan, cek aturan masuk terbaru)."},duration:[1,2],area:"charoen-krung",locationText:{en:"Grand Postal Building (TCDC), Charoen Krung Road, Bang Rak",idn:"Grand Postal Building (TCDC), Charoen Krung Road, Bang Rak"},transit:{en:"BTS Saphan Taksin plus a taxi/Grab, or a river boat to a nearby pier and a walk. (Confirm route on Google Maps.)",idn:"BTS Saphan Taksin lalu taksi/Grab, atau naik perahu sungai ke dermaga terdekat lalu jalan kaki. (Cek rute di Google Maps.)"},indoor:"indoor",crowd:"both",energy:1,tags:["rainy-day","relaxing","hidden-gem","photo"],tips:{en:"The center has moved locations in the past, so confirm the current address and opening status on Google Maps before you go. Check which exhibitions are running.",idn:"TCDC pernah pindah lokasi, jadi pastikan alamat terbaru dan status bukanya di Google Maps sebelum berangkat. Cek juga pameran apa yang sedang berlangsung."},geoQuery:"TCDC Grand Postal Building, Bangkok",mapsQuery:"TCDC Thailand Creative and Design Center Bangkok",imgQuery:"Grand Postal Building Bangkok",imgAlt:"The historic Grand Postal Building on Charoen Krung Road in Bangkok",imgIllustrative:!1},{id:"fashion-asiatique-riverfront",group:"fashion",title:{en:"Asiatique The Riverfront: night market and boutiques",idn:"Asiatique The Riverfront: pasar malam dan butik"},desc:{en:"Asiatique is a riverside open-air night bazaar built in old shipping warehouses, with hundreds of small shops for clothes, accessories and souvenirs, plus restaurants, a ferris wheel and river views.",idn:"Asiatique adalah pasar malam terbuka di tepi sungai yang dibangun di bekas gudang pelabuhan, dengan ratusan toko kecil yang menjual baju, aksesori, dan suvenir, plus restoran, bianglala, dan pemandangan sungai."},special:{en:"A relaxed shopping-and-sunset evening with a free shuttle boat ride and plenty of food options. Fun for a team night out.",idn:"Sore santai sambil belanja dan menikmati sunset, lengkap dengan naik perahu shuttle gratis. Pilihan makanannya banyak, jadi seru buat jalan-jalan bareng tim."},bestTime:["evening","night"],timeText:{en:"Opens in the late afternoon and runs until about midnight; check Google Maps and the official schedule",idn:"Buka sore hari sampai sekitar tengah malam. Cek Google Maps dan jadwal resminya"},cost:{min:0,max:1500},costNote:{en:"Entry is free; clothes and souvenirs vary widely (estimates). A ferris-wheel ride typically costs a few hundred THB.",idn:"Masuk gratis, harga baju dan suvenir sangat bervariasi (perkiraan). Naik bianglala biasanya beberapa ratus THB."},duration:[2,4],area:"riverside",locationText:{en:"Asiatique The Riverfront, Charoen Krung Road, Bang Kho Laem",idn:"Asiatique The Riverfront, Charoen Krung Road, Bang Kho Laem"},transit:{en:"BTS Saphan Taksin, then the free Asiatique shuttle boat from Sathorn (Central) Pier. (Confirm service times and route on Google Maps / Asiatique official channels.)",idn:"BTS Saphan Taksin, lalu naik perahu shuttle gratis Asiatique dari Dermaga Sathorn (Central). (Cek jam operasional dan rute di Google Maps / kanal resmi Asiatique.)"},indoor:"outdoor",crowd:"both",energy:2,tags:["date-night","team-bonding","photo","late-night"],weather:{en:"Open-air with some covered areas; hot at dusk and rain can interrupt the market. Check the forecast and bring a small rain jacket.",idn:"Area terbuka dengan sebagian kecil yang beratap. Tetap panas menjelang senja, dan hujan bisa mengganggu operasional pasar. Cek prakiraan cuaca dan bawa jas hujan tipis."},tips:{en:"Prices at tourist-oriented shops can be higher than other markets, so compare and bargain politely. Last shuttle-boat times matter; confirm them so you do not get stranded.",idn:"Toko yang menyasar turis bisa lebih mahal dibanding pasar lain, jadi bandingkan harga dan menawarlah dengan sopan. Pastikan jam perahu shuttle terakhir supaya kamu nggak terjebak."},geoQuery:"Asiatique The Riverfront, Bangkok",mapsQuery:"Asiatique The Riverfront Bangkok",imgQuery:"Asiatique The Riverfront",imgAlt:"The Asiatique The Riverfront night market with its ferris wheel in Bangkok",imgIllustrative:!1}]});var Do,Yo=S(()=>{Do=[{id:"active-benjakitti-ride",group:"active",title:{en:"Benjakitti Park: Evening Ride, Jog & Skyline Lake Loop",idn:"Benjakitti Park: Sepeda Sore, Jogging & Danau Berlatar Skyline"},desc:{en:"A big lakeside park in the middle of the city with a smooth loop path for cycling, jogging or a slow walk. The skyline of Sukhumvit rises behind the water, and the next-door Benjakitti Forest Park has an elevated boardwalk through trees.",idn:"Taman danau besar di tengah kota dengan jalur keliling yang mulus untuk bersepeda, jogging, atau jalan santai. Gedung-gedung Sukhumvit menjulang di belakang danau, dan Benjakitti Forest Park di sebelahnya punya jalur papan layang yang melintas di antara pepohonan."},special:{en:"Flat, easy and safe-feeling, so even non-cyclists can do it. Golden hour over the lake is one of the best free views in Bangkok, and it is a perfect low-key way to stretch out after a long practice day.",idn:"Jalurnya datar, gampang, dan terasa aman, jadi yang jarang bersepeda pun bisa. Golden hour di atas danau adalah salah satu pemandangan gratis terbaik di Bangkok, dan pas banget untuk melemaskan badan setelah seharian latihan."},bestTime:["evening"],timeText:{en:"About 16:30–19:00 for cooler air and golden hour. Avoid midday heat.",idn:"Sekitar 16:30–19:00 enak: udara lebih adem dan pas golden hour. Hindari panas tengah hari."},cost:{min:0,max:300},costNote:{en:"Entry is normally free. Bike rental, if you want one, is usually a small hourly fee (estimate ~50–150 THB/hour) and may ask for an ID or deposit. Availability varies, so confirm on site.",idn:"Masuk biasanya gratis. Sewa sepeda biasanya murah per jam (perkiraan ~50–150 THB/jam) dan bisa diminta kartu identitas atau deposit. Ketersediaannya bisa berubah, jadi cek di lokasi."},duration:[1,2],area:"other",locationText:{en:"Benjakitti Park, Khlong Toei (off Rama IV / Ratchadaphisek Rd)",idn:"Benjakitti Park, Khlong Toei (dekat Rama IV / Ratchadaphisek Rd)"},transit:{en:"MRT Queen Sirikit National Convention Centre (QSNCC) is the closest station; a short walk to the park gates. (Confirm exit on Google Maps.)",idn:"Stasiun terdekat adalah MRT Queen Sirikit National Convention Centre (QSNCC), tinggal jalan kaki sebentar ke gerbang taman. (Cek pintu keluar di Google Maps.)"},indoor:"outdoor",crowd:"both",energy:2,tags:["after-practice","team-bonding","relaxing","photo","date-night"],weather:{en:"Go late afternoon: midday sun is brutal and there is little shade on the lake path. Bring water and sunscreen. If air quality is bad (PM2.5 is often higher from about December to March), skip the hard run and walk instead. Rain showers can arrive fast in the rainy season, so check the forecast.",idn:"Datang sore hari: matahari tengah hari menyengat dan jalur danau hampir nggak ada teduhnya. Bawa air minum dan sunscreen. Kalau kualitas udara buruk (PM2.5 sering tinggi sekitar Desember–Maret), ganti lari dengan jalan santai. Di musim hujan, hujan bisa turun tiba-tiba, jadi cek aplikasi cuaca."},tips:{en:"Ride/run in the direction of traffic on the path and keep to your lane; weekends get busy with families and bike groups. Park hours and rental rules can change, so confirm on Google Maps. Stay hydrated and avoid the sun for a few hours after hard training.",idn:"Ikuti arah jalur dan tetap di lajurmu. Akhir pekan ramai keluarga dan rombongan sepeda. Jam buka taman dan aturan sewa bisa berubah, jadi cek di Google Maps. Setelah latihan berat, minum yang cukup dan hindari matahari."},geoQuery:"Benjakitti Park, Bangkok",mapsQuery:"Benjakitti Park Bangkok",imgQuery:"Benjakitti Park",imgAlt:"Lake and skyline at Benjakitti Park in Bangkok",imgIllustrative:!1},{id:"active-lumphini-run-paddle",group:"active",title:{en:"Lumphini Park: Run, Paddle Boat & Meet the Lizards",idn:"Lumphini Park: Lari, Perahu Bebek & Ketemu Biawak"},desc:{en:"Bangkok's classic central park, with a loop path around a lake, shaded trees and a skyline backdrop. You can run laps, rent a paddle boat on the lake, or just walk and people-watch. Large Asian water monitor lizards roam the park, which surprises almost every first-timer.",idn:"Taman pusat kota klasik di Bangkok, dengan jalur keliling danau, pohon-pohon rindang, dan latar gedung-gedung tinggi. Kamu bisa lari keliling, sewa perahu bebek di danau, atau sekadar jalan sambil lihat-lihat orang. Biawak air (water monitor) besar berkeliaran di taman, dan hampir semua pengunjung pertama pasti kaget."},special:{en:"Run-friendly, central and easy by train. Around sunset there are often free outdoor aerobic and exercise groups, and at 18:00 the national anthem plays over the park (everyone pauses). Paddle boats on the lake are a cheap, silly team activity.",idn:"Enak buat lari, di tengah kota, dan gampang dijangkau naik kereta. Menjelang sunset sering ada senam aerobik dan kelompok olahraga gratis, dan jam 18:00 lagu kebangsaan diputar di seluruh taman (semua orang berhenti sejenak). Perahu bebek di danau itu aktivitas tim yang murah dan kocak."},bestTime:["morning","evening"],timeText:{en:"Early morning (about 05:30–08:00) or late afternoon to evening (about 16:30–19:30). Park hours can change, so check.",idn:"Pagi-pagi (sekitar 05:30–08:00) atau sore sampai malam (sekitar 16:30–19:30). Jam buka taman bisa berubah, jadi cek dulu."},cost:{min:0,max:150},costNote:{en:"Park entry is typically free. Paddle boats cost a small fee (estimate ~40–100 THB per boat, per 30 min). Confirm on site.",idn:"Masuk taman biasanya gratis. Perahu bebek murah (perkiraan ~40–100 THB per perahu per 30 menit). Cek di lokasi."},duration:[1,2],area:"other",locationText:{en:"Lumphini Park, Pathum Wan / Silom (Rama IV Rd)",idn:"Lumphini Park, Pathum Wan / Silom (Rama IV Rd)"},transit:{en:"MRT Lumphini station is right by the park; MRT Silom / BTS Sala Daeng are also close. (Confirm exit on Google Maps.)",idn:"Stasiun MRT Lumphini persis di samping taman. MRT Silom / BTS Sala Daeng juga dekat. (Cek pintu keluar di Google Maps.)"},indoor:"outdoor",crowd:"both",energy:3,tags:["after-practice","team-bonding","relaxing","photo"],weather:{en:"Run early or at dusk; midday is dangerously hot for hard efforts. Check the AQI before running (PM2.5 is often higher from about December to March) and switch to walking if it is red. Sudden rain in the wet season.",idn:"Lari pagi-pagi atau menjelang senja. Olahraga berat di tengah hari itu berbahaya karena panasnya. Cek AQI sebelum lari (PM2.5 sering tinggi sekitar Desember–Maret), dan ganti jalan kaki kalau statusnya buruk. Di musim hujan, hujan bisa turun tiba-tiba."},tips:{en:"Keep a respectful distance from the monitor lizards: do not feed, touch or chase them (they bite and whip their tails, and they swim). Keep your phone and valuables zipped. Stand still when the anthem plays at 18:00 in public areas. Direction of travel on the main path is normally counter-clockwise, but follow the crowd.",idn:"Jaga jarak dari biawak: jangan diberi makan, disentuh, atau dikejar. Mereka bisa menggigit, mengibaskan ekor, dan juga berenang. Simpan HP dan barang berharga di tas beritsleting. Saat lagu kebangsaan diputar jam 18:00, berhenti dan berdiri diam di area publik sebagai bentuk hormat. Arah jalan di jalur utama biasanya berlawanan arah jarum jam, tapi ikuti saja arus orang."},geoQuery:"Lumphini Park, Bangkok",mapsQuery:"Lumphini Park Bangkok",imgQuery:"Lumphini Park Bangkok",imgAlt:"Lake and skyline at Lumphini Park in Bangkok",imgIllustrative:!1},{id:"active-pickleball-courts",group:"active",title:{en:"Pickleball in Bangkok: Rent a Court with the Squad",idn:"Pickleball di Bangkok: Sewa Lapangan Bareng Squad"},desc:{en:"Pickleball has exploded in Bangkok, with courts in sports clubs, condo complexes, rooftop courts and dedicated facilities around Sukhumvit, Rama 9, Ratchada and many other districts. You rent a court by the hour, borrow paddles, and learn the rules in ten minutes.",idn:"Pickleball lagi booming di Bangkok. Ada lapangan di klub olahraga, kompleks kondominium, rooftop, dan fasilitas khusus di Sukhumvit, Rama 9, Ratchada, dan banyak kawasan lain. Sewa lapangan per jam, pinjam paddle, dan aturannya bisa dipelajari dalam sepuluh menit."},special:{en:"Easy to learn, low injury risk (compared with contact sports), social and competitive at the same time, and perfect for splitting into 2v2 teams. Indoor/covered courts also work in rain or heat.",idn:"Gampang dipelajari, risiko cedera rendah (dibanding olahraga kontak), bisa sekaligus seru-seruan dan kompetitif, pas banget untuk dibagi jadi tim 2v2. Lapangan indoor/beratap tetap bisa dipakai saat hujan atau panas."},bestTime:["morning","evening"],timeText:{en:"Early morning or after about 17:00 when it cools down. Many courts are busiest on weekday evenings and weekends, so book earlier.",idn:"Pagi-pagi atau setelah sekitar 17:00 saat udara mulai adem. Malam hari kerja dan akhir pekan paling ramai, jadi booking lebih awal."},cost:{min:100,max:400},costNote:{en:"Estimate: court rental often ~200–600 THB per hour per court (split among 4 players), plus paddle/ball rental if needed. Prices vary by venue and time of day.",idn:"Perkiraan: sewa lapangan biasanya ~200–600 THB per jam per lapangan (dibagi 4 pemain), ditambah sewa paddle/bola kalau perlu. Harga beda-beda tergantung tempat dan jam."},duration:[1,2],area:"other",locationText:{en:"Pickleball courts across Bangkok (Sukhumvit, Rama 9, Ratchada and more). Search nearby on Google Maps.",idn:"Lapangan pickleball di berbagai sudut Bangkok (Sukhumvit, Rama 9, Ratchada, dan lainnya). Cari yang terdekat di Google Maps."},transit:{en:'Depends on the court. Search "pickleball court Bangkok" on Google Maps near your hotel and filter for ones near a BTS/MRT station. Grab is easy for the rest. (Confirm exit on Google Maps.)',idn:'Tergantung lapangannya. Cari "pickleball court Bangkok" di Google Maps dekat hotelmu, lalu pilih yang dekat stasiun BTS/MRT. Sisanya paling gampang naik Grab. (Cek pintu keluar di Google Maps.)'},indoor:"both",crowd:"group",energy:3,tags:["team-bonding","after-practice","adventurous"],weather:{en:"Outdoor courts are hot and slippery after rain; choose covered or indoor ones midday. Drink more than you think, and take breaks in the shade.",idn:"Lapangan outdoor panas dan licin setelah hujan. Siang hari, pilih lapangan beratap atau indoor. Minum lebih banyak dari yang kamu kira, dan istirahat di tempat teduh."},tips:{en:"Book ahead via the venue's LINE/phone/online booking (do not rely on walk-ins in the evening). Ask about paddle rental and whether balls are included. Wear non-marking court shoes. Players who protect their wrists and hands for a living should not overdo it: warm up and stop if anything feels sore.",idn:"Booking dulu lewat LINE/telepon/online milik tempatnya (malam hari hampir nggak bisa walk-in). Tanyakan sewa paddle dan apakah bola sudah termasuk. Pakai sepatu lapangan non-marking. Kalau tangan dan pergelangan adalah modal kerjamu, jangan memaksakan diri: pemanasan yang cukup dan langsung berhenti kalau ada yang terasa sakit."},mapsQuery:"pickleball court Bangkok",imgQuery:"Pickleball",imgAlt:"Players on a pickleball court holding paddles",imgIllustrative:!0},{id:"active-indoor-bouldering",group:"active",title:{en:"Indoor Bouldering: Climb Without Ropes (and Without the Heat)",idn:"Bouldering Indoor: Panjat Tanpa Tali (dan Tanpa Kepanasan)"},desc:{en:"Bangkok has a growing number of air-conditioned climbing gyms with bouldering walls, mostly low walls over thick padding, so there is no rope or harness. Route colors show difficulty, and most gyms have beginner problems that anyone can try.",idn:"Gym panjat ber-AC di Bangkok makin banyak. Bouldering itu memanjat dinding rendah di atas matras tebal, jadi nggak perlu tali atau harness. Tingkat kesulitan ditandai dengan warna, dan banyak rute untuk pemula."},special:{en:'Great problem-solving and team-cheering activity that works in any weather. It is also a hit with people who like "puzzle + body" challenges.',idn:"Bisa dilakukan di cuaca apa pun, dan serunya seperti memecahkan teka-teki pakai badan. Saling menyemangati bikin suasana tim makin solid."},bestTime:["afternoon","evening"],timeText:{en:"Afternoon or evening. Weekday evenings get busy. Check each gym's opening hours on Google Maps.",idn:"Siang atau malam. Malam hari kerja biasanya ramai. Cek jam buka tiap gym di Google Maps."},cost:{min:300,max:700},costNote:{en:"Estimate for a day pass plus shoe rental (~300–700 THB). Some gyms charge extra for chalk or a safety briefing for first-timers. Prices vary.",idn:"Perkiraan untuk tiket harian + sewa sepatu (~300–700 THB). Beberapa gym mengenakan biaya tambahan untuk kapur (chalk) atau briefing keselamatan bagi pemula. Harga bervariasi."},duration:[1,2],area:"other",locationText:{en:'Climbing/bouldering gyms in several districts. Search "bouldering gym Bangkok" on Google Maps.',idn:'Gym panjat/bouldering di beberapa kawasan. Cari "bouldering gym Bangkok" di Google Maps.'},transit:{en:"Depends on the gym; many are near a BTS/MRT station or easy by Grab. Check the route on Google Maps. (Confirm exit on Google Maps.)",idn:"Tergantung gym-nya. Banyak yang dekat stasiun BTS/MRT, atau gampang naik Grab. Cek rute di Google Maps. (Cek pintu keluar di Google Maps.)"},indoor:"indoor",crowd:"both",energy:3,tags:["after-practice","team-bonding","rainy-day","adventurous"],tips:{en:"Wear stretchy clothes and bring a small towel; rental shoes are normally available. Tell staff you are a beginner for a quick briefing on falling safely. Be careful with your hands and wrists: players and coaches whose hands are their livelihood should pick easy routes, skip big jumps and stop when forearms get tired. Check your team's rules before doing anything with injury risk.",idn:"Pakai baju yang elastis dan bawa handuk kecil. Sepatu biasanya bisa disewa. Bilang ke staf kalau kamu pemula, nanti diajari singkat cara jatuh yang aman. Pemain/staf yang tangan dan pergelangannya penting sebaiknya pilih rute mudah, hindari lompatan besar, dan langsung istirahat kalau lengan bawah mulai lelah. Untuk aktivitas yang berisiko cedera, cek aturan tim dulu."},mapsQuery:"bouldering gym Bangkok",imgQuery:"Indoor bouldering",imgAlt:"A climber on an indoor bouldering wall with colored holds",imgIllustrative:!0},{id:"active-badminton-courts",group:"active",title:{en:"Badminton Courts: Thailand's Everyday Sport",idn:"Lapangan Bulu Tangkis: Olahraga Sehari-hari Orang Thailand"},desc:{en:"Badminton courts are everywhere in Bangkok: in sports centers, mall-adjacent clubs, condos and community halls. You rent a court by the hour and can usually rent rackets and buy shuttlecocks on site.",idn:"Di Bangkok, orang main bulu tangkis di mana-mana: pusat olahraga, klub dekat mal, kondominium, sampai gedung olahraga warga. Lapangan disewa per jam, dan biasanya kamu bisa sewa raket dan beli kok di tempat."},special:{en:"Cheap, easy to organize, and everyone can join regardless of skill. Doubles matches are a good way to split a big group into fun teams.",idn:"Murah, gampang diatur, dan semua bisa ikut tanpa peduli level skill. Pertandingan ganda juga cara seru untuk membagi rombongan besar jadi beberapa tim."},bestTime:["morning","evening"],timeText:{en:"Evening is the busiest time for locals; mornings are easiest to book. Check hours on Google Maps.",idn:"Malam hari paling ramai oleh warga lokal, pagi hari paling gampang booking. Cek jam buka di Google Maps."},cost:{min:50,max:250},costNote:{en:"Estimate per person when splitting a court for 1 hour (courts roughly 150–500 THB/hour depending on venue, air-conditioned ones cost more). Racket rental and shuttlecocks are small extras.",idn:"Perkiraan per orang kalau patungan sewa lapangan 1 jam (lapangan kira-kira 150–500 THB/jam, yang ber-AC lebih mahal). Sewa raket dan kok cuma tambahan kecil."},duration:[1,2],area:"other",locationText:{en:'Badminton courts across Bangkok. Search "badminton court Bangkok" near your hotel on Google Maps.',idn:'Lapangan bulu tangkis di berbagai sudut Bangkok. Cari "badminton court Bangkok" dekat hotelmu di Google Maps.'},transit:{en:"Depends on the venue. Pick one near a BTS/MRT station or use Grab. (Confirm exit on Google Maps.)",idn:"Tergantung tempatnya. Pilih yang dekat stasiun BTS/MRT atau naik Grab. (Cek pintu keluar di Google Maps.)"},indoor:"both",crowd:"group",energy:3,tags:["after-practice","team-bonding","rainy-day"],weather:{en:"Some courts are open-sided and hot; air-conditioned halls are worth the extra baht. Wind affects shuttlecocks outdoors.",idn:"Lapangan yang terbuka tanpa dinding itu panas, jadi hall ber-AC sepadan dengan tambahan biayanya. Di luar ruangan, angin bisa memengaruhi kok."},tips:{en:"Call or message to book the court (many venues use LINE; staff may only speak basic English, so a translation app helps). Wear indoor court shoes. Hands-and-wrists protection: warm up, and stop if your wrist or shoulder feels strained.",idn:"Booking lapangan lewat telepon atau chat (banyak tempat pakai LINE dan staf mungkin hanya bisa bahasa Inggris dasar, jadi aplikasi penerjemah membantu). Pakai sepatu lapangan indoor. Pemanasan pergelangan tangan/bahu yang cukup, dan langsung berhenti kalau terasa tegang."},mapsQuery:"badminton court Bangkok",imgQuery:"Badminton court",imgAlt:"An indoor badminton court with nets and players",imgIllustrative:!0},{id:"active-muay-thai-beginner",group:"active",title:{en:"Beginner Muay Thai Session (Fitness-Style)",idn:"Kelas Coba Muay Thai (Gaya Fitness)"},desc:{en:"Many Muay Thai gyms offer drop-in group classes for tourists: warm-up, shadowboxing, pad work and basic strikes, then conditioning. You learn the stance, jab, cross, kicks and knees on pads, with no need to spar.",idn:"Banyak gym Muay Thai membuka kelas grup drop-in untuk wisatawan: pemanasan, shadowboxing, latihan pad, pukulan dasar, lalu conditioning. Kamu belajar kuda-kuda, jab, cross, tendangan, dan lutut ke pad, tanpa perlu sparring."},special:{en:'The most "Thailand" workout you can do, a great stress release, and a story to tell. Fitness-style classes are far more beginner-friendly than the intimidating ring scene suggests.',idn:'Olahraga paling "Thailand" yang bisa kamu coba, ampuh buat melepas stres, dan jadi cerita seru. Kelas gaya fitness jauh lebih ramah pemula dibanding kesan seram arena tinju.'},bestTime:["morning","afternoon","evening"],timeText:{en:"Group classes are often held morning and late afternoon/evening. Ask the gym for its schedule (usually 1–2 hours).",idn:"Kelas grup biasanya ada pagi dan sore/malam. Tanyakan jadwalnya ke gym (biasanya 1–2 jam)."},cost:{min:500,max:1500},costNote:{en:"Estimate for a drop-in group class at a tourist-oriented gym (~500–1,500 THB). Private lessons cost more. Prices vary, so confirm directly with the gym before you go.",idn:"Perkiraan untuk kelas grup drop-in di gym yang menyasar wisatawan (~500–1.500 THB). Kelas privat lebih mahal. Harga bervariasi, jadi pastikan langsung ke gym sebelum datang."},duration:[1,2],area:"other",locationText:{en:'Muay Thai gyms across Bangkok. Search "Muay Thai beginner class Bangkok" on Google Maps and read recent reviews.',idn:'Gym Muay Thai di berbagai sudut Bangkok. Cari "Muay Thai beginner class Bangkok" di Google Maps dan baca ulasan terbaru.'},transit:{en:"Depends on the gym. Pick one with good recent reviews that is near a BTS/MRT station or takes a short Grab ride. (Confirm exit on Google Maps.)",idn:"Tergantung gym-nya. Pilih yang ulasan terbarunya bagus dan dekat stasiun BTS/MRT atau cukup naik Grab sebentar. (Cek pintu keluar di Google Maps.)"},indoor:"indoor",crowd:"both",energy:3,tags:["after-practice","team-bonding","adventurous"],tips:{en:'Book directly with the gym, not through street touts. People who approach you in tourist areas offering "cheap fight tickets" or "free training" often add commissions, so skip them. Tell the trainer you are a beginner and want no sparring. Bring water, a towel and shorts; gloves can usually be rented. If you rely on your hands and wrists professionally, ask your team before doing any contact training. Expect a lot of sweat and heat (some gyms have only fans).',idn:'Booking langsung ke gym, jangan lewat calo di jalan. Orang yang mendekatimu di area wisata dengan tawaran "tiket pertandingan murah" atau "latihan gratis" sering memasang komisi, jadi abaikan saja. Bilang ke pelatih bahwa kamu pemula dan nggak mau sparring. Bawa air minum, handuk, dan celana pendek (sarung tinju biasanya bisa disewa). Kalau tangan dan pergelangan adalah inti pekerjaanmu, tanya tim dulu sebelum latihan kontak. Siap-siap keringetan banget, beberapa gym cuma pakai kipas angin.'},mapsQuery:"Muay Thai beginner class Bangkok",imgQuery:"Muay Thai training",imgAlt:"A beginner practicing Muay Thai kicks on pads at a gym",imgIllustrative:!0},{id:"active-chula-centenary-park-run",group:"active",title:{en:"Chulalongkorn Centenary Park: Easy Loop Run & Rain Garden",idn:"Chulalongkorn Centenary Park: Lari Santai & Taman Hujan"},desc:{en:"A modern green park by Chulalongkorn University, designed to soak up floodwater, with walking and jogging loops, lawns and a small lake and a green roof. It is compact, easy to reach by train and nice for a short run or walk.",idn:"Taman modern di samping Universitas Chulalongkorn yang dirancang untuk menampung air hujan, dengan jalur jalan kaki/jogging, hamparan rumput, kolam kecil, dan atap hijau. Ukurannya ringkas dan gampang dijangkau naik kereta, enak untuk lari atau jalan sebentar."},special:{en:"A cleaner, calmer alternative to the bigger parks, with a modern design and skyline views from the grass. Bigger green space Suan Luang Rama IX in the east is another option if you have a car or Grab.",idn:"Alternatif yang lebih rapi dan tenang dibanding taman-taman besar, dengan desain modern dan pemandangan skyline dari rumputnya. Kalau butuh ruang hijau lebih luas, ada Suan Luang Rama IX di timur kota, tapi harus naik Grab atau mobil."},bestTime:["morning","evening"],timeText:{en:"Early morning or evening. Park hours can change, so check on Google Maps.",idn:"Pagi-pagi atau malam hari. Jam buka taman bisa berubah, jadi cek di Google Maps."},cost:{min:0,max:0},costNote:{en:"Free to enter. Water and snacks nearby are cheap.",idn:"Masuk gratis. Air minum dan camilan di sekitarnya murah."},duration:[1,2],area:"other",locationText:{en:"Chulalongkorn Centenary Park, Pathum Wan (by Chulalongkorn University)",idn:"Chulalongkorn Centenary Park, Pathum Wan (di samping Universitas Chulalongkorn)"},transit:{en:"MRT Sam Yan station is the closest, a short walk. (Confirm exit on Google Maps.)",idn:"Stasiun terdekat MRT Sam Yan, tinggal jalan kaki sebentar. (Cek pintu keluar di Google Maps.)"},indoor:"outdoor",crowd:"both",energy:2,tags:["after-practice","relaxing","photo","hidden-gem"],weather:{en:"Shade is limited on the open lawn, so avoid midday. It is designed to hold rainwater, so lawns and paths can be wet after storms. Check air quality before running, especially from about December to March.",idn:"Area rumput terbuka minim teduh, jadi hindari tengah hari. Karena dirancang untuk menampung air hujan, rumput dan jalurnya bisa basah setelah hujan deras. Cek kualitas udara sebelum lari, terutama sekitar Desember–Maret."},tips:{en:"Bring your own water. Keep paths clear for runners and respect any posted rules. Pair it with a coffee or a meal in the university-area streets afterward.",idn:"Bawa air minum sendiri. Beri ruang di jalur untuk para pelari dan patuhi aturan yang terpasang. Setelahnya, enak lanjut ngopi atau makan di sekitar kawasan kampus."},geoQuery:"Chulalongkorn University Centenary Park, Bangkok",mapsQuery:"Chulalongkorn University Centenary Park Bangkok",imgQuery:"Chulalongkorn University Centenary Park",imgAlt:"Green lawns and a pond at Chulalongkorn University Centenary Park",imgIllustrative:!1},{id:"group-escape-rooms",group:"group",title:{en:"Escape Room Challenge",idn:"Tantangan Escape Room"},desc:{en:"Escape-room venues in Bangkok offer themed rooms for 2–6 players with puzzles to solve in about an hour. Many are around the Siam and Sukhumvit areas and inside malls. Some rooms offer English game masters, and Indonesian speakers are usually fine with English instructions.",idn:"Di Bangkok ada escape room bertema untuk 2–6 orang, dengan teka-teki yang harus dipecahkan dalam sekitar satu jam. Banyak yang ada di sekitar Siam, Sukhumvit, dan di dalam mal. Beberapa tempat menyediakan game master berbahasa Inggris, jadi kamu tetap bisa seru-seruan dengan instruksi bahasa Inggris."},special:{en:"Perfect for teams who like strategy and communication, and it is air-conditioned. Great as an evening activity because it needs no fitness at all.",idn:"Pas banget buat tim yang suka strategi dan komunikasi. Ber-AC dan sama sekali nggak butuh fisik, jadi cocok untuk aktivitas malam."},bestTime:["afternoon","evening"],timeText:{en:"Rooms usually run in fixed time slots through the afternoon and evening. Book earlier for evenings and weekends.",idn:"Biasanya ada slot waktu tetap dari siang sampai malam. Untuk malam dan akhir pekan, booking lebih awal."},cost:{min:350,max:700},costNote:{en:"Estimate per person for a ~60-minute room (usually priced per person or per group; often cheaper per person with more players). Prices vary by room and venue.",idn:"Perkiraan per orang untuk room ~60 menit (harga per orang atau per grup, dan makin banyak pemain biasanya makin murah per orang). Harga beda-beda tiap room dan tempat."},duration:[1,2],area:"siam",locationText:{en:"Escape-room venues around Siam, Sukhumvit and in malls. Search on Google Maps.",idn:"Escape room di sekitar Siam, Sukhumvit, dan di dalam mal. Cari di Google Maps."},transit:{en:"Siam venues are near BTS Siam / National Stadium. Always confirm the exact address on Google Maps. (Confirm exit on Google Maps.)",idn:"Tempat di area Siam dekat BTS Siam / National Stadium. Selalu pastikan alamat persisnya di Google Maps. (Cek pintu keluar di Google Maps.)"},indoor:"indoor",crowd:"group",energy:2,tags:["team-bonding","after-practice","rainy-day","late-night"],tips:{en:"Group booking is recommended: reserve the time slot ahead through the venue's own channel (check their page/LINE; do not pay via random links). Ask if the room is available in English and how scary or physical it is. Arrive 10–15 minutes early. Keep your phone in a locker if required.",idn:"Disarankan booking grup. Pesan slot lebih dulu lewat kanal resmi tempatnya (halaman/LINE), dan jangan bayar lewat link yang aneh-aneh. Tanyakan apakah bisa dimainkan dalam bahasa Inggris dan seberapa seram atau menguras fisik room-nya. Datang 10–15 menit lebih awal, dan simpan HP di loker kalau diminta."},mapsQuery:"escape room Bangkok",imgQuery:"Escape room",imgAlt:"Friends solving puzzles in a themed escape room",imgIllustrative:!0},{id:"group-bowling-night",group:"group",title:{en:"Mall Bowling Night",idn:"Malam Bowling di Mal"},desc:{en:"Several big Bangkok malls have bowling alleys, usually with arcade or karaoke next door. You rent a lane for a set number of games, rent shoes, and keep scores. It is easy, air-conditioned and works for any skill level.",idn:"Beberapa mal besar di Bangkok punya arena bowling, biasanya bersebelahan dengan game center atau karaoke. Kamu sewa lajur untuk sejumlah game, sewa sepatu, lalu adu skor. Gampang, adem, dan cocok untuk semua level."},special:{en:"Low effort, high laughter, ideal for a big group after a long day, and easy to combine with food in the mall.",idn:"Nggak capek tapi banyak ketawa, ideal untuk rombongan besar setelah hari yang panjang. Gampang juga disambung makan di mal."},bestTime:["afternoon","evening","night"],timeText:{en:"Afternoon to evening; many mall venues run until late evening. Check closing times on Google Maps.",idn:"Siang sampai malam. Banyak tempat di mal buka sampai larut malam. Cek jam tutup di Google Maps."},cost:{min:100,max:300},costNote:{en:"Estimate per person per game including shoe rental (~100–300 THB). Weekend and peak evening prices can be higher; per-lane packages sometimes work out cheaper for groups.",idn:"Perkiraan per orang per game termasuk sewa sepatu (~100–300 THB). Akhir pekan dan jam sibuk malam bisa lebih mahal, dan paket per lajur kadang lebih hemat untuk grup."},duration:[1,2],area:"other",locationText:{en:'Bowling alleys inside major malls in Bangkok. Search "bowling Bangkok" on Google Maps.',idn:'Arena bowling di dalam mal-mal besar Bangkok. Cari "bowling Bangkok" di Google Maps.'},transit:{en:"Mall-based, so usually connected to BTS/MRT. Confirm the exact mall and its station on Google Maps. (Confirm exit on Google Maps.)",idn:"Karena ada di dalam mal, biasanya terhubung dengan BTS/MRT. Cek mal dan stasiun terdekatnya di Google Maps. (Cek pintu keluar di Google Maps.)"},indoor:"indoor",crowd:"group",energy:2,tags:["team-bonding","after-practice","rainy-day"],tips:{en:"Group booking is recommended for 6+ people, especially on weekends. Bring clean socks (shoe rental usually requires them). Stay hydrated; the air-con and the games can make you forget.",idn:"Untuk 6 orang atau lebih, disarankan booking grup, apalagi di akhir pekan. Sewa sepatu biasanya wajib pakai kaus kaki, jadi bawa kaus kaki bersih. Tetap minum air, karena AC dan keseruan main bikin gampang lupa."},mapsQuery:"bowling alley Bangkok",imgQuery:"Bowling alley",imgAlt:"Bowling lanes with balls and pins in an indoor bowling alley",imgIllustrative:!0},{id:"group-karaoke-noraebang",group:"group",title:{en:"Private-Room Karaoke (Family-Karaoke Style)",idn:"Karaoke Room Privat (ala Karaoke Keluarga)"},desc:{en:"Bangkok has karaoke chains and private-room venues where you rent a room by the hour and pick songs from big English, Thai and K-pop libraries. You will find karaoke chains in malls and around Sukhumvit, much like the family-karaoke spots popular in Indonesia.",idn:"Di Bangkok ada jaringan karaoke dan room privat yang disewa per jam, dengan pilihan lagu Inggris, Thailand, dan K-pop yang lengkap. Jaringan karaoke bisa kamu temukan di mal-mal dan sekitar Sukhumvit, mirip karaoke keluarga yang populer di Indonesia."},special:{en:"The easiest way to get the whole squad laughing, with no skill needed. Indonesian visitors will find the format very familiar (think Inul Vizta or Happy Puppy).",idn:"Cara paling gampang bikin satu squad ketawa bareng, tanpa perlu skill. Formatnya pasti sudah familiar buat kamu, mirip Inul Vizta atau Happy Puppy."},bestTime:["evening","night"],timeText:{en:"Evening to late night. Hours vary by venue, so check before going.",idn:"Malam sampai larut malam. Jam buka beda-beda tiap tempat, jadi cek dulu sebelum datang."},cost:{min:150,max:500},costNote:{en:"Estimate per person for 1–2 hours when splitting a room (room prices vary by size and time, often with a drink or food minimum). Prices vary.",idn:"Perkiraan per orang untuk 1–2 jam kalau patungan satu room (harga room tergantung ukuran dan jam, sering ada minimum pesanan minuman/makanan). Harga bervariasi."},duration:[1,3],area:"other",locationText:{en:'Karaoke rooms around Sukhumvit and in malls. Search "karaoke Bangkok" on Google Maps.',idn:'Karaoke di sekitar Sukhumvit dan di dalam mal. Cari "karaoke Bangkok" di Google Maps.'},transit:{en:"Sukhumvit Soi 12 is near BTS Asok / MRT Sukhumvit. Confirm the exact venue on Google Maps. (Confirm exit on Google Maps.)",idn:"Sukhumvit Soi 12 dekat BTS Asok / MRT Sukhumvit. Pastikan tempat persisnya di Google Maps. (Cek pintu keluar di Google Maps.)"},indoor:"indoor",crowd:"group",energy:2,tags:["team-bonding","late-night","rainy-day","after-practice"],tips:{en:'Choose proper karaoke/box venues from reputable listings with clear room pricing. Avoid nightlife "KTV" lounges that use hostesses or have unclear bills, which can be pricey or unsafe. Confirm the price per hour and any minimum spend before you book. The legal drinking age in Thailand is 20; venues may ask for ID. Group booking is recommended in the evening.',idn:'Pilih tempat karaoke resmi dengan rating bagus dan harga room yang jelas. Hindari lounge "KTV" dengan pemandu karaoke (hostess) atau tagihan yang nggak jelas, karena bisa mahal atau nggak aman. Cek harga per jam dan minimum pesanan sebelum booking. Usia legal minum alkohol di Thailand 20 tahun, dan tempat bisa meminta kartu identitas. Untuk malam hari, disarankan booking grup.'},mapsQuery:"karaoke Sukhumvit Soi 12 Bangkok",imgQuery:"Karaoke room",imgAlt:"Friends singing in a private karaoke room",imgIllustrative:!0},{id:"group-vr-experience",group:"group",title:{en:"VR Gaming & Immersive Experiences",idn:"VR Gaming & Pengalaman Imersif"},desc:{en:"VR arcades and immersive game rooms in Bangkok let you play co-op shooters, rhythm games or free-roam experiences in headsets. They are usually in malls or entertainment complexes, and booking a session slot is common.",idn:"Arena VR dan ruang game imersif di Bangkok menawarkan shooter co-op, game ritme, atau pengalaman free-roam pakai headset. Biasanya ada di mal atau kompleks hiburan, dan umumnya perlu booking slot sesi."},special:{en:"Gamers will feel at home, and it gives you a way to play together in a totally different format. Co-op games are great for team coordination.",idn:"Para gamer pasti betah, dan ini cara main bareng dengan format yang beda total. Game co-op juga bagus untuk melatih koordinasi tim."},bestTime:["afternoon","evening"],timeText:{en:"Afternoon to evening; session slots are often 30–60 minutes. Check venue hours.",idn:"Siang sampai malam. Sesi biasanya 30–60 menit. Cek jam buka tempatnya."},cost:{min:300,max:800},costNote:{en:"Estimate per person for a 30–60 minute session (~300–800 THB). Free-roam or multi-player rooms can cost more.",idn:"Perkiraan per orang untuk sesi 30–60 menit (~300–800 THB). Free-roam atau room multi-pemain bisa lebih mahal."},duration:[1,2],area:"other",locationText:{en:'VR arcades in malls and entertainment complexes. Search "VR arcade Bangkok" on Google Maps.',idn:'Arena VR di mal dan kompleks hiburan. Cari "VR arcade Bangkok" di Google Maps.'},transit:{en:"Mall-based venues are usually connected to BTS/MRT. Check the exact address on Google Maps. (Confirm exit on Google Maps.)",idn:"Tempat di dalam mal biasanya terhubung dengan BTS/MRT. Cek alamat persisnya di Google Maps. (Cek pintu keluar di Google Maps.)"},indoor:"indoor",crowd:"group",energy:2,tags:["team-bonding","after-practice","rainy-day","adventurous"],tips:{en:"Group booking recommended so everyone plays in the same session. Take a break if you feel motion sickness, and drink water. Wear comfortable shoes and keep valuables in lockers. Check age and glasses rules for the headsets.",idn:"Disarankan booking grup supaya semua main di sesi yang sama. Kalau mual (motion sickness), istirahat dan minum air. Pakai sepatu yang nyaman dan simpan barang berharga di loker. Cek batas usia dan aturan pemakaian kacamata untuk headset."},mapsQuery:"VR arcade Bangkok",imgQuery:"Virtual reality headset gaming",imgAlt:"A person wearing a virtual reality headset playing a game",imgIllustrative:!0},{id:"group-arcade-games",group:"group",title:{en:"Arcade Game Centers: Rhythm, Claw Machines & Fighting Games",idn:"Game Center Arcade: Game Ritme, Capit Boneka & Game Fighting"},desc:{en:"Bangkok malls have large game centers with rhythm machines, racing seats, fighting games, shooting games, claw machines and photo booths. You buy a game card, load credits and share them across machines.",idn:"Mal-mal di Bangkok punya game center besar dengan mesin game ritme, kursi balap, game fighting, game tembak-tembakan, capit boneka, dan photo booth. Kamu beli kartu game, isi kredit, lalu pakai di berbagai mesin."},special:{en:"Guaranteed fun for gamers: friendly competition, no booking needed, and easy to do for 30 minutes or 3 hours.",idn:"Dijamin seru buat gamer: adu skill santai, nggak perlu booking, dan bisa main 30 menit atau 3 jam sesukamu."},bestTime:["afternoon","evening"],timeText:{en:"Afternoon through the mall's closing time (often around 22:00; check).",idn:"Siang sampai mal tutup (biasanya sekitar 22:00, cek dulu)."},cost:{min:100,max:400},costNote:{en:"Estimate per person (~100–400 THB): you load credits onto a card; each play is a few credits. Claw machines are addictive and can cost more than you plan.",idn:"Perkiraan per orang (~100–400 THB). Kamu isi kredit ke kartu, dan tiap main butuh beberapa kredit. Capit boneka bikin nagih, jadi bisa habis lebih banyak dari rencana."},duration:[1,3],area:"other",locationText:{en:'Game centers in major Bangkok malls. Search "arcade game center Bangkok" on Google Maps.',idn:'Game center di mal-mal besar Bangkok. Cari "arcade game center Bangkok" di Google Maps.'},transit:{en:"Mall-based, usually connected to BTS/MRT. (Confirm exit on Google Maps.)",idn:"Karena ada di dalam mal, biasanya terhubung dengan BTS/MRT. (Cek pintu keluar di Google Maps.)"},indoor:"indoor",crowd:"both",energy:2,tags:["team-bonding","after-practice","rainy-day","late-night"],tips:{en:"Set a credit budget before you start and check whether unused credits can be refunded or kept on the card. Keep your phone and wallet safe in crowded mall areas. Peak times are weekend evenings.",idn:"Tentukan budget kredit sebelum mulai, dan cek apakah sisa kredit bisa di-refund atau tetap tersimpan di kartu. Di mal yang ramai, jaga HP dan dompet. Paling ramai di malam akhir pekan."},mapsQuery:"arcade game center Bangkok",imgQuery:"Video arcade",imgAlt:"Rows of colorful arcade machines in a game center",imgIllustrative:!0},{id:"group-board-game-cafe",group:"group",title:{en:"Board Game Café Afternoon",idn:"Sore santai di kafe board game"},desc:{en:"Board-game cafés let you pay a small per-person or per-hour table fee to play from a big library, with staff who explain the rules. They also serve drinks and snacks. You will find them in trendy neighborhoods like Ari and around Siam and university areas.",idn:"Di kafe board game, kamu cukup bayar biaya meja kecil per orang atau per jam untuk main dari koleksi game yang banyak, dan staf akan menjelaskan aturannya. Mereka juga jual minuman dan camilan. Banyak ditemukan di kawasan seperti Ari, Siam, dan sekitar kampus."},special:{en:"A relaxed way to bond without any physical effort. Games with English rules suit international groups, and card games work great with 4–8 people.",idn:"Cara santai buat makin akrab tanpa capek fisik. Game dengan aturan berbahasa Inggris cocok untuk grup multinasional, dan card game seru dimainkan 4–8 orang."},bestTime:["afternoon","evening"],timeText:{en:"Afternoon to evening. Opening hours vary, so check on Google Maps.",idn:"Sore sampai malam. Jam buka beda-beda tiap tempat, jadi cek di Google Maps."},cost:{min:100,max:400},costNote:{en:"Estimate per person (~100–400 THB) for a table/time fee plus a drink or snack. Some cafés have a minimum order per person.",idn:"Perkiraan per orang (100–400 THB) untuk biaya meja/waktu plus minuman atau camilan. Beberapa kafe punya minimal order per orang."},duration:[2,4],area:"ari",locationText:{en:'Board-game cafés around Ari, Siam and university areas. Search "board game cafe Bangkok".',idn:'Kafe board game di sekitar Ari, Siam, dan kawasan kampus. Cari "board game cafe Bangkok".'},transit:{en:"Ari-area cafés are near BTS Ari. Confirm the exact cafe on Google Maps. (Confirm exit on Google Maps.)",idn:"Kafe di kawasan Ari dekat BTS Ari. Pastikan kafenya di Google Maps. (Cek pintu keluar di Google Maps.)"},indoor:"indoor",crowd:"both",energy:1,tags:["team-bonding","after-practice","rainy-day","relaxing"],tips:{en:"Group booking is recommended for large teams (tables for 6+ fill up fast, especially on weekends). Ask staff to recommend a game for your group size and language level. Handle cards and pieces gently.",idn:"Untuk tim besar, sebaiknya booking grup (meja untuk 6+ orang cepat penuh, terutama akhir pekan). Minta staf merekomendasikan game sesuai jumlah orang dan kemampuan bahasa kalian. Perlakukan kartu dan bidak dengan hati-hati."},mapsQuery:"board game cafe Bangkok",imgQuery:"Board game cafe",imgAlt:"People playing a board game around a table at a cafe",imgIllustrative:!0},{id:"group-thai-cooking-class",group:"group",title:{en:"Thai Cooking Class (Market Tour + Hands-On)",idn:"Kelas masak Thailand (tur pasar + masak langsung)"},desc:{en:"Bangkok cooking schools run half-day classes where you learn 3–5 dishes (like pad thai, tom yum or green curry, plus a dessert) at your own station, often starting with a short market tour. You eat what you cook at the end.",idn:"Sekolah masak di Bangkok mengadakan kelas setengah hari: kamu belajar 3–5 masakan (seperti pad thai, tom yum goong, kari hijau, plus dessert) di stasiun masakmu sendiri. Banyak yang diawali tur pasar singkat, dan di akhir kamu makan hasil masakanmu."},special:{en:"A hands-on way to understand Thai flavors and bring back a skill, not just a souvenir. Perfect for team-building because you cook and eat together.",idn:'Pengalaman yang membawa pulang "skill", bukan cuma oleh-oleh. Pas banget untuk team-building karena masak dan makan bareng.'},bestTime:["morning","afternoon","evening"],timeText:{en:"Morning and afternoon classes are common; some offer evening sessions. Classes last roughly 3–4 hours.",idn:"Kelas pagi dan siang paling umum; beberapa tempat ada kelas malam. Biasanya berlangsung 3–4 jam."},cost:{min:1e3,max:2200},costNote:{en:"Estimate per person (~1,000–2,200 THB), depending on school, number of dishes and whether it includes a market tour. Group rates may apply.",idn:"Perkiraan per orang sekitar 1.000–2.200 THB, tergantung sekolah, jumlah masakan, dan apakah termasuk tur pasar. Mungkin ada harga grup."},duration:[3,4],area:"other",locationText:{en:'Cooking schools around Sathorn, Silom, Sukhumvit and Old Town. Search "Thai cooking class Bangkok".',idn:'Sekolah masak di sekitar Sathorn, Silom, Sukhumvit, dan Old Town. Cari "Thai cooking class Bangkok".'},transit:{en:"Depends on the school; many are near BTS/MRT or provide pickup. Confirm in the booking message. (Confirm exit on Google Maps.)",idn:"Tergantung sekolahnya; banyak yang dekat BTS/MRT atau menyediakan penjemputan. Cek di pesan konfirmasi booking. (Cek pintu keluar di Google Maps.)"},indoor:"indoor",crowd:"group",energy:1,tags:["team-bonding","relaxing","rainy-day","date-night"],tips:{en:"Group booking is strongly recommended, ideally a few days ahead. Tell the school about allergies, pork/shellfish avoidance, vegetarian needs and your spice tolerance when booking. Wear closed shoes and light clothes since kitchens are hot. Only book through the school's own official channel or a well-known platform.",idn:"Booking grup sangat disarankan, idealnya beberapa hari sebelumnya. Saat booking, beri tahu sekolah soal alergi, kebutuhan tanpa babi/seafood bercangkang (atau halal), vegetarian, dan level pedas. Dapur panas, jadi pakai baju ringan dan sepatu tertutup. Booking hanya lewat kanal resmi sekolah atau platform booking terkenal."},mapsQuery:"Thai cooking class Bangkok",imgQuery:"Thai cooking class",imgAlt:"Students cooking at stoves in a Thai cooking class",imgIllustrative:!0},{id:"group-pottery-art-workshop",group:"group",title:{en:"Pottery & Art Workshops (Creative Studios)",idn:"Workshop keramik & seni (studio kreatif)"},desc:{en:"Small studios around Charoen Krung and trendy neighborhoods run beginner workshops: wheel-throwing or hand-building pottery, paint-your-own ceramics, candle making, sketching and more. You usually get all materials and a teacher in about 2–3 hours.",idn:"Studio kecil di sekitar Charoen Krung dan kawasan trendi mengadakan workshop untuk pemula: keramik dengan meja putar atau hand-building, melukis keramik, bikin lilin, sketsa, dan lainnya. Biasanya sudah termasuk semua bahan dan pengajar, sekitar 2–3 jam."},special:{en:"A calm, creative break from screens, with a handmade keepsake. Great for relaxed bonding that is quiet and not physical.",idn:"Waktu kreatif yang tenang, jauh dari layar, plus kenang-kenangan buatan sendiri. Cocok untuk bonding santai yang tenang dan tidak menguras fisik."},bestTime:["morning","afternoon","evening"],timeText:{en:"Fixed class times; book a slot in advance. Check schedules on the studio's own channels.",idn:"Jadwal kelas sudah tetap, jadi booking slot lebih awal. Cek jadwal di kanal resmi studio."},cost:{min:600,max:1800},costNote:{en:"Estimate per person (~600–1,800 THB) depending on the craft and materials. Pottery that needs firing can add a fee and a few days' wait.",idn:"Perkiraan per orang sekitar 600–1.800 THB, tergantung jenis kerajinan dan bahan. Keramik yang perlu dibakar di tungku bisa kena biaya tambahan dan harus menunggu beberapa hari."},duration:[2,3],area:"charoen-krung",locationText:{en:'Creative studios around Charoen Krung and other trendy areas. Search "pottery workshop Bangkok".',idn:'Studio di Charoen Krung dan kawasan trendi lainnya. Cari "pottery workshop Bangkok".'},transit:{en:"Depends on the studio; Charoen Krung studios are reachable by river boat, MRT or Grab. Check the exact address. (Confirm exit on Google Maps.)",idn:"Tergantung studionya; studio di Charoen Krung bisa dijangkau dengan perahu sungai, MRT, atau Grab. Cek alamat persisnya. (Cek pintu keluar di Google Maps.)"},indoor:"indoor",crowd:"both",energy:1,tags:["relaxing","team-bonding","rainy-day","date-night","hidden-gem"],tips:{en:"Group booking recommended (small studios have limited seats). Ask early about firing time: if your trip is short, choose a workshop where you take the piece with you the same day or can have it shipped. Wear clothes you do not mind getting messy.",idn:"Studio kecil kursinya terbatas, jadi sebaiknya booking grup. Kalau tripmu singkat, tanyakan dulu waktu pembakaran (tungku) dan pilih workshop yang hasilnya bisa dibawa pulang hari itu juga atau bisa dikirim. Pakai baju yang nggak masalah kalau kotor."},mapsQuery:"pottery workshop Bangkok",imgQuery:"Pottery workshop",imgAlt:"Hands shaping clay on a pottery wheel in a studio",imgIllustrative:!0},{id:"night-yaowarat-food-walk",group:"night",title:{en:"Yaowarat (Chinatown) Night Food Street Walk",idn:"Jalan-jalan kuliner malam Yaowarat (Chinatown)"},desc:{en:"Yaowarat Road comes alive after dark with neon signs, smoky grills, seafood tables, mango sticky rice, roasted chestnuts and Chinese-Thai stalls squeezed side by side. It is one of Bangkok's most famous street-food scenes and one of the best for a group graze.",idn:"Begitu gelap, Yaowarat Road hidup dengan lampu neon, panggangan berasap, meja seafood, mango sticky rice, kastanye panggang, dan lapak Tionghoa-Thai yang berjejer rapat. Salah satu kawasan jajanan kaki lima paling terkenal di Bangkok, dan paling seru untuk icip-icip bareng grup."},special:{en:"A real night-time Bangkok moment: noisy, glowing, delicious. Perfect for sharing small plates and trying many things for little money.",idn:"Momen malam Bangkok yang asli: ramai, berkilau, dan enak. Pas buat berbagi porsi kecil dan mencoba banyak menu dengan uang sedikit."},bestTime:["evening","night"],timeText:{en:"From about 18:00 to late night. Stalls start setting up in the late afternoon; stall hours and days vary, so check.",idn:"Sekitar pukul 18:00 sampai larut malam. Lapak mulai siap-siap sore hari; jam dan hari buka tiap lapak beda, jadi cek dulu."},cost:{min:300,max:800},costNote:{en:"Estimate per person for grazing several stalls (street dishes roughly 50–200 THB each; seafood and sit-down places cost more). Always check prices before ordering, especially for seafood by weight.",idn:"Perkiraan per orang kalau keliling beberapa lapak (jajanan kaki lima biasanya 50–200 THB per porsi; seafood dan tempat duduk lebih mahal). Selalu tanya harga sebelum pesan, terutama seafood yang dihitung per berat. Kalau perlu halal, tanya \"mai sai moo\" (tanpa babi) atau cari tanda halal."},duration:[2,3],area:"yaowarat",locationText:{en:"Yaowarat Road, Samphanthawong (Bangkok's Chinatown)",idn:"Yaowarat Road, Samphanthawong (Chinatown Bangkok)"},transit:{en:"MRT Wat Mangkon station is the closest on the Blue Line, a short walk; the river boat to Ratchawong Pier is another option. (Confirm exit on Google Maps.)",idn:"Stasiun MRT Wat Mangkon (Blue Line) paling dekat, cukup jalan kaki sebentar. Alternatifnya, naik perahu sungai ke Dermaga Ratchawong. (Cek pintu keluar di Google Maps.)"},indoor:"outdoor",crowd:"group",energy:2,tags:["team-bonding","after-practice","late-night","photo","adventurous"],weather:{en:"Hot, crowded and loud even at night; carry water, wear breathable clothes and expect sudden rain, which can close open-air stalls. Pavements are narrow and crowded.",idn:"Tetap panas, padat, dan bising meski malam. Bawa air minum dan pakai baju yang menyerap keringat. Hujan mendadak bisa bikin lapak tutup. Trotoarnya sempit dan ramai, jadi hati-hati."},tips:{en:"Go with a group to share dishes and try more. Ask for prices before ordering and check the bill. Keep wallet and phone in front pockets or a zipped bag because of pickpockets. Watch scooters in the narrow lanes. Vegetarians and people with allergies (shellfish, peanut, egg) should ask carefully, since sauces and broths are often shared. If you drink alcohol, the legal age is 20.",idn:"Datang beramai-ramai dan berbagi menu supaya bisa mencoba lebih banyak. Tanya harga sebelum pesan dan cek tagihannya. Ada copet, jadi simpan dompet dan HP di saku depan atau tas berritsleting. Hati-hati skuter di gang sempit. Kalau vegetarian atau punya alergi (seafood bercangkang, kacang, telur), tanyakan dengan teliti karena saus dan kuah sering dipakai bersama. Usia legal minum alkohol adalah 20 tahun."},geoQuery:"Yaowarat Road, Bangkok",mapsQuery:"Yaowarat Road Bangkok street food",imgQuery:"Yaowarat Road night",imgAlt:"Neon signs and food stalls on Yaowarat Road at night",imgIllustrative:!1},{id:"night-banthat-thong-food-walk",group:"night",title:{en:"Banthat Thong Evening Street-Food Walk",idn:"Jalan-jalan kuliner malam Banthat Thong"},desc:{en:"Banthat Thong Road is a student-and-local food street near Chulalongkorn University and the Siam area, with grills, noodle shops, stir-fry stalls, desserts and small restaurants. It is cheaper and less touristy than Yaowarat.",idn:"Banthat Thong Road adalah jalan kuliner mahasiswa dan warga lokal dekat Chulalongkorn University dan kawasan Siam, dengan panggangan, kedai mi, lapak tumisan, dessert, dan restoran kecil. Lebih murah dan tidak seturistik Yaowarat."},special:{en:"Local food at local prices near central Bangkok, with a younger crowd vibe. A good option when you want street food without the tourist rush.",idn:"Makanan lokal dengan harga lokal dekat pusat kota, dengan suasana anak muda. Pilihan bagus kalau mau jajanan kaki lima tanpa keramaian turis."},bestTime:["evening","night"],timeText:{en:"Evening is busiest. Hours differ by shop and stall, so check before you go.",idn:"Paling ramai malam hari. Jam buka tiap toko dan lapak berbeda, jadi cek sebelum berangkat."},cost:{min:150,max:450},costNote:{en:"Estimate per person for a full evening of grazing (~150–450 THB). Dishes are often 40–120 THB each.",idn:"Perkiraan per orang untuk icip-icip semalaman sekitar 150–450 THB. Satu porsi biasanya 40–120 THB."},duration:[1,2],area:"banthat-thong",locationText:{en:"Banthat Thong Road, Pathum Wan",idn:"Banthat Thong Road, Pathum Wan"},transit:{en:"Closest rail options are in the Siam / National Stadium / Sam Yan area; use Google Maps for the walking route, or take Grab. (Confirm exit on Google Maps.)",idn:"Stasiun terdekat ada di area Siam / National Stadium / Sam Yan. Cek rute jalan kaki di Google Maps, atau naik Grab. (Cek pintu keluar di Google Maps.)"},indoor:"outdoor",crowd:"both",energy:1,tags:["after-practice","team-bonding","late-night","hidden-gem"],weather:{en:"Mostly open-air: hot and humid even in the evening, and rain can interrupt stalls. Bring water and a light layer for the air-con restaurants.",idn:"Kebanyakan terbuka, jadi tetap panas dan lembap meski malam, dan hujan bisa menghentikan lapak. Bawa air minum dan jaket tipis untuk restoran ber-AC."},tips:{en:'Look for busy stalls with a quick turnover. Ask before ordering about spice level ("mai phet" means not spicy) and ingredients if you have allergies. Pavements are uneven and cluttered with scooters. Pay in cash with small bills.',idn:'Pilih lapak yang ramai dan perputarannya cepat. Saat pesan, sebutkan level pedas ("mai phet" = tidak pedas) dan tanyakan bahan kalau kamu punya alergi. Trotoarnya tidak rata dan penuh skuter. Bayar tunai dengan uang pecahan kecil.'},geoQuery:"Banthat Thong Road, Bangkok",mapsQuery:"Banthat Thong Road food street Bangkok",imgQuery:"Bangkok street food night",imgAlt:"Street-food stalls with grills and noodles at night in Bangkok",imgIllustrative:!0},{id:"night-iconsiam-riverside",group:"night",title:{en:"ICONSIAM & Riverside Evening",idn:"ICONSIAM & malam di tepi Sungai Chao Phraya"},desc:{en:"ICONSIAM is a huge riverside mall on the Thonburi bank with high-end shops, Sook Siam (an indoor Thai floating-market-style food hall), restaurants and river-view terraces. In the evening the waterfront glows and you can watch long-tail boats and cruise ships pass.",idn:"ICONSIAM adalah mal raksasa di tepi sungai sisi Thonburi, dengan toko high-end, Sook Siam (food hall bergaya pasar terapung Thailand di dalam ruangan), restoran, dan teras dengan pemandangan sungai. Malam hari, tepi sungai berkilau dan kamu bisa melihat perahu long-tail dan kapal pesiar lewat."},special:{en:"Air-conditioned, easy and impressive, with Thai street-food stalls under one roof. A good rainy-evening backup that still feels very Bangkok.",idn:"Ber-AC, gampang, dan mengesankan, dengan lapak jajanan kaki lima Thailand di bawah satu atap. Alternatif bagus saat malam hujan, tapi tetap terasa Bangkok banget."},bestTime:["evening","night"],timeText:{en:"Late afternoon to evening for the sunset and lights. Mall hours are usually until about 22:00, but check on Google Maps.",idn:"Sore menjelang matahari terbenam sampai malam, untuk sunset dan lampu-lampunya. Mal biasanya buka sampai sekitar 22:00, tapi cek di Google Maps."},cost:{min:0,max:600},costNote:{en:"Entry is free. Estimate per person for a meal and drinks at Sook Siam or restaurants (~150–600 THB). Shopping can obviously cost much more.",idn:"Masuk gratis. Perkiraan per orang untuk makan dan minum di Sook Siam atau restoran sekitar 150–600 THB. Belanja tentu bisa jauh lebih mahal."},duration:[2,4],area:"riverside",locationText:{en:"ICONSIAM, Khlong San, on the Chao Phraya River",idn:"ICONSIAM, Khlong San, tepi Sungai Chao Phraya"},transit:{en:"BTS Gold Line Charoen Nakhon station connects to ICONSIAM; free shuttle boats have run from Sathorn Pier (BTS Saphan Taksin), but confirm the schedule on site or Google Maps. (Confirm exit on Google Maps.)",idn:"Stasiun BTS Gold Line Charoen Nakhon terhubung langsung ke ICONSIAM. Selama ini ada perahu shuttle gratis dari Dermaga Sathorn (BTS Saphan Taksin), tapi cek jadwalnya di lokasi atau Google Maps. (Cek pintu keluar di Google Maps.)"},indoor:"both",crowd:"both",energy:1,tags:["team-bonding","date-night","photo","relaxing","rainy-day","late-night"],weather:{en:"Mostly indoors and cool; the riverside terraces are hot at midday but lovely in the evening. Rain does not ruin it.",idn:"Kebanyakan di dalam ruangan dan sejuk; teras tepi sungai panas di siang hari tapi enak di malam hari. Hujan pun tidak masalah."},tips:{en:"Weekend evenings are very crowded; arrive earlier. Sook Siam is great for tasting several dishes cheaply. Boats and ferry timings vary, so confirm the last boat back before you leave. If you drink alcohol, the legal age is 20.",idn:"Malam akhir pekan sangat ramai, jadi datang lebih awal. Sook Siam pas untuk mencicipi banyak menu dengan murah. Jadwal perahu bisa berubah, jadi pastikan jam perahu terakhir untuk pulang. Usia legal minum alkohol adalah 20 tahun."},geoQuery:"ICONSIAM, Bangkok",mapsQuery:"ICONSIAM Bangkok",imgQuery:"ICONSIAM",imgAlt:"The ICONSIAM mall on the Chao Phraya River at night",imgIllustrative:!1},{id:"night-asiatique-riverfront",group:"night",title:{en:"Asiatique The Riverfront: Ferris Wheel & Waterfront Dinner",idn:"Asiatique The Riverfront: bianglala & makan malam di tepi sungai"},desc:{en:"Asiatique is an open-air riverside night market and entertainment complex built around old warehouses, with a giant Ferris wheel, shops, food courts, restaurants and live shows. A free shuttle boat is known to run from Sathorn Pier in the afternoon and evening.",idn:"Asiatique adalah pasar malam dan kompleks hiburan terbuka di tepi sungai yang dibangun dari gudang-gudang tua, dengan bianglala raksasa, toko, food court, restoran, dan pertunjukan. Perahu shuttle gratis dikenal beroperasi dari Dermaga Sathorn pada sore dan malam hari."},special:{en:"A touristy-but-fun evening with river breeze, Ferris-wheel skyline views and easy food for big groups.",idn:"Malam yang turistik tapi seru: angin sungai, pemandangan skyline dari bianglala, dan makanan yang mudah untuk grup besar."},bestTime:["evening","night"],timeText:{en:"From late afternoon to evening. Opening hours and shuttle times vary, so check before going.",idn:"Sore sampai malam. Jam buka dan jadwal shuttle bisa berubah, jadi cek sebelum berangkat."},cost:{min:0,max:700},costNote:{en:"Entry is normally free. Ferris wheel and show tickets cost extra (estimate a few hundred THB), and a meal is roughly 200–600 THB per person.",idn:"Masuk biasanya gratis. Bianglala dan pertunjukan bayar terpisah (perkiraan beberapa ratus THB). Makan sekitar 200–600 THB per orang."},duration:[2,4],area:"other",locationText:{en:"Asiatique The Riverfront, Charoen Krung Rd, Bang Kho Laem",idn:"Asiatique The Riverfront, Charoen Krung Rd, Bang Kho Laem"},transit:{en:"Free shuttle boat from Sathorn Pier (BTS Saphan Taksin) is commonly used; or Grab/taxi. Confirm the schedule and the last boat back. (Confirm exit on Google Maps.)",idn:"Banyak orang naik perahu shuttle gratis dari Dermaga Sathorn (BTS Saphan Taksin); atau Grab/taksi. Cek jadwal dan perahu terakhir untuk pulang. (Cek pintu keluar di Google Maps.)"},indoor:"outdoor",crowd:"both",energy:1,tags:["team-bonding","date-night","photo","relaxing","late-night"],weather:{en:"Open-air and humid even at night; rain can interrupt shows and the wheel. Pack a thin rain jacket in the wet season.",idn:"Terbuka dan tetap lembap meski malam; hujan bisa menghentikan pertunjukan dan bianglala. Bawa jas hujan tipis saat musim hujan."},tips:{en:"Weekend evenings get crowded. Keep valuables close in the crowd. Check the last shuttle boat or have a Grab plan back. Shop prices at tourist-oriented stalls are often higher, so compare. If you drink alcohol, the legal age is 20.",idn:"Malam akhir pekan ramai. Jaga barang berharga di keramaian. Cek jam perahu shuttle terakhir atau siapkan rencana pulang naik Grab. Toko yang menyasar turis cenderung lebih mahal, jadi bandingkan harga. Usia legal minum alkohol adalah 20 tahun."},geoQuery:"Asiatique The Riverfront, Bangkok",mapsQuery:"Asiatique The Riverfront Bangkok",imgQuery:"Asiatique The Riverfront",imgAlt:"The Ferris wheel and riverside warehouses of Asiatique at night",imgIllustrative:!1},{id:"night-train-night-markets",group:"night",title:{en:"Train Night Market & Jodd Fairs-Style Night Markets",idn:"Train Night Market & pasar malam ala Jodd Fairs"},desc:{en:"Bangkok's big evening markets, such as the Talad Rot Fai (Train Night Market) in Srinakarin and Ratchada and the Jodd Fairs markets near Rama 9, mix street food, retro stalls, vintage and thrift finds, and live music. They are popular with young locals and visitors.",idn:"Pasar malam besar di Bangkok, seperti Talad Rot Fai (Train Night Market) di Srinakarin dan Ratchada serta Jodd Fairs dekat Rama 9, memadukan jajanan kaki lima, lapak retro, barang vintage/thrift, dan musik live. Populer di kalangan anak muda lokal dan wisatawan."},special:{en:'A lively "eat, browse, repeat" evening for groups with cheap street food and photo-friendly retro stalls.',idn:"Malam yang seru: makan, lihat-lihat, ulangi. Cocok untuk grup, dengan jajanan murah dan lapak retro yang instagramable."},bestTime:["evening","night"],timeText:{en:"Markets usually open in the evening, often several days a week (commonly including the weekend) and may close on some days. Availability, location and opening days change, so check on Google Maps or the market's official page before going.",idn:"Pasar malam biasanya buka malam hari, sering hanya beberapa hari seminggu (umumnya termasuk akhir pekan), dan bisa tutup di hari tertentu. Hari buka, lokasi, dan status operasionalnya bisa berubah, jadi cek di Google Maps atau halaman resmi pasar sebelum berangkat."},cost:{min:200,max:600},costNote:{en:"Estimate per person for food and drinks (~200–600 THB); shopping extra. Always bargain politely for non-food items.",idn:"Perkiraan per orang untuk makan dan minum sekitar 200–600 THB; belanja terpisah. Untuk barang non-makanan, tawar dengan sopan."},duration:[2,3],area:"other",locationText:{en:"Train Night Market (Srinakarin / Ratchada) and Jodd Fairs (Rama 9 area). Confirm which is open.",idn:"Train Night Market (Srinakarin / Ratchada) dan Jodd Fairs (area Rama 9). Pastikan mana yang buka."},transit:{en:"Depends on the market. Rama 9 / Ratchada markets are linked to the MRT (check the nearest station on Google Maps), while Srinakarin is easiest by Grab. (Confirm exit on Google Maps.)",idn:"Tergantung pasarnya. Pasar di Rama 9 / Ratchada terhubung dengan MRT (cek stasiun terdekat di Google Maps), sedangkan Srinakarin paling gampang naik Grab. (Cek pintu keluar di Google Maps.)"},indoor:"outdoor",crowd:"group",energy:2,tags:["team-bonding","after-practice","late-night","photo","adventurous"],weather:{en:"Mostly open-air and crowded; hot, and rain can empty the market or flood paths in the wet season. Wear comfortable shoes.",idn:"Kebanyakan terbuka dan ramai; panas, dan saat musim hujan, hujan bisa bikin pasar sepi atau jalannya tergenang. Pakai sepatu yang nyaman."},tips:{en:'Check that the market is actually open that night; many only run on certain days. Carry small cash and keep valuables zipped. Do not buy from sellers pushing wildlife or gimmicky "antique" items. Alcohol: legal age is 20; carry ID.',idn:'Pastikan pasarnya benar-benar buka malam itu; banyak yang hanya buka di hari tertentu. Siapkan uang tunai pecahan kecil dan simpan barang berharga di tas berritsleting. Jangan beli dari penjual yang memaksa menjual satwa liar atau "barang antik" aneh. Usia legal minum alkohol 20 tahun, jadi bawa kartu identitas.'},mapsQuery:"nigh
