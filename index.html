.",idn:"Bukan mal lama, tapi lebih mirip kawasan terpadu yang baru dibuka, ala PIK Avenue. Belum semuanya buka, dan jam buka beda-beda tiap toko dan zona."},tags:["new","mixed-use","design","lumphini","calm"],geoQuery:"One Bangkok, Wireless Road, Bangkok",mapsQuery:"One Bangkok Bangkok",imgQuery:"One Bangkok",imgAlt:"One Bangkok development towers near Lumphini Park in Bangkok"},{id:"emquartier",type:"mall",name:{en:"EmQuartier",idn:"EmQuartier",th:"เอ็มควอเทียร์"},desc:{en:"A stylish mall in Sukhumvit with a waterfall atrium, Helix food floors, Thai design shops, and cafes. It faces Emporium across the road.",idn:"Mal stylish di Sukhumvit dengan atrium air terjun, lantai kuliner Helix, toko desain Thai, dan café. Berhadapan dengan Emporium di seberang jalan."},budget:3,why:{en:"Great for Thai designer shops, a skyline-style rooftop garden, and dining in a quieter area than Siam.",idn:"Asyik buat toko desainer Thai, taman atap dengan pemandangan kota, dan restoran dengan suasana yang lebih tenang daripada Siam."},transit:{en:"BTS Phrom Phong, directly connected by skywalk (Emporium on the other side).",idn:"Terhubung langsung lewat skywalk dari BTS Phrom Phong (Emporium ada di sisi seberang)."},korea:{en:"Premium feel similar to Plaza Indonesia or Pacific Place, next to Phrom Phong, Bangkok’s Japanese expat hub, full of cafés and Japanese restaurants. For halal food, the Middle-Eastern/halal strip at Sukhumvit Soi 3/1 (“Soi Arab”, near BTS Nana) is two BTS stops away; check halal status and hours on Google Maps.",idn:"Nuansanya premium dan berkelas seperti Plaza Indonesia atau Pacific Place. Phrom Phong di dekatnya adalah kawasan tempat banyak orang Jepang tinggal, jadi café dan restoran Jepang bertebaran. Untuk makanan halal, deretan restoran Timur Tengah/halal di Sukhumvit Soi 3/1 (“Soi Arab”, dekat BTS Nana) cuma dua stasiun BTS dari sini; cek status halal dan jam buka di Google Maps."},tags:["design","rooftop","phrom-phong","premium","food"],geoQuery:"EmQuartier, Bangkok",mapsQuery:"EmQuartier Bangkok",imgQuery:"EmQuartier",imgAlt:"EmQuartier shopping mall in Phrom Phong, Bangkok"},{id:"emporium",type:"mall",name:{en:"Emporium",idn:"Emporium",th:"เอ็มโพเรียม"},desc:{en:"An upscale department-store style mall with luxury brands, Thai designer boutiques and a well-known food court on the upper floors.",idn:"Mal bergaya department store kelas atas dengan merek mewah, butik desainer Thai, dan food court di lantai atas."},budget:3,why:{en:"Calm, air-conditioned shopping with a good food court if you do not want a crowded Siam day.",idn:"Cocok kalau kamu mau belanja santai ber-AC dengan food court yang oke, tanpa hiruk-pikuk Siam."},transit:{en:"BTS Phrom Phong, directly connected (EmQuartier is across Sukhumvit Road).",idn:"Terhubung langsung dengan BTS Phrom Phong (EmQuartier ada di seberang Jalan Sukhumvit)."},korea:{en:"Feels like a quieter Plaza Indonesia-style department store. Staff in luxury shops speak English.",idn:"Rasanya seperti department store yang tenang ala Plaza Indonesia. Staf di butik mewah bisa berbahasa Inggris."},tags:["luxury","calm","food-court","phrom-phong"],geoQuery:"Emporium, Sukhumvit, Bangkok",mapsQuery:"Emporium Bangkok",imgQuery:"Emporium Bangkok",imgAlt:"Emporium shopping mall on Sukhumvit Road in Bangkok"},{id:"central-embassy",type:"mall",name:{en:"Central Embassy",idn:"Central Embassy",th:"เซ็นทรัล เอ็มบาสซี"},desc:{en:"A high-end mall with luxury brands, Eathai food hall, concept shops and cafes. It is connected to the Park Hyatt and has a quiet atmosphere.",idn:"Mal kelas atas dengan merek mewah, food hall Eathai, concept store, dan kafe. Terhubung dengan Park Hyatt dan suasananya tenang."},budget:4,why:{en:"Best for refined shopping and a food-hall lunch away from the busier Siam malls.",idn:"Pas buat belanja yang lebih berkelas dan makan siang di food hall, jauh dari mal-mal Siam yang ramai."},transit:{en:"BTS Phloen Chit, connected by skywalk.",idn:"Terhubung lewat skywalk dari BTS Phloen Chit."},korea:{en:"More refined and less crowded than Siam Paragon, comparable to a Jakarta luxury mall like Plaza Indonesia; prices are high-end.",idn:"Lebih tenang dari Siam Paragon dan terasa seperti mal mewah Jakarta, misalnya Plaza Indonesia. Harganya cenderung mahal."},tags:["luxury","design","food-hall","quiet","phloen-chit"],geoQuery:"Central Embassy, Bangkok",mapsQuery:"Central Embassy Bangkok",imgQuery:"Central Embassy Bangkok",imgAlt:"Central Embassy shopping mall in Bangkok"},{id:"sim-esim",type:"essential",name:{en:"SIM & eSIM",idn:"SIM & eSIM",th:"ซิมการ์ด / อีซิม"},desc:{en:"Tourist SIMs from Thai carriers (AIS, True) are sold at airport counters and many mall stores. eSIM apps are the easiest if your phone supports it; install before you land.",idn:"SIM turis dari operator Thailand (AIS, True) dijual di konter bandara dan gerai di mal. Kalau HP kamu mendukung eSIM, paling praktis dipasang sebelum mendarat."},budget:1,why:{en:"Maps, Grab, translation and QR payment all depend on data. Decide before you arrive: airport SIM, mall store SIM, or eSIM.",idn:"Peta, Grab, terjemahan, dan pembayaran QR semuanya butuh data. Tentukan sebelum tiba: SIM bandara, SIM dari gerai, atau eSIM."},transit:{en:"Airport arrivals halls (BKK, DMK) and mall carrier stores. Bring your passport; SIM registration is required for physical SIMs.",idn:"Bisa dibeli di area kedatangan bandara (BKK, DMK) dan gerai operator di mal. SIM fisik wajib registrasi, jadi bawa paspor."},korea:{en:"Indonesian carrier roaming packs (Telkomsel, XL, Indosat) and eSIM sellers exist, usually pricier than a local tourist SIM, but easy. Check your phone is unlocked and compatible with eSIM first. Plans and prices change often.",idn:"Ada juga paket roaming operator Indonesia (Telkomsel, XL, Indosat) dan penjual eSIM. Biasanya lebih mahal dari SIM turis lokal, tapi praktis. Pastikan dulu HP kamu tidak terkunci (unlocked) dan mendukung eSIM. Paket dan harga sering berubah."},tags:["data","airport","passport","esim"],mapsQuery:"AIS shop Bangkok",imgQuery:"SIM card",imgAlt:"A SIM card being inserted into a smartphone",imgIllustrative:!0},{id:"chargers-adapters",type:"essential",name:{en:"Chargers, Cables & Plug Adapters",idn:"Charger, Kabel & Adaptor",th:"ที่ชาร์จ สายชาร์จ และหัวแปลงปลั๊ก"},desc:{en:"Thailand uses 220 V and Type A/B/C sockets (many are universal multi-sockets). Indonesian two-round-pin plugs usually fit; phone shops, MBK stalls and electronics stores sell cables and chargers.",idn:"Thailand pakai listrik 220 V dengan stopkontak tipe A/B/C (banyak juga yang universal). Colokan Indonesia yang dua pin bulat biasanya langsung masuk. Kabel dan charger bisa dibeli di toko HP, lapak MBK, dan toko elektronik."},budget:1,why:{en:"Cable lost or left in the hotel? A replacement is quick to find. Power banks are also sold widely; carry them in your cabin bag on flights, never checked.",idn:"Kabel hilang atau ketinggalan di hotel? Gampang cari gantinya. Power bank juga banyak dijual. Di pesawat, bawa di kabin saja (jangan masuk bagasi)."},transit:{en:"MBK Center (BTS National Stadium) for the cheapest cables; mall electronics shops for branded chargers. Also available at 7-Eleven in a pinch.",idn:"Kabel termurah di MBK Center (BTS National Stadium), charger bermerek di toko elektronik mal. Kalau darurat, 7-Eleven juga jual."},korea:{en:"Indonesia uses a similar voltage (230 V), so most Indonesian chargers work without a transformer. Bring a multi-plug or a travel adapter for flat-pin plugs, and check wattage for fast charging.",idn:"Tegangannya mirip Indonesia (230 V), jadi kebanyakan charger dari Indonesia bisa langsung dipakai tanpa trafo. Bawa colokan multi atau adaptor travel untuk colokan pin pipih, dan cek watt kalau mau fast charging."},tags:["220v","power-bank","cables","mbk"],mapsQuery:"phone accessories shop Bangkok",imgQuery:"Type C electrical plug",imgAlt:"Thai wall sockets and plug adapters",imgIllustrative:!0},{id:"supermarkets-premium",type:"essential",name:{en:"Tops & Villa Market Supermarkets",idn:"Supermarket Tops & Villa Market",th:"ท็อปส์ และ วิลล่า มาร์เก็ท"},desc:{en:"Tops (often inside Central malls) and Villa Market (in expat areas such as Phrom Phong and Thonglor) are cleaner, calmer supermarkets with imported snacks, Thai fruit, bakery and ready meals.",idn:"Tops (banyak di dalam mal grup Central) dan Villa Market (di kawasan ekspat seperti Phrom Phong dan Thonglor) adalah supermarket yang bersih dan tenang. Ada camilan impor, buah Thailand, roti, dan makanan siap saji."},budget:2,why:{en:"Good for imported products, quality fruit and a calmer shopping trip. Prices are a bit higher than Big C or Lotus's.",idn:"Cocok untuk produk impor, buah berkualitas, dan belanja yang lebih santai. Harganya sedikit di atas Big C atau Lotus's."},transit:{en:"Tops is inside many malls (for example Central branches); Villa Market has branches in Phrom Phong and Thonglor. Search the nearest branch on Google Maps.",idn:"Tops ada di banyak mal (misalnya cabang Central), Villa Market ada di sekitar Phrom Phong dan Thonglor. Cari cabang terdekat di Google Maps."},korea:{en:"Like Ranch Market or Grand Lucky back home. Plenty of imported snacks, but Thai shelves are full of Mama noodles, so bring Indomie if you can't live without it.",idn:"Rasanya seperti Ranch Market atau Grand Lucky. Camilan impor banyak, tapi rak mi instan dipenuhi Mama, jadi bawa Indomie sendiri kalau tidak bisa hidup tanpanya."},tags:["supermarket","imported","fruit","bakery"],mapsQuery:"Tops supermarket Bangkok",imgQuery:"Tops supermarket Thailand",imgAlt:"Inside a Tops supermarket in Thailand",imgIllustrative:!0},{id:"hypermarkets",type:"essential",name:{en:"Big C & Lotus's Hypermarkets",idn:"Hipermarket Big C & Lotus's",th:"บิ๊กซี และ โลตัส"},desc:{en:"Thailand's big discount supermarkets for water by the case, snacks, instant noodles, toiletries, fruit and sundries at the best prices.",idn:"Hipermarket diskon besar Thailand untuk beli air mineral per dus, camilan, mi instan, perlengkapan mandi, buah, dan kebutuhan lain dengan harga paling murah."},budget:1,why:{en:"Cheapest place to stock a team room with water, drinks and snacks, plus gifts like Thai snacks and instant noodles.",idn:"Tempat termurah untuk stok air, minuman, dan camilan di kamar tim, plus oleh-oleh seperti camilan Thailand dan mi instan."},transit:{en:"Several branches in central Bangkok (for example Big C Ratchadamri, Lotus's branches on main roads). Use Google Maps to find the closest one.",idn:"Ada banyak cabang di pusat kota (misalnya Big C Ratchadamri, cabang Lotus's di jalan-jalan besar). Cari yang terdekat di Google Maps."},korea:{en:"Think Transmart or Hypermart, with shorter hours in smaller branches. Cashiers may not give bags automatically, and plastic bag rules vary, so bring a tote.",idn:"Mirip Transmart atau Hypermart, dan cabang kecil jam bukanya lebih pendek. Aturan kantong plastik beda-beda tiap cabang, jadi bawa tas belanja sendiri biar praktis."},tags:["cheap","bulk","snacks","water"],mapsQuery:"Big C supermarket Bangkok",imgQuery:"Big C Thailand",imgAlt:"Big C hypermarket exterior in Thailand",imgIllustrative:!0},{id:"skincare",type:"essential",name:{en:"Skincare & Sun Care",idn:"Perawatan Kulit & Tabir Surya",th:"สกินแคร์ และ กันแดด"},desc:{en:"Pharmacies and beauty chains sell sunscreen, gentle moisturisers and sheet masks. Thai drugstore brands such as Smooth E and Mistine are widely available.",idn:"Apotek dan jaringan toko kecantikan menjual sunscreen, pelembap yang lembut, dan sheet mask. Merek drugstore Thailand seperti Smooth E dan Mistine juga mudah ditemukan."},budget:2,why:{en:"Bangkok sun and humidity are strong. A high-SPF sunscreen, lip balm and a light moisturiser are worth having, and Thai brands make fun, cheap souvenirs.",idn:"Matahari dan kelembapan di Bangkok cukup kuat. Sunscreen SPF tinggi, lip balm, dan pelembap ringan layak dibawa, dan merek Thailand bisa jadi oleh-oleh murah yang seru."},transit:{en:"Watsons, Boots and pharmacies in malls and near BTS stations.",idn:"Bisa dibeli di Watsons, Boots, dan apotek di mal serta dekat stasiun BTS."},korea:{en:"Thai sunscreens and lotions have different textures and some are whitening-oriented, so test on your arm first. Imported (incl. Korean) sunscreens cost more here; bring your favorite local brand (e.g. Azarine, Wardah) if you are picky.",idn:"Sunscreen dan losion Thailand teksturnya berbeda dan sebagian fokus ke pencerah, jadi tes dulu di lengan. Sunscreen impor (termasuk Korea) lebih mahal di sini; kalau kamu pilih-pilih, bawa merek lokal favoritmu (misalnya Azarine, Wardah)."},tags:["sunscreen","moisturizer","thai-brands","souvenir"],mapsQuery:"Watsons Bangkok",imgQuery:"Sunscreen",imgAlt:"Bottles of sunscreen lotion",imgIllustrative:!0},{id:"protein-snacks",type:"essential",name:{en:"Protein Snacks & Light Meals",idn:"Camilan Protein & Makanan Ringan",th:"อาหารโปรตีน"},desc:{en:"7-Eleven and supermarkets sell boiled eggs, soy milk, yogurt, ready-to-eat chicken breast packs and tuna. Protein bars are sold in supermarkets and pharmacy chains; whey powder is best bought online or at sports nutrition stores.",idn:"7-Eleven dan supermarket menjual telur rebus, susu kedelai, yoghurt, dada ayam siap makan, dan tuna. Protein bar ada di supermarket dan jaringan apotek; whey protein lebih baik dibeli online atau di toko nutrisi olahraga."},budget:1,why:{en:"Easy post-practice refuel when you do not want a full meal. Check the label for sugar and allergens.",idn:"Cara praktis isi protein habis latihan kalau sedang malas makan berat. Cek label untuk kandungan gula dan alergen."},transit:{en:"7-Eleven (chilled and hot counters), Tops, Big C, Lotus's. Specific brands and stock change.",idn:"Ada di 7-Eleven (rak pendingin dan konter makanan hangat), Tops, Big C, Lotus's. Merek dan stok sering berubah."},korea:{en:"Thai stores lean toward eggs, soy and Thai-style meals rather than a wide range of ready-to-eat chicken breast. Bring a favorite protein powder if you rely on one.",idn:"Toko di Thailand lebih banyak menyediakan telur, susu kedelai, dan makanan ala Thailand ketimbang aneka dada ayam siap makan. Kalau rutin minum protein powder, bawa favoritmu."},tags:["protein","eggs","post-practice","snacks"],mapsQuery:"7-Eleven Bangkok",imgQuery:"Boiled egg",imgAlt:"Peeled boiled eggs",imgIllustrative:!0},{id:"atms-bank-fees",type:"essential",name:{en:"ATMs & Bank Fees",idn:"ATM & Biaya Bank",th:"ตู้เอทีเอ็มและค่าธรรมเนียม"},desc:{en:"Thai banks charge a flat fee for withdrawals with foreign cards, commonly around 220 THB per transaction (estimate; some banks differ, and AEON ATMs are reported to be cheaper). Your home bank may add its own fee.",idn:"Bank Thailand mengenakan biaya tetap untuk penarikan dengan kartu asing, biasanya sekitar 220 baht per transaksi (perkiraan; tiap bank beda, dan ATM AEON kabarnya lebih murah). Bank penerbit kartumu di Indonesia bisa menambah biaya sendiri."},budget:1,why:{en:"Fewer, larger withdrawals avoid repeating the flat fee. Always choose to be charged in THB, not in IDR, to avoid bad conversion (DCC).",idn:"Tarik tunai sekaligus dalam jumlah besar supaya tidak kena biaya tetap berulang kali. Tolak layar yang menawarkan transaksi dalam rupiah (DCC), dan selalu pilih baht (THB)."},transit:{en:"ATMs are in 7-Eleven, malls and bank branches. Use machines inside bank branches or malls rather than isolated street ATMs.",idn:"ATM ada di minimarket, mal, dan kantor cabang bank. Pakai mesin di dalam kantor bank atau mal, bukan ATM di pinggir jalan yang sepi."},korea:{en:"Indonesian ATMs charge low fees on your own bank's network; in Thailand the flat fee is significant. Card payment (Visa/Mastercard) and QR payments are common in malls, but street stalls often need cash. Check your card's overseas fee and daily limit before the trip.",idn:"Di Indonesia biaya ATM kecil kalau pakai jaringan bank sendiri, tapi di Thailand biaya tetapnya cukup besar. Di mal, kartu dan QR sudah umum, tapi lapak kaki lima butuh tunai. Cek biaya luar negeri dan limit harian kartumu sebelum berangkat."},tags:["cash","fees","dcc","cards"],mapsQuery:"ATM Bangkok",imgQuery:"ATM Thailand",imgAlt:"A bank ATM in Thailand",imgIllustrative:!0},{id:"currency-exchange",type:"essential",name:{en:"Currency Exchange",idn:"Tukar Uang",th:"แลกเปลี่ยนเงินตรา"},desc:{en:"Independent exchange shops such as SuperRich and Vasu Exchange are well-known in Bangkok and often offer better rates than airports and hotels. Compare the rate boards.",idn:"Money changer independen seperti SuperRich dan Vasu Exchange terkenal di Bangkok dan sering memberi kurs lebih baik daripada bandara atau hotel. Bandingkan papan kursnya."},budget:1,why:{en:"Get better rates than airport counters and hotels. Exchange only what you need, and bring your passport for larger amounts.",idn:"Kursnya lebih bagus daripada konter bandara dan hotel. Tukar seperlunya saja, dan bawa paspor untuk jumlah besar."},transit:{en:"Look for exchange counters in central areas (for example around Ratchadamri and Siam) and in some malls. Search on Google Maps and check recent reviews.",idn:"Cari money changer di pusat kota (misalnya sekitar Ratchadamri dan Siam) dan di beberapa mal. Cari di Google Maps dan cek ulasan terbaru."},korea:{en:"In Bangkok most travelers bring USD or THB cash or exchange at local money changers. IDR cash can be exchanged, but rates are usually poor, so it is better to change IDR to THB or USD at home before flying. Rates differ per shop and per bill size, so compare, and avoid airport rates when you can. Count your cash before leaving the counter.",idn:"Di Bangkok, kebanyakan turis membawa tunai USD atau THB, atau menukar di money changer lokal. Rupiah tunai bisa ditukar, tapi kursnya biasanya kurang bagus, jadi lebih baik tukar rupiah ke THB atau USD di Indonesia sebelum berangkat. Kurs berbeda tiap toko dan pecahan uang, jadi bandingkan, dan hindari kurs bandara kalau bisa. Hitung uangmu sebelum meninggalkan konter."},tags:["exchange","cash","rates","passport"],mapsQuery:"SuperRich currency exchange Bangkok",imgQuery:"Currency exchange Bangkok",imgAlt:"A currency exchange booth with rate board",imgIllustrative:!0},{id:"emergency-supplies",type:"essential",name:{en:"Emergency Supplies Kit",idn:"Perlengkapan Darurat",th:"ของใช้ฉุกเฉิน"},desc:{en:"Power bank, light poncho or compact umbrella, sunscreen, mosquito repellent, oral rehydration salts, plasters and basic meds. All are easy to buy at 7-Eleven, pharmacies and supermarkets.",idn:"Power bank, jas hujan ringan atau payung lipat, sunscreen, losion antinyamuk, oralit, plester, dan obat-obatan dasar. Semuanya mudah dibeli di 7-Eleven, apotek, dan supermarket."},budget:1,why:{en:"Sudden rain, heat, mosquitoes or a stomach upset can ruin a day. A small kit prevents most of it. Carry your passport copy or photo and keep medicine in its original packaging; check rules for prescription meds before you travel.",idn:"Hujan mendadak, panas, nyamuk, atau sakit perut bisa merusak satu hari. Kit kecil bisa mencegah sebagian besar masalah itu. Bawa fotokopi atau foto paspor, dan simpan obat dalam kemasan aslinya; cek aturan obat resep sebelum berangkat."},transit:{en:"7-Eleven for ponchos and ORS, pharmacies for meds and repellent, supermarkets for sunscreen.",idn:"Jas hujan dan oralit di 7-Eleven, obat dan antinyamuk di apotek, sunscreen di supermarket."},korea:{en:"Indonesian favorites like Tolak Angin, minyak kayu putih or Soffell/Autan repellent are not always available, so bring your own (Thai pharmacies have equivalents). For dengue-prone seasons, repellent matters. Seek a doctor for fever or severe symptoms.",idn:"Andalan dari rumah seperti Tolak Angin, minyak kayu putih, atau Soffell/Autan belum tentu ada, jadi bawa sendiri (apotek Thailand punya padanannya). Saat musim rawan demam berdarah, losion antinyamuk itu penting. Kalau demam atau gejalanya berat, segera ke dokter."},tags:["emergency","poncho","ors","repellent","power-bank"],mapsQuery:"pharmacy near me Bangkok",imgQuery:"Oral rehydration salts",imgAlt:"Oral rehydration salt sachets and a bottle of water",imgIllustrative:!0}],aa=[{id:"tao-kae-noi",kind:"snack",name:{en:"Tao Kae Noi Crispy Seaweed",th:"เถ้าแก่น้อย สาหร่ายทอดกรอบ",idn:"Camilan rumput laut Tao Kae Noi"},desc:{en:"The iconic Thai crispy seaweed snack with flavors like original and tom yum. Light, salty and easy to pack home.",idn:"Camilan rumput laut renyah ikonik Thailand dengan rasa seperti original dan tom yum. Ringan, gurih, dan gampang dibawa pulang jadi oleh-oleh."},price:[15,60],imgQuery:"Tao Kae Noi seaweed",imgAlt:"A pack of Tao Kae Noi crispy seaweed snack"},{id:"dried-mango",kind:"snack",name:{en:"Dried Mango",th:"มะม่วงอบแห้ง",idn:"Mangga kering"},desc:{en:"Chewy sweet dried Thai mango, a classic gift. Check labels for added sugar and sulfites if sensitive.",idn:"Mangga kering Thailand yang kenyal dan manis, oleh-oleh klasik. Kalau sensitif, cek label untuk tambahan gula dan sulfit."},price:[50,200],imgQuery:"Dried mango",imgAlt:"Dried mango slices in a bowl",imgIllustrative:!0},{id:"mama-instant-noodles",kind:"snack",name:{en:"Mama Instant Noodles",th:"มาม่า",idn:"Mi Mama"},desc:{en:"Thailand's favorite instant noodles, with tom yum and other Thai flavors. Cheap, fun and easy to bring home.",idn:"Mi instan favorit Thailand, dengan rasa tom yum dan rasa khas Thailand lainnya. Murah, seru, dan gampang dibawa pulang."},price:[8,40],imgQuery:"Mama instant noodles",imgAlt:"Packs of Mama instant noodles"},{id:"m-150",kind:"drink",name:{en:"M-150",th:"เอ็ม 150",idn:"M-150"},desc:{en:"A classic small-bottle Thai energy tonic, sweet and strong. It contains caffeine, so follow the label: one a day at most.",idn:"Tonik energi klasik Thailand dalam botol kecil, manis dan kuat. Mengandung kafein, jadi ikuti label: maksimal satu botol sehari."},price:[10,20],imgQuery:"M-150 energy drink",imgAlt:"A bottle of M-150 energy drink",imgIllustrative:!0},{id:"jim-thompson-silk",kind:"souvenir",name:{en:"Jim Thompson Thai Silk",th:"จิม ทอมป์สัน",idn:"Sutra Jim Thompson"},desc:{en:"A famous Thai silk brand known for scarves, cushion covers and accessories. A premium, gift-worthy souvenir, with prices well above market-stall silk.",idn:"Merek sutra Thailand terkenal untuk syal, sarung bantal, dan aksesori. Oleh-oleh premium yang layak jadi hadiah, harganya jauh di atas sutra di lapak pasar."},price:[500,6e3],imgQuery:"Jim Thompson silk Bangkok",imgAlt:"Jim Thompson Thai silk scarves and fabrics"}],Va=[{topic:{en:"Hot food counters",idn:"Konter makanan hangat"},korea:{en:"Convenience stores sell cold lunch boxes and ready meals; you microwave them yourself, using a self-serve microwave.",idn:"Di Indomaret/Alfamart, pilihan makanan siap saji makin banyak; ada tidaknya microwave tergantung gerai."},thailand:{en:"Staff at 7-Eleven will usually heat your meal for you at the counter. Many stores also have toasties and steamed buns.",idn:"Di 7-Eleven, staf biasanya memanaskan makananmu di kasir. Banyak gerai juga punya roti panggang isi dan bakpao."}},{topic:{en:"Payment & QR",idn:"Pembayaran & QR"},korea:{en:"Cards and mobile pay work almost everywhere, even at stalls.",idn:"QRIS, e-wallet, dan kartu bisa dipakai hampir di mana-mana, bahkan di warung."},thailand:{en:"Cards and QR are common in malls and convenience stores, but street stalls and small shops often want cash. Thai QR (PromptPay) may not work for foreign cards, so carry some THB.",idn:"Kartu dan QR umum di mal dan minimarket, tapi lapak kaki lima dan toko kecil sering minta tunai. Aplikasi Indonesia yang mendukung QRIS lintas negara bisa scan QR Thailand (PromptPay) di merchant yang ikut serta, tapi tidak semua QR bisa, jadi tetap bawa baht tunai."}},{topic:{en:"Bags & plastic",idn:"Kantong plastik"},korea:{en:"Plastic bags cost a small fee at stores, and many people bring their own.",idn:"Di banyak kota, kantong plastik berbayar atau tidak disediakan di toko modern, jadi banyak orang bawa tas sendiri."},thailand:{en:"Rules vary by chain and shop; some give bags, some ask if you need one. Bring a light tote anyway.",idn:"Aturannya beda tiap jaringan dan toko; ada yang memberi kantong, ada yang menanyakan dulu. Tetap bawa tas belanja ringan."}},{topic:{en:"ATMs & cash",idn:"ATM & tunai"},korea:{en:"Withdrawals are cheap or free for domestic cards.",idn:"Tarik tunai murah atau gratis dengan kartu dari bank sendiri."},thailand:{en:"Foreign cards usually pay a flat fee (commonly around 220 THB per withdrawal, estimate) plus your bank's fee. Withdraw larger amounts less often and decline conversion to IDR.",idn:"Kartu asing biasanya kena biaya tetap per transaksi (sekitar 220 baht, perkiraan) ditambah biaya bank penerbit. Tarik sekaligus dalam jumlah besar dan tolak konversi ke rupiah."}},{topic:{en:"SIM & data",idn:"SIM & data"},korea:{en:"Roaming or a prepaid SIM is set up before travelling.",idn:"Biasanya aktifkan paket roaming atau siapkan SIM/eSIM prabayar sebelum berangkat."},thailand:{en:"Physical SIMs need your passport for registration at the shop. eSIM is easiest, set up before landing. Airport counters are convenient but sometimes pricier.",idn:"SIM fisik perlu registrasi dengan paspor di gerai. eSIM paling praktis, atur sebelum mendarat. Konter bandara praktis, tapi kadang lebih mahal."}},{topic:{en:"Sociolla vs Thai beauty stores",idn:"Sociolla vs toko kecantikan Thailand"},korea:{en:"Sociolla, Guardian and Watsons are easy to find, with local and K-beauty brands and frequent promos.",idn:"Sociolla, Guardian, dan Watsons mudah ditemukan, dengan merek lokal dan K-beauty serta promo yang sering."},thailand:{en:"Watsons, Boots, Eve and Boy, and Beautrium are the main chains in Bangkok; imported brands (including K-beauty) are sold at higher prices, so bring your favorite Indonesian brands from home.",idn:"Watsons, Boots, Eve and Boy, dan Beautrium adalah jaringan utama di Bangkok; merek impor (termasuk K-beauty) dijual lebih mahal, jadi bawa merek lokal favoritmu dari Indonesia."}},{topic:{en:"Bargaining",idn:"Tawar-menawar"},korea:{en:"Fixed prices in shops; some bargaining at traditional markets.",idn:"Harga pas di toko; tawar-menawar biasa di pasar tradisional."},thailand:{en:"Malls and convenience stores have fixed prices. Market stalls (MBK, Chatuchak) accept polite bargaining; smile, ask for a lower price and walk away if not satisfied.",idn:"Mal dan minimarket pakai harga pas. Lapak pasar (MBK, Chatuchak) bisa ditawar dengan sopan: senyum, minta harga lebih murah, dan pergi saja kalau tidak cocok."}},{topic:{en:"Late-night shopping",idn:"Belanja larut malam"},korea:{en:"24-hour convenience stores and some late-night Daiso/mart; malls close around 20:00-22:00.",idn:"Ada minimarket 24 jam; mal biasanya tutup sekitar pukul 22.00."},thailand:{en:"Most big malls close around 21:00-22:00 (check each), while 7-Eleven stays open very late and sometimes 24 hours. Alcohol sales have legal time restrictions.",idn:"Kebanyakan mal besar tutup sekitar pukul 21.00–22.00 (cek masing-masing), sementara 7-Eleven buka sampai larut malam, bahkan 24 jam. Penjualan alkohol dibatasi jam tertentu oleh hukum."}}]});var U,Ta,Jo=S(()=>{U=[{id:"hello",cat:"greetings",en:"Hello",th:"สวัสดี{P}",rom:"sa-wat-dee {P}",idn:"Halo",ctx:{en:"Works any time of day, for hello and also for goodbye. Say it to shop staff, drivers, hotel staff and anyone older than you.",idn:"Bisa dipakai kapan saja, untuk menyapa maupun berpamitan. Ucapkan ke staf toko, sopir, staf hotel, dan siapa pun yang lebih tua darimu."},level:"polite",note:{en:"Always end with khrap (men) or kha (women). It works a bit like adding \"Pak/Bu/Kak\" or a polite \"ya\" in Indonesian: leave it off and you sound blunt, add it and you sound friendly and respectful. The app switches khrap/kha for you.",idn:'Laki-laki menutup dengan "khrap", perempuan dengan "kha". Fungsinya mirip menambahkan "Pak/Bu/Kak" atau "ya" yang sopan dalam bahasa Indonesia: tanpa itu terdengar ketus, dengan itu terdengar ramah dan sopan. Aplikasi akan menyesuaikannya dengan gendermu.'}},{id:"wai-greeting",cat:"greetings",en:"The wai (palms-together greeting)",th:"ไหว้",rom:"wai",idn:"Wai (salam dengan telapak tangan dirapatkan)",ctx:{en:"Press your palms together near your chest and give a small nod while saying sa-wat-dee. A deeper wai with hands higher is for monks and elders.",idn:'Rapatkan kedua telapak tangan di depan dada dan sedikit menunduk sambil mengucapkan "sa-wat-dee". Untuk biksu dan orang tua, angkat tangan lebih tinggi dan menunduk lebih dalam.'},level:"polite",note:{en:"It is like a respectful salim or greeting gesture back home, with palms together. You do not need to wai staff who serve you (a smile and a nod is fine); wai back if someone wais you first. A child’s wai is answered with a smile and a nod.",idn:"Mirip salim atau salam hormat di Indonesia, dengan kedua telapak tangan dirapatkan. Kamu tidak perlu memberi wai duluan ke staf yang melayanimu; senyum dan anggukan sudah cukup. Kalau seseorang memberi wai duluan, balas dengan wai. Wai dari anak kecil cukup dibalas dengan senyum dan anggukan."}},{id:"goodbye-see-you",cat:"greetings",en:"See you again",th:"ไว้เจอกันใหม่นะ{P}",rom:"wai jer gan mai na {P}",idn:"Sampai jumpa lagi",ctx:{en:"A warm way to say goodbye to someone you have met or worked with. You can also just say sa-wat-dee.",idn:'Salam perpisahan yang hangat untuk orang yang sudah kamu temui atau ajak bekerja sama. Bisa juga cukup bilang "sa-wat-dee".'},level:"polite",note:{en:'Thai has a formal "la-kon" for goodbye, but it can sound final, like "farewell". For daily life use sa-wat-dee or this phrase.',idn:'Ada ungkapan perpisahan formal "la-kon" (ลาก่อน), tapi kesannya seperti "selamat tinggal" untuk selamanya, jadi jarang dipakai sehari-hari. "Sa-wat-dee" atau frasa ini lebih natural.'}},{id:"thank-you",cat:"greetings",en:"Thank you",th:"ขอบคุณ{P}",rom:"khop khun {P}",idn:"Terima kasih",ctx:{en:"Use it after every service: food arriving, a ride ending, a door held open.",idn:"Ucapkan setiap kali dilayani: makanan datang, turun dari taksi, atau saat ada yang menahankan pintu."},level:"polite",note:{en:"Say it with a small smile. Thais say it a lot, so it is hard to overdo.",idn:"Ucapkan sambil sedikit tersenyum. Orang Thailand sering mengucapkannya, jadi tidak akan terasa berlebihan."}},{id:"thank-you-very-much",cat:"greetings",en:"Thank you very much",th:"ขอบคุณมาก{P}",rom:"khop khun mak {P}",idn:"Terima kasih banyak",ctx:{en:"When someone goes out of their way to help you: staff who find your lost item, a driver who waits.",idn:"Untuk orang yang sudah repot-repot membantumu, misalnya staf yang menemukan barangmu yang hilang atau sopir yang mau menunggu."},level:"polite"},{id:"sorry",cat:"greetings",en:"Sorry / I apologize",th:"ขอโทษ{P}",rom:"khor thot {P}",idn:"Maaf",ctx:{en:"When you bump into someone, are late, or make a mistake. Also used to get attention politely.",idn:"Saat menyenggol orang, terlambat, atau berbuat salah. Juga dipakai untuk memanggil orang dengan sopan."},level:"polite",note:{en:'Works a bit like Indonesian "maaf" and "permisi" combined. A light "khor thot" is enough for small things.',idn:'Rasanya seperti gabungan "maaf" dan "permisi". Untuk hal kecil, cukup ucapkan "khor thot" dengan ringan.'}},{id:"excuse-me-pass",cat:"greetings",en:"Excuse me (let me pass)",th:"ขอทางหน่อย{P}",rom:"khor thang noi {P}",idn:"Permisi (mau lewat)",ctx:{en:"On crowded BTS platforms, in malls, or in narrow market lanes when you need to get through.",idn:"Di peron BTS yang padat, di mal, atau di gang pasar yang sempit saat kamu perlu lewat."},level:"polite"},{id:"nice-to-meet-you",cat:"greetings",en:"Nice to meet you",th:"ยินดีที่ได้รู้จัก{P}",rom:"yin-dee thee dai roo-jak {P}",idn:"Senang bertemu denganmu",ctx:{en:"First meeting with partners, staff or event crew. Combine with a small wai.",idn:"Saat pertama kali bertemu mitra lokal, staf, atau kru acara. Paling pas sambil memberi wai kecil."},level:"polite"},{id:"how-are-you",cat:"greetings",en:"How are you?",th:"สบายดีไหม{Q}",rom:"sa-bai dee mai {Q}",idn:"Apa kabar?",ctx:{en:"Friendly check-in with someone you already know. The answer is usually sa-bai dee.",idn:'Untuk menanyakan kabar orang yang sudah kamu kenal. Jawabannya biasanya "sa-bai dee".'},level:"polite",note:{en:'It is not asked to strangers as often as English "how are you". Among friends you can drop the particle.',idn:'Tidak ditanyakan ke orang asing sesering "how are you" dalam bahasa Inggris. Dengan teman, partikel "khrap/kha" di akhir boleh dihilangkan.'}},{id:"im-fine",cat:"greetings",en:"I’m fine / doing well",th:"สบายดี{P}",rom:"sa-bai dee {P}",idn:"Kabar baik",ctx:{en:"The standard reply to sa-bai dee mai. Add khop khun (thanks) if you like.",idn:'Jawaban standar untuk "sa-bai dee mai". Lebih baik lagi kalau ditambah "khop khun" (terima kasih).'},level:"polite"},{id:"mai-pen-rai",cat:"greetings",en:"No problem / It’s okay",th:"ไม่เป็นไร{P}",rom:"mai pen rai {P}",idn:"Tidak apa-apa",ctx:{en:'Reply to an apology or small trouble. Also a general "don’t worry about it".',idn:'Untuk menanggapi permintaan maaf atau masalah kecil, artinya "nggak apa-apa, jangan dipikirkan".'},level:"polite",note:{en:'Close to Indonesian "nggak apa-apa / santai aja", but it carries a stronger "let it go" attitude that Thais value. Use it to stay calm and smiling when plans change.',idn:'Mirip "nggak apa-apa" atau "santai aja", tapi sikap "sudahlah, biarkan saja"-nya lebih kuat dan sangat dihargai orang Thailand. Kalau jadwal berubah, ucapkan sambil tersenyum supaya suasana tetap enak.'}},{id:"ok-can-do",cat:"greetings",en:"OK / can do",th:"ได้{P}",rom:"dai {P}",idn:"Ya, bisa",ctx:{en:"Agreeing to a request or saying something is possible. Very common one-word answer.",idn:'Jawaban satu kata yang sangat umum untuk menyetujui permintaan atau bilang sesuatu "bisa".'},level:"polite",note:{en:'The opposite is mai dai (cannot). In Thai, a polite "no" is often softened to mai dai or "mai mee" (don’t have) instead of a flat refusal.',idn:'Lawannya "mai dai" (tidak bisa). Dalam bahasa Thailand, penolakan sering diperhalus jadi "mai dai" atau "mai mee" (tidak ada) daripada menolak mentah-mentah.'}},{id:"cannot",cat:"greetings",en:"No, can’t / not possible",th:"ไม่ได้{P}",rom:"mai dai {P}",idn:"Tidak bisa",ctx:{en:"Declining politely, e.g. when a seller offers something you do not want or you cannot do something.",idn:"Untuk menolak dengan sopan, misalnya saat ditawari barang yang tidak kamu mau atau diminta melakukan sesuatu yang tidak bisa kamu lakukan."},level:"polite",note:{en:'For an offer you do not want, "mai ao" (don’t want) with a smile is the normal street response.',idn:'Untuk tawaran yang tidak kamu mau, jawaban yang umum adalah "mai ao" (tidak mau) sambil tersenyum.'}},{id:"dont-understand",cat:"greetings",en:"I don’t understand",th:"ไม่เข้าใจ{P}",rom:"mai khao jai {P}",idn:"Saya tidak mengerti",ctx:{en:'When someone speaks too fast or in a way you cannot follow. Pair with "phoot chaa chaa noi".',idn:'Saat lawan bicara terlalu cepat atau kamu tidak bisa mengikutinya. Pasangkan dengan "phoot chaa chaa noi".'},level:"polite"},{id:"speak-english",cat:"greetings",en:"Can you speak English?",th:"พูดภาษาอังกฤษได้ไหม{Q}",rom:"phoot pha-saa ang-grit dai mai {Q}",idn:"Bisa bahasa Inggris?",ctx:{en:"Before launching into a long question at a shop, clinic or taxi stand.",idn:"Tanyakan dulu sebelum mengajukan pertanyaan panjang di toko, klinik, atau pangkalan taksi."},level:"polite"},{id:"speak-slowly",cat:"greetings",en:"Please speak slowly",th:"พูดช้าๆ หน่อย{P}",rom:"phoot chaa chaa noi {P}",idn:"Tolong bicara pelan-pelan",ctx:{en:"When someone speaks too quickly for you to catch.",idn:"Saat seseorang bicara terlalu cepat sampai kamu sulit menangkapnya."},level:"polite"},{id:"come-from-indonesia",cat:"greetings",en:"I’m from Indonesia",th:"มาจากอินโดนีเซีย{P}",rom:"ma jak in-do-nee-sia {P}",idn:"Saya dari Indonesia",ctx:{en:"Small talk with drivers and shop staff. Thais are often friendly and curious about Indonesia (Bali, food, Mobile Legends esports).",idn:"Untuk ngobrol santai dengan sopir atau staf toko. Orang Thailand sering ramah dan penasaran soal Indonesia (Bali, makanan, esports Mobile Legends)."},level:"polite",note:{en:"Thai drops the subject easily, so no pronoun is needed. That also avoids having to choose between pom (men) and chan / di-chan (women).",idn:'Bahasa Thailand sering menghilangkan subjek, jadi tidak perlu kata ganti. Kamu juga tidak perlu memilih antara "pom" (laki-laki) dan "chan / di-chan" (perempuan).'}},{id:"good-luck",cat:"greetings",en:"Good luck",th:"โชคดี{P}",rom:"chok dee {P}",idn:"Semoga beruntung",ctx:{en:"Wishing someone luck before a match, a trip or an exam.",idn:"Untuk mendoakan keberuntungan sebelum pertandingan, perjalanan, atau ujian."},level:"polite"},{id:"congratulations",cat:"greetings",en:"Congratulations",th:"ยินดีด้วย{P}",rom:"yin-dee duai {P}",idn:"Selamat!",ctx:{en:"After a win, a promotion, a birthday or good news.",idn:"Setelah menang, naik jabatan, ulang tahun, atau ada kabar baik."},level:"polite"},{id:"not-spicy",cat:"food",en:"Not spicy, please",th:"ไม่เผ็ด{P}",rom:"mai phet {P}",idn:"Tolong jangan pedas",ctx:{en:"Say it when ordering. Dishes such as pad kra pao, som tam and tom yum are spicy by default.",idn:"Ucapkan saat memesan. Hidangan seperti pad kra pao, som tam, dan tom yum pedas dari sananya."},level:"polite",note:{en:'Even "mai phet" can still taste spicy, even for Indonesians used to sambal. If you are sensitive, say "mai phet leoi" (not spicy at all) or "phet noi".',idn:'Meski sudah bilang "mai phet", rasanya masih bisa pedas, bahkan buat lidah Indonesia yang terbiasa sambal. Kalau tidak kuat pedas, pakai "mai phet leoi" (sama sekali tidak pedas) atau "phet noi" (sedikit pedas).'}},{id:"less-spicy",cat:"food",en:"A little spicy",th:"เผ็ดน้อย{P}",rom:"phet noi {P}",idn:"Pedasnya sedikit saja",ctx:{en:"You want some heat but not the full Thai level.",idn:"Saat kamu mau sedikit pedas, tapi level standar Thailand terlalu berat."},level:"polite"},{id:"no-chilies",cat:"food",en:"No chilies, please",th:"ไม่ใส่พริก{P}",rom:"mai sai phrik {P}",idn:"Tanpa cabai",ctx:{en:"For stir-fries, noodle dishes and soups when you want zero chili added.",idn:"Untuk tumisan, mi, dan sup saat kamu sama sekali tidak mau cabai."},level:"polite"},{id:"is-this-spicy",cat:"food",en:"Is this spicy?",th:"อันนี้เผ็ดไหม{Q}",rom:"an-nee phet mai {Q}",idn:"Ini pedas?",ctx:{en:"Pointing at a dish or at the menu before ordering.",idn:"Sambil menunjuk menu atau makanan sebelum memesan."},level:"polite"},{id:"no-peanuts",cat:"food",en:"No peanuts, please",th:"ไม่ใส่ถั่วลิสง{P}",rom:"mai sai thua li-song {P}",idn:"Tanpa kacang tanah",ctx:{en:'Peanuts often top pad thai, satay sauce and som tam. For a real allergy, use the emergency phrase "phae thua li-song" instead.',idn:'Kacang tanah sering ditabur di pad thai, saus sate, dan som tam. Kalau benar-benar alergi, pakai frasa darurat "phae thua li-song".'},level:"polite"},{id:"no-pork",cat:"food",en:"No pork, please",th:"ไม่ใส่หมู{P}",rom:"mai sai moo {P}",idn:"Tanpa babi",ctx:{en:"Pork is in many dishes. Pick chicken (gai) or another protein.",idn:"Banyak hidangan pakai daging babi. Minta ganti ayam (gai) atau protein lain."},level:"polite",note:{en:"Broths and sauces may still contain pork. Ask again if it matters for religious or health reasons.",idn:"Kaldu dan saus bisa saja tetap mengandung babi. Kalau penting karena alasan agama atau kesehatan, tanyakan lagi, atau cari tempat makan berlogo halal."}},{id:"no-shrimp",cat:"food",en:"No shrimp, please",th:"ไม่ใส่กุ้ง{P}",rom:"mai sai goong {P}",idn:"Tanpa udang",ctx:{en:"Useful for fried rice, noodles and tom yum.",idn:"Berguna untuk nasi goreng, mi, dan tom yum."},level:"polite",note:{en:"Dried shrimp and shrimp paste are hidden in many sauces and curry pastes. A real allergy needs the emergency phrase.",idn:"Udang kering dan terasi sering tersembunyi di saus dan bumbu kari. Kalau alergi, pakai frasa darurat."}},{id:"no-fish-sauce",cat:"food",en:"No fish sauce, please",th:"ไม่ใส่น้ำปลา{P}",rom:"mai sai nam pla {P}",idn:"Tanpa kecap ikan (nam pla)",ctx:{en:"Fish sauce is the salty base of Thai cooking. This request may be hard to fulfil in some dishes, so ask politely.",idn:"Kecap ikan adalah dasar rasa asin masakan Thailand, jadi di beberapa hidangan sulit dihilangkan. Mintalah dengan sopan."},level:"polite"},{id:"no-msg",cat:"food",en:"No MSG, please",th:"ไม่ใส่ผงชูรส{P}",rom:"mai sai phong choo-rot {P}",idn:"Tanpa MSG (micin)",ctx:{en:"If you want to avoid MSG at street stalls. Many places add it or flavor powder.",idn:"Kalau mau menghindari MSG di lapak kaki lima. Banyak tempat menambahkan MSG atau bumbu penyedap."},level:"polite"},{id:"no-coriander",cat:"food",en:"No coriander, please",th:"ไม่ใส่ผักชี{P}",rom:"mai sai phak-chee {P}",idn:"Tanpa daun ketumbar",ctx:{en:"Coriander is a very common topping on noodles and soups. Say this when ordering.",idn:"Daun ketumbar sering jadi taburan di mi dan sup. Sampaikan saat memesan."},level:"polite"},{id:"extra-rice",cat:"food",en:"Extra rice, please",th:"ขอข้าวเพิ่ม{P}",rom:"khor khao phoem {P}",idn:"Minta tambah nasi",ctx:{en:"After training or a match when one plate is not enough. Extra rice sometimes costs a few baht.",idn:"Setelah latihan atau pertandingan saat satu piring tidak cukup. Tambah nasi kadang kena biaya beberapa baht."},level:"polite"},{id:"takeaway",cat:"food",en:"Take away / to go",th:"ห่อกลับ{P}",rom:"ho glap {P}",idn:"Dibungkus, ya",ctx:{en:'Order food to carry out. At cafes you can also say "glap baan" (go home).',idn:'Untuk pesan makanan dibawa pulang. Di kafe bisa juga bilang "glap baan" (pulang).'},level:"polite"},{id:"eat-here",cat:"food",en:"Eat here",th:"กินที่นี่{P}",rom:"gin thee nee {P}",idn:"Makan di sini",ctx:{en:'When asked "eat here or take away?" at a restaurant or food court.',idn:'Jawaban saat ditanya "makan di sini atau dibungkus?" di restoran atau food court.'},level:"polite"},{id:"delicious",cat:"food",en:"Delicious",th:"อร่อย{P}",rom:"a-roi {P}",idn:"Enak!",ctx:{en:'Say it when you finish, or to compliment the cook. Add "mak" (very): a-roi mak.',idn:'Ucapkan setelah selesai makan atau untuk memuji juru masak. Tambahkan "mak" (sangat): "a-roi mak".'},level:"polite"},{id:"check-please",cat:"food",en:"Check, please",th:"คิดเงินด้วย{P}",rom:"kit ngoen duai {P}",idn:"Minta bill, ya",ctx:{en:'Ask for the bill at a restaurant. Many locals also say "check bin". A raised hand and eye contact works too.',idn:'Untuk minta bill di restoran. Banyak orang lokal juga bilang "check bin". Angkat tangan dan kontak mata juga bisa.'},level:"polite"},{id:"water-please",cat:"food",en:"Plain water, please",th:"ขอน้ำเปล่าหน่อย{P}",rom:"khor nam plao noi {P}",idn:"Minta air putih",ctx:{en:'Water is not always free at tables. Bottled "nam plao" may be charged.',idn:'Air di meja tidak selalu gratis. Air botolan ("nam plao") bisa dikenai biaya.'},level:"polite"},{id:"vegetarian",cat:"food",en:"Vegetarian, please",th:"ขอแบบมังสวิรัติ{P}",rom:"khor baep mang-sa-wi-rat {P}",idn:"Tolong versi vegetarian",ctx:{en:"Say it when ordering. Check that fish sauce, oyster sauce and shrimp paste are left out.",idn:"Sampaikan saat memesan. Pastikan kecap ikan, saus tiram, dan terasi juga tidak dipakai."},level:"polite",note:{en:"Look for yellow flags with the character เจ (jay): that is strict Buddhist vegan food (no meat, dairy, eggs, garlic or onion, depending on the stall).",idn:'Cari bendera kuning bertuliskan "เจ" (jay): itu makanan vegan ala Buddha yang ketat (tanpa daging, produk susu, telur, bawang putih, atau bawang bombai, tergantung tempatnya).'}},{id:"one-more",cat:"food",en:"One more, please",th:"ขออีกอันหนึ่ง{P}",rom:"khor eek an neung {P}",idn:"Tambah satu lagi",ctx:{en:'Another skewer, dessert or pastry. For drinks say "eek gaeo" (another glass); for plates, "eek jaan".',idn:'Untuk tambah sate, dessert, atau roti. Untuk minuman bilang "eek gaeo" (satu gelas lagi); untuk piring, "eek jaan".'},level:"polite"},{id:"with-ice",cat:"food",en:"With ice, please",th:"ใส่น้ำแข็ง{P}",rom:"sai nam-khaeng {P}",idn:"Pakai es",ctx:{en:"For iced Thai tea, coffee or smoothies. Most Thai drinks come iced by default.",idn:"Untuk teh Thailand, kopi, atau smoothie. Kebanyakan minuman Thailand sudah pakai es dari sananya."},level:"polite"},{id:"no-ice",cat:"food",en:"No ice, please",th:"ไม่ใส่น้ำแข็ง{P}",rom:"mai sai nam-khaeng {P}",idn:"Tanpa es",ctx:{en:"If you want a drink without ice, for example for a cold stomach or sore throat.",idn:"Kalau mau minum tanpa es, misalnya karena perut atau tenggorokan sedang kurang enak."},level:"polite"},{id:"less-sweet",cat:"food",en:"Less sweet, please",th:"หวานน้อย{P}",rom:"waan noi {P}",idn:"Jangan terlalu manis",ctx:{en:"Thai iced tea, coffee and smoothies are very sweet by default. Add this to avoid sugar overload.",idn:"Teh Thailand, kopi, dan smoothie biasanya sangat manis. Tambahkan frasa ini supaya tidak kelebihan gula."},level:"polite"},{id:"no-sugar",cat:"food",en:"No sugar, please",th:"ไม่ใส่น้ำตาล{P}",rom:"mai sai nam-tan {P}",idn:"Tanpa gula",ctx:{en:"For coffee or tea with zero added sugar. Note that syrup or condensed milk may still be added unless you also say it.",idn:"Untuk kopi atau teh tanpa tambahan gula. Sirup atau susu kental manis bisa saja tetap ditambahkan, jadi sebutkan juga."},level:"polite"},{id:"recommend",cat:"food",en:"What do you recommend?",th:"มีอะไรแนะนำไหม{Q}",rom:"mee a-rai nae-nam mai {Q}",idn:"Ada menu rekomendasi?",ctx:{en:"When the menu is only in Thai or you do not know what to choose.",idn:"Saat menunya hanya berbahasa Thailand atau kamu bingung mau pilih apa."},level:"polite"},{id:"menu-please",cat:"food",en:"Menu, please",th:"ขอเมนูหน่อย{P}",rom:"khor may-noo noi {P}",idn:"Minta menunya, ya",ctx:{en:"Sit down and ask for the menu. In small shops the menu may be on the wall.",idn:"Duduk lalu minta menu. Di warung kecil, menunya mungkin tertempel di dinding."},level:"polite"},{id:"ill-have-this",cat:"food",en:"I’ll have this one",th:"เอาอันนี้{P}",rom:"ao an-nee {P}",idn:"Saya pesan yang ini",ctx:{en:'Point at the menu or the dish and order. Add "sorng" (two) etc. for quantity.',idn:'Tunjuk menu atau makanannya lalu pesan. Untuk jumlah, tambahkan angka seperti "sorng" (dua).'},level:"polite"},{id:"cutlery",cat:"food",en:"Spoon and fork, please",th:"ขอช้อนส้อมหน่อย{P}",rom:"khor chon som noi {P}",idn:"Minta sendok dan garpu",ctx:{en:"Thai food is eaten with a spoon (main tool) and fork (pusher). Chopsticks are only for noodle soups.",idn:"Makanan Thailand dimakan dengan sendok (alat utama) dan garpu (pendorong). Sumpit hanya untuk sup mi."},level:"polite",note:{en:"Just like at home in Indonesia: spoon in the right hand, fork pushes food onto the spoon. Thais rarely put the fork in the mouth.",idn:"Sama seperti di Indonesia: sendok di tangan kanan, garpu untuk mendorong makanan ke sendok. Orang Thailand jarang memasukkan garpu ke mulut."}},{id:"how-much",cat:"shopping",en:"How much is this?",th:"อันนี้เท่าไหร่{Q}",rom:"an-nee tao-rai {Q}",idn:"Ini berapa?",ctx:{en:"Point at the item and ask. Works at markets, malls and street stalls.",idn:"Tunjuk barangnya lalu tanyakan. Bisa dipakai di pasar, mal, dan lapak kaki lima."},level:"polite"},{id:"pay-by-card",cat:"shopping",en:"Can I pay by card?",th:"จ่ายบัตรได้ไหม{Q}",rom:"jai bat dai mai {Q}",idn:"Bisa bayar pakai kartu?",ctx:{en:"At small shops and markets, ask before ordering. Some places only take cash or QR.",idn:"Di toko kecil dan pasar, tanyakan sebelum memesan. Beberapa tempat hanya terima tunai atau QR."},level:"polite"},{id:"pay-by-qr",cat:"shopping",en:"Can I pay by QR code?",th:"สแกนจ่ายได้ไหม{Q}",rom:"sa-kaen jai dai mai {Q}",idn:"Bisa bayar pakai QR?",ctx:{en:"Many Thai shops use PromptPay QR codes. Foreign cards or apps may or may not work, so ask.",idn:"Banyak toko di Thailand pakai QR PromptPay. Aplikasi Indonesia yang mendukung QRIS lintas negara bisa scan di merchant yang ikut serta, tapi tidak semua QR bisa, jadi tanyakan dulu."},level:"polite"},{id:"another-size",cat:"shopping",en:"Do you have another size?",th:"มีไซส์อื่นไหม{Q}",rom:"mee sai uen mai {Q}",idn:"Ada ukuran lain?",ctx:{en:"Clothes and shoes. Thai sizes can run small, so check the label.",idn:"Untuk baju dan sepatu. Ukuran Thailand cenderung kecil, jadi cek labelnya."},level:"polite"},{id:"try-on",cat:"shopping",en:"Can I try this on?",th:"ลองได้ไหม{Q}",rom:"long dai mai {Q}",idn:"Boleh dicoba?",ctx:{en:"Before buying clothes. Some night-market stalls do not allow trying on.",idn:"Tanyakan sebelum membeli baju. Beberapa lapak pasar malam tidak mengizinkan mencoba."},level:"polite"},{id:"discount",cat:"shopping",en:"Can you give a discount?",th:"ลดได้ไหม{Q}",rom:"lot dai mai {Q}",idn:"Bisa kurang harganya?",ctx:{en:"Bargaining is normal at markets such as Chatuchak, but not in malls, convenience stores or fixed-price shops.",idn:"Tawar-menawar wajar di pasar seperti Chatuchak, tapi tidak di mal, minimarket, atau toko harga pas."},level:"polite",note:{en:"Keep it friendly and smile. A small discount is common; pushing hard for deep cuts is considered rude.",idn:"Tetap ramah dan tersenyum. Diskon sedikit itu biasa; menawar terlalu sadis dianggap tidak sopan."}},{id:"too-expensive",cat:"shopping",en:"A bit too expensive",th:"แพงไปหน่อย{P}",rom:"phaeng pai noi {P}",idn:"Agak mahal, ya",ctx:{en:"A soft way to start bargaining or to politely decline.",idn:"Cara halus untuk mulai menawar atau menolak dengan sopan."},level:"polite"},{id:"cheaper",cat:"shopping",en:"Can it be cheaper?",th:"ถูกกว่านี้ได้ไหม{Q}",rom:"thook gwa nee dai mai {Q}",idn:"Bisa lebih murah?",ctx:{en:'Second step in bargaining after "phaeng pai noi".',idn:'Langkah tawar-menawar kedua setelah "phaeng pai noi".'},level:"polite"},{id:"just-looking",cat:"shopping",en:"Just looking",th:"ขอดูเฉยๆ{P}",rom:"khor doo choei-choei {P}",idn:"Lihat-lihat dulu, ya",ctx:{en:"When staff follow you around or a vendor invites you in. Smile and say it.",idn:"Saat staf terus mengikutimu atau pedagang menawarimu mampir. Ucapkan sambil tersenyum."},level:"polite"},{id:"no-bag",cat:"shopping",en:"No bag needed",th:"ไม่เอาถุง{P}",rom:"mai ao thung {P}",idn:"Tidak perlu kantong",ctx:{en:"At 7-Eleven and shops. Plastic bags are being phased out in many stores, so carry a small tote.",idn:"Di 7-Eleven dan toko. Banyak toko mulai mengurangi kantong plastik, jadi bawa tas kecil sendiri."},level:"polite"},{id:"heat-it-up",cat:"shopping",en:"Please heat it up",th:"อุ่นให้หน่อย{P}",rom:"un hai noi {P}",idn:"Tolong dipanaskan",ctx:{en:"At convenience stores with microwaves for rice boxes, sandwiches and toasted buns.",idn:"Di minimarket yang punya microwave, untuk nasi kotak, sandwich, dan roti panggang."},level:"polite"},{id:"receipt",cat:"shopping",en:"Receipt, please",th:"ขอใบเสร็จ{P}",rom:"khor bai-set {P}",idn:"Minta struknya",ctx:{en:"Keep receipts for returns and expense reports.",idn:"Simpan struk untuk penukaran/pengembalian barang dan laporan pengeluaran."},level:"polite"},{id:"tax-refund",cat:"shopping",en:"Tourist tax refund (VAT refund), please",th:"ขอคืนภาษีสำหรับนักท่องเที่ยวได้ไหม{Q}",rom:"khor khuen pha-see sam-rap nak thong-thiao dai mai {Q}",idn:"Bisa VAT refund untuk turis?",ctx:{en:"Ask at the register of participating stores before paying. Bring your passport and ask for the refund paperwork and the tax invoice.",idn:"Tanyakan di kasir toko peserta sebelum membayar. Bawa paspor dan minta dokumen refund serta faktur pajak."},level:"polite",note:{en:"Rules, minimum spend and eligible stores change, so check the current conditions at the shop and the official tourist VAT refund information.",idn:"Aturan, minimal belanja, dan toko peserta bisa berubah, jadi cek ketentuan terbaru di toko dan di informasi resmi VAT refund untuk turis."}},{id:"deliver-to-hotel",cat:"shopping",en:"Can you deliver to the hotel?",th:"ส่งไปที่โรงแรมได้ไหม{Q}",rom:"song pai thee rong-raem dai mai {Q}",idn:"Bisa dikirim ke hotel?",ctx:{en:"For large or heavy purchases, or when ordering a lot of items for a group.",idn:"Untuk barang besar atau berat, atau saat belanja banyak untuk rombongan."},level:"polite"},{id:"where-is-bts",cat:"transport",en:"Where is the BTS station?",th:"สถานีบีทีเอสอยู่ที่ไหน{Q}",rom:"sa-tha-nee bee-tee-es yoo thee-nai {Q}",idn:"Stasiun BTS di mana?",ctx:{en:'Ask passers-by, shop staff or security guards. Replace "BTS" with "MRT" for the subway.',idn:'Tanyakan ke orang lewat, staf toko, atau satpam. Ganti "BTS" dengan "MRT" untuk kereta bawah tanah.'},level:"polite"},{id:"where-is-toilet",cat:"transport",en:"Where is the toilet?",th:"ห้องน้ำอยู่ที่ไหน{Q}",rom:"hong-nam yoo thee-nai {Q}",idn:"Toilet di mana?",ctx:{en:"In malls, stations and restaurants. Public toilets can charge a few baht.",idn:"Di mal, stasiun, dan restoran. Toilet umum kadang bayar beberapa baht."},level:"polite"},{id:"stop-here",cat:"transport",en:"Please stop here",th:"จอดตรงนี้ได้เลย{P}",rom:"jot trong-nee dai loei {P}",idn:"Berhenti di sini, ya",ctx:{en:"In a taxi or Grab when you reach your drop-off spot.",idn:"Di taksi atau Grab saat sudah sampai titik turun."},level:"polite"},{id:"get-off-here",cat:"transport",en:"I’ll get off here",th:"ขอลงตรงนี้{P}",rom:"khor long trong-nee {P}",idn:"Saya turun di sini",ctx:{en:"On a bus, boat or motorbike taxi. On buses, press the bell or tell the conductor.",idn:"Di bus, perahu, atau ojek. Di bus, tekan bel atau bilang ke kondektur."},level:"polite"},{id:"use-meter",cat:"transport",en:"Please use the meter",th:"เปิดมิเตอร์ด้วย{P}",rom:"poet mi-ter duai {P}",idn:"Tolong nyalakan argo",ctx:{en:"As you get in a street taxi. If the driver refuses, step out and flag another. Grab is the easy fixed-price alternative.",idn:"Ucapkan saat naik taksi di jalan. Kalau sopir menolak, turun dan cari taksi lain. Grab jadi alternatif mudah dengan tarif pasti."},level:"polite"},{id:"turn-left",cat:"transport",en:"Turn left",th:"เลี้ยวซ้าย{P}",rom:"liao saai {P}",idn:"Belok kiri",ctx:{en:"Directions to a driver or when guiding someone.",idn:"Memberi arah ke sopir atau saat memandu seseorang."},level:"polite"},{id:"turn-right",cat:"transport",en:"Turn right",th:"เลี้ยวขวา{P}",rom:"liao khwa {P}",idn:"Belok kanan",ctx:{en:"Directions to a driver or when guiding someone.",idn:"Memberi arah ke sopir atau saat memandu seseorang."},level:"polite"},{id:"go-straight",cat:"transport",en:"Go straight",th:"ตรงไป{P}",rom:"trong pai {P}",idn:"Lurus terus",ctx:{en:"Directions in a car or when someone asks you the way.",idn:"Memberi arah di mobil atau saat ada yang bertanya jalan."},level:"polite"},{id:"how-far",cat:"transport",en:"Is it far?",th:"ไกลไหม{Q}",rom:"glai mai {Q}",idn:"Jauh?",ctx:{en:"Asking whether a place is walkable or how far a destination is.",idn:"Menanyakan apakah tempatnya bisa dijangkau jalan kaki atau seberapa jauh tujuannya."},level:"polite"},{id:"how-long",cat:"transport",en:"How long does it take?",th:"ใช้เวลานานเท่าไหร่{Q}",rom:"chai we-la nan tao-rai {Q}",idn:"Berapa lama?",ctx:{en:"When you are planning arrival times. Bangkok traffic varies a lot by hour, so add buffer time.",idn:"Saat merencanakan waktu tiba. Lalu lintas Bangkok sangat bervariasi tergantung jam, jadi sisihkan waktu cadangan."},level:"polite"},{id:"go-to-airport",cat:"transport",en:"To Suvarnabhumi Airport, please",th:"ไปสนามบินสุวรรณภูมิ{P}",rom:"pai sa-nam-bin su-wan-na-phoom {P}",idn:"Ke Bandara Suvarnabhumi, ya",ctx:{en:'Tell a taxi or Grab driver your destination. For Don Mueang say "sa-nam-bin don-mueang".',idn:'Sebutkan tujuanmu ke sopir taksi atau Grab. Untuk Don Mueang, bilang "sa-nam-bin don-mueang".'},level:"polite"},{id:"can-you-go-to",cat:"transport",en:"Can you go to Siam Paragon?",th:"ไปสยามพารากอนได้ไหม{Q}",rom:"pai sa-yam pa-ra-gon dai mai {Q}",idn:"Bisa ke Siam Paragon?",ctx:{en:"Ask before you get in a street taxi. Swap in any place name. Drivers sometimes refuse short or jammed trips.",idn:"Tanyakan sebelum naik taksi di jalan. Ganti saja nama tempatnya. Sopir kadang menolak perjalanan dekat atau yang macet."},level:"polite"},{id:"wait-a-moment",cat:"transport",en:"Please wait a moment",th:"รอสักครู่นะ{P}",rom:"ro sak-khroo na {P}",idn:"Tunggu sebentar, ya",ctx:{en:"Asking a driver to wait while you drop something off or run into a shop.",idn:"Minta sopir menunggu saat kamu menaruh barang atau mampir sebentar ke toko."},level:"polite"},{id:"slow-down",cat:"transport",en:"Please slow down",th:"ช้าลงหน่อย{P}",rom:"chaa long noi {P}",idn:"Pelan-pelan sedikit, ya",ctx:{en:"On a motorbike taxi or in a car when the driver is going too fast.",idn:"Di ojek atau mobil saat sopirnya ngebut."},level:"polite"},{id:"which-train",cat:"transport",en:"Does this train go to Siam?",th:"รถไฟฟ้าขบวนนี้ไปสยามไหม{Q}",rom:"rot-fai-fa kha-buan nee pai sa-yam mai {Q}",idn:"Kereta ini ke Siam?",ctx:{en:"On BTS/MRT platforms when you are unsure about direction. Check the sign for the final station of the line, too.",idn:"Di peron BTS/MRT saat ragu arah. Cek juga papan nama stasiun terakhir di jalur itu."},level:"polite"},{id:"use-expressway",cat:"transport",en:"Can we take the expressway?",th:"ขึ้นทางด่วนได้ไหม{Q}",rom:"khuen thang-duan dai mai {Q}",idn:"Boleh lewat tol?",ctx:{en:"When you are in a hurry. The toll is paid by the passenger on top of the fare.",idn:"Saat terburu-buru. Biaya tol dibayar penumpang di luar tarif."},level:"polite"},{id:"check-in",cat:"hotel",en:"I’d like to check in",th:"ขอเช็กอิน{P}",rom:"khor chek-in {P}",idn:"Saya mau check-in",ctx:{en:"At the front desk. Keep your passport handy, since hotels ask for it.",idn:"Di meja resepsionis. Siapkan paspor karena hotel akan memintanya."},level:"polite"},{id:"check-out",cat:"hotel",en:"I’d like to check out",th:"ขอเช็กเอาต์{P}",rom:"khor chek-out {P}",idn:"Saya mau check-out",ctx:{en:"At the front desk when leaving. Ask them to check the minibar and keep your receipt.",idn:"Di resepsionis saat pergi. Minta mereka mengecek minibar dan simpan struknya."},level:"polite"},{id:"laundry",cat:"hotel",en:"I’d like to send laundry",th:"ขอส่งซักผ้า{P}",rom:"khor song sak pha {P}",idn:"Saya mau pakai layanan laundry",ctx:{en:"Hotel laundry can be pricey per item. Ask for the price list or use a nearby coin or self-service laundry for training clothes.",idn:"Laundry hotel bisa mahal per potong. Minta daftar harganya, atau pakai laundry koin/self-service terdekat untuk baju latihan."},level:"polite"},{id:"room-cleaning",cat:"hotel",en:"Please clean the room",th:"ช่วยทำความสะอาดห้องให้หน่อย{P}",rom:"chuai tham khwam sa-at hong hai noi {P}",idn:"Tolong bersihkan kamar",ctx:{en:"Call the front desk or tell housekeeping when you leave for the day.",idn:"Telepon resepsionis atau bilang ke housekeeping saat kamu keluar."},level:"polite"},{id:"lost-room-key",cat:"hotel",en:"I lost my room key",th:"กุญแจห้องหาย{P}",rom:"kun-jae hong hai {P}",idn:"Kunci kamar saya hilang",ctx:{en:"At the front desk. They will usually reissue a key card after checking your ID.",idn:"Di resepsionis. Biasanya mereka akan menerbitkan ulang kartu kunci setelah mengecek identitasmu."},level:"polite"},{id:"extra-towels",cat:"hotel",en:"Extra towels, please",th:"ขอผ้าเช็ดตัวเพิ่ม{P}",rom:"khor pha-chet-tua phoem {P}",idn:"Minta handuk tambahan",ctx:{en:"By phone to housekeeping or at the front desk.",idn:"Lewat telepon ke housekeeping atau di resepsionis."},level:"polite"},{id:"late-checkout",cat:"hotel",en:"Can I check out late?",th:"ขอเช็กเอาต์สายได้ไหม{Q}",rom:"khor chek-out sai dai mai {Q}",idn:"Boleh late check-out?",ctx:{en:"Ask the evening before. Late check-out may be free or charged by the hour.",idn:"Tanyakan malam sebelumnya. Late check-out bisa gratis atau dikenai biaya per jam."},level:"polite"},{id:"wifi-password",cat:"hotel",en:"What is the Wi-Fi password?",th:"รหัสไวไฟคืออะไร{Q}",rom:"ra-hat wai-fai khue a-rai {Q}",idn:"Kata sandi Wi-Fi-nya apa?",ctx:{en:"At hotels, cafes and restaurants. It is often on the receipt or a sign.",idn:"Di hotel, kafe, dan restoran. Sering tertulis di struk atau papan informasi."},level:"polite"},{id:"luggage-storage",cat:"hotel",en:"Can you store my luggage?",th:"ฝากกระเป๋าได้ไหม{Q}",rom:"fak kra-pao dai mai {Q}",idn:"Boleh titip tas?",ctx:{en:"Before check-in or after check-out. Ask the front desk about their policy.",idn:"Sebelum check-in atau setelah check-out. Tanyakan aturannya ke resepsionis."},level:"polite"},{id:"aircon-not-cold",cat:"hotel",en:"The air conditioner isn’t cold",th:"แอร์ไม่เย็น{P}",rom:"air mai yen {P}",idn:"AC-nya tidak dingin",ctx:{en:"Report it to the front desk. In Bangkok heat a working aircon matters, so ask them to check or change rooms.",idn:"Laporkan ke resepsionis. Di panasnya Bangkok, AC yang berfungsi itu penting, jadi minta dicek atau pindah kamar."},level:"polite"},{id:"breakfast-time",cat:"hotel",en:"What time does breakfast start?",th:"อาหารเช้าเริ่มกี่โมง{Q}",rom:"a-han chao roem gee mong {Q}",idn:"Sarapan mulai jam berapa?",ctx:{en:"At check-in or at the restaurant entrance.",idn:"Saat check-in atau di pintu masuk restoran."},level:"polite"},{id:"call-taxi",cat:"hotel",en:"Please call a taxi for me",th:"ช่วยเรียกแท็กซี่ให้หน่อย{P}",rom:"chuai riak thaek-see hai noi {P}",idn:"Tolong panggilkan taksi",ctx:{en:"At the front desk. Ask them to write the destination in Thai for the driver.",idn:"Di resepsionis. Minta mereka menuliskan tujuanmu dalam bahasa Thailand untuk sopir."},level:"polite"},{id:"help",cat:"emergency",en:"Help!",th:"ช่วยด้วย{P}",rom:"chuai duai {P}",idn:"Tolong!",ctx:{en:"In danger or a serious situation. Say it loudly. Thai emergency calls: police 191, ambulance 1669, tourist police 1155.",idn:"Saat dalam bahaya atau situasi serius. Teriakkan dengan keras. Nomor darurat Thailand: polisi 191, ambulans 1669, Polisi Pariwisata 1155."},level:"neutral"},{id:"call-ambulance",cat:"emergency",en:"Call an ambulance",th:"เรียกรถพยาบาลด้วย{P}",rom:"riak rot pha-ya-baan duai {P}",idn:"Tolong panggil ambulans",ctx:{en:"Ask a bystander or staff to call, or dial 1669 yourself.",idn:"Minta orang sekitar atau staf untuk menelepon, atau hubungi 1669 sendiri."},level:"neutral"},{id:"go-to-hospital",cat:"emergency",en:"Please take me to the hospital",th:"ขอไปโรงพยาบาลหน่อย{P}",rom:"khor pai rong-pha-ya-baan noi {P}",idn:"Tolong antar ke rumah sakit",ctx:{en:"Tell a taxi/Grab driver. Show the hospital name on your phone map for speed.",idn:"Sampaikan ke sopir taksi/Grab. Tunjukkan nama rumah sakit di peta HP supaya cepat."},level:"polite"},{id:"call-police",cat:"emergency",en:"Call the police",th:"เรียกตำรวจด้วย{P}",rom:"riak tam-ruat duai {P}",idn:"Tolong panggil polisi",ctx:{en:"For theft, accidents or threats. Dial 191, or the tourist police on 1155 (English-speaking).",idn:"Untuk pencurian, kecelakaan, atau ancaman. Hubungi 191, atau Polisi Pariwisata di 1155 (bisa berbahasa Inggris)."},level:"neutral"},{id:"allergy-peanut",cat:"emergency",en:"I’m allergic to peanuts",th:"แพ้ถั่วลิสง{P}",rom:"phae thua li-song {P}",idn:"Saya alergi kacang tanah",ctx:{en:'Say it clearly before ordering. For other allergens, replace "thua li-song" with the item, then ask staff to confirm.',idn:'Sampaikan dengan jelas sebelum memesan. Untuk alergi lain, ganti "thua li-song" dengan bahan tersebut, lalu minta staf memastikan.'},level:"polite",note:{en:"This is a real-allergy phrase, not a taste preference. Cross-contamination in wok kitchens is common, so also show the phrase on your phone.",idn:"Ini kalimat untuk alergi sungguhan, bukan soal selera. Kontaminasi silang sering terjadi di dapur wajan, jadi tunjukkan juga kalimatnya di ponselmu."}},{id:"allergy-seafood",cat:"emergency",en:"I’m allergic to seafood",th:"แพ้อาหารทะเล{P}",rom:"phae a-han tha-le {P}",idn:"Saya alergi makanan laut",ctx:{en:"Covers shrimp, crab, squid and shellfish. Fish sauce and shrimp paste are hidden in many dishes.",idn:"Termasuk udang, kepiting, cumi, dan kerang. Kecap ikan dan terasi udang tersembunyi di banyak masakan."},level:"polite"},{id:"lost-way",cat:"emergency",en:"I’m lost",th:"หลงทาง{P}",rom:"long thang {P}",idn:"Saya tersesat",ctx:{en:"Ask staff, police or a shopkeeper for help. Show your hotel name on the phone.",idn:"Minta tolong ke staf, polisi, atau pemilik toko. Tunjukkan nama hotelmu di ponsel."},level:"polite"},{id:"lost-wallet",cat:"emergency",en:"I lost my wallet",th:"กระเป๋าสตางค์หาย{P}",rom:"kra-pao sa-tang hai {P}",idn:"Dompet saya hilang",ctx:{en:"Tell the police or tourist police and block your cards at once.",idn:"Lapor ke polisi atau Polisi Pariwisata, dan langsung blokir kartumu."},level:"polite"},{id:"lost-passport",cat:"emergency",en:"I lost my passport",th:"พาสปอร์ตหาย{P}",rom:"pat-sa-pot hai {P}",idn:"Paspor saya hilang",ctx:{en:"Report to the tourist police for a police report, then contact your embassy. Keep a photo of your passport on your phone.",idn:"Lapor ke Polisi Pariwisata untuk dapat surat keterangan kehilangan, lalu hubungi kedutaan. Simpan foto paspormu di ponsel."},level:"polite"},{id:"thief",cat:"emergency",en:"Thief!",th:"มีขโมย{P}",rom:"mee kha-moy {P}",idn:"Ada pencuri!",ctx:{en:"If someone snatches a bag or phone. Shout it so people nearby react.",idn:"Kalau tas atau ponselmu dijambret, teriakkan ini supaya orang di sekitar sadar."},level:"neutral"},{id:"fire",cat:"emergency",en:"Fire!",th:"ไฟไหม้{P}",rom:"fai mai {P}",idn:"Kebakaran!",ctx:{en:"Shout it, leave the building and call 199 for the fire service.",idn:"Teriakkan dengan keras, keluar dari gedung, lalu telepon pemadam kebakaran di 199."},level:"neutral"},{id:"feel-sick",cat:"emergency",en:"I feel sick",th:"รู้สึกไม่สบาย{P}",rom:"roo-suek mai sa-bai {P}",idn:"Saya merasa nggak enak badan",ctx:{en:'To staff, a teammate or a pharmacist. "mai sa-bai" means unwell; it is the opposite of "sa-bai dee".',idn:'Dipakai ke staf, rekan tim, atau apoteker. "mai sa-bai" artinya "nggak enak badan", kebalikan dari "sa-bai dee".'},level:"polite"},{id:"need-doctor",cat:"emergency",en:"I need to see a doctor",th:"ขอพบหมอหน่อย{P}",rom:"khor phop mor noi {P}",idn:"Saya perlu ke dokter",ctx:{en:"At a clinic, hospital or hotel front desk. Many hotels can call a doctor to the room.",idn:"Ucapkan di rumah sakit, klinik, atau resepsionis hotel. Banyak hotel bisa memanggil dokter ke kamar."},level:"polite"},{id:"stomach-ache",cat:"emergency",en:"I have a stomach ache",th:"ปวดท้อง{P}",rom:"puat thong {P}",idn:"Perut saya sakit",ctx:{en:"Common with spicy or street food. Pharmacies can help with mild cases.",idn:"Sering terjadi karena makanan pedas atau jajanan kaki lima. Untuk gejala ringan, apotek bisa membantu."},level:"polite"},{id:"have-fever",cat:"emergency",en:"I have a fever",th:"มีไข้{P}",rom:"mee khai {P}",idn:"Saya demam",ctx:{en:"To a doctor or pharmacist. Dengue is present in Thailand, so see a doctor if fever persists.",idn:"Bilang ke dokter atau apoteker. Di Thailand ada demam berdarah, jadi periksa ke dokter kalau demamnya nggak turun."},level:"polite"},{id:"where-pharmacy",cat:"emergency",en:"Where is a pharmacy?",th:"ร้านขายยาอยู่ที่ไหน{Q}",rom:"ran khai ya yoo thee-nai {Q}",idn:"Apotek di mana?",ctx:{en:"Pharmacies are everywhere and pharmacists can recommend remedies for mild issues.",idn:"Apotek ada di mana-mana, dan apotekernya bisa merekomendasikan obat untuk keluhan ringan."},level:"polite"},{id:"call-embassy",cat:"emergency",en:"Please call the Indonesian embassy",th:"ช่วยโทรหาสถานทูตอินโดนีเซียให้หน่อย{P}",rom:"chuai tho ha sa-than-thoot in-do-nee-sia hai noi {P}",idn:"Tolong telepon Kedutaan Besar Indonesia",ctx:{en:"For passport loss, arrests or serious accidents. Ask police or hotel staff to help you place the call.",idn:"Untuk paspor hilang, penangkapan, atau kecelakaan serius. Minta polisi atau staf hotel membantu menyambungkan teleponnya."},level:"polite"},{id:"slang-555",cat:"slang",en:"555 (LOL)",th:"555",rom:"ha ha ha (five-five-five)",idn:"wkwkwk",ctx:{en:'Texting laughter. Thai for 5 is "ha", so 555 reads "ha ha ha". More 5s means a bigger laugh.',idn:'Cara menulis tawa di chat. Angka 5 dalam bahasa Thai dibaca "ha", jadi 555 dibaca "ha ha ha". Makin banyak angka 5, makin ngakak.'},level:"casual",note:{en:"Same job as Indonesian \"wkwk\". Fine in chats with friends and teammates, but you would skip it in formal emails.",idn:'Fungsinya sama seperti "wkwk" di Indonesia. Oke di chat dengan teman dan rekan tim, tapi jangan dipakai di email resmi.'}},{id:"slang-jueng",cat:"slang",en:"Wow! Stunning / so impressive",th:"จึ้ง",rom:"jueng",idn:"Gila! / Keren banget",ctx:{en:'Reaction to something eye-catching: a dazzling outfit, a perfect play, a stunning view. Often "jueng mak" (so jueng).',idn:'Dipakai saat bereaksi pada sesuatu yang mencolok: outfit memukau, permainan sempurna, atau pemandangan keren. Sering juga "jueng mak" (keren banget).'},level:"slang",note:{en:"Trendy online slang among young people. Not used in formal speech, and it may sound odd to older people.",idn:"Bahasa gaul online anak muda. Nggak dipakai di situasi resmi, dan bisa terdengar aneh bagi orang yang lebih tua."}},{id:"slang-khot-di",cat:"slang",en:"Super good / insanely good",th:"โคตรดี",rom:"khot dee",idn:"Mantap parah / Bagus banget",ctx:{en:'Strong praise among friends. "khot" is an intensifier meaning "extremely" and can be put before other words, like khot a-roi.',idn:'Pujian kuat antarteman. "khot" adalah penguat yang berarti "banget" dan bisa ditaruh di depan kata lain, misalnya "khot a-roi" (enak banget).'},level:"slang",note:{en:'"khot" comes from a rude word, so keep it to friends, never to elders, staff, or clients. Think of Indonesian slang like "anjir" used as an intensifier: casual, can sound crude.',idn:'"khot" berasal dari kata kasar, jadi pakai hanya dengan teman. Jangan ke orang yang lebih tua, staf, atau klien. Mirip "anjir" yang dipakai sebagai penguat di Indonesia: santai, tapi bisa terdengar kasar.'}},{id:"slang-tueng",cat:"slang",en:"Intense / awesome (impressively strong)",th:"ตึง",rom:"tueng",idn:"Gila / Jago parah (skill-nya luar biasa)",ctx:{en:'Used by young people and gamers when something or someone is impressively strong, intense or cool. Often "tueng mak".',idn:'Dipakai anak muda dan gamer saat seseorang atau sesuatu terlihat kuat, intens, atau keren banget. Sering juga "tueng mak".'},level:"slang",note:{en:"Casual slang for friends and online chat. Tone is hype and playful. Not for formal talk.",idn:"Bahasa gaul untuk teman dan chat online. Nadanya heboh dan iseng, jadi jangan dipakai di situasi resmi."}},{id:"slang-sut-jat",cat:"slang",en:"Absolutely the best / over the top",th:"สุดจัด",rom:"sut jat",idn:"Mantap jiwa / Juara",ctx:{en:'Praising something that reaches the max: food, a performance, a party. Often "sut jat sut jat".',idn:'Pujian untuk sesuatu yang levelnya maksimal: makanan, penampilan, atau pesta. Sering diulang jadi "sut jat sut jat".'},level:"slang",note:{en:"Fun, energetic and casual. Fine with friends and in posts; skip it in formal situations.",idn:"Ungkapan santai yang seru dan penuh energi. Cocok dengan teman dan di postingan medsos, hindari di situasi resmi."}},{id:"slang-mai-wai-laeo",cat:"slang",en:"I can’t take it anymore (so funny / so cute / so tired)",th:"ไม่ไหวแล้ว",rom:"mai wai laeo",idn:"Nggak kuat / Nyerah (karena lucu, gemas, atau capek)",ctx:{en:'Literally "can’t cope any more". Used when you are laughing too hard, overwhelmed by cuteness, or truly worn out. Meaning comes from the context.',idn:'Arti harfiahnya "udah nggak sanggup lagi". Dipakai saat ngakak parah, gemas banget, atau benar-benar capek. Artinya tergantung konteks.'},level:"casual",note:{en:"Everyday casual Thai. Add khrap/kha when speaking to someone you are not close to.",idn:'Bahasa sehari-hari yang santai. Ke orang yang belum akrab, tambahkan akhiran sopan "khrap/kha".'}},{id:"slang-pang",cat:"slang",en:"Awesome / spot on / killer",th:"ปัง",rom:"pang",idn:"Pecah! / Keren abis",ctx:{en:'Praise for outfits, looks, results, ideas or performances that turned out great. Often "pang mak".',idn:'Pujian untuk outfit, penampilan, hasil, ide, atau pertunjukan yang hasilnya keren. Sering juga "pang mak".'},level:"slang",note:{en:'Safe, friendly slang. Common even in the media. Like Indonesian "pecah!".',idn:'Bahasa gaul yang aman dan ramah. Sering muncul di media juga. Mirip "pecah!" dalam bahasa gaul Indonesia.'}},{id:"slang-saep",cat:"slang",en:"Delicious (and often spicy)",th:"แซ่บ",rom:"saep",idn:"Enak (biasanya yang pedas)",ctx:{en:"An Isan (northeastern) word for tasty, very popular nationwide. Used for som tam, larb and spicy street food.",idn:'Kata dari daerah Isan (timur laut) yang berarti "enak", populer di seluruh Thailand. Banyak dipakai untuk som tam, larb, dan jajanan pedas.'},level:"casual",note:{en:'Friendly and fun. Vendors love hearing it. Compare Indonesian "enak" with a "nendang" spicy kick.',idn:'Ungkapan ramah dan seru yang disukai pedagang. Rasanya seperti "enak" plus sedikit "nendang" pedasnya.'}},{id:"slang-chill",cat:"slang",en:"Chill / relaxed",th:"ชิล",rom:"chill (chin)",idn:"Santai / Selow",ctx:{en:'Borrowed from English "chill". Said "chin chin" in Thai, it means taking it easy; a chill cafe is a relaxed one.',idn:'Diambil dari bahasa Inggris "chill". Dalam bahasa Thai diucapkan "chin chin" dan artinya santai menikmati suasana. "Chill cafe" berarti kafe yang suasananya santai.'},level:"casual"},{id:"slang-hiu-jang",cat:"slang",en:"I’m so hungry!",th:"หิวจัง",rom:"hiu jang",idn:"Lapar banget",ctx:{en:'Casual complaint among friends before a meal. "jang" adds feeling, like "so" in English.',idn:'Keluhan santai antarteman sebelum makan. "jang" menambah rasa, mirip "banget".'},level:"casual",note:{en:'Fine with friends and teammates. To staff say polite "hiu khao" (hungry) or just order food.',idn:'Oke dipakai ke teman atau rekan tim. Ke staf, cukup bilang "hiu khao" (saya lapar) yang lebih sopan, atau langsung pesan saja.'}},{id:"slang-kreng-jai",cat:"slang",en:"Kreng jai (hesitating to impose on others)",th:"เกรงใจ",rom:"kreng jai",idn:"Sungkan, nggak mau merepotkan",ctx:{en:'A key Thai value: you do not want to trouble, burden or embarrass someone. A Thai person may say "kreng jai" when declining your help or an offer.',idn:'Nilai inti budaya Thai: perasaan nggak mau merepotkan, membebani, atau mempermalukan orang lain. Orang Thai bisa bilang "kreng jai" saat menolak bantuan atau tawaranmu.'},level:"neutral",note:{en:"It is hard to translate. It is like Indonesian \"sungkan\" / \"nggak enakan\". If a Thai person says kreng jai, offer once more kindly.",idn:'Susah diterjemahkan, tapi sangat mirip "sungkan" atau "nggak enakan" dalam budaya Indonesia. Kalau seseorang bilang kreng jai, tawarkan sekali lagi dengan ramah.'}},{id:"slang-wer",cat:"slang",en:"Exaggerating / over the top",th:"เว่อร์",rom:"wer",idn:"Lebay / Berlebihan",ctx:{en:'Said about something exaggerated or too much, e.g. a huge reaction or an over-decorated post. Often "wer mak".',idn:'Dipakai untuk sesuatu yang dilebih-lebihkan, misalnya reaksi heboh atau postingan yang terlalu dihias. Sering juga "wer mak".'},level:"casual",note:{en:"Casual and teasing. Use only with friends, since it can sound critical.",idn:"Dipakai untuk meledek antarteman. Bisa terdengar seperti kritik, jadi pakai hanya dengan yang akrab."}},{id:"slang-ao-laeo",cat:"slang",en:"Uh-oh / here we go",th:"เอาแล้ว",rom:"ao laeo",idn:"Waduh, gawat / Tuh kan, kejadian",ctx:{en:"Reaction when something is about to go wrong or when an expected problem appears, often with a laugh.",idn:"Reaksi saat sesuatu mau berantakan atau masalah yang sudah diduga akhirnya muncul, biasanya sambil tertawa."},level:"casual"},{id:"slang-mua",cat:"slang",en:"Making it up / messing up / nonsense",th:"มั่ว",rom:"mua",idn:"Asal-asalan / Ngawur",ctx:{en:'When someone guesses randomly, answers carelessly, or is inaccurate. "Phoot mua" = talking nonsense.',idn:'Dipakai saat seseorang menebak asal, menjawab sembarangan, atau nggak akurat. "Phoot mua" artinya "ngomong ngawur".'},level:"casual",note:{en:"Fine among friends but can sound critical or rude if said about someone’s work or words.",idn:"Oke antarteman, tapi kalau dipakai untuk hasil kerja atau omongan orang, bisa terdengar mengkritik dan nggak sopan."}},{id:"slang-ngong",cat:"slang",en:"Confused / I don’t get it",th:"งง",rom:"ngong",idn:"Bingung / Nggak ngerti",ctx:{en:'Used by almost everyone for being puzzled: "ngong mak" = totally confused.',idn:'Dipakai hampir semua generasi saat bingung atau nggak paham. "ngong mak" artinya "bingung banget".'},level:"casual"},{id:"slang-seng",cat:"slang",en:"Bummed / bored",th:"เซ็ง",rom:"seng",idn:"Bete / Bosan",ctx:{en:"When plans fall through, you are bored, or something is disappointing.",idn:"Dipakai saat rencana batal, lagi bosan, atau sesuatu mengecewakan."},level:"casual"},{id:"slang-fin",cat:"slang",en:"So satisfying / blissful",th:"ฟิน",rom:"fin",idn:"Bahagia banget / Puas banget",ctx:{en:"The feeling of blissful satisfaction: a cold drink on a hot day, a perfect massage, a great fan moment.",idn:"Rasa puas yang bikin bahagia: minuman dingin di hari panas, pijat yang pas, atau momen bahagia sebagai fans."},level:"casual"},{id:"slang-su-su",cat:"slang",en:"You can do it! / Keep fighting!",th:"สู้ๆ",rom:"soo soo",idn:"Semangat!",ctx:{en:"Encouragement before a match, an exam or hard work. Great to say to teammates.",idn:"Penyemangat sebelum pertandingan, ujian, atau kerja berat. Cocok diucapkan ke rekan tim."},level:"casual",note:{en:'Exactly like Indonesian "Semangat!". Add khrap/kha to make it more polite: soo soo khrap/kha.',idn:'Hampir sama persis dengan "Semangat!". Supaya lebih sopan, tambahkan di akhir: "soo soo khrap/kha".'}},{id:"caution-mueng-goo",cat:"slang",en:"มึง / กู (rude “you” / “I”)",th:"มึง / กู",rom:"mueng / goo",idn:"Kau / aku (sangat kasar, nyaris makian)",ctx:{en:"Heard among very close friends and in movies or games. These are coarse pronouns for “you” and “I”.",idn:'Kata ganti kasar untuk "kamu" dan "aku" yang terdengar di antara teman yang sangat akrab, atau di film dan game.'},level:"caution",note:{en:'NEVER use these with staff, elders, strangers or clients. They sound aggressive and insulting. Stay with polite endings (khrap/kha) and "khun" for “you”.',idn:'JANGAN pernah pakai ke staf, orang yang lebih tua, orang asing, atau klien. Terdengar agresif dan menghina. Tetap pakai akhiran sopan (khrap/kha) dan "khun" untuk "kamu".'}},{id:"caution-khwai",cat:"slang",en:"ควาย (calling someone stupid)",th:"ควาย",rom:"khwai",idn:"Bodoh (makian)",ctx:{en:'Literally "water buffalo". Used as an insult for “idiot”. You may hear it in jokes and gaming trash talk.',idn:'Arti aslinya "kerbau", dipakai sebagai makian "bodoh, tolol". Bisa kamu dengar dalam candaan atau trash talk saat main game.'},level:"caution",note:{en:"Offensive. Do not say it to anyone, even as a joke, unless you are very close friends and sure they will laugh. Never in public or toward staff.",idn:"Kata ini menghina. Jangan ucapkan ke siapa pun, bahkan bercanda, kecuali kalian sangat akrab dan kamu yakin dia akan tertawa. Jangan pernah di tempat umum atau ke staf."}},{id:"caution-ai-ee",cat:"slang",en:"ไอ้ / อี (insulting name prefixes)",th:"ไอ้ / อี",rom:"ai / ee",idn:"Si … (makian di depan nama/sebutan)",ctx:{en:'Placed before a name or noun: "ai" for men and "ee" for women. Between close friends it can be teasing, but with others it is an insult.',idn:'Ditaruh di depan nama atau kata benda: "ai" untuk laki-laki, "ee" untuk perempuan. Antarteman akrab bisa jadi ledekan, tapi ke orang lain itu hinaan.'},level:"caution",note:{en:'Avoid completely. It can start a fight if aimed at a stranger. Use "khun" (Mr/Ms) or "phi" (older sibling) + name for friendly respect.',idn:'Hindari sama sekali. Kalau ditujukan ke orang asing, bisa mem
