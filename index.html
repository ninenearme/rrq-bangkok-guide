icu perkelahian. Untuk menunjukkan hormat yang ramah, pakai "khun" (seperti Pak/Bu/Kak) atau "phi" (kakak) + nama.'}},{id:"team-deliver-lobby",cat:"team",en:"Please deliver to the lobby",th:"กรุณาส่งที่ล็อบบี้{P}",rom:"ga-roo-naa song thee lop-bee {P}",idn:"Tolong antar ke lobi",ctx:{en:"Tell a delivery rider or shop that the package, food or equipment should be dropped at the hotel lobby or reception.",idn:"Dipakai untuk minta kurir atau toko menitipkan paket, makanan, atau perlengkapan di lobi atau resepsionis hotel."},level:"polite"},{id:"team-package-for-me",cat:"team",en:"Is there a package for me?",th:"มีพัสดุมาส่งไหม{Q}",rom:"mee phat-sa-doo ma song mai {Q}",idn:"Ada paket untuk saya?",ctx:{en:"At the hotel front desk to check whether a delivery has arrived.",idn:"Dipakai di resepsionis hotel untuk mengecek apakah kiriman sudah sampai."},level:"polite"},{id:"team-receive-package",cat:"team",en:"Please receive the package for us",th:"ช่วยรับพัสดุให้หน่อย{P}",rom:"chuai rap phat-sa-doo hai noi {P}",idn:"Tolong terima paket untuk saya",ctx:{en:"Ask hotel staff to accept a delivery when nobody is in the room.",idn:"Dipakai untuk minta staf hotel menerima kiriman saat nggak ada orang di kamar."},level:"polite"},{id:"team-rooms-together",cat:"team",en:"Can we have rooms next to each other?",th:"ขอห้องติดกันได้ไหม{Q}",rom:"khor hong tit gan dai mai {Q}",idn:"Bisa minta kamar yang bersebelahan?",ctx:{en:"At check-in for a group. Hotels will try but cannot always guarantee it.",idn:"Dipakai saat check-in rombongan. Hotel akan berusaha, tapi nggak selalu bisa menjamin."},level:"polite"},{id:"team-extra-room",cat:"team",en:"Can you book an extra room?",th:"ช่วยจองห้องเพิ่มได้ไหม{Q}",rom:"chuai jong hong phoem dai mai {Q}",idn:"Bisa pesankan satu kamar tambahan?",ctx:{en:"When one more person or staff member joins and you need another room.",idn:"Dipakai saat ada satu orang lagi yang bergabung dan kamu butuh kamar tambahan."},level:"polite"},{id:"team-where-electronics",cat:"team",en:"Where can I buy computer equipment?",th:"ร้านขายอุปกรณ์คอมพิวเตอร์อยู่ที่ไหน{Q}",rom:"ran khai up-pa-gon kom-phiw-ter yoo thee-nai {Q}",idn:"Di mana saya bisa beli perlengkapan komputer?",ctx:{en:"When a keyboard, mouse or cable breaks. Ask hotel staff or shopping-mall information; IT malls are a common answer.",idn:"Kalau keyboard, mouse, atau kabel rusak, tanya staf hotel atau bagian informasi mal. Biasanya kamu akan diarahkan ke mal khusus IT."},level:"polite"},{id:"team-have-this-cable",cat:"team",en:"Do you have this charging cable?",th:"มีสายชาร์จแบบนี้ไหม{Q}",rom:"mee sai chaat baep nee mai {Q}",idn:"Ada kabel charger seperti ini?",ctx:{en:"Show the broken cable or a photo on your phone. Shops will usually bring the matching one.",idn:"Tunjukkan kabel yang rusak atau fotonya di ponsel. Biasanya mereka akan ambilkan yang cocok."},level:"polite"},{id:"team-multi-discount",cat:"team",en:"Can I get a discount if I buy several?",th:"ถ้าซื้อหลายชิ้นลดได้ไหม{Q}",rom:"tha sue lai chin lot dai mai {Q}",idn:"Kalau beli banyak, bisa dapat diskon?",ctx:{en:"When buying multiple items for a team. Works at markets and independent shops, rarely at fixed-price chains.",idn:"Dipakai saat beli beberapa barang untuk tim. Berhasil di pasar dan toko independen, tapi jarang di jaringan toko berharga pas."},level:"polite"},{id:"team-tax-invoice",cat:"team",en:"Tax invoice, please",th:"ขอใบกำกับภาษีด้วย{P}",rom:"khor bai gam-gap pha-see duai {P}",idn:"Tolong buatkan faktur pajak (tax invoice)",ctx:{en:"For company expense claims. Ask before paying; some shops need the company name and tax ID and cannot issue later.",idn:"Dipakai untuk klaim biaya kantor. Minta sebelum bayar. Perlu nama perusahaan dan nomor pajak, dan ada toko yang nggak bisa menerbitkannya belakangan."},level:"polite"},{id:"team-book-van",cat:"team",en:"I’d like to book a van for 8 people",th:"ต้องการจองรถตู้สำหรับแปดคน{P}",rom:"tong-gan jong rot-too sam-rap paet khon {P}",idn:"Saya mau pesan van untuk 8 orang",ctx:{en:"For a group transfer. Tell them the date, time, pickup point and number of bags too.",idn:"Untuk perjalanan rombongan. Sebutkan juga tanggal, jam, titik jemput, dan jumlah tas."},level:"polite"},{id:"team-van-price",cat:"team",en:"How much for the van?",th:"รถตู้ราคาเท่าไหร่{Q}",rom:"rot-too ra-kha tao-rai {Q}",idn:"Berapa harga sewa vannya?",ctx:{en:"Confirm the total price first, including tolls, waiting time and any extra charge.",idn:"Pastikan dulu total harganya, termasuk tol, waktu tunggu, dan biaya tambahan lain."},level:"polite"},{id:"team-driver-wait",cat:"team",en:"Can you wait for us a moment?",th:"ช่วยรอสักครู่ได้ไหม{Q}",rom:"chuai ro sak-khroo dai mai {Q}",idn:"Bisa tunggu sebentar?",ctx:{en:"Asking a driver to wait while the team loads equipment or finishes.",idn:"Dipakai untuk minta sopir menunggu selagi tim memuat perlengkapan atau menyelesaikan urusan."},level:"polite"},{id:"team-table-eight",cat:"team",en:"A table for eight, please",th:"ขอโต๊ะสำหรับแปดคน{P}",rom:"khor to sam-rap paet khon {P}",idn:"Meja untuk 8 orang, ya",ctx:{en:"For group meals. Large groups should call ahead or arrive off-peak.",idn:"Untuk makan rombongan. Grup besar sebaiknya telepon dulu atau datang di luar jam ramai."},level:"polite"},{id:"team-order-for-group",cat:"team",en:"I’d like to order food for ten people",th:"ขอสั่งอาหารสำหรับสิบคน{P}",rom:"khor sang a-han sam-rap sip khon {P}",idn:"Saya mau pesan makanan untuk 10 orang",ctx:{en:"For catering or a big delivery order. Ask for the cooking time, then confirm allergies or dietary needs.",idn:"Untuk katering atau pesan-antar dalam jumlah besar. Tanyakan lama memasaknya, lalu pastikan soal alergi atau kebutuhan makanan khusus."},level:"polite"},{id:"team-split-bill",cat:"team",en:"Can we split the bill?",th:"ขอแยกบิลได้ไหม{Q}",rom:"khor yaek bin dai mai {Q}",idn:"Bisa bayar terpisah?",ctx:{en:"When a group wants to pay separately. Some places do not split, so ask early.",idn:"Dipakai saat rombongan mau bayar masing-masing. Ada tempat yang nggak bisa pisah bill, jadi tanyakan dari awal."},level:"polite"},{id:"team-pay-together",cat:"team",en:"We’ll pay together",th:"จ่ายรวมกัน{P}",rom:"jai ruam gan {P}",idn:"Bayar sekalian, ya",ctx:{en:"One person pays the whole bill for the group.",idn:"Dipakai saat satu orang membayar seluruh tagihan rombongan."},level:"polite"},{id:"team-meet-lobby",cat:"team",en:"Let’s meet in the lobby at 10",th:"เจอกันที่ล็อบบี้ตอนสิบโมง{P}",rom:"jer gan thee lop-bee ton sip mong {P}",idn:"Ketemu di lobi jam 10, ya",ctx:{en:"Coordinating with local staff or drivers. Thai time words: 10 am = sip mong chao (10 morning).",idn:'Dipakai untuk janjian dengan staf lokal atau sopir. Cara menyebut jam dalam bahasa Thai: jam 10 pagi = "sip mong chao" (10 pagi).'},level:"polite"},{id:"team-on-my-way",cat:"team",en:"On my way",th:"กำลังไป{P}",rom:"gam-lang pai {P}",idn:"Saya lagi di jalan",ctx:{en:"A short update when you are heading to a meeting point.",idn:"Kabar singkat saat kamu sedang menuju titik temu."},level:"polite"},{id:"team-arrived",cat:"team",en:"I’ve arrived",th:"มาถึงแล้ว{P}",rom:"ma thueng laeo {P}",idn:"Saya sudah sampai",ctx:{en:"Message or call to a driver, host or teammate when you have reached the meeting point.",idn:"Dipakai lewat pesan atau telepon ke sopir, tuan rumah, atau rekan tim saat kamu sudah tiba di titik temu."},level:"polite"},{id:"team-sorry-late",cat:"team",en:"Sorry for being late",th:"ขอโทษที่มาช้า{P}",rom:"khor thot thee ma chaa {P}",idn:"Maaf saya terlambat",ctx:{en:"When you arrive after the agreed time. Bangkok traffic is a known cause, but a short apology is still polite.",idn:"Dipakai saat datang lewat dari waktu yang disepakati. Macetnya Bangkok memang terkenal, tapi minta maaf singkat tetap sopan."},level:"polite"},{id:"team-postpone",cat:"team",en:"Can we change the time?",th:"ขอเลื่อนเวลาได้ไหม{Q}",rom:"khor luean we-la dai mai {Q}",idn:"Boleh ganti jamnya?",ctx:{en:"Politely ask to move a pickup or booking. Give notice as early as possible.",idn:"Dipakai untuk minta dengan sopan agar jam jemput atau reservasi diubah. Kabari sedini mungkin."},level:"polite"}],Ta=[{id:"q-hello",phraseId:"hello",type:"meaning",q:{en:"What does this mean?",idn:"Apa artinya?"},th:"สวัสดี{P}",rom:"sa-wat-dee {P}",options:[{en:"Thank you",idn:"Terima kasih"},{en:"Hello",idn:"Halo"},{en:"I’m sorry",idn:"Maaf"},{en:"Delicious",idn:"Enak"}],answer:1,explain:{en:"Sa-wat-dee is hello (and goodbye). Add khrap (men) or kha (women) for politeness.",idn:'"Sa-wat-dee" artinya halo (juga dipakai saat berpisah). Supaya sopan, laki-laki menambahkan khrap, perempuan kha.'}},{id:"q-not-spicy",phraseId:"not-spicy",type:"meaning",q:{en:"What does this mean?",idn:"Apa artinya?"},th:"ไม่เผ็ด{P}",rom:"mai phet {P}",options:[{en:"Not spicy",idn:"Tidak pedas"},{en:"No ice",idn:"Tanpa es"},{en:"No pork",idn:"Tanpa babi"},{en:"Not sweet",idn:"Tidak manis"}],answer:0,explain:{en:'"Mai" means not, "phet" means spicy. Related phrases: mai sai nam-khaeng (no ice), mai sai moo (no pork).',idn:'"Mai" artinya "tidak", "phet" artinya "pedas". Tanpa es: "mai sai nam-khaeng", tanpa babi: "mai sai moo" (berguna juga kalau kamu cari makanan halal).'}},{id:"q-use-meter",phraseId:"use-meter",type:"situation",q:{en:"You get into a street taxi and the driver quotes a high fixed price. What do you say?",idn:"Kamu naik taksi yang distop di jalan, lalu sopirnya minta tarif borongan yang mahal. Apa yang kamu bilang?"},options:[{en:"Please stop here",idn:"Tolong berhenti di sini"},{en:"Turn left",idn:"Tolong belok kiri"},{en:"Is it far?",idn:"Jauh nggak?"},{en:"Please use the meter",idn:"Tolong pakai argo"}],answer:3,explain:{en:'"Poet mi-ter duai {P}" asks the driver to turn on the meter. If they refuse, politely get out and find another taxi, or use Grab.',idn:'"Poet mi-ter duai" artinya minta sopir menyalakan argo. Kalau dia menolak, turun dengan sopan lalu cari taksi lain atau pakai Grab.'}},{id:"q-how-much",phraseId:"how-much",type:"meaning",q:{en:"What does this mean?",idn:"Apa artinya?"},th:"อันนี้เท่าไหร่{Q}",rom:"an-nee tao-rai {Q}",options:[{en:"Where is this?",idn:"Ini di mana?"},{en:"Is this spicy?",idn:"Ini pedas?"},{en:"How much is this?",idn:"Ini berapa?"},{en:"Can I try this on?",idn:"Boleh saya coba ini?"}],answer:2,explain:{en:'"An-nee" = this one, "tao-rai" = how much. Point at the item while asking.',idn:'"An-nee" artinya "yang ini", "tao-rai" artinya "berapa". Tanyakan sambil menunjuk barangnya.'}},{id:"q-allergy",phraseId:"allergy-peanut",type:"situation",q:{en:"You have a true peanut allergy and are about to order pad thai. What should you say?",idn:"Kamu alergi kacang tanah dan mau pesan pad thai. Apa yang harus kamu bilang?"},options:[{en:"Delicious",idn:"Enak"},{en:"I’ll have this one",idn:"Saya pesan yang ini"},{en:"I’m allergic to peanuts",idn:"Saya alergi kacang tanah"},{en:"Extra rice, please",idn:"Tambah nasi, ya"}],answer:2,explain:{en:'"Phae thua li-song" means allergic to peanuts. Use "mai sai" (no adding) only for preferences, not for real allergies.',idn:'"Phae thua li-song" artinya alergi kacang tanah. "Mai sai" (jangan dimasukkan) hanya untuk selera; untuk alergi sungguhan, pakai "phae".'}},{id:"q-help",phraseId:"help",type:"meaning",q:{en:"What does this mean?",idn:"Apa artinya?"},th:"ช่วยด้วย{P}",rom:"chuai duai {P}",options:[{en:"Help!",idn:"Tolong!"},{en:"Excuse me",idn:"Permisi"},{en:"Please wait",idn:"Tolong tunggu"},{en:"Hurry up",idn:"Tolong cepat"}],answer:0,explain:{en:'"Chuai duai" is the all-purpose cry for help. Emergency numbers: police 191, ambulance 1669, tourist police 1155.',idn:'"Chuai duai" adalah ungkapan dasar untuk minta tolong. Nomor darurat: polisi 191, ambulans 1669, Polisi Pariwisata 1155.'}},{id:"q-check-please",phraseId:"check-please",type:"situation",q:{en:"You finish dinner and want to pay. What do you say to the waiter?",idn:"Kamu selesai makan malam dan mau bayar. Apa yang kamu bilang ke pelayan?"},options:[{en:"Menu, please",idn:"Minta menunya, ya"},{en:"One more, please",idn:"Satu lagi, ya"},{en:"Check, please",idn:"Minta bill-nya, ya"},{en:"Plain water, please",idn:"Minta air putih, ya"}],answer:2,explain:{en:'"Kit ngoen duai" is a common way to ask for the bill. You can also raise a hand and say "check bin".',idn:'"Kit ngoen duai" adalah cara umum minta tagihan. Kamu juga bisa angkat tangan dan bilang "check bin".'}},{id:"q-jueng",phraseId:"slang-jueng",type:"meaning",q:{en:"A young Thai friend sees your outfit and says this. What does it mean?",idn:"Teman Thai melihat outfit-mu dan bilang begini. Apa artinya?"},th:"จึ้ง",rom:"jueng",options:[{en:"I’m hungry",idn:"Aku lapar"},{en:"That’s boring",idn:"Membosankan"},{en:"I’m confused",idn:"Aku bingung"},{en:"Wow, stunning!",idn:"Wah, keren banget!"}],answer:3,explain:{en:'"Jueng" is trendy slang for amazed or stunning. Use it with friends, not in formal situations.',idn:'"Jueng" adalah bahasa gaul untuk kagum atau keren banget. Pakai dengan teman, bukan di situasi resmi.'}},{id:"q-555",phraseId:"slang-555",type:"meaning",q:{en:"A Thai teammate types this in the chat. What are they doing?",idn:"Rekan tim Thai mengetik ini di chat. Apa maksudnya?"},th:"555",rom:"ha ha ha",options:[{en:"Asking for 555 baht",idn:"Minta 555 baht"},{en:"Laughing",idn:"Sedang tertawa (wkwk)"},{en:"Saying goodbye",idn:"Pamit"},{en:"Calling the police",idn:"Menelepon polisi"}],answer:1,explain:{en:'Thai "five" sounds like "ha", so 555 = "ha ha ha", the Thai version of Indonesian "wkwk".',idn:'Angka 5 dalam bahasa Thai dibaca "ha", jadi 555 berarti "ha ha ha". Ini versi Thai dari "wkwk".'}},{id:"q-mai-pen-rai",phraseId:"mai-pen-rai",type:"situation",q:{en:"You bump into someone and say sorry. They smile and answer this. What does it mean?",idn:"Kamu menabrak seseorang dan minta maaf. Dia tersenyum lalu menjawab begini. Apa artinya?"},th:"ไม่เป็นไร{P}",rom:"mai pen rai {P}",options:[{en:"No problem / it’s okay",idn:"Nggak apa-apa"},{en:"I don’t understand",idn:"Saya nggak paham"},{en:"You owe me money",idn:"Bayar utangmu"},{en:"Please come again",idn:"Datang lagi, ya"}],answer:0,explain:{en:'"Mai pen rai" is the relaxed "it’s fine, don’t worry". It reflects Thai culture of staying calm.',idn:'"Mai pen rai" artinya "nggak apa-apa, santai aja". Ungkapan ini mencerminkan budaya Thai yang mengutamakan tetap tenang.'}},{id:"q-mueng-goo",phraseId:"caution-mueng-goo",type:"situation",q:{en:"A hotel receptionist helps you. Which kind of words should you NEVER use with her?",idn:"Resepsionis hotel sedang membantumu. Kata-kata apa yang TIDAK BOLEH kamu pakai ke dia?"},th:"มึง / กู",rom:"mueng / goo",options:[{en:"Polite endings (khrap / kha)",idn:"Akhiran sopan (khrap/kha)"},{en:"“Khun” for you",idn:'“Khun” untuk menyapa'},{en:"Rude pronouns (mueng / goo)",idn:"Kata ganti kasar (mueng/goo)"},{en:"Thank you (khop khun)",idn:'Terima kasih (khop khun)'}],answer:2,explain:{en:"Mueng / goo are coarse pronouns only for very close friends. Using them with staff or elders is insulting.",idn:'"Mueng/goo" adalah kata ganti kasar yang hanya dipakai antarteman sangat akrab. Memakainya ke staf atau orang yang lebih tua itu menghina.'}},{id:"q-check-in",phraseId:"check-in",type:"situation",q:{en:"You arrive at the hotel front desk after a long flight. What do you say?",idn:"Kamu tiba di resepsionis hotel setelah penerbangan panjang. Apa yang kamu bilang?"},options:[{en:"Extra towels, please",idn:"Minta handuk tambahan, ya"},{en:"I lost my room key",idn:"Kunci kamar saya hilang"},{en:"What is the Wi-Fi password?",idn:"Password Wi-Fi-nya apa?"},{en:"I’d like to check in",idn:"Saya mau check-in"}],answer:3,explain:{en:'"Khor chek-in {P}" is the standard phrase. Keep your passport ready.',idn:'"Khor chek-in" adalah ungkapan standarnya. Siapkan paspormu.'}},{id:"q-slow-down",phraseId:"slow-down",type:"situation",q:{en:"You are on a motorbike taxi and the rider is going too fast. What do you say?",idn:"Kamu naik ojek dan pengemudinya ngebut banget. Apa yang kamu bilang?"},options:[{en:"Go straight",idn:"Lurus terus"},{en:"Please slow down",idn:"Tolong pelan-pelan"},{en:"Can you go to Siam Paragon?",idn:"Tolong ke Siam Paragon"},{en:"Please wait a moment",idn:"Tolong tunggu sebentar"}],answer:1,explain:{en:'"Chaa long noi {P}" asks the driver to go slower. Also hold on and wear the helmet.',idn:'"Chaa long noi" artinya minta pengemudi melambat. Pegangan yang kuat dan pakai helm.'}},{id:"q-tueng",phraseId:"slang-tueng",type:"meaning",q:{en:"After a great play a Thai friend shouts this. What does it mean?",idn:"Setelah permainan keren, teman Thai berteriak begini. Apa artinya?"},th:"ตึง",rom:"tueng",options:[{en:"Impressive / intense",idn:"Gila / Jago parah"},{en:"Too slow",idn:"Lambat banget"},{en:"I’m sleepy",idn:"Ngantuk"},{en:"Please repeat",idn:"Ulangi, dong"}],answer:0,explain:{en:'"Tueng" is casual slang praising something impressively strong. Common in gaming talk.',idn:'"Tueng" adalah bahasa gaul santai untuk memuji sesuatu yang kuat banget. Sering dipakai saat ngobrol soal game.'}},{id:"q-lost-way",phraseId:"lost-way",type:"situation",q:{en:"You cannot find your hotel and ask a shopkeeper for help. Which phrase fits?",idn:"Kamu nggak bisa menemukan hotelmu dan minta tolong ke pemilik toko. Ungkapan mana yang pas?"},options:[{en:"Delicious",idn:"Enak"},{en:"Check, please",idn:"Minta bill-nya, ya"},{en:"I’m lost",idn:"Saya tersesat"},{en:"Thank you very much",idn:"Terima kasih banyak"}],answer:2,explain:{en:'"Long thang" = lost (my way). Show your hotel name on the phone for faster help.',idn:'"Long thang" artinya tersesat. Tunjukkan nama hotelmu di ponsel supaya dibantu lebih cepat.'}},{id:"q-kreng-jai",phraseId:"slang-kreng-jai",type:"meaning",q:{en:"A Thai colleague says this when you offer to carry their bag. What do they mean?",idn:"Rekan kerja Thai bilang begini saat kamu menawarkan diri membawakan tasnya. Apa maksudnya?"},th:"เกรงใจ",rom:"kreng jai",options:[{en:"I’m angry at you",idn:"Saya marah"},{en:"I’m very hungry",idn:"Saya lapar banget"},{en:"I don’t know the way",idn:"Saya nggak tahu jalannya"},{en:"I don’t want to trouble you",idn:"Nggak usah, saya sungkan merepotkan"}],answer:3,explain:{en:'"Kreng jai" is the feeling of not wanting to burden others. Offer once more kindly.',idn:'"Kreng jai" adalah perasaan sungkan karena nggak mau membebani orang lain. Tawarkan sekali lagi dengan ramah.'}},{id:"q-split-bill",phraseId:"team-split-bill",type:"situation",q:{en:"Your group wants to pay separately at a restaurant. What do you ask?",idn:"Rombonganmu mau bayar masing-masing di restoran. Apa yang kamu tanyakan?"},options:[{en:"We’ll pay together",idn:"Bayar sekalian, ya"},{en:"Can we split the bill?",idn:"Bisa bayar terpisah?"},{en:"A table for eight",idn:"Meja untuk 8 orang, ya"},{en:"One more, please",idn:"Satu lagi, ya"}],answer:1,explain:{en:'"Khor yaek bin dai mai" asks to split the bill. Ask early since some places do not.',idn:'"Khor yaek bin dai mai" artinya menanyakan apakah bisa bayar terpisah. Ada tempat yang nggak bisa, jadi tanyakan dari awal.'}},{id:"q-heat-up",phraseId:"heat-it-up",type:"situation",q:{en:"You buy a rice box at 7-Eleven and want it hot. What do you say?",idn:"Kamu beli nasi kotak di 7-Eleven dan mau dihangatkan. Apa yang kamu bilang?"},options:[{en:"Please heat it up",idn:"Tolong dihangatkan"},{en:"No bag needed",idn:"Nggak perlu kantong"},{en:"Receipt, please",idn:"Minta struknya, ya"},{en:"Can I pay by card?",idn:"Bisa bayar pakai kartu?"}],answer:0,explain:{en:'"Un hai noi" = heat it up for me. The staff will use the microwave. Say "mai ao thung" if you do not need a bag.',idn:'"Un hai noi" artinya minta dihangatkan. Staf akan memakai microwave. Kalau nggak perlu kantong, bilang "mai ao thung".'}},{id:"q-fire",phraseId:"fire",type:"meaning",q:{en:"You hear shouts in the hotel hallway. What does this mean?",idn:"Kamu mendengar teriakan ini di lorong hotel. Apa artinya?"},th:"ไฟไหม้{P}",rom:"fai mai {P}",options:[{en:"Lights are off",idn:"Lampunya mati"},{en:"Please be quiet",idn:"Tolong tenang"},{en:"Fire!",idn:"Kebakaran!"},{en:"Breakfast is ready",idn:"Sarapan sudah siap"}],answer:2,explain:{en:'"Fai mai" means fire. Leave the building and call 199.',idn:'"Fai mai" artinya kebakaran. Keluar dari gedung dan telepon 199.'}},{id:"q-late-checkout",phraseId:"late-checkout",type:"situation",q:{en:"Your flight is in the evening and you want to keep the room longer. What do you ask?",idn:"Pesawatmu malam hari dan kamu mau pakai kamar lebih lama. Apa yang kamu tanyakan?"},options:[{en:"Can you store my luggage?",idn:"Bisa titip koper?"},{en:"What time does breakfast start?",idn:"Sarapan mulai jam berapa?"},{en:"Please call a taxi for me",idn:"Tolong panggilkan taksi"},{en:"Can I check out late?",idn:"Boleh check-out telat?"}],answer:3,explain:{en:'"Khor chek-out sai dai mai" asks for late check-out. Ask the evening before; fees may apply.',idn:'"Khor chek-out sai dai mai" artinya minta late check-out. Tanyakan malam sebelumnya dan cek kemungkinan biaya tambahan.'}},{id:"q-saep",phraseId:"slang-saep",type:"meaning",q:{en:"A som tam vendor grins and says this after you finish. What is the vendor saying?",idn:"Setelah kamu menghabiskan som tam, pedagangnya tersenyum dan bilang begini. Apa maksudnya?"},th:"แซ่บ",rom:"saep",options:[{en:"Too expensive",idn:"Kemahalan"},{en:"Tasty (and spicy)",idn:"Pedas dan enak, kan"},{en:"We are closed",idn:"Kami sudah tutup"},{en:"Please pay now",idn:"Tolong bayar sekarang"}],answer:1,explain:{en:'"Saep" is the Isan word for tasty, used nationwide for spicy street food.',idn:'"Saep" adalah kata dari Isan yang berarti "enak", dipakai di seluruh Thailand untuk jajanan pedas.'}},{id:"q-mai-wai-laeo",phraseId:"slang-mai-wai-laeo",type:"meaning",q:{en:"A friend watching a hilarious clip says this while laughing. What does it mean?",idn:"Temanmu menonton video lucu dan bilang begini sambil tertawa. Apa artinya?"},th:"ไม่ไหวแล้ว",rom:"mai wai laeo",options:[{en:"I can’t take it (so funny)",idn:"Nggak kuat (lucu banget)"},{en:"The clip is a lie",idn:"Videonya bohong"},{en:"Let’s go home",idn:"Ayo pulang"},{en:"I want some water",idn:"Aku mau minum air"}],answer:0,explain:{en:'"Mai wai laeo" is a feeling-overload phrase: laughing, tired or touched. Context decides.',idn:'"Mai wai laeo" dipakai saat perasaan meluap: karena lucu, capek, atau terharu. Artinya ditentukan oleh konteks.'}},{id:"q-book-van",phraseId:"team-book-van",type:"situation",q:{en:"You must move eight people from the hotel to an event. What do you say to a car company?",idn:"Kamu harus memindahkan 8 orang dari hotel ke lokasi acara. Apa yang kamu bilang ke penyedia kendaraan?"},options:[{en:"Please stop here",idn:"Tolong berhenti di sini"},{en:"I’d like to book a van for 8 people",idn:"Saya mau pesan van untuk 8 orang"},{en:"How far is it?",idn:"Seberapa jauh?"},{en:"I’ll get off here",idn:"Saya turun di sini"}],answer:1,explain:{en:'"Rot-too" is a van. Confirm date, time, pickup point, luggage and total price including tolls.',idn:'"Rot-too" artinya van. Pastikan tanggal, jam, titik jemput, jumlah barang, dan total harga termasuk tol.'}},{id:"q-wai",phraseId:"wai-greeting",type:"situation",q:{en:"A hotel guest older than you wais as you greet them. What is the best response?",idn:"Tamu hotel yang lebih tua memberi wai sambil menyapamu. Respons terbaiknya apa?"},options:[{en:"Wai back with a small bow and say hello",idn:"Balas wai sambil sedikit menunduk dan menyapa"},{en:"Ignore it",idn:"Abaikan saja"},{en:"Point at them and laugh",idn:"Tunjuk dia sambil tertawa"},{en:"Shout “555”",idn:'Teriak “555”'}],answer:0,explain:{en:"Return a wai with a small bow. It is like the respectful palms-together greeting many Indonesians know from home.",idn:"Balas wai sambil sedikit menunduk. Mirip salam hormat dengan menangkupkan tangan yang biasa kita lakukan di Indonesia."}},{id:"q-khop-khun",phraseId:"thank-you",type:"meaning",q:{en:"The taxi driver hands you your bag. What do you reply with?",idn:"Sopir taksi menyerahkan tasmu. Kamu jawab apa?"},th:"ขอบคุณ{P}",rom:"khop khun {P}",options:[{en:"Sorry",idn:"Maaf"},{en:"Hello",idn:"Halo"},{en:"Goodbye forever",idn:"Selamat tinggal selamanya"},{en:"Thank you",idn:"Terima kasih"}],answer:3,explain:{en:'"Khop khun" is thank you. Add "mak" (very) for extra thanks.',idn:'"Khop khun" artinya terima kasih. Tambahkan "mak" (banget) supaya terdengar lebih berterima kasih.'}},{id:"q-less-sweet",phraseId:"less-sweet",type:"situation",q:{en:"Thai iced tea is normally very sweet. You want it less sweet. What do you say?",idn:"Thai tea biasanya manis banget. Kamu mau yang kurang manis. Apa yang kamu bilang?"},options:[{en:"Less sweet, please",idn:"Kurang manis, ya"},{en:"Extra rice, please",idn:"Tambah nasi, ya"},{en:"Eat here",idn:"Makan di sini"},{en:"No coriander, please",idn:"Tanpa daun ketumbar, ya"}],answer:0,explain:{en:'"Waan noi" = a little sweet. You can also say "mai waan" for no sweetness at all.',idn:'"Waan noi" artinya "sedikit manis". Kalau nggak mau manis sama sekali, bilang "mai waan".'}}]});var Ge,oa,Ua,Ja,Xo=S(()=>{Ge=[{id:"bts-skytrain",name:{en:"BTS Skytrain",idn:"BTS Skytrain",th:"รถไฟฟ้าบีทีเอส"},how:{en:"Elevated trains over the busiest central areas (Siam, Asok, Phrom Phong, Thonglor, Ari, Mo Chit, Saphan Taksin). Two main lines, Sukhumvit and Silom, meet at Siam. You tap in with a card or single-journey card, ride, and tap out at your destination station.",idn:"Kereta layang yang melintasi pusat kota Bangkok, seperti Siam, Asok, Phrom Phong, Thonglor, Ari, Mo Chit, dan Saphan Taksin. Jalur utamanya Sukhumvit dan Silom, yang bertemu di Stasiun Siam. Tap kartu atau tiket sekali jalan saat masuk, lalu tap lagi saat keluar di stasiun tujuan."},pay:{en:"Rabbit card or a single-journey card. Official BTS pages say the ticket machines take coins and QR payment (some machine types also take banknotes). Reports in late 2026 say BTS gates do not yet read foreign bank cards, so do not count on tapping a credit card here. Check at the station.",idn:"Pakai kartu Rabbit atau tiket sekali jalan. Menurut halaman resmi BTS, mesin tiket menerima koin dan pembayaran QR, dan sebagian jenis mesin juga menerima uang kertas. Banyak laporan per akhir 2026 menyebut gerbang BTS belum bisa membaca kartu bank luar negeri, jadi jangan mengandalkan tap kartu kredit. Cek langsung di stasiun."},cost:{en:"Fare depends on the number of stations travelled, so a short hop costs less than a cross-town trip. Single-journey cards and Rabbit cards are priced on the same distance logic. Use the official fare calculator or Google Maps for the exact price.",idn:"Tarif tergantung jumlah stasiun (jarak) yang kamu tempuh. Satu-dua stasiun dekat lebih murah, menyeberangi kota lebih mahal. Cek harga pastinya di kalkulator tarif resmi BTS atau Google Maps."},pros:[{en:"Skips Bangkok traffic completely, so travel time is predictable.",idn:"Bebas macet Bangkok sepenuhnya, jadi waktu perjalanan mudah diperkirakan."},{en:"Air-conditioned, very clear signage in English, and stops right next to major malls.",idn:"AC-nya dingin, petunjuk berbahasa Inggris jelas, dan stasiunnya pas di sebelah mal-mal besar."},{en:"Cheap compared with taxis for most central trips.",idn:"Jauh lebih murah daripada taksi untuk sebagian besar rute di pusat kota."}],cons:[{en:"Crowded at rush hours and big events; large bags and equipment cases are awkward.",idn:"Penuh sesak di jam sibuk dan saat ada acara besar; koper besar atau case perlengkapan merepotkan dibawa."},{en:"Separate ticket from MRT and Airport Rail Link, so changing systems means new gates and a new fare.",idn:"Tiketnya terpisah dari MRT dan Airport Rail Link. Saat pindah jalur, kamu harus keluar gerbang, masuk lagi, dan bayar tarif baru."},{en:"Stairs and long walkways at some stations; the last stretch to a venue can be hot and humid.",idn:"Beberapa stasiun punya tangga dan lorong penghubung yang panjang; jalan kaki terakhir ke tujuan bisa panas dan lembap."}],tips:[{en:"Carry coins or small notes or set up QR payment before queueing at the machine.",idn:"Siapkan koin, uang kecil, atau pembayaran QR sebelum antre di mesin tiket."},{en:"A Rabbit card saves time at the machines when you ride several times a day.",idn:"Kalau naik beberapa kali sehari, kartu Rabbit bikin kamu nggak perlu antre di mesin tiket."},{en:"Check the exit number on Google Maps before you tap out so you land on the right side of the road.",idn:"Cek nomor pintu keluar di Google Maps sebelum tap keluar supaya nggak salah sisi jalan dan nyasar."}],safety:[{en:"Pickpockets work crowded platforms and carriages; keep phones and wallets in front pockets or a zipped bag.",idn:"Copet beraksi di peron dan gerbong yang penuh. Simpan ponsel dan dompet di saku depan atau tas berresleting."},{en:"Stay behind the yellow line and let people exit before boarding.",idn:"Tunggu di belakang garis kuning, dan dahulukan penumpang yang turun sebelum naik."}],apps:[{name:"Google Maps",note:{en:"Shows BTS routes, exits and walking transfers.",idn:"Menampilkan rute BTS, pintu keluar, hingga jalur jalan kaki untuk transit."}},{name:"BTS SkyTrain (official site route and fare tool)",note:{en:"Fare and journey-time planner on the official site.",idn:"Fitur perhitungan tarif dan waktu tempuh di situs resmi."}}],official:{name:"BTS Skytrain official site",url:"https://www.bts.co.th/eng/index.html"},mistakes:[{en:"Assuming a bank card or an MRT/Airport Rail Link ticket will open BTS gates.",idn:"Mengira kartu bank atau tiket MRT/Airport Rail Link bisa membuka gerbang BTS."},{en:"Leaving a station by the wrong exit and walking a long way around in the heat.",idn:"Keluar lewat pintu yang salah lalu harus jalan memutar jauh di bawah terik."}],ratings:{speed:5,comfort:4,cost:4,easeForFirstTimers:4},bestFor:{en:"Central trips between Siam, Asok, Phrom Phong, Thonglor, Ari and Mo Chit, especially at rush hour.",idn:"Paling cocok untuk bolak-balik antara Siam, Asok, Phrom Phong, Thonglor, Ari, dan Mo Chit, terutama di jam sibuk."},source:{name:"BTS official ticket machine page",url:"https://www.bts.co.th/eng/tickets/ticket-machine.html",checked:"2026-11-17"}},{id:"mrt",name:{en:"MRT Subway",idn:"MRT Subway",th:"รถไฟฟ้า MRT"},how:{en:"Underground and elevated metro run by BEM (Blue and Purple lines) and other operators (Yellow and Pink lines). The Blue Line loops through Sukhumvit, Silom, Hua Lamphong and Chatuchak Park. Gates are tap-in, tap-out.",idn:"Ada jalur Biru dan Ungu yang dioperasikan BEM, serta jalur Kuning dan Pink dari operator lain. Jalur Biru melingkar melewati Sukhumvit, Silom, Hua Lamphong, dan Chatuchak Park. Di gerbang, tap saat masuk dan saat keluar."},pay:{en:"On the Blue and Purple lines the official BEM page says contactless (EMV) bank cards work at the gates: credit cards from any Thai or international issuer (Visa, Mastercard, UnionPay) are accepted, while debit cards are limited to certain Thai issuers. The Yellow Line operator lists foreign debit cards too. Use the same single card to enter and exit, and tap only one card. News reports say old stored-value MRT cards stopped working on Blue/Purple on 1 June 2026, and single-journey tokens are expected to be replaced by QR tickets from 1 January 2027. Confirm at the station.",idn:"Menurut halaman resmi BEM, di jalur Biru dan Ungu kartu bank nirsentuh (EMV) bisa langsung di-tap di gerbang. Kartu kredit Visa, Mastercard, dan UnionPay dari penerbit Thailand maupun luar negeri diterima, sedangkan kartu debit hanya dari beberapa bank Thailand tertentu. Halaman operator jalur Kuning menyebut kartu debit luar negeri juga bisa. Tap satu kartu yang sama saat masuk dan keluar. Ada laporan bahwa kartu isi ulang MRT lama tidak bisa dipakai lagi di jalur Biru dan Ungu sejak 1 Juni 2026, dan token sekali jalan akan diganti tiket QR mulai 1 Januari 2027. Pastikan langsung di lokasi."},cost:{en:"Distance-based fare charged when you tap out. Fare levels have been revised several times in 2025-26 and promotions change, so check the official site or app instead of relying on any number you read.",idn:"Tarif berbasis jarak dipotong saat kamu tap keluar. Tarif dan promo sudah beberapa kali berubah di 2025–26, jadi cek di situs atau aplikasi resmi daripada percaya angka yang kamu baca di tempat lain."},pros:[{en:"Cold air-con and no traffic; stations are often right under malls and offices.",idn:"AC dingin dan bebas macet. Banyak stasiun yang letaknya tepat di bawah mal dan gedung perkantoran."},{en:"Contactless bank cards on the Blue and Purple lines mean no ticket queue for many visitors.",idn:"Di jalur Biru dan Ungu, kartu nirsentuh bisa langsung di-tap, jadi banyak pengunjung nggak perlu antre beli tiket."},{en:"Reaches places the BTS does not, such as Hua Lamphong, Chinatown area and Benjakitti area (QSNCC).",idn:"Menjangkau area yang nggak dilewati BTS, seperti Hua Lamphong, kawasan Chinatown, dan kawasan Taman Benjakitti (Stasiun QSNCC)."}],cons:[{en:"Not integrated with the BTS: you exit, walk and re-enter with a new payment.",idn:"Tarifnya tidak terintegrasi dengan BTS: kamu harus keluar, jalan kaki, lalu masuk lagi dengan pembayaran baru."},{en:"Card rules are different per line and operator; debit cards and foreign cards can be rejected.",idn:"Aturan kartu berbeda di tiap jalur dan operator; kartu debit atau kartu luar negeri bisa ditolak."},{en:"Long underground escalators and exits; carrying heavy cases is tiring.",idn:"Eskalator dan pintu keluar bawah tanahnya panjang, jadi capek kalau membawa case berat."}],tips:[{en:"Test your card with a short ride on day one. If the gate shows red, try another card or ask staff.",idn:"Di hari pertama, coba naik jarak pendek untuk mengetes kartumu. Kalau gerbang menyala merah, pakai kartu lain atau tanya petugas."},{en:"Enter and exit with the same card; a different card at exit can lead to a penalty charge.",idn:"Masuk dan keluar harus dengan kartu yang sama. Tap kartu berbeda saat keluar bisa kena biaya penalti."},{en:"Ask your card issuer about foreign-transaction fees and make sure contactless is enabled in your app.",idn:"Tanyakan ke bank penerbit kartumu soal biaya transaksi luar negeri, dan pastikan fitur nirsentuh sudah aktif di aplikasinya."}],safety:[{en:"Keep your bag in front of you in packed carriages.",idn:"Di gerbong yang penuh, pakai tasmu di depan."},{en:"Do not eat or drink inside the paid area or on trains; it is not allowed and can be fined.",idn:"Dilarang makan atau minum di area berbayar maupun di dalam kereta; bisa kena denda."}],apps:[{name:"Google Maps",note:{en:"Shows MRT stations, exit numbers and changes.",idn:"Menampilkan stasiun MRT, nomor pintu keluar, dan rute transit."}},{name:"MangMoom EMV (mangmoomemv.com)",note:{en:"Optional trip history and registration for EMV cards.",idn:"Bisa cek riwayat perjalanan dan mendaftarkan kartu EMV (opsional)."}}],official:{name:"BEM MRT EMV contactless page",url:"https://metro.bemplc.co.th/EMV-Contactless?lang=en"},mistakes:[{en:"Tapping two cards (or a card and a phone) at once at the gate.",idn:"Men-tap dua kartu (atau kartu dan ponsel) sekaligus di gerbang."},{en:"Assuming the same card rules apply on every MRT line.",idn:"Mengira semua jalur MRT memakai aturan kartu yang sama."}],ratings:{speed:5,comfort:4,cost:4,easeForFirstTimers:4},bestFor:{en:"Trips to Chatuchak, Sukhumvit, Silom, Chinatown and Benjakitti Park when you want air-con and predictable timing.",idn:"Cocok untuk perjalanan ke Chatuchak, Sukhumvit, Silom, Chinatown, dan Taman Benjakitti saat kamu butuh AC dan waktu tempuh yang pasti."},source:{name:"BEM EMV page and EBM Yellow Line EMV page",url:"https://metro.bemplc.co.th/EMV-Contactless?lang=en",checked:"2026-11-17"}},{id:"grab",name:{en:"Grab (ride-hailing car)",idn:"Grab (taksi online)",th:"แกร็บ"},how:{en:"Book a car in the Grab app, see the route and an upfront price, and follow the driver on the map. Larger-car options (such as XL or van types when shown in the app) exist for groups. Airports have marked Grab pickup points.",idn:"Pesan mobil lewat aplikasi Grab, lihat rute dan perkiraan harga di depan, lalu pantau posisi sopir di peta. Kalau tersedia di aplikasi, kamu bisa pilih mobil besar seperti XL atau van, cocok untuk rombongan. Bandara punya titik jemput khusus Grab."},pay:{en:"Cash or a card linked in the app, depending on what the app offers for your account. Foreign cards sometimes fail on first use, so add and test the payment method before you land.",idn:"Bayar tunai atau dengan kartu yang terhubung di aplikasi, tergantung opsi yang tersedia di akunmu. Kartu luar negeri kadang gagal saat pertama dipakai, jadi tambahkan dan tes metode pembayaranmu sebelum mendarat."},cost:{en:"Price is shown upfront and moves with distance, traffic and demand. Expressway tolls and airport fees may be added. Compare the app price with a metered taxi for the same trip.",idn:"Harga ditampilkan sebelum memesan dan berubah sesuai jarak, kondisi lalu lintas, dan permintaan. Bisa ada tambahan tol atau biaya bandara. Bandingkan dengan tarif argo taksi untuk rute yang sama."},pros:[{en:"Destination is typed in the app, so there is no language barrier and no haggling.",idn:"Tujuan diketik di aplikasi, jadi nggak ada kendala bahasa dan nggak perlu tawar-menawar."},{en:"Door-to-door with luggage and air-con; larger cars available for groups.",idn:"Antar sampai depan pintu dengan mobil ber-AC plus bagasi; ada mobil besar untuk rombongan."},{en:"Trip details and driver info are recorded in the app.",idn:"Riwayat perjalanan dan data sopir tercatat di aplikasi, jadi lebih tenang."}],cons:[{en:"Prices jump in rain and rush hour, and cars can be slow to arrive.",idn:"Saat hujan atau jam sibuk, harga bisa naik dan mobil lama datang."},{en:"Pickup spots in big malls and hotels can be confusing, so drivers sometimes cancel.",idn:"Titik jemput di mal atau hotel besar bisa membingungkan, jadi sopir kadang membatalkan pesanan."},{en:"Traffic is still traffic: a short distance can take a long time.",idn:"Macet tetap macet: jarak dekat pun bisa makan waktu lama."}],tips:[{en:"Check the plate number and driver photo in the app before you get in.",idn:"Sebelum naik, pastikan pelat nomor dan foto sopir sesuai dengan yang ada di aplikasi."},{en:"Drop a pin at a clear pickup point (mall entrance number, hotel gate) and message the driver in the app chat.",idn:"Taruh pin di titik jemput yang jelas, seperti nomor pintu masuk mal atau gerbang hotel, lalu kabari sopir lewat chat di aplikasi."},{en:"For groups with equipment cases, book an XL or van option earlier than you think you need it.",idn:"Untuk rombongan yang membawa case perlengkapan, pesan opsi XL atau van lebih awal dari yang kamu kira perlu."}],safety:[{en:"Use the in-app share-trip and emergency features; sit in the back seat if travelling alone at night.",idn:"Pakai fitur bagikan perjalanan dan fitur darurat di aplikasi; kalau naik sendirian malam hari, duduk di kursi belakang."},{en:"Only get into the car that matches the app. Do not accept offers from drivers who approach you outside.",idn:"Naik hanya ke mobil yang sesuai dengan aplikasi. Tolak tawaran sopir yang mendekatimu di luar."}],apps:[{name:"Grab",note:{en:"Car, XL and bike options; payment and trip sharing.",idn:"Opsi mobil, XL, dan motor, plus fitur pembayaran dan bagikan perjalanan."}},{name:"Google Maps",note:{en:"Cross-check the route and the pickup pin.",idn:"Cocokkan rute dan pin titik jemput."}}],official:{name:"Grab Thailand",url:"https://www.grab.com/th/"},mistakes:[{en:"Not adding a working payment method before arrival.",idn:"Belum menambahkan metode pembayaran yang berfungsi sebelum tiba."},{en:"Waiting at the wrong gate or level at a mall or airport instead of the Grab pickup point.",idn:"Menunggu di pintu atau lantai yang salah di mal atau bandara, bukan di titik jemput Grab."}],ratings:{speed:3,comfort:5,cost:3,easeForFirstTimers:5},bestFor:{en:"Groups, late nights, rain, and trips with luggage or equipment.",idn:"Cocok untuk rombongan, larut malam, hari hujan, dan perjalanan dengan koper atau perlengkapan."},source:{name:"Thailand Business News: ride-hailing oversight (8 platforms incl. Grab, Bolt)",url:"https://www.thailand-business-news.com/law/330996-thailand-to-tighten-oversight-of-app-based-ride-hailing-services",checked:"2026-11-17"}},{id:"bolt",name:{en:"Bolt (ride-hailing)",idn:"Bolt (taksi online)",th:"โบลท์"},how:{en:"A Grab-like app: request a car (and in some areas a bike), see the price and driver, and track the ride. Availability and prices differ from Grab at any given time, so it is useful as a second app.",idn:"Aplikasi yang mirip Grab: pesan mobil (dan di beberapa area juga motor), lihat harga dan data sopir, lalu pantau perjalanannya. Harga dan ketersediaan mobilnya berbeda dengan Grab di tiap waktu, jadi berguna sebagai aplikasi cadangan."},pay:{en:"Cash or card options shown in the app. Add and test a foreign card before you need it.",idn:"Bayar dengan opsi tunai atau kartu yang ditampilkan di aplikasi. Tambahkan dan tes kartu luar negerimu sebelum benar-benar butuh."},cost:{en:"Upfront price based on distance and demand; often a little different from Grab for the same trip. Tolls and airport pickup fees may apply.",idn:"Harga ditetapkan di depan berdasarkan jarak dan permintaan; sering sedikit berbeda dari Grab untuk rute yang sama. Bisa ada tambahan tol atau biaya jemput di bandara."},pros:[{en:"Good for price-checking against Grab when both are available.",idn:"Bagus untuk membandingkan harga dengan Grab kalau keduanya tersedia."},{en:"App-based destination entry avoids language problems.",idn:"Tujuan diketik di aplikasi, jadi nggak ada masalah bahasa."},{en:"Trip recorded in-app with driver and plate details.",idn:"Data sopir dan pelat nomor tercatat di aplikasi."}],cons:[{en:"Regulatory status has been in the news in 2026, so availability can change; do not make it your only option.",idn:"Status regulasinya sempat jadi berita di 2026, jadi ketersediaannya bisa berubah. Jangan jadikan satu-satunya pilihan."},{en:"Fewer cars than Grab in some areas and at peak times.",idn:"Di beberapa area dan saat jam sibuk, mobilnya bisa lebih sedikit dibanding Grab."},{en:"Airport pickup points may be less clearly set up than for Grab.",idn:"Titik jemput di bandara mungkin tidak sejelas milik Grab."}],tips:[{en:"Keep both Grab and Bolt installed and compare before booking.",idn:"Pasang Grab dan Bolt sekaligus, lalu bandingkan sebelum memesan."},{en:"Always match the plate number and photo in the app.",idn:"Selalu cocokkan pelat nomor dan foto di aplikasi."},{en:"If a driver asks you to cancel and pay cash outside the app, decline and cancel yourself.",idn:"Kalau sopir minta kamu membatalkan pesanan dan bayar tunai di luar aplikasi, tolak dan batalkan sendiri."}],safety:[{en:"Share your trip with a friend and use the in-app safety tools.",idn:"Bagikan perjalananmu ke teman dan pakai fitur keamanan di aplikasi."},{en:"Be extra careful with app motorbike rides: helmets, traffic and travel insurance exclusions.",idn:"Ekstra hati-hati dengan ojek online: cek helm, kondisi lalu lintas, dan apakah asuransi perjalananmu mengecualikan naik motor."}],apps:[{name:"Bolt",note:{en:"Request and track rides.",idn:"Pesan dan pantau perjalanan."}},{name:"Grab",note:{en:"Back-up if Bolt has no cars nearby.",idn:"Cadangan kalau Bolt nggak ada mobil di dekatmu."}}],official:{name:"Bolt",url:"https://bolt.eu/"},mistakes:[{en:"Relying on Bolt alone without a back-up app.",idn:"Hanya mengandalkan Bolt tanpa aplikasi cadangan."},{en:"Agreeing to an off-app price with the driver.",idn:"Sepakat harga dengan sopir di luar aplikasi."}],ratings:{speed:3,comfort:4,cost:4,easeForFirstTimers:4},bestFor:{en:"A second ride-hailing option for price comparison and back-up.",idn:"Pilihan taksi online kedua untuk membandingkan harga dan sebagai cadangan."},source:{name:"TTR Weekly: Bolt confirms continued operations in Thailand (May 2026); Thailand Business News (Sep 2026)",url:"https://www.ttrweekly.com/site/2026/05/bolt-confirms-continued-operations-in-thailand/",checked:"2026-11-17"}},{id:"metered-taxi",name:{en:"Metered Taxi",idn:"Taksi argo",th:"แท็กซี่มิเตอร์"},how:{en:"Flag a taxi on the street or use a taxi queue at malls, hotels and airports. The meter should be switched on at the start of the trip. Show the Thai destination card or a map on your phone.",idn:"Stop taksi di jalan atau pakai antrean taksi di mal, hotel, dan bandara. Argo harus dinyalakan sejak awal perjalanan. Tunjukkan kartu tujuan berbahasa Thai atau peta di ponselmu."},pay:{en:"Cash in small notes is safest. Some taxis accept card or QR, but do not count on it. Expressway tolls are paid by the passenger.",idn:"Uang tunai pecahan kecil paling aman. Ada taksi yang menerima kartu atau QR, tapi jangan terlalu berharap. Biaya tol dibayar penumpang."},cost:{en:"Meter fare = a starting fare plus distance and a waiting rate when traffic crawls. Add tolls, and at airports an official surcharge. Official rate tables change, so check the Department of Land Transport.",idn:"Tarif argo = tarif awal ditambah biaya jarak dan biaya tunggu saat macet. Ditambah tol, dan di bandara ada biaya tambahan resmi. Tabel tarif resmi bisa berubah, jadi cek di Departemen Transportasi Darat (DLT)."},pros:[{en:"Available everywhere, 24 hours, and usually fine for short trips.",idn:"Ada di mana-mana selama 24 jam dan biasanya oke untuk jarak dekat."},{en:"Cheap for groups of 3-4 when the meter runs honestly.",idn:"Kalau argonya jujur, murah untuk 3–4 orang yang patungan."},{en:"No app, SIM or card needed.",idn:"Bisa naik tanpa aplikasi, SIM card, atau kartu."}],cons:[{en:"Drivers sometimes refuse short trips or trips through heavy traffic.",idn:"Sopir kadang menolak jarak dekat atau rute yang macet."},{en:"Some drivers will not use the meter and quote a fixed price.",idn:"Ada sopir yang nggak mau pakai argo dan minta tarif borongan."},{en:"Language gap; trunk space is limited for equipment cases.",idn:"Bisa ada kendala bahasa, dan bagasinya kecil sehingga case perlengkapan mungkin nggak muat."}],tips:[{en:"Say or show: meter please (see phrases). If the driver says no, get out and take the next one.",idn:'Ucapkan atau tunjukkan "tolong pakai argo" (lihat Frasa). Kalau sopir menolak, turun dan naik taksi berikutnya.'},{en:"Have your hotel or destination name in Thai and a pin on a map.",idn:"Siapkan nama hotel atau tujuanmu dalam bahasa Thai dan pin lokasinya di peta."},{en:"Carry 20/50/100 baht notes; many drivers do not have change for 500 or 1,000.",idn:"Bawa uang pecahan 20, 50, dan 100 baht. Banyak sopir nggak punya kembalian untuk 500 atau 1.000 baht."}],safety:[{en:"Note the taxi plate or take a photo; keep valuables on your lap, not in the trunk.",idn:"Catat atau foto pelat nomor taksi, dan simpan barang berharga di pangkuan, bukan di bagasi."},{en:"Report problems to the Tourist Police (1155).",idn:"Kalau ada masalah, laporkan ke Polisi Pariwisata (1155)."}],apps:[{name:"Google Maps",note:{en:"Check the route and the estimated distance.",idn:"Cek rute dan perkiraan jaraknya."}},{name:"Grab",note:{en:"Some regular taxis are bookable in ride-hailing apps; options change.",idn:"Taksi biasa kadang bisa dipesan lewat aplikasi taksi online, tapi opsinya bisa berubah."}}],official:{name:"Department of Land Transport (DLT)",url:"https://www.dlt.go.th/"},mistakes:[{en:"Getting in and starting a long trip without the meter on.",idn:"Naik dan memulai perjalanan jauh tanpa argo menyala."},{en:"Paying with a large note and not checking the change.",idn:"Bayar dengan uang besar lalu nggak mengecek kembaliannya."}],ratings:{speed:3,comfort:4,cost:3,easeForFirstTimers:3},bestFor:{en:"Short trips when you have no data, or when a Grab car is not available.",idn:"Cocok untuk jarak dekat saat kamu nggak punya kuota atau nggak dapat mobil Grab."},source:{name:"AOT Suvarnabhumi public taxi page",url:"https://suvarnabhumi.airportthai.co.th/service/transportation/detail/304",checked:"2026-11-17"}},{id:"motorcycle-taxi",name:{en:"Motorcycle Taxi",idn:"Ojek motor",th:"มอเตอร์ไซค์รับจ้าง"},how:{en:"Riders in numbered orange vests wait at soi entrances, station exits and busy corners. You agree on the price first, put on the helmet and sit behind the rider. You can also book an app bike.",idn:"Pengemudi berompi oranye bernomor menunggu di mulut soi (gang), pintu keluar stasiun, dan sudut jalan yang ramai. Sepakati harga dulu, pakai helm, lalu duduk di belakang. Kamu juga bisa pesan ojek lewat aplikasi."},pay:{en:"Cash, agreed before you ride. App rides are paid in the app.",idn:"Bayar tunai sesuai harga yang disepakati sebelum naik. Ojek lewat aplikasi dibayar di aplikasi."},cost:{en:"Usually a negotiated price per short trip, and it rises with distance and time of day. No official fare table to rely on.",idn:"Biasanya harga ditawar per perjalanan pendek, dan naik sesuai jarak dan jam. Nggak ada tabel tarif resmi yang bisa diandalkan."},pros:[{en:"Fastest way to cross heavy traffic and to reach the end of a long soi.",idn:"Cara tercepat menembus macet dan sampai ke ujung soi (gang) yang panjang."},{en:"Useful for the last kilometre from a station.",idn:"Praktis buat kilometer terakhir dari stasiun."},{en:"No app needed for short hops.",idn:"Untuk jarak dekat, nggak perlu aplikasi."}],cons:[{en:"Higher crash risk than any other mode, and many travel insurance policies limit cover.",idn:"Risiko kecelakaan lebih tinggi daripada moda lain, dan banyak asuransi perjalanan membatasi pertanggungannya."},{en:"Not suitable for luggage, equipment cases or rain.",idn:"Nggak cocok untuk koper, case peralatan, atau saat hujan."},{en:"Price is negotiated, so first-timers often overpay.",idn:"Harganya ditawar, jadi yang baru pertama kali sering kemahalan."}],tips:[{en:"Agree on the price before you get on and ask the rider to slow down.",idn:"Sepakati harga sebelum naik dan minta pengemudinya pelan-pelan."},{en:"Always wear the helmet and keep your bag between you and the rider.",idn:"Selalu pakai helm dan taruh tas di antara kamu dan pengemudi."},{en:"Use it only for short trips; for anything long take a car.",idn:"Pakai hanya untuk jarak dekat; untuk jarak jauh, naik mobil."}],safety:[{en:"Check your travel insurance for motorbike exclusions before riding.",idn:"Cek pengecualian terkait motor di asuransi perjalananmu sebelum naik."},{en:"Do not ride after drinking, in heavy rain, or on expressways.",idn:"Jangan naik setelah minum alkohol, saat hujan deras, atau di jalan tol."}],apps:[{name:"Grab (bike option)",note:{en:"Where available; rider and price are shown in the app.",idn:"Kalau tersedia di daerahmu, pengemudi dan harga tampil di aplikasi."}},{name:"Google Maps",note:{en:"Show the rider the pin on your phone.",idn:"Tunjukkan pin peta di HP-mu ke pengemudi."}}],official:{name:"Department of Land Transport (DLT)",url:"https://www.dlt.go.th/"},mistakes:[{en:"Riding without agreeing the price first.",idn:"Naik tanpa menyepakati harga dulu."},{en:"Using a motorbike taxi with big bags or equipment.",idn:"Naik ojek dengan tas besar atau peralatan."}],ratings:{speed:5,comfort:1,cost:4,easeForFirstTimers:2},bestFor:{en:"A short last-mile hop for travellers who are comfortable with the risk and have no luggage.",idn:"Cocok untuk perjalanan pendek di kilometer terakhir, kalau kamu siap dengan risikonya dan nggak bawa barang."}},{id:"public-bus",name:{en:"Public Bus (BMTA)",idn:"Bus Kota (BMTA)",th:"รถเมล์"},how:{en:"Bangkok's bus network is large but confusing for beginners. Buses show route numbers, and a conductor on most buses comes to you to collect the fare. Tell them your stop or show it on a map.",idn:"Jaringan bus Bangkok luas tapi bikin bingung pemula. Bus menampilkan nomor rute, dan di kebanyakan bus ada kondektur yang datang menagih ongkos. Sebutkan halte tujuanmu atau tunjukkan di peta."},pay:{en:"Cash is the default and the most reliable. Card or mobile payment is only on some buses, so treat it as something to test, not to rely on.",idn:"Tunai adalah cara utama dan paling bisa diandalkan. Kartu atau pembayaran mobile cuma ada di sebagian bus, jadi anggap saja coba-coba, jangan diandalkan."},cost:{en:"Fare depends on the bus type (regular, air-con, expressway) and distance. Check the BMTA fare table or ask the conductor; do not rely on numbers from old blog posts.",idn:"Ongkos tergantung jenis bus (biasa, ber-AC, rute tol) dan jarak. Cek tabel tarif BMTA atau tanya kondektur; jangan percaya angka dari blog lama."},pros:[{en:"Very cheap and reaches places the rail network does not.",idn:"Sangat murah dan menjangkau tempat yang nggak dilewati kereta."},{en:"Good for seeing the city street by street.",idn:"Enak buat menikmati kota sambil lihat-lihat jalanan."},{en:"Some airport routes link straight to rail or major hubs.",idn:"Beberapa rute bandara langsung terhubung ke kereta atau titik transit utama."}],cons:[{en:"Slow in traffic, hot, and often crowded.",idn:"Lambat kalau macet, panas, dan sering penuh."},{en:"Route changes and unclear stop names; few English signs.",idn:"Rute sering berubah, nama halte membingungkan, dan papan berbahasa Inggris sedikit."},{en:"Hard with luggage or equipment cases.",idn:"Susah kalau bawa koper atau case peralatan."}],tips:[{en:"Use ViaBus or Google Maps to see the route number and live bus positions.",idn:"Pakai ViaBus atau Google Maps untuk cek nomor rute dan posisi bus secara real-time."},{en:"Keep small notes and coins ready, and tap the bell early.",idn:"Siapkan uang kecil dan koin, dan tekan bel lebih awal."},{en:"Board quickly and move away from the door; buses may not wait long.",idn:"Naik dengan cepat lalu menjauh dari pintu; bus nggak akan menunggu lama."}],safety:[{en:"Watch pockets on crowded buses and keep your bag in front.",idn:"Jaga saku di bus yang penuh dan taruh tas di depan."},{en:"Hold the rail; buses brake suddenly.",idn:"Pegang pegangan; bus sering mengerem mendadak."}],apps:[{name:"ViaBus",note:{en:"Route numbers, stops and live bus positions (planning only, not payment).",idn:"Menampilkan nomor rute, halte, dan posisi bus real-time (hanya untuk perencanaan, bukan pembayaran)."}},{name:"Google Maps",note:{en:"Basic route planning with buses.",idn:"Perencanaan rute dasar, termasuk bus."}}],official:{name:"Bangkok Mass Transit Authority (BMTA)",url:"https://www.bmta.co.th/"},mistakes:[{en:"Boarding the wrong direction because the route number is the same both ways.",idn:"Naik bus arah sebaliknya karena nomor rutenya sama di kedua arah."},{en:"Having only large notes when the conductor arrives.",idn:"Cuma punya uang besar saat kondektur datang."}],ratings:{speed:2,comfort:2,cost:5,easeForFirstTimers:2},bestFor:{en:"Budget travel and a few simple routes you have checked in advance.",idn:"Cocok untuk jalan-jalan hemat lewat beberapa rute sederhana yang sudah kamu cek sebelumnya."},source:{name:"Nation Thailand: DMK transport guide (A1/A2/A3/A4 routes)",url:"https://www.nationthailand.com/news/general/40073046",checked:"2026-11-17"}},{id:"chao-phraya-boat",name:{en:"Chao Phraya River Boat",idn:"Perahu Sungai Chao Phraya",th:"เรือด่วนเจ้าพระยา"},how:{en:"Long commuter boats run along the Chao Phraya River between Nonthaburi and Sathorn, stopping at piers near Wat Arun, the Grand Palace area and Sathorn (change there for the free Asiatique shuttle boat). Boats are colour-coded by flag (orange, yellow, green-yellow, red) with different stopping patterns.",idn:"Perahu komuter panjang yang melayani rute sepanjang Sungai Chao Phraya antara Nonthaburi dan Sathorn, berhenti di dermaga dekat Wat Arun, area Grand Palace, dan Sathorn (transit di sana ke perahu shuttle gratis Asiatique). Perahu dibedakan dengan warna bendera (oranye, kuning, hijau-kuning, merah) dengan pola pemberhentian yang berbeda."},pay:{en:"Pay on board or at the pier. Fares on the official page on the check date were flat per route (Orange 19, Yellow 24, Red 33 THB), but they changed several times in 2026, so confirm at the pier before you board.",idn:"Bayar di perahu atau di dermaga. Di halaman resmi pada tanggal pengecekan, tarifnya flat per rute (Oranye 19, Kuning 24, Merah 33 THB), tapi sudah berubah beberapa kali di 2026, jadi pastikan di dermaga sebelum naik."},cost:{en:"Mostly a flat fare per flag line (Green-Yellow is by section). Prices have been adjusted several times in 2026; check the operator's table. Tourist or private boats are priced separately.",idn:"Umumnya tarif flat per jalur bendera (Hijau-Kuning dihitung per bagian). Harga sudah disesuaikan beberapa kali di 2026; cek tabel tarif operator. Perahu wisata atau sewaan punya harga sendiri."},pros:[{en:"Beats traffic and gives a free river view; great for Old Town sights.",idn:"Bebas macet plus bonus pemandangan sungai; mantap buat wisata Kota Tua."},{en:"Very cheap per trip.",idn:"Sangat murah per perjalanan."},{en:"Connects to BTS Saphan Taksin via Sathorn pier.",idn:"Terhubung ke BTS Saphan Taksin lewat dermaga Sathorn."}],cons:[{en:"Limited hours and no night service; a schedule change in 2026 was posted by the operator.",idn:"Jam operasional terbatas dan nggak ada layanan malam; operator juga mengumumkan perubahan jadwal di 2026."},{en:"Boarding is fast and steps are steep; hard with bags.",idn:"Naik-turunnya cepat dan tangganya curam; repot kalau bawa tas."},{en:"Pier names can confuse; some piers are closed for renovation.",idn:"Nama dermaga bisa membingungkan, dan beberapa dermaga tutup untuk renovasi."}],tips:[{en:"Check the flag colour on the boat and whether it stops at your pier before boarding.",idn:"Sebelum naik, cek warna bendera perahu dan apakah perahu itu berhenti di dermaga tujuanmu."},{en:"Go early in the day for Old Town; the sunset ride is popular and crowded.",idn:"Ke Kota Tua pagi-pagi; perahu saat sunset populer dan penuh."},{en:"Check the operator's current timetable before you plan a return trip.",idn:"Cek jadwal terbaru operator sebelum merencanakan perjalanan pulang."}],safety:[{en:"Mind the gap between boat and pier and follow the staff's whistle.",idn:"Hati-hati celah antara perahu dan dermaga, dan ikuti peluit petugas."},{en:"Keep bags on your lap and do not lean over the rail.",idn:"Taruh tas di pangkuan dan jangan mencondongkan badan ke luar pagar."}],apps:[{name:"Google Maps",note:{en:"Shows piers and the walking link from BTS.",idn:"Menampilkan dermaga dan jalur jalan kaki dari BTS."}},{name:"Chao Phraya Express Boat site",note:{en:"Official route, flag and timetable pages.",idn:"Halaman resmi untuk rute, bendera, dan jadwal."}}],official:{name:"Chao Phraya Express Boat",url:"https://www.chaophrayaexpressboat.com/chaophrayaexpressboat?lang=en"},mistakes:[{en:"Getting on a boat that skips your pier.",idn:"Naik perahu yang nggak berhenti di dermaga tujuanmu."},{en:"Planning a late return after the last boat.",idn:"Merencanakan pulang telat setelah perahu terakhir."}],ratings:{speed:3,comfort:3,cost:5,easeForFirstTimers:3},bestFor:{en:"Old Town sightseeing: Wat Arun, Grand Palace area and riverside days.",idn:"Cocok untuk wisata Kota Tua: Wat Arun, area Grand Palace, dan seharian di tepi sungai."},source:{name:"Chao Phraya Express Boat official site",url:"https://www.chaophrayaexpressboat.com/chaophrayaexpressboat?lang=en",checked:"2026-11-17"}},{id:"airport-rail-link",name:{en:"Airport Rail Link (ARL)",idn:"Airport Rail Link (ARL)",th:"แอร์พอร์ต เรล ลิงก์"},how:{en:"Rail line from Suvarnabhumi Airport (Level B1 of the main terminal) into the city, with interchange options at Makkasan (for MRT Phetchaburi) and Phaya Thai (for BTS). It runs separately from BTS and MRT.",idn:"Jalur kereta dari Bandara Suvarnabhumi (Lantai B1 terminal utama) ke pusat kota, dengan titik transit di Makkasan (ke MRT Phetchaburi) dan Phaya Thai (ke BTS). ARL beroperasi terpisah dari BTS dan MRT."},pay:{en:"The state news service reported that debit and credit cards with the contactless symbol can be tapped at all ARL gates from 8 November 2025, alongside tokens and Smart Pass. Foreign card acceptance is not detailed, so carry a backup (cash for tokens).",idn:"Kantor berita pemerintah Thailand melaporkan bahwa sejak 8 November 2025 kartu debit dan kredit berlogo contactless bisa di-tap di semua gerbang ARL, selain token dan Smart Pass. Belum ada detail soal kartu luar negeri, jadi siapkan cadangan (uang tunai untuk token)."},cost:{en:"Distance-based fare by destination station. Exact fares and journey times are not listed here, so check the station display or Google Maps.",idn:"Tarif berdasarkan jarak ke stasiun tujuan. Tarif dan waktu tempuh pastinya nggak dicantumkan di sini, jadi cek layar di stasiun atau Google Maps."},pros:[{en:"Avoids road traffic between the airport and central stations.",idn:"Menghindari macet jalan raya antara bandara dan stasiun pusat kota."},{en:"Fixed route and predictable operating hours (05:30-24:00 per AOT).",idn:"Rute tetap dan jam operasional jelas (05:30-24:00 menurut AOT)."},{en:"Cheaper than a taxi for one or two people with light bags.",idn:"Lebih murah daripada taksi untuk 1-2 orang dengan barang ringan."}],cons:[{en:"You still need a transfer to BTS or MRT, plus a new fare and a walk.",idn:"Kamu tetap harus transit ke BTS atau MRT, bayar tarif baru, dan jalan kaki."},{en:"Stairs and walkways with big cases are tiring, especially at interchange stations.",idn:"Tangga dan lorong penghubung bikin capek kalau bawa case besar, apalagi di stasiun transit."},{en:"Does not run overnight.",idn:"Nggak beroperasi semalaman."}],tips:[{en:"At Suvarnabhumi follow signs to B1 for the train.",idn:"Di Suvarnabhumi, ikuti petunjuk ke Lantai B1 untuk kereta."},{en:"For hotels near BTS Phaya Thai, Makkasan or Phetchaburi, this is usually the simplest option.",idn:"Kalau hotelmu dekat BTS Phaya Thai, Makkasan, atau Phetchaburi, ini biasanya pilihan paling simpel."},{en:"Keep a small amount of cash for tokens in case your card is not accepted.",idn:"Siapkan sedikit uang tunai untuk token, jaga-jaga kalau kartumu ditolak."}],safety:[{en:"Keep an eye on bags on busy trains.",idn:"Awasi tasmu saat kereta penuh."},{en:"Do not accept help from strangers at the ticket gates.",idn:"Jangan terima bantuan orang asing di gerbang tiket."}],apps:[{name:"Google Maps",note:{en:"Station choice and transfers to BTS/MRT.",idn:"Pilihan stasiun dan rute transit ke BTS/MRT."}},{name:"Era One call center (+66 2 091 1595)",note:{en:"Number listed by AOT for ARL information.",idn:"Nomor yang dicantumkan AOT untuk informasi ARL."}}],official:{name:"AOT Suvarnabhumi - Ways to transport (lists ARL)",url:"https://suvarnabhumi.airportthai.co.th/service/airport-guide/detail/Transportation_BKK"},mistakes:[{en:"Assuming BTS or MRT tickets work on the Airport Rail Link.",idn:"Mengira tiket BTS atau MRT bisa dipakai di Airport Rail Link."},{en:"Choosing ARL for a big group with equipment cases and long transfers.",idn:"Memilih ARL untuk rombongan besar yang bawa case peralatan dengan transit yang panjang."}],ratings:{speed:4,comfort:3,cost:4,easeForFirstTimers:4},bestFor:{en:"Solo travellers and small groups with light luggage heading to central stations.",idn:"Cocok untuk solo traveler atau rombongan kecil dengan barang ringan yang menuju stasiun pusat kota."},source:{name:"Thai government news (PRD): ARL contactless ticketing; AOT BKK transport page",url:"https://thailand.prd.go.th/en/content/category/detail/id/2078/iid/439307",checked:"2026-11-17"}},{id:"suvarnabhumi-transfer",name:{en:"Suvarnabhumi Airport transfers (BKK)",idn:"Transfer Bandara Suvarnabhumi (BKK)",th:"การเดินทางจากสนามบินสุวรรณภูมิ"},how:{en:"Options from the main terminal: public taxi queue on Level 1, Airport Rail Link on B1, Grab at Level 1 Gate 4, AOT Limousine and chartered vehicles, plus public buses and vans from the Public Transportation Center. See AIRPORTS for the step-by-step guide.",idn:"Pilihan dari terminal utama: antrean taksi resmi di Lantai 1, Airport Rail Link di B1, Grab di Lantai 1 Gate 4, AOT Limousine dan kendaraan sewaan, plus bus dan van dari Public Transportation Center. Lihat bagian AIRPORTS untuk panduan langkah demi langkah."},pay:{en:"Taxi: meter, a 50 THB airport surcharge to the driver and tolls. Rail Link: card or tokens. Grab: in app. AOT Limousine: walk-in booking at the Level 2 counters.",idn:"Taksi: argo, biaya tambahan bandara 50 THB ke sopir, plus tol ditanggung penumpang. Rail Link: kartu atau token. Grab: di aplikasi. AOT Limousine: pesan langsung di konter Lantai 2."},cost:{en:"Taxi: meter + 50 THB surcharge + tolls. AOT Limousine lists starting rates by car class (from 550 THB for an eco sedan to 1,300 THB for a luxury sedan, as published by AOT). Rail Link, bus and Grab are distance-based or app-priced.",idn:"Taksi: argo + biaya tambahan 50 THB + tol. AOT Limousine mencantumkan tarif awal per kelas mobil (mulai 550 THB untuk sedan ekonomi sampai 1.300 THB untuk sedan mewah, menurut AOT). Rail Link, bus, dan Grab tergantung jarak atau harga di aplikasi."},pros:[{en:"Official counters and queue systems at the airport reduce taxi touting.",idn:"Konter resmi dan sistem antrean di bandara bikin kamu terhindar dari calo taksi."},{en:"AOT lists 9-seat vans and a 27-seat LimoBus for groups.",idn:"AOT mencantumkan van 9 kursi dan LimoBus 27 kursi untuk rombongan."},{en:"Several modes are available 24 hours (taxi, Grab, AOT Limousine).",idn:"Taksi, Grab, dan AOT Limousine tersedia 24 jam."}],cons:[{en:"Taxi queues and Grab pickup can be slow at peak arrivals.",idn:"Saat kedatangan sedang ramai, antrean taksi dan penjemputan Grab bisa lambat."},{en:"Traffic into the city can be heavy; time estimates vary.",idn:"Jalan ke pusat kota bisa macet parah; perkiraan waktu tempuh bervariasi."},{en:"Charter vehicle desks have limited hours (some stop in the evening).",idn:"Konter kendaraan sewaan punya jam terbatas (ada yang tutup sore/malam)."}],tips:[{en:"For groups with equipment cases, use a van, Grab XL or a pre-booked airport transfer.",idn:"Untuk rombongan yang bawa case peralatan, pakai van, Grab XL, atau transfer bandara yang dipesan duluan."},{en:"If you pre-book, confirm the vehicle size, luggage capacity and where the driver meets you.",idn:"Kalau pesan duluan, pastikan ukuran kendaraan, kapasitas bagasi, dan titik temu dengan sopir."},{en:"Get a queue ticket at the official taxi counter and ignore touts in the arrivals hall.",idn:"Ambil nomor antrean di konter taksi resmi dan abaikan calo di aula kedatangan."}],safety:[{en:"Use only official taxi, Grab, AOT or pre-booked services; do not accept rides from people who approach you.",idn:"Pakai hanya taksi resmi, Grab, AOT, atau layanan yang sudah dipesan; jangan terima tumpangan dari orang yang mendekatimu."},{en:"Insist on the meter and keep receipts.",idn:"Minta argo dinyalakan dan simpan struknya."}],apps:[{name:"Grab",note:{en:"Level 1 Gate 4 outer curb pickup per AOT.",idn:"Penjemputan di jalur luar Lantai 1 Gate 4, menurut AOT."}},{name:"Google Maps",note:{en:"Compare routes and traffic.",idn:"Bandingkan rute dan kondisi lalu lintas."}}],official:{name:"AOT Suvarnabhumi - Ways to transport",url:"https://suvarnabhumi.airportthai.co.th/service/airport-guide/detail/Transportation_BKK"},mistakes:[{en:"Joining the taxi queue without checking vehicle size for a large group.",idn:"Rombongan besar ikut antre taksi tanpa mengecek ukuran mobil."},{en:"Paying a driver who quotes a flat price instead of using the meter.",idn:"Membayar sopir yang minta harga borongan alih-alih pakai argo."}],ratings:{speed:3,comfort:4,cost:3,easeForFirstTimers:4},bestFor:{en:"Anyone arriving at BKK; choose by group size and luggage.",idn:"Untuk semua yang tiba di BKK; pilih sesuai jumlah orang dan barang bawaan."},source:{name:"AOT Suvarnabhumi - Ways to transport",url:"https://suvarnabhumi.airportthai.co.th/service/airport-guide/detail/Transportation_BKK",checked:"2026-11-17"}},{id:"don-mueang-transfer",name:{en:"Don Mueang Airport transfers (DMK)",idn:"Transfer Bandara Don Mueang (DMK)",th:"การเดินทางจากสนามบินดอนเมือง"},how:{en:"From DMK you can take BMTA airport buses (A1-A4), the Red Line train via a skywalk from Terminal 2, a metered taxi from the queue, Grab from the marked pickup, or a prearranged transfer. Details are in AIRPORTS.",idn:"Dari DMK kamu bisa naik bus bandara BMTA (A1-A4), kereta Red Line lewat skywalk dari Terminal 2, taksi argo dari antrean, Grab dari titik jemput yang ditandai, atau transfer yang dipesan duluan. Detailnya ada di bagian AIRPORTS."},pay:{en:"Buses: cash. Red Line: tickets at station (card options may be limited; confirm). Taxi: meter plus the airport surcharge and tolls. Grab: in app.",idn:"Bus: tunai. Red Line: beli tiket di stasiun (opsi kartu mungkin terbatas; pastikan dulu). Taksi: argo plus biaya tambahan bandara dan tol. Grab: di aplikasi."},cost:{en:"A news report (Nov 2026) listed bus fares of 30 THB for A1 (Mo Chit) and A2 (Victory Monument) and 50 THB for A3 (Lumphini) and A4 (Sanam Luang). Taxi: meter + 50 THB surcharge per the airport site + tolls. Red Line is distance-based (the operator lists 1.50 THB per km). Confirm all prices on site.",idn:"Menurut berita (Nov 2026), ongkos bus A1 (Mo Chit) dan A2 (Victory Monument) 30 THB, serta A3 (Lumphini) dan A4 (Sanam Luang) 50 THB. Taksi: argo + biaya tambahan 50 THB menurut situs bandara + tol. Red Line dihitung per jarak (operator mencantumkan 1,50 THB per km). Pastikan semua harga di lokasi."},pros:[{en:"Red Line connects to the MRT Blue Line at Krung Thep Aphiwat.",idn:"Red Line terhubung ke MRT Blue Line di Krung Thep Aphiwat."},{en:"A1 reaches the Mo Chit area where BTS and MRT meet.",idn:"A1 sampai ke area Mo Chit, tempat BTS dan MRT bertemu."},{en:"Grab has a service counter and pickup areas.",idn:"Grab punya konter layanan dan area penjemputan."}],cons:[{en:"Bus routes and schedules were reported inconsistently, and the A2 route changed in 2024.",idn:"Info rute dan jadwal bus beda-beda antarsumber, dan rute A2 berubah di 2024."},{en:"Taxi and Grab queues can be long at peak flights.",idn:"Saat banyak penerbangan tiba, antrean taksi dan Grab bisa panjang."},{en:"Public transport is hard with large cases.",idn:"Transportasi umum susah kalau bawa case besar."}],tips:[{en:"For groups with equipment, pre-book a van or take Grab XL instead of the bus.",idn:"Untuk rombongan yang bawa peralatan, pesan van duluan atau naik Grab XL, jangan bus."},{en:"Check the Red Line operating hours (the airport guide lists 05:00-24:00).",idn:"Cek jam operasional Red Line (panduan bandara mencantumkan 05:00-24:00)."},{en:"A free shuttle between DMK and BKK exists only for connecting passengers with proof of onward flight.",idn:"Shuttle gratis antara DMK dan BKK hanya untuk penumpang transit yang punya bukti penerbangan lanjutan."}],safety:[{en:"Use the airport's official taxi queue and meter; ignore touts.",idn:"Pakai antrean taksi resmi bandara dan argo; abaikan calo."},{en:"Watch bags on buses and trains.",idn:"Jaga tasmu di bus dan kereta."}],apps:[{name:"Grab",note:{en:"Pickup areas at Gates 3-4 (T1) and 11-14 (T2) per the Nov 2026 guide.",idn:"Area penjemputan di Gate 3-4 (T1) dan 11-14 (T2), menurut panduan Nov 2026."}},{name:"ViaBus",note:{en:"Bus routes and live positions.",idn:"Rute bus dan posisi real-time."}}],official:{name:"Don Mueang Airport transport page",url:"https://www.donmueangairport.com/en/transportation"},mistakes:[{en:"Choosing the bus with big equipment cases.",idn:"Memilih bus padahal bawa case peralatan besar."},{en:"Walking to the Red Line station without checking the skywalk and hours.",idn:"Jalan ke stasiun Red Line tanpa cek skywalk dan jam operasionalnya."}],ratings:{speed:3,comfort:3,cost:4,easeForFirstTimers:3},bestFor:{en:"Travellers to Mo Chit/Chatuchak or those comfortable with buses; groups should pre-book a vehicle.",idn:"Cocok untuk yang mau ke Mo Chit/Chatuchak atau terbiasa naik bus; rombongan sebaiknya pesan kendaraan duluan."},source:{name:"Nation Thailand DMK transport guide (3 Nov 2026) and DMK official transport page",url:"https://www.nationthailand.com/news/general/40073046",checked:"2026-11-17"}}],oa=[{id:"bkk",name:{en:"Suvarnabhumi Airport",idn:"Bandara Suvarnabhumi",th:"ท่าอากาศยานสุวรรณภูมิ"},code:"BKK",overview:{en:"Bangkok's main international airport, east of the city. The Airport Rail Link station is on Level B1 and the official public taxi counter is on Level 1 between Gates 4 and 7. Both the taxi counter and Grab pickup are open 24 hours per AOT.",idn:"Bandara internasional utama Bangkok, di sebelah timur kota. Stasiun Airport Rail Link ada di Lantai B1 dan konter taksi resmi di Lantai 1 antara Gate 4 dan 7. Menurut AOT, konter taksi dan penjemputan Grab buka 24 jam."},options:[{mode:{en:"Public (official) taxi",idn:"Taksi resmi"},how:{en:"Go to Level 1, take a queue ticket at the counter or machines (between Gates 4 and 7), and get the taxi assigned to your number.",idn:"Ke Lantai 1, ambil nomor antrean di konter atau mesin (antara Gate 4 dan 7), lalu naik taksi sesuai nomormu."},pay:{en:"Meter fare + 50 THB airport surcharge (to the driver) + tolls paid by you.",idn:"Tarif argo + biaya tambahan bandara 50 THB (ke sopir) + tol yang kamu bayar sendiri."},watchOut:{en:"Do not accept a flat price or an unmarked car; ask for the meter.",idn:"Tolak harga borongan atau mobil tanpa tanda resmi; minta argo dinyalakan."}},{mode:{en:"Airport Rail Link",idn:"Airport Rail Link"},how:{en:"Follow signs to Level B1 and enter the ARL gates. Interchange at Phaya Thai (BTS) or Makkasan (MRT Phetchaburi).",idn:"Ikuti petunjuk ke Lantai B1 dan masuk lewat gerbang ARL. Transit di Phaya Thai (BTS) atau Makkasan (MRT Phetchaburi)."},pay:{en:"Contactless card (reported from 8 Nov 2025) or tokens; hours 05:30-24:00 per AOT.",idn:"Kartu contactless (dilaporkan sejak 8 Nov 2025) atau token; jam operasional 05:30-24:00 menurut AOT."},watchOut:{en:"Interchanges to BTS/MRT need a new fare; cases are hard on stairs.",idn:"Transit ke BTS/MRT perlu bayar tarif baru; case berat repot di tangga."}},{mode:{en:"Grab",idn:"Grab"},how:{en:"Book in the app and walk to Level 1, Gate 4, outer curb.",idn:"Pesan di aplikasi lalu jalan ke Lantai 1, Gate 4, jalur luar."},pay:{en:"In app; check tolls and airport fees.",idn:"Bayar di aplikasi; cek biaya tol dan biaya bandara."},watchOut:{en:"Match plate and driver; wait only at the pickup area.",idn:"Cocokkan pelat nomor dan sopir; tunggu hanya di area penjemputan."}},{mode:{en:"AOT Limousine and chartered vans",idn:"AOT Limousine dan van sewaan"},how:{en:"AOT Limousine counters are on Level 2. Chartered 9-seat vans and a 27-seat LimoBus are listed near Gate 8 on Level 1 (limited hours).",idn:"Konter AOT Limousine ada di Lantai 2. Van sewaan 9 kursi dan LimoBus 27 kursi ada di dekat Gate 8 Lantai 1 (jam terbatas)."},pay:{en:"AOT lists starting rates (from 550 THB eco sedan to 1,300 THB luxury sedan) for the limousine; charter pricing is by operator.",idn:"AOT mencantumkan tarif awal limousine (mulai 550 THB sedan ekonomi sampai 1.300 THB sedan mewah); harga sewa tergantung operator."},watchOut:{en:"Confirm the final price, car size and luggage fit before you pay.",idn:"Pastikan harga akhir, ukuran mobil, dan muat tidaknya barang sebelum bayar."}},{mode:{en:"Public bus or van",idn:"Bus atau van umum"},how:{en:"From the Public Transportation Center: routes include S6/555 to Krung Thep Aphiwat, 554 to Rangsit, and 552B to BTS On Nut. S1 to Khao San leaves from Level 1, Gate 7.",idn:"Dari Public Transportation Center: ada rute S6/555 ke Krung Thep Aphiwat, 554 ke Rangsit, dan 552B ke BTS On Nut. S1 ke Khao San berangkat dari Lantai 1, Gate 7."},pay:{en:"Cash; confirm the route and fare on site.",idn:"Tunai; pastikan rute dan ongkos di lokasi."},watchOut:{en:"Route lists vary between AOT pages; check the live board.",idn:"Daftar rute beda-beda di tiap halaman AOT; cek papan informasi di lokasi."}}],steps:[{en:"Clear immigration, collect bags and customs; head to the Arrivals hall.",idn:"Selesaikan imigrasi, ambil bagasi, lewati bea cukai, lalu menuju aula Kedatangan."},{en:"Decide: Airport Rail Link (B1), official taxi (Level 1), Grab (Level 1 Gate 4) or a pre-booked vehicle.",idn:"Tentukan pilihan: Airport Rail Link (B1), taksi resmi (Lantai 1), Grab (Lantai 1 Gate 4), atau kendaraan yang sudah dipesan."},{en:"Taxi: go to Level 1, take a queue ticket between Gates 4 and 7, and get in the assigned car.",idn:"Taksi: ke Lantai 1, ambil nomor antrean di antara Gate 4 dan 7, lalu naik mobil yang ditentukan."},{en:"Show the Thai destination and say meter please; the 50 THB surcharge is normal, tolls are extra.",idn:"Tunjukkan tujuan dalam bahasa Thai dan minta argo dinyalakan; biaya tambahan 50 THB itu normal, tol dibayar terpisah."},{en:"Rail Link: follow signs to B1, tap in or buy a token, and plan the BTS/MRT interchange.",idn:"Rail Link: ikuti petunjuk ke B1, tap kartu atau beli token, dan rencanakan transit ke BTS/MRT."},{en:"Groups with cases: use a van, Grab XL or a pre-booked transfer instead of a standard taxi or rail.",idn:"Rombongan yang bawa case: pakai van, Grab XL, atau transfer yang dipesan duluan, bukan taksi biasa atau kereta."},{en:"Check the hotel address on the map and note the plate number before leaving.",idn:"Sebelum berangkat, cek alamat hotel di peta dan catat pelat nomornya."}],scams:[{en:"Touts in the arrivals hall offering a taxi or fixed price; use the official queue only.",idn:"Calo di aula kedatangan yang menawarkan taksi atau harga borongan; pakai antrean resmi saja."},{en:"Drivers claiming the flag-fall or surcharge is higher than the official figure; the airport surcharge is 50 THB.",idn:"Sopir yang bilang tarif awal atau biaya tambahan lebih tinggi dari angka resmi; biaya tambahan bandara itu 50 THB."},{en:"A driver who says the meter is broken.",idn:"Sopir yang bilang argonya rusak."}],official:{name:"AOT Suvarnabhumi - Ways to transport",url:"https://suvarnabhumi.airportthai.co.th/service/airport-guide/detail/Transportation_BKK"}},{id:"dmk",name:{en:"Don Mueang Airport",idn:"Bandara Don Mueang",th:"ท่าอากาศยานดอนเมือง"},code:"DMK",overview:{en:"Bangkok's older airport, north of the city, mainly used for low-cost and domestic flights. The Red Line station is reached by an elevated walkway from Level 2 of Terminal 2. Buses A1-A4 leave from the Service Hall on Level 1.",idn:"Bandara lama Bangkok di sebelah utara kota, terutama untuk penerbangan murah dan domestik. Stasiun Red Line bisa dicapai lewat lorong layang dari Lantai 2 Terminal 2. Bus A1-A4 berangkat dari Service Hall di Lantai 1."},options:[{mode:{en:"Metered taxi",idn:"Taksi argo"},how:{en:"Take a queue ticket at Gate 8 on Level 1 (Terminal 1) or at the ground-floor taxi area beside Terminal 2 and wait for your number.",idn:"Ambil nomor antrean di Gate 8 Lantai 1 (Terminal 1) atau di area taksi lantai dasar di samping Terminal 2, lalu tunggu nomormu dipanggil."},pay:{en:"Meter + 50 THB airport surcharge (airport site) + tolls.",idn:"Argo + biaya tambahan bandara 50 THB (menurut situs bandara) + tol."},watchOut:{en:"Insist on the meter and do not accept flat prices.",idn:"Minta argo dinyalakan dan tolak harga borongan."}},{mode:{en:"Grab",idn:"Grab"},how:{en:"Service counter at Gate 7 on Level 1; pickup areas at Gates 3-4 (T1) and 11-14 (T2), per the Nov 2026 guide.",idn:"Konter layanan di Gate 7 Lantai 1; area penjemputan di Gate 3-4 (T1) dan 11-14 (T2), menurut panduan Nov 2026."},pay:{en:"In app; counter hours were reported as 07:00-23:30.",idn:"Bayar di aplikasi; jam konter dilaporkan 07:00-23:30."},watchOut:{en:"Wait at the pickup area, not at the curb.",idn:"Tunggu di area penjemputan resmi, bukan di pinggir jalan."}},{mode:{en:"Red Line train",idn:"Kereta Red Line"},how:{en:"Walk to Don Mueang station via the elevated walkway from Level 2 of Terminal 2. Trains go to Krung Thep Aphiwat, where you can change to the MRT Blue Line.",idn:"Jalan ke stasiun Don Mueang lewat lorong layang d
