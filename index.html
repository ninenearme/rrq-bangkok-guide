t market Bangkok Talad Rot Fai Jodd Fairs",imgQuery:"Train Night Market Bangkok",imgAlt:"Crowded night market stalls under string lights in Bangkok",imgIllustrative:!0},{id:"night-mahanakhon-skywalk",group:"night",title:{en:"MahaNakhon SkyWalk: Bangkok From 300+ Metres",idn:"MahaNakhon SkyWalk: Bangkok dari ketinggian 300+ meter"},desc:{en:"MahaNakhon is the pixelated skyscraper in Sathorn. Its observation deck has indoor panoramic floors, a rooftop level with an outdoor area and a glass tray floor, with a 360-degree view across the city and the river. Going around sunset lets you see Bangkok turn from day to night.",idn:"MahaNakhon adalah gedung pencakar langit berbentuk \"pixel\" di Sathorn. Dek observasinya punya lantai panorama indoor, area rooftop outdoor, dan lantai kaca, dengan pemandangan 360 derajat ke kota dan sungai. Datang menjelang sunset supaya bisa melihat Bangkok berubah dari siang ke malam."},special:{en:"The classic Bangkok skyline moment and a great photo stop. It is a splurge but short and easy, so it fits a tight schedule.",idn:"Momen skyline Bangkok yang klasik dan spot foto keren. Memang agak boros, tapi singkat dan mudah, jadi pas untuk jadwal padat."},bestTime:["evening","night"],timeText:{en:"About 30–60 minutes before sunset to catch both day and night views. Opening times and ticket slots vary, so check.",idn:"Datang 30–60 menit sebelum matahari terbenam supaya dapat pemandangan siang dan malam. Jam buka dan slot tiket bisa berbeda, jadi cek dulu."},cost:{min:900,max:1500},costNote:{en:"Estimate per person for a ticket (~900–1,500 THB); sunset slots and combined tickets can cost more, and prices change. Booking in advance is recommended.",idn:"Perkiraan tiket per orang sekitar 900–1.500 THB; slot sunset dan tiket kombo bisa lebih mahal, dan harga bisa berubah. Disarankan booking lebih awal."},duration:[1,2],area:"other",locationText:{en:"MahaNakhon Tower, Silom / Sathorn",idn:"MahaNakhon Tower, Silom / Sathorn"},transit:{en:"BTS Chong Nonsi station is linked to the tower by a walkway. (Confirm exit on Google Maps.)",idn:"Stasiun BTS Chong Nonsi terhubung ke gedung lewat jalur pejalan kaki. (Cek pintu keluar di Google Maps.)"},indoor:"both",crowd:"both",energy:1,tags:["photo","date-night","team-bonding","late-night"],weather:{en:"Views depend on haze and clouds; check the forecast and AQI for clarity. If it rains the outdoor rooftop part may close for safety, so confirm.",idn:"Pemandangan tergantung kabut dan awan; cek prakiraan cuaca dan kualitas udara (AQI). Saat hujan, rooftop outdoor bisa ditutup demi keamanan, jadi cek dulu."},tips:{en:"Book ahead for sunset. Follow staff instructions on the glass-floor sections and bring a phone strap. Bags and tripods may have to be stored. Wear shoes that suit the rules. Keep the schedule tight: you can be done in about an hour.",idn:"Booking slot sunset lebih awal. Ikuti arahan staf di area lantai kaca dan bawa tali HP. Tas atau tripod mungkin harus dititipkan. Pakai sepatu yang sesuai aturan. Meski jadwal padat, sekitar satu jam sudah cukup."},geoQuery:"MahaNakhon, Bangkok",mapsQuery:"MahaNakhon SkyWalk Bangkok",imgQuery:"MahaNakhon SkyWalk",imgAlt:"The MahaNakhon tower and its rooftop observation deck in Bangkok",imgIllustrative:!1},{id:"night-rooftop-bar-view",group:"night",title:{en:"Rooftop Viewpoint Evening (Sky Bars, Mocktails Welcome)",idn:"Malam di rooftop (sky bar, mocktail juga oke)"},desc:{en:"Bangkok has famous high-rise rooftop bars with open-air terraces over the river and the skyline, such as the long-established Sky Bar at lebua State Tower in Sathorn. You go for the view, sit with a drink and stay as long as you like, usually with a dress code.",idn:"Bangkok punya banyak rooftop bar terkenal di gedung tinggi dengan teras terbuka menghadap sungai dan skyline, seperti Sky Bar di lebua State Tower, Sathorn, yang sudah lama jadi ikon. Kamu datang untuk pemandangannya, pesan satu minuman, dan duduk selama yang kamu mau. Kebanyakan punya aturan berpakaian."},special:{en:"A glamorous, memorable night view you can enjoy even with a non-alcoholic drink. Great for a special evening out or a team celebration.",idn:"Pemandangan malam yang glamor dan berkesan, tetap bisa dinikmati dengan minuman non-alkohol. Pas untuk malam spesial atau perayaan tim."},bestTime:["evening","night"],timeText:{en:"Around sunset to late evening. Opening hours, queues, and reservation rules vary, so check the venue's own page.",idn:"Sekitar sunset sampai malam. Jam buka, antrean, dan aturan reservasi berbeda-beda, jadi cek halaman resmi tempatnya."},cost:{min:500,max:1500},costNote:{en:"Estimate per person (~500–1,500 THB) for one or two drinks; cocktails at famous rooftops are expensive and some venues have minimum spends. A mocktail or soft drink is cheaper.",idn:"Perkiraan per orang sekitar 500–1.500 THB untuk 1–2 minuman. Koktail di rooftop terkenal mahal dan beberapa tempat punya minimal belanja. Mocktail atau soft drink lebih murah."},duration:[1,2],area:"other",locationText:{en:"Rooftop bars around Sathorn / Silom / Sukhumvit, e.g. Sky Bar at lebua State Tower",idn:"Rooftop bar di sekitar Sathorn / Silom / Sukhumvit (misalnya Sky Bar di lebua State Tower)"},transit:{en:"Sky Bar at lebua is a short walk from BTS Saphan Taksin. Other rooftops vary, so use Google Maps. (Confirm exit on Google Maps.)",idn:"Sky Bar di lebua cukup dekat jalan kaki dari BTS Saphan Taksin. Rooftop lain lokasinya beda-beda, jadi pakai Google Maps. (Cek pintu keluar di Google Maps.)"},indoor:"both",crowd:"both",energy:1,tags:["date-night","photo","team-bonding","late-night","relaxing"],weather:{en:"Open-air terraces can close during rain or strong wind, and the view needs clear weather. Check the forecast and the venue's rain policy.",idn:"Teras terbuka bisa ditutup saat hujan atau angin kencang, dan pemandangannya butuh cuaca cerah. Cek prakiraan cuaca dan kebijakan tempatnya saat hujan."},tips:{en:"Legal drinking age in Thailand is 20: bring your passport or a photo ID, as staff may check, and order a mocktail if you are under 20 or do not drink. Alcohol sales can be restricted on certain holidays and days, so check. Many rooftops enforce a dress code (usually smart casual: closed shoes, no sports shorts or flip-flops). Reserve a table where possible, and do not leave drinks unattended.",idn:"Usia legal minum alkohol di Thailand adalah 20 tahun. Staf bisa memeriksa, jadi bawa paspor atau kartu identitas berfoto; kalau di bawah 20 tahun atau tidak minum alkohol, pesan mocktail. Penjualan alkohol bisa dibatasi di hari libur/hari tertentu, jadi cek dulu. Banyak rooftop menerapkan aturan berpakaian (biasanya smart casual: sepatu tertutup, tanpa celana pendek olahraga atau sandal jepit). Kalau bisa, reservasi meja, dan jangan tinggalkan minumanmu tanpa pengawasan."},geoQuery:"Sky Bar at lebua State Tower, Bangkok",mapsQuery:"Sky Bar lebua State Tower Bangkok",imgQuery:"Sky Bar Bangkok lebua",imgAlt:"A rooftop bar terrace overlooking the Bangkok skyline at night",imgIllustrative:!1},{id:"night-late-night-dessert-hunt",group:"night",title:{en:"Late-Night Dessert Hunt (Honey Toast, Bingsu, Thai Sweets)",idn:"Berburu dessert malam (honey toast, bingsu, dessert Thailand)"},desc:{en:"After dinner, Bangkok keeps serving sweets: Thai-style shaved ice and bingsu, honey toast, mango sticky rice stalls, warm Chinese desserts like sesame soup, and dessert cafés open late. Dessert chains such as After You, with branches in malls and trendy neighborhoods, are a safe starting point.",idn:"Habis makan malam, Bangkok masih terus menyajikan yang manis-manis: es serut ala Thailand dan bingsu, honey toast, lapak mango sticky rice, dessert hangat ala Tionghoa seperti sup wijen, dan kafe dessert yang buka sampai malam. Jaringan kafe dessert seperti After You, yang punya cabang di mal dan kawasan trendi, adalah titik awal yang aman."},special:{en:"Cheap, fun, shareable, and a nice cool-down after practice or dinner. Indonesian visitors will love the bingsu (trendy in Indonesian malls too) and honey toast, with some Thai twists like mango or Thai tea.",idn:"Murah, seru, enak dibagi, dan pas untuk mendinginkan badan setelah latihan atau makan. Kamu pasti suka bingsu (yang juga lagi tren di mal-mal Indonesia) dan honey toast-nya, plus ada versi khas Thailand seperti mangga atau Thai tea."},bestTime:["evening","night"],timeText:{en:"After dinner until late. Closing times vary a lot by branch and stall, so check on Google Maps.",idn:"Setelah makan malam sampai larut. Jam tutup tiap cabang dan lapak sangat berbeda, jadi cek di Google Maps."},cost:{min:60,max:250},costNote:{en:"Estimate per person (~60–250 THB): street sweets are cheap; café desserts and shared bingsu cost more.",idn:"Perkiraan per orang sekitar 60–250 THB. Dessert kaki lima murah; dessert kafe dan bingsu untuk berbagi lebih mahal."},duration:[1,2],area:"thonglor",locationText:{en:'Dessert cafés and stalls around Thonglor, Siam malls and Yaowarat. Search "After You dessert cafe Bangkok" or "dessert Bangkok".',idn:'Kafe dan lapak dessert di sekitar Thonglor, mal-mal Siam, dan Yaowarat. Cari "After You dessert cafe Bangkok" atau "dessert Bangkok".'},transit:{en:"Thonglor branches are near BTS Thong Lo; mall branches connect to BTS/MRT. Confirm each branch on Google Maps. (Confirm exit on Google Maps.)",idn:"Cabang Thonglor dekat BTS Thong Lo; cabang di mal terhubung dengan BTS/MRT. Cek tiap cabang di Google Maps. (Cek pintu keluar di Google Maps.)"},indoor:"both",crowd:"both",energy:1,tags:["after-practice","late-night","team-bonding","relaxing","date-night"],weather:{en:"Street sweets are outdoors, so heat and rain apply; cafés are air-conditioned.",idn:"Dessert kaki lima ada di luar ruangan, jadi terpengaruh panas dan hujan; kafe ber-AC."},tips:{en:"Desserts are often shareable: order one per two people. Check for peanut, dairy and egg if you have allergies. Mango sticky rice depends on mango season, so quality varies. Do not eat uncovered street ice and sweets if you have a sensitive stomach and a big schedule ahead.",idn:"Dessert enak dibagi: pesan satu porsi untuk dua orang. Kalau punya alergi, cek kacang, susu, dan telur. Kualitas mango sticky rice tergantung musim mangga. Kalau perutmu sensitif dan ada jadwal penting, hindari es dan dessert kaki lima yang tidak tertutup."},mapsQuery:"After You dessert cafe Bangkok",imgQuery:"Mango sticky rice",imgAlt:"A plate of mango sticky rice, a popular Thai dessert",imgIllustrative:!0},{id:"night-guided-evening-bike-tour",group:"night",title:{en:"Guided Evening Bike Tour (Small Group, Quiet Routes)",idn:"Tur sepeda malam dengan pemandu (grup kecil, rute tenang)"},desc:{en:"Several local operators run evening group bike rides in Bangkok on quieter back lanes and riverside routes, often including a stop for food or a viewpoint. The tour provides bikes, helmets, lights and a guide who handles traffic, so you can focus on the ride.",idn:"Beberapa operator lokal di Bangkok mengadakan tur sepeda grup malam hari lewat gang-gang tenang dan rute tepi sungai, sering dengan mampir makan atau ke spot pemandangan. Sepeda, helm, lampu, dan pemandu yang mengatur lalu lintas sudah disediakan, jadi kamu tinggal fokus bersepeda."},special:{en:"The safest way to cycle at night in Bangkok: no navigating traffic alone, cooler air, and lots of hidden alleys that you would miss in a car.",idn:"Cara paling aman bersepeda malam di Bangkok: tidak perlu menembus lalu lintas sendirian, udaranya lebih sejuk, dan kamu bisa melihat banyak gang tersembunyi yang tidak kelihatan dari mobil."},bestTime:["evening","night"],timeText:{en:"Tours typically start late afternoon or evening and last about 3–4 hours. Schedules vary by operator.",idn:"Tur biasanya mulai sore atau malam dan berlangsung sekitar 3–4 jam. Jadwal tergantung operator."},cost:{min:900,max:1800},costNote:{en:"Estimate per person (~900–1,800 THB), depending on whether food, drinks or a boat crossing are included. Check the inclusions before booking.",idn:"Perkiraan per orang sekitar 900–1.800 THB, tergantung apakah termasuk makanan, minuman, atau naik perahu. Cek apa saja yang termasuk sebelum booking."},duration:[3,4],area:"other",locationText:{en:'Meeting points vary by tour (often Old Town / riverside areas). Search "Bangkok evening bike tour".',idn:'Titik kumpul tiap tur berbeda (sering di Old Town / tepi sungai). Cari "Bangkok evening bike tour".'},transit:{en:"Depends on the tour's meeting point; the operator will give directions. Use Google Maps to confirm the nearest BTS/MRT/pier. (Confirm exit on Google Maps.)",idn:"Tergantung titik kumpul tur; operator akan memberi petunjuk arah. Cek BTS/MRT/dermaga terdekat di Google Maps. (Cek pintu keluar di Google Maps.)"},indoor:"outdoor",crowd:"group",energy:2,tags:["team-bonding","adventurous","photo","late-night","hidden-gem"],weather:{en:"Humid and warm even in the evening; rain can cancel or shorten tours. Wear breathable clothes and closed shoes, and bring a light rain jacket in the wet season.",idn:"Tetap panas dan lembap meski malam; hujan bisa membatalkan atau mempersingkat tur. Pakai baju yang menyerap keringat dan sepatu tertutup, dan bawa jas hujan tipis saat musim hujan."},tips:{en:"Group booking recommended: ask for a private group tour for a big team. Choose an operator with recent good reviews, small groups, lights and helmets, and a clear cancellation policy. Tell the guide about your riding level. Only book through the operator's official channel or a well-known booking platform, and confirm the price. Stay hydrated and follow your guide in traffic.",idn:"Disarankan booking grup; untuk tim besar, minta tur grup privat. Pilih operator dengan ulasan terbaru yang bagus, grup kecil, lampu dan helm, serta kebijakan pembatalan yang jelas. Beri tahu pemandu soal kemampuan bersepedamu. Booking hanya lewat kanal resmi operator atau platform booking terkenal, dan pastikan harganya. Jangan lupa minum dan ikuti pemandu di jalan yang ramai."},mapsQuery:"Bangkok evening bike tour",imgQuery:"Bangkok bicycle tour",imgAlt:"A group of cyclists on a guided bicycle tour in Bangkok",imgIllustrative:!0},{id:"night-photo-walk-talat-noi",group:"night",title:{en:"Night Photo Walk: Talat Noi, Song Wat & Yaowarat Neon",idn:"Jalan-jalan foto malam: Talat Noi, Song Wat & neon Yaowarat"},desc:{en:"Talat Noi and Song Wat are old riverside lanes with Chinese shrines, rusty auto-parts shops, street art and quiet alleys, a few minutes from the neon of Yaowarat. After dark, shrines glow red and the river edge is calm, which makes it a great area for atmospheric night photos.",idn:"Talat Noi dan Song Wat adalah kawasan tua di tepi sungai dengan klenteng, toko onderdil mobil berkarat, street art, dan gang-gang sepi, hanya beberapa menit dari neon Yaowarat. Malam hari, klenteng bercahaya merah dan tepi sungai tenang, jadi cocok banget untuk foto malam yang atmosferik."},special:{en:"Unique textures and light, and you can combine it with Yaowarat's food street. Phones with night mode do well; no fancy gear needed.",idn:"Tekstur dan cahaya yang unik, dan bisa digabung dengan jalan kuliner Yaowarat. HP dengan mode malam sudah cukup; tidak perlu alat canggih."},bestTime:["evening","night"],timeText:{en:"Go at dusk (blue hour, about 17:45–19:00) then continue until about 21:00. Alleys get very quiet later at night.",idn:"Datang saat senja (blue hour, sekitar 17:45–19:00) lalu lanjut sampai sekitar 21:00. Makin malam, gangnya jadi sangat sepi."},cost:{min:0,max:300},costNote:{en:"Free to walk; add a little for snacks, a drink or a boat ride. Estimate only.",idn:"Jalan kaki gratis; siapkan sedikit untuk camilan, minuman, atau ongkos perahu. Hanya perkiraan."},duration:[1,3],area:"talat-noi",locationText:{en:"Talat Noi and Song Wat Road, Samphanthawong, near Yaowarat",idn:"Talat Noi dan Song Wat Road, Samphanthawong, dekat Yaowarat"},transit:{en:"River boat to Ratchawong Pier, or MRT Wat Mangkon then walk (about 15–20 minutes). Confirm the route on Google Maps. (Confirm exit on Google Maps.)",idn:"Naik perahu sungai ke Dermaga Ratchawong, atau MRT Wat Mangkon lalu jalan kaki (sekitar 15–20 menit). Cek rutenya di Google Maps. (Cek pintu keluar di Google Maps.)"},indoor:"outdoor",crowd:"both",energy:1,tags:["photo","hidden-gem","date-night","late-night","adventurous"],weather:{en:"Humid and warm in the evening; narrow lanes with little shade or lighting, and wet pavements after rain. Rain also makes great reflections, but protect your camera.",idn:"Tetap panas dan lembap di malam hari. Gang sempit minim peneduh dan penerangan, dan jalanan licin setelah hujan. Pantulan setelah hujan memang keren, tapi lindungi kameramu."},tips:{en:"Stay in busier lanes after about 21:00 and go in a group; some alleys are dim and uneven. Watch for scooters and motorbikes in narrow lanes. Be respectful at shrines and homes: ask before photographing people, avoid flash near worshippers and do not block entrances. Keep camera straps secure to avoid snatching.",idn:"Setelah sekitar 21:00, tetap di jalan yang ramai dan bergerak dalam grup; beberapa gang gelap dan tidak rata. Hati-hati skuter dan motor di gang sempit. Jaga sopan santun di klenteng dan rumah warga: minta izin sebelum memotret orang, jangan pakai flash dekat orang yang sedang beribadah, dan jangan menghalangi pintu masuk. Pasang tali kamera dengan kencang supaya tidak dijambret."},geoQuery:"Talat Noi, Bangkok",mapsQuery:"Talat Noi Bangkok",imgQuery:"Talat Noi Bangkok",imgAlt:"A narrow alley with a Chinese shrine and street art in Talat Noi, Bangkok",imgIllustrative:!1}]});var W,zo=S(()=>{W=[{id:"gem-loha-prasat",group:"hidden",title:{en:'Loha Prasat at Wat Ratchanatdaram — the "metal castle"',idn:"Loha Prasat (Wat Ratchanatdaram) — kuil \"kastel logam\""},desc:{en:"A rare temple tower topped with 37 metal spires, rising in tiers from a stepped base in Bangkok's Old Town. You can walk up the inner spiral to the upper levels for a view over the rooftops and the nearby Golden Mount. It sits quietly beside the Phra Nakhon temple belt and is far less crowded than the Grand Palace.",idn:"Menara kuil unik dengan 37 puncak logam yang menjulang bertingkat. Lewat tangga spiral di dalamnya, kamu bisa naik ke lantai atas dan melihat atap-atap Old Town serta Golden Mount di dekatnya. Jauh lebih sepi daripada Grand Palace, jadi enak untuk berkeliling dengan tenang."},special:{en:"Loha Prasat is one of only a few of its kind in the world, yet most visitors skip it. The dark metal-and-white look is nothing like the usual gold temples.",idn:"Arsitektur seperti ini hanya ada sedikit di dunia, tapi kebanyakan turis melewatkannya. Nuansa logam gelapnya beda total dari kuil-kuil emas, dan hasil fotonya keren."},bestTime:["morning","afternoon"],timeText:{en:"Morning or late afternoon is cooler; check Google Maps for current opening hours",idn:"Pagi atau sore lebih sejuk. Pastikan cek jam buka di Google Maps"},cost:{min:0,max:50},costNote:{en:"Small entry fee may apply for the tower (estimate). Check on arrival.",idn:"Mungkin ada biaya masuk kecil untuk menara (perkiraan). Cek saat tiba."},duration:[.5,1],area:"other",locationText:{en:"Wat Ratchanatdaram, Maha Chai Road, Old Town (Phra Nakhon)",idn:"Wat Ratchanatdaram, Maha Chai Road, Old Town (Phra Nakhon)"},transit:{en:"No direct BTS. MRT Sam Yot is the nearest rail option, then a walk or short Grab. (Confirm station and exit on Google Maps.)",idn:"Tidak ada BTS langsung. MRT Sam Yot paling dekat, lalu jalan kaki atau naik Grab sebentar. (Cek stasiun dan pintu keluar di Google Maps.)"},indoor:"both",crowd:"both",energy:1,tags:["hidden-gem","photo","relaxing","after-practice"],weather:{en:"The stair climb is partly outdoors and hot at midday. Bring water and avoid noon sun.",idn:"Sebagian tangga ada di luar ruangan, jadi cukup panas di siang hari. Bawa air minum dan hindari terik tengah hari."},tips:{en:"Temple dress code: cover shoulders and knees; no shorts or sleeveless tops. Take off shoes where indicated. Keep voices low and do not point feet at Buddha images. Good low-effort stop after a busy day; combine it with the Giant Swing and Ban Bat nearby.",idn:"Aturan berpakaian di kuil: tutup bahu dan lutut (tidak boleh celana pendek atau baju tanpa lengan). Lepas sepatu di area yang ditandai. Jaga suara dan jangan arahkan kaki ke patung Buddha. Cocok untuk mampir santai setelah hari yang padat; gabungkan dengan Giant Swing dan Ban Bat di dekatnya."},geoQuery:"Wat Ratchanatdaram, Bangkok",mapsQuery:"Loha Prasat Wat Ratchanatdaram Bangkok",imgQuery:"Loha Prasat Wat Ratchanatdaram",imgAlt:"Tiered Loha Prasat tower with many metal spires at Wat Ratchanatdaram",imgIllustrative:!1},{id:"gem-giant-swing-wat-suthat",group:"hidden",title:{en:"Giant Swing & Wat Suthat at golden hour",idn:"Giant Swing & Wat Suthat — jalan santai saat senja"},desc:{en:"The towering red teak Giant Swing (Sao Ching Cha) stands in front of Wat Suthat, a royal temple with a huge Buddha hall and some of Bangkok's finest old murals. The area around the swing is a calm, almost village-like patch of Old Town with Brahmin shrines and old shophouses.",idn:"Ayunan raksasa dari kayu jati merah (Sao Ching Cha) berdiri menjulang di depan Wat Suthat. Di aula utamanya ada patung Buddha besar dan mural-mural tua, dan di sekitar ayunan masih ada kuil Brahmana dan ruko-ruko tua, jadi suasananya seperti kampung."},special:{en:"Most tourists pass it in a tuk-tuk. Walking around it at dusk, when the light turns warm and traffic thins, is a quiet local-feeling moment in the middle of the Old Town.",idn:"Kebanyakan turis cuma lewat naik tuk-tuk. Jalan pelan-pelan di sini saat senja, ketika cahaya menghangat dan lalu lintas berkurang, memberi momen tenang bernuansa lokal di tengah Old Town."},bestTime:["morning","evening"],timeText:{en:"Early morning or 16:30–18:00 for soft light (check temple hours on Google Maps)",idn:"Pagi-pagi atau sekitar 16:30–18:00 untuk cahaya yang lembut (cek jam buka kuil di Google Maps)"},cost:{min:0,max:100},costNote:{en:"The Giant Swing area is free; entering Wat Suthat usually has a small fee (estimate).",idn:"Area sekitar ayunan gratis; masuk ke Wat Suthat biasanya ada biaya kecil (perkiraan)."},duration:[1,1.5],area:"other",locationText:{en:"Sao Ching Cha / Wat Suthat, Old Town",idn:"Sao Ching Cha / Wat Suthat, Old Town"},transit:{en:"MRT Sam Yot is the closest rail option, then walk or short Grab. (Confirm exit on Google Maps.)",idn:"MRT Sam Yot paling dekat, lalu jalan kaki atau naik Grab sebentar. (Cek pintu keluar di Google Maps.)"},indoor:"outdoor",crowd:"both",energy:1,tags:["hidden-gem","photo","relaxing","date-night"],weather:{en:"Little shade around the swing; very hot at midday. Evening is much more comfortable.",idn:"Sekitar ayunan minim peneduh, jadi sangat panas di siang hari. Sore menjelang malam jauh lebih nyaman."},tips:{en:"Temple dress code: shoulders and knees covered; remove shoes inside halls. Not a heavy-walking route, so it suits a rest day. Pair it with Loha Prasat and Ban Bat on the same loop.",idn:"Aturan berpakaian di kuil: tutup bahu dan lutut, lepas sepatu di dalam aula. Rutenya tidak banyak jalan kaki, jadi cocok untuk hari istirahat. Gabungkan dengan Loha Prasat dan Ban Bat dalam satu rute."},geoQuery:"Giant Swing, Bangkok",mapsQuery:"Giant Swing Wat Suthat Bangkok",imgQuery:"Giant Swing Bangkok",imgAlt:"The red Giant Swing in front of Wat Suthat Bangkok",imgIllustrative:!1},{id:"gem-wat-ratchabophit",group:"hidden",title:{en:"Wat Ratchabophit — Thai temple with a European-style twist",idn:"Wat Ratchabophit — kuil Thailand dengan sentuhan Eropa"},desc:{en:"A 19th-century royal temple that mixes Thai roofs with European-influenced details and a circular cloister around the central chedi. The inner courtyard is tiled in colorful patterns and feels intimate compared with its famous neighbors.",idn:"Kuil kerajaan abad ke-19 dengan arsitektur unik yang memadukan atap Thailand dan detail bergaya Eropa. Ada serambi melingkar yang mengelilingi chedi utama, halaman dalamnya dihiasi ubin warna-warni, dan suasananya lebih intim dan tenang dibanding kuil-kuil terkenal di sekitarnya."},special:{en:"Architecture fans get something no gold-roofed postcard temple offers: Thai and European styles blended together in a calm, uncrowded setting.",idn:"Beda dari kuil emas ala kartu pos, di sini kamu bisa menikmati arsitektur perpaduan Thailand dan Eropa dengan suasana yang sepi."},bestTime:["morning","afternoon"],timeText:{en:"Morning or late afternoon; check Google Maps for current hours",idn:"Disarankan pagi atau sore. Cek jam buka di Google Maps"},cost:{min:0,max:50},costNote:{en:"Free or a very small donation/fee (estimate).",idn:"Gratis atau donasi/biaya masuk yang sangat kecil (perkiraan)."},duration:[.5,1],area:"other",locationText:{en:"Wat Ratchabophit, near Wat Pho and Pak Khlong Talat (Old Town)",idn:"Wat Ratchabophit, dekat Wat Pho dan Pak Khlong Talat (Old Town)"},transit:{en:"Walkable from MRT Sanam Chai (about 15 min, confirm on Google Maps) or by Grab; river boat to Tha Tien then a short ride also works.",idn:"Bisa jalan kaki sekitar 15 menit dari MRT Sanam Chai (cek di Google Maps). Grab juga praktis, atau dari Dermaga Tha Tien."},indoor:"both",crowd:"both",energy:1,tags:["hidden-gem","photo","relaxing","after-practice"],weather:{en:"Open courtyard with little shade; avoid midday heat.",idn:"Halamannya terbuka dan minim peneduh. Hindari siang hari."},tips:{en:"Dress code: shoulders and knees covered. Remove shoes in prayer halls. A nice add-on with Pak Khlong Talat and Wat Pho.",idn:"Aturan berpakaian: tutup bahu dan lutut, lepas sepatu di aula ibadah. Enak digabung dalam satu rute dengan Pak Khlong Talat atau Wat Pho."},geoQuery:"Wat Ratchabophit, Bangkok",mapsQuery:"Wat Ratchabophit Bangkok",imgQuery:"Wat Ratchabophit",imgAlt:"Circular cloister and chedi at Wat Ratchabophit in Bangkok",imgIllustrative:!1},{id:"gem-santichaiprakan-phra-sumen",group:"hidden",title:{en:"Santichaiprakan Park & Phra Sumen Fort at sunset",idn:"Taman Santichaiprakan & Benteng Phra Sumen — spot sunset"},desc:{en:"A small riverside park beside the white, octagonal Phra Sumen Fort, one of the two surviving forts of old Bangkok. Locals come for the breeze, jogging, snacks and sunset over the Chao Phraya, with a leafy old-style feel that is totally different from the Khao San tourist strip just nearby.",idn:"Taman kecil di tepi sungai di samping Benteng Phra Sumen yang putih dan berbentuk segi delapan, salah satu dari dua benteng Bangkok lama yang masih tersisa. Warga lokal datang untuk menikmati angin, jogging, ngemil, dan melihat sunset di Sungai Chao Phraya, dengan suasana yang beda total dari Jalan Khao San yang ada persis di dekatnya."},special:{en:"Free, breezy, and cooler than almost anywhere in the old city at dusk. You get fort, river and sunset in one stop.",idn:"Gratis, berangin, dan saat senja jadi salah satu tempat paling sejuk di kota tua. Benteng, sungai, dan sunset sekaligus di satu tempat."},bestTime:["evening"],timeText:{en:"About an hour before sunset until dusk",idn:"Sekitar satu jam sebelum matahari terbenam sampai senja"},cost:{min:0,max:150},costNote:{en:"Park is free. Budget a little for street snacks or a drink nearby (estimate).",idn:"Tamannya gratis. Siapkan sedikit untuk camilan atau minuman di sekitarnya (perkiraan)."},duration:[1,2],area:"other",locationText:{en:"Phra Arthit Road, Phra Nakhon (Old Town riverside)",idn:"Phra Arthit Road, Phra Nakhon (tepi sungai Old Town)"},transit:{en:"Chao Phraya Express boat to Phra Arthit Pier (N13), then a short walk. (Confirm pier on Google Maps.)",idn:"Naik Chao Phraya Express Boat ke Dermaga Phra Arthit (N13), lalu jalan kaki sebentar. (Cek dermaga di Google Maps.)"},indoor:"outdoor",crowd:"both",energy:1,tags:["hidden-gem","relaxing","photo","date-night","after-practice"],weather:{en:"Shade is limited; mosquitoes after dark, so bring repellent. Skip it in heavy rain.",idn:"Minim peneduh dan banyak nyamuk setelah gelap, jadi bawa lotion anti nyamuk. Skip kalau hujan deras."},tips:{en:"A great low-energy end to a day. Keep valuables close in the evening crowd. Phra Arthit Road has plenty of small cafés for before or after.",idn:"Pas untuk menutup hari dengan santai. Jaga barang berharga saat ramai di malam hari. Di Phra Arthit Road banyak kafe kecil untuk mampir sebelum atau sesudahnya."},geoQuery:"Santichaiprakan Park, Bangkok",mapsQuery:"Santichaiprakan Park Phra Sumen Fort Bangkok",imgQuery:"Phra Sumen Fort",imgAlt:"White Phra Sumen Fort beside the Chao Phraya River at Santichaiprakan Park",imgIllustrative:!1},{id:"gem-wat-intharawihan",group:"hidden",title:{en:"Wat Intharawihan — the giant standing Buddha",idn:"Wat Intharawihan — Buddha berdiri raksasa"},desc:{en:"A neighborhood temple in Bang Khun Phrom famous for a very tall golden standing Buddha towering above the surrounding rooftops. It sits in an everyday local area, so you also see how Bangkokians actually use their temples.",idn:"Kuil di kawasan Bang Khun Phrom yang terkenal dengan patung Buddha berdiri berwarna emas yang sangat tinggi, menjulang di atas atap-atap sekitarnya. Letaknya di tengah permukiman warga, jadi kamu juga bisa melihat bagaimana warga Bangkok memanfaatkan kuil sehari-hari."},special:{en:"Few foreign visitors come here despite its size, and with quiet streets around it, it feels like a real temple rather than a sight.",idn:"Meski ukurannya besar, jarang ada turis asing yang datang, jadi terasa seperti kuil kampung yang asli, bukan tempat wisata."},bestTime:["morning","afternoon"],timeText:{en:"Morning or late afternoon. Check Google Maps for current hours.",idn:"Pagi atau sore. Cek jam buka di Google Maps"},cost:{min:0,max:50},costNote:{en:"Usually free, donations welcome (estimate).",idn:"Biasanya gratis, donasi sukarela (perkiraan)."},duration:[.5,1],area:"other",locationText:{en:"Wat Intharawihan, Bang Khun Phrom, near Phra Sumen Fort",idn:"Wat Intharawihan, Bang Khun Phrom, dekat Benteng Phra Sumen"},transit:{en:"Grab or taxi is easiest; it is a short ride from Phra Arthit. (Confirm on Google Maps.)",idn:"Paling gampang naik Grab atau taksi; dekat dari Phra Arthit. (Cek di Google Maps.)"},indoor:"both",crowd:"both",energy:1,tags:["hidden-gem","photo","relaxing"],weather:{en:"Courtyard has limited shade; go early or late.",idn:"Halamannya minim peneduh, jadi datang pagi-pagi atau sore."},tips:{en:"Dress code: shoulders and knees covered. Do not climb on or touch the statue. Pair with Santichaiprakan Park for sunset.",idn:"Aturan berpakaian: tutup bahu dan lutut. Jangan memanjat atau menyentuh patung Buddha. Gabungkan dengan sunset di Taman Santichaiprakan."},geoQuery:"Wat Intharawihan, Bangkok",mapsQuery:"Wat Intharawihan Bangkok standing Buddha",imgQuery:"Wat Intharawihan",imgAlt:"Tall golden standing Buddha statue at Wat Intharawihan, Bangkok",imgIllustrative:!1},{id:"gem-kudi-chin-santa-cruz",group:"hidden",title:{en:"Kudi Chin & Santa Cruz Church — Portuguese-era Thonburi",idn:"Kudi Chin & Gereja Santa Cruz — jejak Portugis di Thonburi"},desc:{en:"A small old riverside community in Thonburi where Portuguese, Chinese and Thai descendants have lived for generations. The Santa Cruz Church has a distinctive dome and a calm interior, and the lanes nearby are known for traditional baked sweets (kanom farang) and old wooden houses.",idn:"Kampung tua kecil di tepi sungai Thonburi, tempat keturunan Portugis, Tionghoa, dan Thailand tinggal turun-temurun. Gereja Santa Cruz punya kubah bulat yang khas dan interior yang tenang, dan di gang-gangnya masih ada kue panggang tradisional kanom farang serta rumah-rumah kayu tua."},special:{en:"It shows a very different, multicultural layer of Bangkok history, and tourists rarely wander the lanes.",idn:"Tempat untuk melihat lapisan multikultural sejarah Bangkok, tapi hampir tidak ada turis yang menyusuri gang-gangnya."},bestTime:["morning","afternoon"],timeText:{en:"Daytime. Church access varies; check Google Maps for current info.",idn:"Disarankan siang hari. Akses ke gereja bisa berubah, jadi cek di Google Maps"},cost:{min:0,max:150},costNote:{en:"Free to walk; budget a little for sweets and a drink (estimate).",idn:"Jalan kaki gratis; siapkan sedikit untuk kue dan minuman (perkiraan)."},duration:[1,2],area:"other",locationText:{en:"Kudi Chin, Thonburi side near Memorial Bridge",idn:"Kudi Chin, sisi Thonburi dekat Memorial Bridge"},transit:{en:"A short Grab, or river boat/cross-river ferry near Memorial Bridge and then a walk. (Confirm exact pier on Google Maps.)",idn:"Naik Grab sebentar, atau naik perahu/feri penyeberangan dekat Memorial Bridge lalu jalan kaki. (Cek dermaga persisnya di Google Maps.)"},indoor:"both",crowd:"both",energy:1,tags:["hidden-gem","photo","relaxing","adventurous"],weather:{en:"Walking is mostly outdoors and shade is patchy. Avoid midday heat.",idn:"Kebanyakan jalan kaki di luar ruangan dengan peneduh yang jarang-jarang. Hindari panas siang hari."},tips:{en:"Church dress code applies: shoulders and knees covered, quiet voices. It is an active community, so avoid filming residents without asking.",idn:"Ada aturan berpakaian di gereja: tutup bahu dan lutut, dan jaga suara. Ini permukiman yang masih ditinggali warga, jadi jangan memotret/merekam orang tanpa izin."},geoQuery:"Santa Cruz Church, Bangkok",mapsQuery:"Santa Cruz Church Kudi Chin Bangkok",imgQuery:"Santa Cruz Church Bangkok",imgAlt:"Santa Cruz Church with its dome in Kudi Chin, Thonburi",imgIllustrative:!1},{id:"gem-lhong-1919",group:"hidden",title:{en:"Lhong 1919 — restored Chinese-style riverside compound",idn:"Lhong 1919 — kompleks bergaya Tionghoa di tepi sungai yang direstorasi"},desc:{en:"A restored historic Chinese-style compound on the Thonburi riverbank, now a calm spot with courtyards, shrines, small shops and café spaces. Its red-and-green details and river view make it feel like a mini heritage village.",idn:"Kompleks bersejarah bergaya Tionghoa di tepi sungai Thonburi yang sudah direstorasi, dengan halaman, klenteng, toko kecil, dan kafe. Detail merah-hijaunya berpadu dengan pemandangan sungai, jadi terasa seperti desa warisan budaya mini."},special:{en:"It is beautiful and photogenic yet much quieter than the big riverside malls next door. A good change from glass towers.",idn:"Cantik dan fotogenik, tapi jauh lebih sepi daripada mal-mal besar di sebelahnya. Pas untuk rehat dari gedung-gedung kaca."},bestTime:["afternoon","evening"],timeText:{en:"Late afternoon for light; check Google Maps for current hours",idn:"Disarankan sore hari saat cahayanya bagus. Cek jam buka di Google Maps"},cost:{min:0,max:250},costNote:{en:"Entry is typically free; budget for drinks and snacks (estimate).",idn:"Masuk biasanya gratis; siapkan untuk minuman dan camilan (perkiraan)."},duration:[1,2],area:"riverside",locationText:{en:"Lhong 1919, Khlong San riverside, Thonburi",idn:"Lhong 1919, tepi sungai Khlong San, Thonburi"},transit:{en:"Grab is simplest. River boats and ICONSIAM-area piers are nearby, but confirm the best route on Google Maps.",idn:"Grab paling simpel. Ada perahu sungai dan dermaga di area ICONSIAM di dekatnya, tapi cek rute terbaik di Google Maps."},indoor:"both",crowd:"both",energy:1,tags:["hidden-gem","photo","relaxing","date-night"],weather:{en:"Courtyards are open air and warm; there are covered corners for rain.",idn:"Halamannya terbuka jadi cukup panas, tapi ada sudut beratap buat berteduh kalau hujan."},tips:{en:"Treat shrines respectfully. Cafés and shops have their own hours, so confirm before a long trip. Easy to combine with ICONSIAM nearby.",idn:"Hormati tempat sembahyangnya ya. Jam buka kafe dan toko beda-beda, jadi cek dulu sebelum jalan jauh. Gampang digabung dengan ICONSIAM yang ada di dekatnya."},geoQuery:"Lhong 1919, Bangkok",mapsQuery:"Lhong 1919 Bangkok",imgQuery:"Lhong 1919 Bangkok",imgAlt:"Chinese-style courtyard at Lhong 1919 on the Chao Phraya riverbank",imgIllustrative:!1},{id:"gem-wat-prayoon-turtle-hill",group:"hidden",title:{en:"Wat Prayurawongsawat — the artificial hill and turtle pond",idn:"Wat Prayurawongsawat — bukit buatan dan kolam kura-kura"},desc:{en:"A Thonburi temple near Memorial Bridge known for a small artificial hill topped with a white chedi and a pond full of turtles you can feed. It has a quiet, almost village atmosphere, and the whole visit is a short, gentle outing.",idn:"Kuil di Thonburi dekat Memorial Bridge yang terkenal dengan bukit buatan kecil berpuncak chedi putih dan kolam penuh kura-kura. Suasana sekitarnya tenang, cocok buat mampir sebentar dan santai."},special:{en:"An unusual, low-key stop with a bit of humor: turtles, a mini mountain and a very local setting. Great when everyone is tired but wants something light.",idn:"Kura-kura, gunung mini, sampai suasana yang lokal banget — spot unik yang diam-diam lucu. Pas banget waktu semua capek tapi masih pengin jalan-jalan ringan."},bestTime:["morning","afternoon"],timeText:{en:"Daytime; check Google Maps for current hours",idn:"Paling enak siang hari. Cek jam buka di Google Maps"},cost:{min:0,max:100},costNote:{en:"Usually free; a small amount for turtle food or donation (estimate).",idn:"Biasanya gratis; paling keluar sedikit buat pakan kura-kura atau donasi (perkiraan)."},duration:[.5,1],area:"other",locationText:{en:"Wat Prayurawongsawat, Thonburi near Memorial Bridge",idn:"Wat Prayurawongsawat, Thonburi dekat Memorial Bridge"},transit:{en:"Grab, or walk over Memorial Bridge from the Phra Nakhon side. Confirm the walking route and pier on Google Maps.",idn:"Naik Grab, atau jalan kaki menyeberangi Memorial Bridge dari sisi Phra Nakhon. Cek rute jalan kaki dan dermaganya di Google Maps."},indoor:"outdoor",crowd:"both",energy:1,tags:["hidden-gem","photo","relaxing","after-practice"],weather:{en:"Mostly open air and sunny; skip heavy rain and midday heat.",idn:"Sebagian besar terbuka dan terik. Hindari hujan deras dan panas tengah hari."},tips:{en:"Dress code: shoulders and knees covered. Feed turtles only with the food sold on site, nothing else.",idn:"Pakaian: tutup bahu dan lutut. Beri makan kura-kura hanya dengan pakan yang dijual di sana."},geoQuery:"Wat Prayurawongsawat, Bangkok",mapsQuery:"Wat Prayurawongsawat Bangkok turtle",imgQuery:"Wat Prayurawongsawat",imgAlt:"White chedi on a small hill at Wat Prayurawongsawat, Bangkok",imgIllustrative:!1},{id:"gem-holy-rosary-church",group:"hidden",title:{en:"Holy Rosary Church (Wat Kalawar) near Talat Noi",idn:"Gereja Holy Rosary (Wat Kalawar) — dekat Talat Noi"},desc:{en:"A historic Roman Catholic church on the Chao Phraya riverbank, built by the Portuguese community and known for its pale façade and elegant interior. It sits quietly near Talat Noi's alleys and Chinese shrines.",idn:"Gereja Katolik bersejarah di tepi Sungai Chao Phraya yang dibangun oleh komunitas Portugis. Fasadnya berwarna pastel lembut dengan interior yang anggun, dan letaknya tenang di dekat gang-gang Talat Noi dan kelenteng Tionghoa."},special:{en:"Talat Noi is usually seen as a Chinese-Thai neighborhood; this church shows the older Portuguese layer.",idn:"Talat Noi biasanya dikenal sebagai kawasan Tionghoa-Thai, tapi gereja ini menunjukkan lapisan sejarah Portugis yang lebih tua."},bestTime:["morning","afternoon"],timeText:{en:"Daytime. Church access varies, so check Google Maps first (do not enter during services).",idn:"Paling enak siang hari. Cek di Google Maps apakah sedang buka (jangan masuk saat misa)"},cost:{min:0,max:50},costNote:{en:"Free; donations optional (estimate).",idn:"Gratis, donasi sukarela (perkiraan)."},duration:[.5,1],area:"talat-noi",locationText:{en:"Holy Rosary Church (Wat Kalawar), riverside near Talat Noi",idn:"Gereja Holy Rosary (Wat Kalawar), tepi sungai dekat Talat Noi"},transit:{en:"Walkable as part of a Talat Noi loop; river boat (Ratchawong Pier area) or MRT Wat Mangkon plus Grab also work. (Confirm on Google Maps.)",idn:"Bisa jalan kaki sebagai bagian dari rute keliling Talat Noi. Bisa juga naik perahu sungai (area Dermaga Ratchawong) atau MRT Wat Mangkon + Grab. (Cek di Google Maps)"},indoor:"both",crowd:"both",energy:1,tags:["hidden-gem","photo","relaxing"],weather:{en:"Interior is cooler than outside; the walk to it can be hot.",idn:"Di dalam lebih sejuk daripada di luar, tapi jalan ke sananya bisa panas."},tips:{en:"Church dress code: shoulders and knees covered, quiet voices. No flash photography, and respect worshippers.",idn:"Aturan berpakaian di gereja: tutup bahu dan lutut, jaga suara tetap pelan. Jangan pakai flash, dan hormati orang yang sedang beribadah."},geoQuery:"Holy Rosary Church, Bangkok",mapsQuery:"Holy Rosary Church Wat Kalawar Bangkok",imgQuery:"Holy Rosary Church Bangkok",imgAlt:"Holy Rosary Church on the Chao Phraya riverbank in Bangkok",imgIllustrative:!1},{id:"gem-talat-noi-alleys",group:"hidden",title:{en:"Talat Noi back alleys — shrines, street art and old garages",idn:"Gang-gang Talat Noi — kelenteng, street art, bengkel tua"},desc:{en:"A narrow riverside neighborhood where tiny Chinese shrines, old auto-parts shops, murals and low-key cafés sit side by side. It is best explored on foot, wandering without a strict plan.",idn:"Di kawasan tepi sungai yang sempit ini, kelenteng Tionghoa kecil, toko onderdil mobil tua, mural, dan kafe mungil berjejer berdampingan. Paling asyik dijelajahi jalan kaki tanpa rencana."},special:{en:'It is a living workshop neighborhood, not a mall-made "vintage" district, which is what makes it so photogenic.',idn:"Ini bukan kawasan \"vintage\" buatan mal, tapi lingkungan yang bengkel-bengkelnya masih beroperasi — makanya fotonya terasa hidup."},bestTime:["morning","afternoon"],timeText:{en:"Late morning to late afternoon, weekdays are quieter and many workshops are active",idn:"Siang menjelang sore. Hari kerja lebih sepi dan banyak bengkel yang buka"},cost:{min:0,max:300},costNote:{en:"Walking is free; budget for coffee or street food (estimate).",idn:"Jalan-jalannya gratis. Siapkan budget buat kopi atau jajanan kaki lima saja (perkiraan)."},duration:[1.5,3],area:"talat-noi",locationText:{en:"Talat Noi, Samphanthawong (riverside)",idn:"Talat Noi, tepi sungai Samphanthawong"},transit:{en:"River boat to the Ratchawong Pier area, or MRT Hua Lamphong then Grab; confirm on Google Maps.",idn:"Naik perahu sungai ke area Dermaga Ratchawong, atau MRT Hua Lamphong lalu Grab. Cek di Google Maps."},indoor:"outdoor",crowd:"both",energy:2,tags:["hidden-gem","photo","adventurous","after-practice"],weather:{en:"Hot and shadeless in places; bring water. Alleys flood slightly in heavy rain.",idn:"Banyak bagian tanpa naungan dan panas. Bawa air minum. Kalau hujan deras, gangnya bisa sedikit tergenang."},tips:{en:"Narrow lanes with scooters; watch your step and your phone. Be respectful at shrines and do not photograph workers closely without asking.",idn:"Gangnya sempit dan dilewati motor, jadi hati-hati langkah dan HP kamu. Jaga sopan santun di kelenteng, dan jangan memotret pekerja dari dekat tanpa izin."},geoQuery:"Talat Noi, Bangkok",mapsQuery:"Talat Noi Bangkok",imgQuery:"Talat Noi Bangkok",imgAlt:"Narrow alley with murals and shrines in Talat Noi, Bangkok",imgIllustrative:!1},{id:"gem-haroon-mosque",group:"hidden",title:{en:"Haroon Mosque and the Bang Rak mosque community",idn:"Masjid Haroon — kampung Muslim di Bang Rak"},desc:{en:"A long-established mosque in the old Bang Rak riverside quarter, surrounded by a small Muslim community with lanes of halal food stalls and homes. Visiting shows a very different side of Bangkok from malls and temples.",idn:"Masjid tua di kawasan lama tepi sungai Bang Rak. Di sekitarnya ada komunitas Muslim kecil dengan gang berisi warung makanan halal dan rumah-rumah warga. Kamu bisa lihat sisi Bangkok yang beda dari mal dan kuil."},special:{en:"Bangkok has many communities layered together; this one is calm, local and rarely on tourist maps.",idn:"Bangkok adalah kota dengan banyak komunitas yang berlapis-lapis; yang satu ini tenang, lokal, dan hampir nggak pernah muncul di peta wisata."},bestTime:["morning","afternoon"],timeText:{en:"Daytime; avoid prayer times and check Google Maps for access",idn:"Paling enak siang hari. Hindari waktu salat dan cek akses berkunjung di Google Maps"},cost:{min:0,max:200},costNote:{en:"Free to look; budget for halal snacks or lunch nearby (estimate).",idn:"Lihat-lihat gratis. Siapkan budget buat camilan atau makan siang halal di sekitar (perkiraan)."},duration:[1,2],area:"other",locationText:{en:"Haroon Mosque, Bang Rak riverside off Charoen Krung Road",idn:"Masjid Haroon, tepi sungai Bang Rak, masuk dari Charoen Krung Road"},transit:{en:"BTS Saphan Taksin plus Grab is easiest; river boats stop nearby but confirm the right pier on Google Maps.",idn:"Paling gampang BTS Saphan Taksin + Grab. Perahu sungai juga berhenti di dekat sini, tapi cek dermaga yang tepat di Google Maps."},indoor:"both",crowd:"both",energy:1,tags:["hidden-gem","relaxing","adventurous"],weather:{en:"Lanes are open-air and hot at midday.",idn:"Gangnya terbuka, jadi panas di tengah hari."},tips:{en:"Ask before entering any prayer space; dress modestly (cover shoulders, knees and arms; women may be asked to cover hair). Remove shoes, keep quiet and be discreet with photos. Friday midday and prayer times are busy for worshippers.",idn:"Tanya dulu sebelum masuk ke ruang salat. Pakai pakaian sopan (tutup bahu, lutut, dan lengan; perempuan mungkin diminta menutup rambut). Lepas alas kaki, jaga suara, dan hati-hati saat memotret. Jumat siang dan waktu salat biasanya ramai jemaah."},geoQuery:"Haroon Mosque, Bangkok",mapsQuery:"Haroon Mosque Bang Rak Bangkok",imgQuery:"Haroon Mosque Bangkok",imgAlt:"Haroon Mosque in the Bang Rak district of Bangkok",imgIllustrative:!1},{id:"gem-bangkokian-museum",group:"hidden",title:{en:"The Bangkokian Museum — a 1930s home in Bang Rak",idn:"Bangkokian Museum — rumah tahun 1930-an di Bang Rak"},desc:{en:"A small museum in a set of old Bangkok houses in Bang Rak that shows how ordinary families lived in the early to mid 20th century. The rooms are filled with period furniture and household items, in a quiet garden compound.",idn:"Museum yang dibuat dari rumah-rumah tua Bangkok di Bang Rak. Lewat perabot dan barang rumah tangga zaman itu, museum ini menunjukkan bagaimana keluarga biasa hidup di awal hingga pertengahan abad ke-20. Tempatnya mungil dengan taman yang tenang."},special:{en:"Instead of palaces and kings, it shows everyday life, so it is surprisingly relatable and uncrowded.",idn:"Bukan cerita istana atau raja, tapi kehidupan sehari-hari — jadi ternyata relatable dan sepi pengunjung."},bestTime:["morning","afternoon"],timeText:{en:"Daytime; opening days and hours change, so check Google Maps first",idn:"Siang hari. Hari dan jam buka bisa berubah, jadi cek Google Maps dulu"},cost:{min:0,max:100},costNote:{en:"Free or very low entry (estimate). Check on arrival.",idn:"Gratis atau tiket masuknya murah banget (perkiraan). Cek saat tiba."},duration:[.5,1.5],area:"other",locationText:{en:"Bangkokian Museum, Charoen Krung Soi 43, Bang Rak",idn:"Bangkokian Museum, Charoen Krung Soi 43, Bang Rak"},transit:{en:"Grab is simplest; BTS Saphan Taksin is about 2 km away. (Confirm on Google Maps.)",idn:"Paling simpel naik Grab. Dari BTS Saphan Taksin jaraknya sekitar 2 km. (Cek di Google Maps)"},indoor:"indoor",crowd:"both",energy:1,tags:["hidden-gem","relaxing","rainy-day","after-practice"],tips:{en:"Great rainy-day or very low-energy option. Dress modestly and avoid touching exhibits. Check for photo rules inside.",idn:"Cocok buat hari hujan atau hari ketika energi tinggal sisa. Pakai pakaian sopan dan jangan sentuh barang pameran. Cek aturan foto di dalam saat di lokasi."},geoQuery:"Bangkokian Museum, Bangkok",mapsQuery:"Bangkokian Museum Charoen Krung Soi 43 Bangkok",imgQuery:"Bangkokian Museum",imgAlt:"Old wooden house at the Bangkokian Museum in Bang Rak",imgIllustrative:!1},{id:"gem-pak-khlong-talat-flower-market",group:"hidden",title:{en:"Pak Khlong Talat flower market at night",idn:"Pasar bunga Pak Khlong Talat — suasana malam"},desc:{en:"Bangkok's big wholesale flower and produce market near the river, famous for piles of jasmine garlands, marigolds, roses and orchids. It is busiest late at night and early morning, and the stalls and alleys are a color-saturated scene.",idn:"Pasar grosir bunga dan hasil bumi terbesar di Bangkok, dekat sungai. Untaian melati, marigold, mawar, dan anggrek menumpuk seperti gunung. Paling ramai larut malam dan subuh, dan setiap gang penuh warna."},special:{en:"Locals buy here for offerings and weddings, so it is practical, not touristy. It is also one of the few things to do at night that costs almost nothing.",idn:"Warga lokal belanja di sini untuk sesajen dan pernikahan, jadi ini pasar sungguhan, bukan pasar turis. Juga salah satu dari sedikit kegiatan malam yang hampir nggak keluar uang."},bestTime:["evening","night","morning"],timeText:{en:"Evening and late night are lively; many stalls trade through the night. Check Google Maps for current hours",idn:"Paling hidup sore sampai tengah malam. Banyak lapak yang buka semalaman. Cek jam buka di Google Maps"},cost:{min:0,max:200},costNote:{en:"Browsing is free; a flower garland or small bouquet costs little (estimate).",idn:"Lihat-lihat gratis. Untaian bunga atau buket kecil harganya murah (perkiraan)."},duration:[1,2],area:"other",locationText:{en:"Pak Khlong Talat, near Memorial Bridge, Old Town riverside",idn:"Pak Khlong Talat, tepi sungai Old Town dekat Memorial Bridge"},transit:{en:"MRT Sanam Chai is about a 5–10 min walk, or river boat to the Memorial Bridge pier area. (Confirm pier and exit on Google Maps.)",idn:"Dari MRT Sanam Chai jalan kaki sekitar 5–10 menit. Atau naik perahu ke area dermaga Memorial Bridge. (Cek dermaga dan pintu keluar di Google Maps)"},indoor:"both",crowd:"both",energy:2,tags:["hidden-gem","photo","late-night","adventurous"],weather:{en:"Covered in parts, but hot and crowded; wet floors on rainy nights.",idn:"Sebagian beratap, tapi panas dan ramai. Kalau malam hujan, lantainya basah."},tips:{en:"Keep bags in front; carts and motorbikes move through lanes. Learn the price before buying. Photograph stalls politely.",idn:"Pakai tas di depan. Gerobak dan motor lalu-lalang di gang. Tanya harga sebelum beli, dan foto pedagang dengan sopan."},geoQuery:"Pak Khlong Talat, Bangkok",mapsQuery:"Pak Khlong Talat flower market Bangkok",imgQuery:"Pak Khlong Talat",imgAlt:"Stalls of flower garlands and flowers at Pak Khlong Talat market",imgIllustrative:!1},{id:"gem-or-tor-kor-market",group:"hidden",title:{en:"Or Tor Kor Market — Bangkok's premium fresh market",idn:"Pasar Or Tor Kor — pasar segar premium Bangkok"},desc:{en:"A large, clean, well-known fresh market beside Chatuchak, with high-quality fruit, seafood, meat, curry pastes and prepared-food stalls. It is a locals' market, with good sampling and snacking opportunities.",idn:"Pasar segar terkenal yang besar dan bersih di sebelah Chatuchak. Ada buah, seafood, daging, bumbu kari, dan lapak makanan siap santap. Warga lokal belanja di sini, jadi seru buat icip-icip dan ngemil."},special:{en:"Fresh produce in a very orderly setting, which is great for a first-time market visitor who does not want a messy wet-market jolt. Great fruit and ready-to-eat stalls.",idn:"Tempatnya rapi, jadi nggak bikin kaget buat yang baru pertama ke pasar. Buah dan makanan siap santapnya juara."},bestTime:["morning","afternoon"],timeText:{en:"Morning is the freshest; check Google Maps for current hours",idn:"Pagi hari paling segar. Cek jam buka di Google Maps"},cost:{min:100,max:400},costNote:{en:"Fruit boxes and snacks cost more than at street stalls but are still reasonable (estimate).",idn:"Paket buah atau camilan sedikit lebih mahal dari lapak kaki lima, tapi masih wajar (perkiraan)."},duration:[1,2],area:"other",locationText:{en:"Or Tor Kor Market, next to Chatuchak",idn:"Pasar Or Tor Kor, sebelah Chatuchak"},transit:{en:"MRT Kamphaeng Phet, a short walk. (Confirm exit on Google Maps.)",idn:"Jalan kaki sebentar dari stasiun MRT Kamphaeng Phet. (Cek pintu keluar di Google Maps.)"},indoor:"both",crowd:"both",energy:1,tags:["hidden-gem","relaxing","rainy-day","after-practice"],weather:{en:"Mostly covered halls; cooler than outdoor markets.",idn:"Sebagian besar beratap, jadi lebih sejuk daripada pasar terbuka."},tips:{en:"Great place to buy fruit and ready-to-eat dishes for the room. Wash fruit before eating, and carry cash. Combine with Chatuchak market when you have energy.",idn:"Tempat yang pas buat beli buah atau makanan siap santap untuk dimakan di penginapan. Cuci buah sebelum dimakan dan bawa uang tunai. Kalau masih kuat, gabung dengan Pasar Chatuchak."},geoQuery:"Or Tor Kor Market, Bangkok",mapsQuery:"Or Tor Kor Market Bangkok",imgQuery:"Or Tor Kor Market",imgAlt:"Fresh fruit stalls at Or Tor Kor Market in Bangkok",imgIllustrative:!1},{id:"gem-khlong-toei-market",group:"hidden",title:{en:"Khlong Toei Market — the real working wet market",idn:"Pasar Khlong Toei — pasar basah lokal yang asli"},desc:{en:"One of Bangkok's largest and busiest fresh markets, supplying restaurants and households with vegetables, meat, seafood and flowers. It is noisy, wet and full of life, with early-morning energy you will not find in a mall.",idn:"Salah satu pasar segar terbesar dan tersibuk di Bangkok, memasok sayur, daging, seafood, dan bunga ke restoran dan rumah tangga. Berisik dan becek, tapi ada energi subuh yang nggak bakal kamu temukan di mal."},special:{en:"It is where Bangkok's food actually comes from. Come with curiosity rather than a plan.",idn:"Di sinilah bahan makanan Bangkok benar-benar berasal. Datang aja dengan rasa penasaran, nggak perlu rencana."},bestTime:["morning"],timeText:{en:"Early morning is the busiest; check Google Maps for current hours",idn:"Pagi buta paling ramai. Cek jam buka di Google Maps"},cost:{min:0,max:200},costNote:{en:"Looking is free; budget for a market breakfast or snacks (estimate).",idn:"Lihat-lihat gratis. Siapkan budget buat sarapan atau camilan di pasar (perkiraan)."},duration:[1,1.5],area:"other",locationText:{en:"Khlong Toei Market, Khlong Toei district",idn:"Pasar Khlong Toei, distrik Khlong Toei"},transit:{en:"MRT Khlong Toei, a short walk. (Confirm exit on Google Maps.)",idn:"Jalan kaki sebentar dari stasiun MRT Khlong Toei. (Cek pintu keluar di Google Maps)"},indoor:"both",crowd:"both",energy:2,tags:["hidden-gem","adventurous","photo"],weather:{en:"Wet floors and strong smells; wear closed shoes. Heat builds fast.",idn:"Lantainya basah dan baunya menyengat. Pakai sepatu tertutup. Panasnya juga cepat naik."},tips:{en:"Not for everyone: it can be crowded and smelly. Watch for carts and forklifts. Avoid taking large bags. Ask before photographing vendors. If anyone offers to guide you, politely decline.",idn:"Nggak cocok buat semua orang: bisa ramai dan bau. Awas gerobak dan forklift. Jangan bawa tas besar. Minta izin dulu sebelum memotret pedagang. Kalau ada yang menawarkan jadi pemandu, tolak dengan sopan."},geoQuery:"Khlong Toei Market, Bangkok",mapsQuery:"Khlong Toei Market Bangkok",imgQuery:"Khlong Toei Market",imgAlt:"Busy fresh market stalls at Khlong Toei Market, Bangkok",imgIllustrative:!1},{id:"gem-wang-lang-market",group:"hidden",title:{en:"Wang Lang Market — Thonburi street-food and snacks",idn:"Pasar Wang Lang — jajanan kaki lima Thonburi"},desc:{en:"A busy riverside market area by Siriraj Hospital where Thonburi locals buy cheap clothes, snacks and street food. The lanes are packed with stalls selling noodles, grilled skewers, sweets and drinks.",idn:"Kawasan pasar tepi sungai di sebelah Rumah Sakit Siriraj, tempat warga Thonburi membeli baju murah, camilan, dan jajanan kaki lima. Gangnya penuh lapak mi, sate bakar, makanan manis, dan minuman."},special:{en:"It is cheap, local and student-heavy, and the food stalls are a good way to try lots of small things.",idn:"Murah, lokal, dan banyak mahasiswa — pas buat icip-icip banyak makanan sedikit-sedikit."},bestTime:["morning","afternoon"],timeText:{en:"Daytime to early evening; check Google Maps for current hours",idn:"Siang sampai sore. Cek jam buka di Google Maps"},cost:{min:50,max:300},costNote:{en:"Dishes about 30–80 THB each (estimate), so a snack crawl is cheap.",idn:"Satu porsi sekitar 30–80 THB (perkiraan), jadi wisata jajan pun murah."},duration:[1,2],area:"other",locationText:{en:"Wang Lang, Thonburi near Siriraj Hospital",idn:"Wang Lang, Thonburi dekat Rumah Sakit Siriraj"},transit:{en:"Chao Phraya Express boat to Wang Lang (Siriraj) Pier (N10), then walk. (Confirm pier on Google Maps.)",idn:"Naik Chao Phraya Express Boat, turun di Dermaga Wang Lang (Siriraj) (N10), lalu jalan kaki. (Cek dermaga di Google Maps)"},indoor:"both",crowd:"both",energy:2,tags:["hidden-gem","adventurous","after-practice","late-night"],weather:{en:"Open lanes, hot and crowded; covered in places.",idn:"Gangnya terbuka, panas dan ramai. Sebagian ada atapnya."},tips:{en:"Hold your phone close in the crowd. Eat where stalls are busy and food is cooked in front of you. Bring small notes.",idn:"Pegang HP kamu erat-erat di keramaian. Makan di lapak yang ramai dan masak langsung di depanmu. Siapkan uang pecahan kecil."},geoQuery:"Wang Lang Market, Bangkok",mapsQuery:"Wang Lang Market Bangkok",imgQuery:"Wang Lang Market Bangkok",imgAlt:"Busy food and clothing stalls at Wang Lang Market",imgIllustrative:!1},{id:"gem-bang-nam-phueng-floating-market",group:"hidden",title:{en:"Bang Nam Phueng weekend market in Bang Krachao",idn:"Pasar Bang Nam Phueng — pasar akhir pekan di Bang Krachao"},desc:{en:'A small weekend market in the green Bang Krachao "lung of Bangkok", more local than the big tourist floating markets. Expect food stalls, handicrafts and a countryside feel, all within the city limits.',idn:"Pasar akhir pekan kecil di Bang Krachao, yang dijuluki \"paru-paru Bangkok\". Jauh lebih lokal daripada pasar terapung besar untuk turis, dengan lapak makanan dan kerajinan tangan. Masih di dalam kota, tapi berasa di desa."},special:{en:"Greenery, quiet, and local food. It is a gentle day trip that still counts as Bangkok.",idn:"Pemandangan hijau, suasana tenang, makanan lokal. Trip sehari yang santai tapi masih di Bangkok."},bestTime:["morning","afternoon"],timeText:{en:"Weekends only, daytime. Hours vary, so check Google Maps before going",idn:"Hanya buka akhir pekan, siang hari. Jamnya beda-beda, jadi cek Google Maps sebelum berangkat"},cost:{min:100,max:500},costNote:{en:"Food and small purchases; add transport (estimate).",idn:"Untuk makan dan belanja kecil-kecilan, belum termasuk transportasi (perkiraan)."},duration:[2,4],area:"bang-krachao",locationText:{en:"Bang Nam Phueng, Bang Krachao, Phra Pradaeng",idn:"Bang Nam Phueng, Bang Krachao, Phra Pradaeng"},transit:{en:"Grab or taxi is the simplest; public routes need a transfer and a short ferry/boat depending on the way. (Confirm on Google Maps.)",idn:"Paling simpel naik Grab atau taksi. Kalau naik transportasi umum, mungkin perlu transit dan naik perahu/feri sebentar. (Cek di Google Maps)"},indoor:"outdoor",crowd:"both",energy:2,tags:["hidden-gem","relaxing","photo","adventurous"],weather:{en:"Outdoor; hot at midday and wet in rainy season. Mosquitoes can be strong.",idn:"Terbuka, jadi panas di tengah hari dan basah di musim hujan. Nyamuknya bisa banyak."},tips:{en:"Weekend-only; confirm it is open before committing half a day. Bring repellent, sunscreen and cash. Plan a ride back in advance.",idn:"Cuma buka akhir pekan, jadi pastikan buka sebelum menghabiskan setengah hari ke sana. Bawa lotion antinyamuk, sunscreen, dan uang tunai, dan pikirkan transportasi pulang dari awal."},geoQuery:"Bang Nam Phueng, Bangkok",mapsQuery:"Bang Nam Phueng floating market Bang Krachao",imgQuery:"Bang Nam Phueng floating market",imgAlt:"Weekend floating market stalls at Bang Nam Phueng, Bang Krachao",imgIllustrative:!1},{id:"gem-chula-student-eats",group:"hidden",title:{en:"Chulalongkorn University student-food streets",idn:"Sekitar Chulalongkorn University — gang kuliner mahasiswa"},desc:{en:"The lanes around Chulalongkorn University (around Soi Chula 42) fill with cheap student-priced eateries, noodle shops, khao gaeng stalls and dessert places. It is a very local and budget-friendly alternative to the big mall food courts nearby.",idn:"Gang-gang di sekitar Chulalongkorn University (sekitar Soi Chula 42) dipenuhi tempat makan murah harga mahasiswa, kedai mi, warung khao gaeng (nasi kari), dan toko dessert. Jauh lebih lokal dan murah daripada food court mal besar di dekatnya."},special:{en:"Good food at student prices without being far from central Siam. Great to try many dishes in small portions.",idn:"Nggak jauh dari pusat Siam, tapi bisa makan enak dengan harga mahasiswa. Cocok buat cobain banyak menu porsi kecil."},bestTime:["morning","afternoon","evening"],timeText:{en:"Lunch and dinner rushes are lively; hours vary by shop, so check Google Maps",idn:"Ramai saat jam makan siang dan malam. Jam buka tiap kedai beda-beda, jadi cek Google Maps"},cost:{min:50,max:250},costNote:{en:"Typical dishes about 40–100 THB each (estimate).",idn:"Satu porsi sekitar 40–100 THB (perkiraan)."},duration:[1,1.5],area:"siam",locationText:{en:"Streets around Chulalongkorn University, near Siam Square",idn:"Gang-gang sekitar Chulalongkorn University, dekat Siam Square"},transit:{en:"BTS National Stadium or MRT Sam Yan; then a short walk. (Confirm exits on Google Maps.)",idn:"Dari BTS National Stadium atau MRT Sam Yan, lanjut jalan kaki. (Cek pintu keluar di Google Maps)"},indoor:"both",crowd:"both",energy:1,tags:["hidden-gem","after-practice","team-bonding"],weather:{en:"Many shops are open-front; fans or A/C inside some.",idn:"Banyak kedai yang bagian depannya terbuka; sebagian ada AC."},tips:{en:'Easy for groups of 3–6 to share several dishes. Tell stalls "mai phet" if you want no spice. Check any allergies before ordering.',idn:'Pas buat grup 3–6 orang yang mau sharing beberapa menu. Kalau mau tidak pedas, bilang "mai phet". Sampaikan alergi sebelum pesan.'},geoQuery:"Chulalongkorn University, Bangkok",mapsQuery:"Soi Chula 42 street food Bangkok",imgQuery:"Chulalongkorn University Bangkok",imgAlt:"Street food stalls near Chulalongkorn University in Bangkok",imgIllustrative:!0},{id:"gem-thonburi-riverside-cafes",group:"hidden",title:{en:"Thonburi riverside & shophouse cafés (Khlong San / Wongwian Yai side)",idn:"Kafe tepi sungai & shophouse di Thonburi (sisi Khlong San / Wongwian Yai)"},desc:{en:"Across the river from Old Town, converted wooden and shophouse cafés sit on side lanes and by the water, offering coffee and Thai desserts away from the busy side of the river. Names change quickly, so pick one with good reviews, good A/C and a river or canal view on Google Maps.",idn:"Di Thonburi, seberang sungai dari Old Town, ada kafe di rumah kayu dan shophouse yang direnovasi, tersebar di gang-gang dan pinggir air. Kamu bisa menikmati kopi dan dessert Thai dengan tenang, jauh dari sisi sungai yang ramai. Kafenya cepat berganti, jadi pilih di Google Maps yang ulasannya bagus, ber-AC, dan punya view sungai/kanal."},special:{en:"Quiet, slow and relatively cheap, ideal for decompressing between busy days. Specific cafés change fast, so check recent reviews.",idn:"Tenang, santai, dan relatif murah — pas buat recharge di sela jadwal padat. Kafenya sering berganti, jadi cek ulasan terbaru."},bestTime:["morning","afternoon"],timeText:{en:"Late morning to afternoon. Hours vary by café; check Google Maps",idn:"Siang menjelang sore. Jam buka tiap kafe beda, jadi cek Google Maps"},cost:{min:80,max:300},costNote:{en:"Coffee or dessert usually 80–180 THB (estimate).",idn:"Kopi atau dessert biasanya 80–180 THB (perkiraan)."},duration:[1,2],area:"riverside",locationText:{en:"Khlong San / Wongwian Yai side lanes, Thonburi",idn:"Gang-gang sisi Khlong San / Wongwian Yai, Thonburi"},transit:{en:"Grab is simplest; BTS Gold Line, MRT Blue Line or river boat depends on the café. (Confirm station and exit on Google Maps.)",idn:"Paling simpel naik Grab. Tergantung kafenya, BTS Gold Line, MRT Blue Line, atau perahu sungai bisa lebih praktis. (Cek stasiun dan pintu keluar di Google Maps)"},indoor:"indoor",crowd:"both",energy:1,tags:["hidden-gem","relaxing","rainy-day","after-practice"],tips:{en:'Search "cafe Khlong San" or "cafe Thonburi" on Google Maps and pick by recent photos and reviews. Check opening days before going.',idn:'Cari "cafe Khlong San" atau "cafe Thonburi" di Google Maps dan pilih berdasarkan foto dan ulasan terbaru. Cek hari buka sebelum berangkat.'},mapsQuery:"cafe Khlong San Thonburi Bangkok",imgQuery:"Khlong San Bangkok riverside",imgAlt:"Riverside view in the Khlong San area of Thonburi, Bangkok",imgIllustrative:!0},{id:"gem-ari-side-soi-cafes",group:"hidden",title:{en:"Ari side-soi independent cafés",idn:"Kafe independen di gang-gang Ari"},desc:{en:"Ari's quiet side lanes off the main road hold small independent coffee shops, bakeries and brunch spots in converted houses. You can spend a slow afternoon wandering between them, which fits the district's calm, creative vibe.",idn:"Di gang-gang tenang di belakang jalan utama Ari ada kedai kopi independen, bakery, dan tempat brunch di rumah-rumah yang direnovasi. Enak buat café hopping santai, cocok dengan suasana kawasannya yang kalem."},special:{en:"Small-batch coffee and local pastries in a residential setting, quieter than the main road. Individual cafés change often, so use recent reviews.",idn:"Specialty coffee dan pastry lokal di suasana perumahan, jauh lebih tenang daripada jalan utama. Kafenya sering berganti, jadi cek ulasan terbaru."},bestTime:["morning","afternoon"],timeText:{en:"Morning to mid-afternoon; hours vary and some close one day a week",idn:"Pagi sampai pertengahan sore. Jam buka beda-beda dan ada yang tutup sehari dalam seminggu"},cost:{min:100,max:350},costNote:{en:"Coffee 90–160 THB, pastries extra (estimate).",idn:"Kopi 90–160 THB, pastry terpisah (perkiraan)."},duration:[1,3],area:"ari",locationText:{en:"Side sois around Ari BTS (Phaya Thai)",idn:"Gang-gang sekitar stasiun BTS Ari (Phaya Thai)"},transit:{en:"BTS Ari, then walk into the side sois. (Confirm exit on Google Maps.)",idn:"Turun di BTS Ari, lalu jalan kaki masuk ke gang-gang samping. (Cek pintu keluar di Google Maps)"},indoor:"indoor",crowd:"both",energy:1,tags:["hidden-gem","relaxing","rainy-day","after-practice","date-night"],tips:{en:'Search "specialty coffee Ari" on Google Maps and pick by recent reviews. Quiet seating is perfect for laptops, but be polite about table time at busy hours.',idn:'Cari "specialty coffee Ari" di Google Maps dan pilih berdasarkan ulasan terbaru. Tenang dan enak buat kerja pakai laptop, tapi jangan terlalu lama menempati meja saat jam ramai ya.'},geoQuery:"Ari, Phaya Thai, Bangkok",mapsQuery:"specialty coffee Ari Bangkok",imgQuery:"Ari Bangkok cafe",imgAlt:"Small independent cafe on a quiet side street in Ari, Bangkok",imgIllustrative:!0},{id:"gem-samsen-phra-athit-cafes",group:"hidden",title:{en:"Samsen & Phra Athit back-lane cafés",idn:"Kafe di gang belakang Samsen & Phra Athit"},desc:{en:"Behind the busy Khao San strip, quieter lanes around Phra Athit and Samsen hide small cafés in old shophouses, many with art, books and a neighborhood feel. They are a calm break after a day of sightseeing.",idn:"Di gang Phra Athit dan Samsen, di belakang Khao San yang ramai, tersembunyi kafe-kafe kecil di shophouse tua yang direnovasi. Ada pernak-pernik seni dan buku, dengan suasana kampung kota — enak buat istirahat tenang setelah jalan-jalan."},special:{en:"Old Bangkok character and quiet seating minutes from tourist crowds. Individual cafés change, so check recent reviews.",idn:"Cukup beberapa menit dari keramaian turis, kamu sudah dapat suasana Bangkok lama dan tempat duduk yang tenang. Kafenya bisa berganti, jadi cek ulasan terbaru."},bestTime:["morning","afternoon"],timeText:{en:"Daytime; check Google Maps for each café's hours",idn:"Siang hari. Cek jam buka tiap kafe di Google Maps"},cost:{min:80,max:300},costNote:{en:"Coffee or tea 80–150 THB (estimate).",idn:"Kopi atau teh 80–150 THB (perkiraan)."},duration:[1,2],area:"other",locationText:{en:"Phra Athit / Samsen, Phra Nakhon",idn:"Phra Athit / Samsen, Phra Nakhon"},transit:{en:"Chao Phraya Express boat to Phra Arthit Pier (N13), then walk. (Confirm pier on Google Maps.)",idn:"Naik Chao Phraya Express Boat, turun di Dermaga Phra Arthit (N13), lalu jalan kaki. (Cek dermaga di Google Maps)"},indoor:"indoor",crowd:"both",energy:1,tags:["hidden-gem","relaxing","rainy-day","after-practice"],tips:{en:"Combine with Santichaiprakan Park and Phra Sumen Fort for sunset. Check opening days, as small cafés often close one day a week.",idn:"Saat sunset, gabungkan dengan Taman Santichaiprakan dan Benteng Phra Sumen. Banyak kafe kecil tutup sehari dalam seminggu, jadi cek hari bukanya."},mapsQuery:"cafe Phra Athit Samsen Bangkok",imgQuery:"Phra Athit Road Bangkok",imgAlt:"Old shophouse cafes along Phra Athit Road in Bangkok",imgIllustrative:!0},{id:"gem-ceramic-pottery-workshop",group:"hidden",title:{en:"Drop-in pottery / ceramics workshop (small local studios)",idn:"Kelas keramik/tembikar sehari di studio kecil"},desc:{en:"Bangkok has many small independent studios offering short hand-building or wheel-throwing sessions for beginners, usually 2 to 3 hours with all materials included. You make a piece, glaze it, and many studios fire it for later pick-up or shipping.",idn:"Bangkok punya banyak studio independen kecil yang buka kelas singkat hand-building atau putar roda (wheel-throwing) untuk pemula, biasanya 2–3 jam dan sudah termasuk bahan. Kamu bikin karya sendiri dan memberi glasir, lalu banyak studio yang membakarnya untuk diambil nanti atau dikirim."},special:{en:"A calm, hands-on, screen-free activity that suits a team looking for something different from gaming and malls.",idn:"Kegiatan tenang, pakai tangan, dan bebas layar — cocok buat tim yang cari sesuatu yang beda dari gaming dan mal."},bestTime:["morning","afternoon"],timeText:{en:"Daytime sessions; booking ahead is recommended, check each studio on Google Maps",idn:"Kelas kebanyakan siang hari. Sebaiknya booking dulu, dan cek tiap studio di Google Maps"},cost:{min:800,max:1800},costNote:{en:"Typical beginner class estimate; varies by studio and what you make.",idn:"Perkiraan untuk kelas pemula; tergantung studio dan apa yang kamu buat."},duration:[2,3],area:"other",locationText:{en:"Small studios in Ari, Thonglor/Ekkamai and Thonburi (search on Maps)",idn:"Studio kecil di Ari, Thonglor/Ekkamai, Thonburi, dll. (cari di Maps)"},transit:{en:'Depends on the studio. Search "pottery workshop Bangkok" on Google Maps and check the nearest BTS/MRT. (Confirm exit on Google Maps.)',idn:'Tergantung studionya. Cari "pottery workshop Bangkok" di Google Maps dan cek BTS/MRT terdekat. (Cek pintu keluar di Google Maps)'},indoor:"indoor",crowd:"both",energy:1,tags:["hidden-gem","team-bonding","rainy-day","relaxing","after-practice"],tips:{en:"Book ahead and confirm English support, group size and whether firing and pick-up or shipping are included. Wear clothes you do not mind getting muddy, and trim long nails. Hands and wrists work gently, so it is a nice break from mouse/keyboard strain.",idn:"Booking dulu dan pastikan ada panduan bahasa Inggris, jumlah peserta, serta apakah pembakaran dan pengambilan/pengiriman sudah termasuk. Pakai baju yang nggak masalah kena tanah liat, dan potong kuku panjang. Pergelangan tangan bergerak lembut, jadi ini istirahat yang enak buat tangan yang capek main mouse dan keyboard."},mapsQuery:"pottery workshop Bangkok",imgQuery:"Pottery workshop hands clay wheel",imgAlt:"Hands shaping clay on a pottery wheel in a workshop",imgIllustrative:!0}]});var be,Vo=S(()=>{be=[{id:"siam",name:{en:"Siam",idn:"Siam",th:"สยาม"},tagline:{en:"Bangkok's shopping and Gen Z crossroads, all linked by skywalk",idn:"Taman bermain Gen Z Bangkok, mal-malnya tersambung skywalk"},personality:{en:"Siam is where two BTS lines cross and half of Bangkok's youth seems to arrive at once. Air-conditioned malls (Siam Paragon, Siam Center, Siam Discovery, CentralWorld) sit shoulder to shoulder, linked by a skywalk, while the low-rise lanes of Siam Square below hold tiny fashion boutiques, dessert cafés and student-priced eateries. It is loud, bright and unapologetically commercial, and on weekends the crowds are thick. For a first-timer it is the easiest place in the city to eat, shop and cool off in one afternoon.",idn:"Siam, tempat dua jalur BTS bertemu, adalah kawasan tempat anak muda Bangkok tumpah ruah. Siam Paragon, Siam Center, Siam Discovery, dan CentralWorld berjejer tersambung skywalk, jadi kamu bisa keliling seharian sambil ngadem di AC. Di bawahnya, gang-gang Siam Square penuh butik fashion kecil, kafe dessert, dan tempat makan harga mahasiswa. Akhir pekan memang ramai dan berisik banget, tapi buat yang baru pertama ke Bangkok, nggak ada tempat yang lebih gampang buat makan, belanja, dan kabur dari panas."},food:[{name:"Somtam Nua (Siam Square)",note:{en:"A Siam Square classic for papaya salad and crispy fried chicken; expect a queue at peak hours and ask for less spicy if you are unsure.",idn:"Spot legendaris Siam Square untuk som tam (salad pepaya) dan ayam goreng renyah. Antrean panjang di jam ramai; kalau ragu soal pedasnya, minta dibuat kurang pedas."},mapsQuery:"Somtam Nua Siam Square Bangkok"},{name:"Mango Tango (Siam Square)",note:{en:"Dessert-only stop built around fresh mango, a popular post-shopping sugar hit.",idn:"Toko khusus dessert dengan mangga segar sebagai menu utama. Pas banget buat isi ulang gula setelah belanja."},mapsQuery:"Mango Tango Siam Square Bangkok"},{name:"Paragon Food Hall (Siam Paragon, ground floor)",note:{en:"Big air-conditioned food court and supermarket area; easy, safe, and good for a large group that cannot agree on dinner.",idn:"Food hall besar di lantai bawah Siam Paragon. Menunya banyak, jadi praktis kalau rombongan susah sepakat mau makan apa."},mapsQuery:"Paragon Food Hall Siam Paragon Bangkok"},{name:"Food courts and restaurant floors in CentralWorld",note:{en:"Several floors of chain and local restaurants, plenty of Japanese and Korean options (popular in Indonesia too) if you want a familiar meal.",idn:"Ada restoran chain dan lokal di beberapa lantai CentralWorld. Banyak pilihan Jepang dan Korea (yang juga populer di Indonesia), pas kalau lagi kangen rasa yang familiar."},mapsQuery:"CentralWorld food court Bangkok"}],cafes:[{name:"After You Dessert Café (Siam Paragon)",note:{en:"Famous for shaved ice and thick honey toast; a classic dessert stop, but waits can be long on weekends.",idn:"Kafe dessert yang terkenal dengan es serut dan honey toast tebal. Akhir pekan antreannya lama."},mapsQuery:"After You Dessert Cafe Siam Paragon Bangkok"},{name:"Cafés in Siam Square sois and Siam Discovery",note:{en:"Small, design-forward cafés tucked in the Siam Square lanes and inside Siam Discovery; walk the sois and pick whichever has a seat.",idn:"Banyak kafe kecil yang estetik di gang Siam Square dan di dalam Siam Discovery. Keliling gangnya dan pilih yang masih ada tempat duduk."},mapsQuery:"cafe Siam Square Soi Bangkok"}],shopping:[{name:"Siam Center and Siam Discovery",note:{en:"Thai designers, streetwear and lifestyle concept stores; the trendiest of the Siam malls.",idn:"Kumpulan brand desainer Thai, streetwear, dan concept store lifestyle. Mal paling trendi di Siam."},mapsQuery:"Siam Discovery Bangkok"},{name:"MBK Center",note:{en:"Old-school mega-mall with hundreds of small stalls for phone accessories, souvenirs and cheap clothes; bargaining is normal and prices are not fixed everywhere.",idn:"Mal jadul berisi ratusan kios kecil yang jual aksesori HP, suvenir, dan baju murah. Tawar-menawar itu biasa dan banyak tempat yang harganya nggak pas."},mapsQuery:"MBK Center Bangkok"},{name:"Siam Paragon and CentralWorld",note:{en:"The big, polished malls for international brands, electronics and cinemas.",idn:"Mal besar dengan brand internasional, elektronik, sampai bioskop."},mapsQuery:"Siam Paragon Bangkok"}],activities:[{en:"Mall-hop along the skywalk from Siam to Chit Lom, free air-conditioning included",idn:"Keliling mal lewat skywalk dari Siam ke Chit Lom (bonus AC gratis)"},{en:"Browse the fashion boutiques and dessert cafés in the Siam Square lanes",idn:"Lihat-lihat butik fashion dan kafe dessert di gang Siam Square"},{en:"Visit the Jim Thompson House, a quiet teak-house museum near National Stadium BTS",idn:"Kunjungi Jim Thompson House, museum rumah kayu jati yang tenang dekat BTS National Stadium"},{en:"Hunt for souvenirs and phone gear in MBK Center",idn:"Berburu suvenir dan aksesori HP di MBK Center"},{en:"See the Siam Paragon aquarium (Sea Life) if you want an indoor rainy-day option",idn:"Kalau hujan, ke akuarium Siam Paragon (Sea Life)"}],duration:{en:"Half day (3–5 h)",idn:"Setengah hari (3–5 jam)"},budget:{level:2,text:{en:"≈ 500–1,500 THB per person excluding big purchases (estimate)",idn:"≈ 500–1.500 THB per orang, di luar belanja besar (perkiraan)"}},bestTime:{en:"Weekday late morning or early afternoon; avoid Saturday evenings if you hate crowds. Malls typically open late morning and close around 21:00–22:00 (check each mall).",idn:"Paling lega hari kerja, siang menjelang sore. Kalau nggak suka ramai, hindari Sabtu malam. Mal biasanya buka agak siang dan tutup sekitar 21.00–22.00 (cek tiap mal)."},stations:[{name:"BTS Siam",line:"BTS Sukhumvit Line and Silom Line interchange"},{name:"BTS National Stadium",line:"BTS Silom Line"},{name:"BTS Chit Lom",line:"BTS Sukhumvit Line"}],route:[{en:"Start: BTS National Stadium; walk to the Jim Thompson House for a calm morning.",idn:"Mulai: BTS National Stadium. Awali pagi dengan tenang di Jim Thompson House."},{en:"Cross to MBK Center for souvenirs and a quick browse (budget 45–60 min).",idn:"Pindah ke MBK Center buat lihat-lihat suvenir (sekitar 45–60 menit)."},{en:"Take the skywalk to Siam Discovery and Siam Center for Thai design and streetwear.",idn:"Jalan lewat skywalk ke Siam Discovery dan Siam Center buat lihat toko desain Thai dan streetwear."},{en:"Drop down to Siam Square for lunch (Somtam Nua) and a mango dessert.",idn:"Turun ke Siam Square untuk makan siang (Somtam Nua) dan dessert mangga."},{en:"Finish at Siam Paragon for the food hall or an after-dinner dessert, then BTS from Siam.",idn:"Tutup dengan food hall atau dessert di Siam Paragon, lalu pulang naik BTS dari stasiun Siam."}],knowBefore:{en:"Crowded and loud on weekends; keep bags zipped on the skywalk and in MBK. Malls are over-air-conditioned, so carry a thin layer. Bargain only at stalls (MBK, Siam Square), not in department stores.",idn:"Akhir pekan ramai banget, jadi pakai tas di depan di skywalk dan MBK. AC di mal dingin banget, bawa outer tipis. Tawar-menawar hanya di kios (MBK, Siam Square), jangan di department store."},geoQuery:"Siam Square, Pathum Wan, Bangkok",mapsQuery:"Siam Square Bangkok",imgQuery:"Siam Square Bangkok",imgAlt:"Crowded street and signs at Siam Square in Bangkok"},{id:"ari",name:{en:"Ari",idn:"Ari",th:"อารีย์"},tagline:{en:"Specialty coffee and a slow, lived-in neighborhood rhythm",idn:"Specialty coffee dan suasana kampung kota yang santai"},personality:{en:"Ari feels like the Bangkok that locals actually live in: tree-lined sois, shophouse cafés, small restaurants and office workers on lunch break. It lacks big landmarks, which is exactly the point; you come to wander, sit by a window with a good coffee and let the afternoon go slowly. The vibe is calmer and more residential than Siam or Sukhumvit. The trade-off is that sights are spread out and sois can be hot with little shade.",idn:"Ari terasa seperti Bangkok tempat warga lokal benar-benar tinggal: gang berpohon rindang, kafe shophouse, rumah makan kecil, dan pekerja kantoran saat jam makan
