th, thick Thai-Chinese rice porridge with soft pork meatballs, ginger and spring onion, finished with a raw or poached egg and a Chinese fried dough stick for dipping.",idn:"Bubur nasi Chinese-Thai yang halus dan kental, dengan bakso babi yang lembut, jahe, dan daun bawang, diberi telur mentah atau setengah matang, plus cakwe (pa thong ko) untuk dicelup."},ingredients:{en:["rice porridge","pork meatballs","ginger","spring onion","egg","pepper","Chinese fried dough (pa thong ko)","soy sauce"],idn:["Bubur nasi","Bakso babi","Jahe","Daun bawang","Telur","Merica","Cakwe (pa thong ko)","Kecap asin"]},spice:0,price:[40,70],allergens:["egg","soy","gluten"],pork:"yes",seafood:"no",veg:"no",tags:["street","beginner","local-fav","late-night","kr-familiar"],beginner:{en:"Very familiar to Indonesians: it is basically a cousin of bubur ayam, though the standard version uses pork. The fresh ginger and white pepper give it a clean, warming taste. Breakfast and hangover favorite. Season with a little soy sauce and white pepper at the table.",idn:'Buat orang Indonesia, ini terasa akrab — mirip bubur ayam, hanya saja versi standarnya pakai babi. Jahe segar dan merica putih memberi rasa bersih dan menghangatkan. Favorit untuk sarapan atau pemulih badan setelah begadang. Tambahkan sedikit kecap asin dan merica dari meja.'},order:{en:'Say jok moo and add "kai" for egg. Ask for "pa thong ko" if you want the fried dough to dip.',idn:'Pesan jok moo (bubur babi) dan tambahkan "kai" untuk telur. Kalau mau cakwe untuk dicelup, minta "pa thong ko".',th:"ขอโจ๊กหมูใส่ไข่{P}",rom:"khor jok moo sai khai {P}"},fact:{en:"Jok is a classic Thai-Chinese breakfast you can find at shops that open before dawn. Many shops serve it until late morning.",idn:"Jok adalah sarapan klasik Chinese-Thai di warung yang buka sebelum subuh. Banyak yang menjualnya sampai menjelang siang."},where:[{name:"Jok Prince",area:"other",note:{en:"Well-known jok shop in the Banglamphu old-town area, a popular breakfast stop.",idn:"Warung jok terkenal di kawasan kota tua Banglamphu, tempat sarapan favorit."}}],imgQuery:"Jok Thai congee",imgAlt:"A bowl of Thai rice porridge with pork balls, ginger and egg",mapsQuery:"Jok Prince Bangkok"},{id:"pad-pak-boong",cat:"classics",name:{en:"Pad Pak Boong Fai Daeng",th:"ผัดผักบุ้งไฟแดง",idn:"Pad pak boong fai daeng (tumis kangkung)"},rom:"phat phak-boong fai daeng",desc:{en:"Morning glory (water spinach) stir-fried over roaring flames with garlic, chilies and a salty-sweet sauce of fermented soybean and oyster sauce. Crunchy, garlicky and smoky.",idn:"Kangkung ditumis cepat di api besar dengan bawang putih, cabai, tauco, dan saus tiram. Renyah, wangi bawang putih, dan smoky."},ingredients:{en:["morning glory (water spinach)","garlic","bird's-eye chilies","fermented soybean","oyster sauce","fish sauce"],idn:["Kangkung","Bawang putih","Cabai rawit","Tauco","Saus tiram","Kecap ikan"]},spice:2,price:[60,120],allergens:["soy","shellfish","fish"],pork:"no",seafood:"no",veg:"option",tags:["street","local-fav","late-night","kr-familiar"],beginner:{en:'A cheap, fast side vegetable dish that goes with rice. Oyster sauce and fish sauce are standard, so say "jay" or "mai sai nam man hoi" if you need it vegetarian. Indonesians will find the garlicky stir-fried greens a lot like tumis kangkung back home.',idn:'Lauk sayur yang murah dan cepat, cocok dengan nasi. Saus tiram dan kecap ikan sudah standar, jadi kalau vegetarian bilang "jay" atau "mai sai nam man hoi" (tanpa saus tiram). Tumisan sayur wangi bawang putih ini mirip banget dengan tumis kangkung di Indonesia.'},order:{en:"Say pad pak boong fai daeng and order rice separately.",idn:"Pesan pad pak boong fai daeng, dan pesan nasi terpisah.",th:"ขอผัดผักบุ้งไฟแดง ไม่เผ็ด{P}",rom:"khor phat phak-boong fai daeng mai phet {P}"},fact:{en:'Some stalls fling the cooked greens from the wok across the street to a waiter who catches them on a plate. "Fai daeng" means "red fire".',idn:'Beberapa warung melempar kangkung matang dari wajan ke seberang jalan, lalu ditangkap pelayan dengan piring. "Fai daeng" artinya "api merah".'},where:[{name:"Any street stall or open-air restaurant",area:"other",note:{en:"Common at tam sang (made-to-order) stalls and evening seafood restaurants.",idn:"Umum di warung masak dadakan (tam sang) dan restoran seafood malam."}}],imgQuery:"Pad pak boong fai daeng",imgAlt:"Stir-fried morning glory with garlic and chilies",mapsQuery:"pad pak boong fai daeng Bangkok"},{id:"gai-pad-med-mamuang",cat:"classics",name:{en:"Gai Pad Med Mamuang",th:"ไก่ผัดเม็ดมะม่วงหิมพานต์",idn:"Gai pad med mamuang (ayam tumis mete)"},rom:"gai phat met ma-muang him-ma-phan",desc:{en:"Chicken stir-fried with crunchy cashews, dried chilies, onion and scallion in a sweet-savory roasted chili sauce. Mild, nutty and a crowd-pleaser.",idn:"Ayam ditumis dengan kacang mete renyah, cabai kering, bawang bombai, dan daun bawang dalam saus cabai panggang yang manis-gurih. Tidak pedas, gurih, dan disukai semua orang."},ingredients:{en:["chicken","cashew nuts","dried chilies","onion","scallion","roasted chili paste (nam prik pao)","oyster sauce","soy sauce"],idn:["Ayam","Kacang mete","Cabai kering","Bawang bombai","Daun bawang","Pasta cabai panggang (nam prik pao)","Saus tiram","Kecap asin"]},spice:1,price:[70,130],allergens:["tree-nut","soy","shellfish","fish"],pork:"no",seafood:"no",veg:"option",tags:["local-fav","beginner","high-protein","post-practice","kr-familiar"],beginner:{en:"The dried chilies are for aroma and are usually left on the plate; the dish is mild. It tastes a lot like the chicken-and-cashew stir-fries (ayam kungpao, ayam mete) at Chinese-Indonesian restaurants. Check cashew allergy before ordering.",idn:"Cabai keringnya hanya untuk aroma dan biasanya disisihkan di piring; secara keseluruhan tidak pedas. Rasanya mirip ayam kungpao atau ayam mete di restoran chinese food di Indonesia. Kalau alergi kacang mete, pastikan dulu sebelum memesan."},order:{en:"Say gai pad med mamuang and order rice with it.",idn:"Pesan gai pad med mamuang dan nasinya sekalian.",th:"ขอไก่ผัดเม็ดมะม่วง ไม่เผ็ด{P}",rom:"khor gai phat met ma-muang mai phet {P}"},fact:{en:'Cashew in Thai is "med mamuang himmaphan", literally "Himmaphan mango seed", after the mythical forest Himmaphan.',idn:'Kacang mete dalam bahasa Thai disebut "med mamuang himmaphan", harfiahnya "biji mangga Himmaphan", diambil dari nama hutan mitologis Himmaphan.'},where:[{name:"Any restaurant serving central Thai dishes",area:"other",note:{en:"Standard on Thai-Chinese restaurant menus and many mall food courts.",idn:"Menu standar di restoran Chinese-Thai dan banyak food court mal."}}],imgQuery:"Chicken with cashew nuts Thai",imgAlt:"Chicken stir-fried with cashews and dried chilies",mapsQuery:"gai pad med mamuang Bangkok"},{id:"tom-yum-goong",cat:"soups",name:{en:"Tom Yum Goong",th:"ต้มยำกุ้ง",idn:"Tom yum goong (sup udang asam pedas)"},rom:"tom yam goong",desc:{en:"Hot and sour soup with prawns, lemongrass, galangal, kaffir lime leaf, mushrooms, chilies and lime. Comes clear (nam sai) or creamy (nam khon) with a rich orange chili-paste slick.",idn:"Sup asam pedas dengan udang, serai, lengkuas, daun jeruk purut, jamur, cabai, dan jeruk nipis. Bisa pilih kuah bening (nam sai) atau kuah creamy (nam khon) dengan lapisan minyak cabai oranye yang mengapung."},ingredients:{en:["prawns","lemongrass","galangal","kaffir lime leaves","mushrooms","bird's-eye chilies","lime juice","fish sauce","chili paste","evaporated milk (nam khon version)"],idn:["Udang","Serai","Lengkuas","Daun jeruk purut","Jamur","Cabai rawit","Air jeruk nipis","Kecap ikan","Pasta cabai","Susu evaporasi (versi nam khon)"]},spice:4,price:[150,400],allergens:["shellfish","fish","dairy"],pork:"no",seafood:"yes",veg:"no",tags:["local-fav","high-protein","post-practice","kr-familiar"],beginner:{en:"Do not eat the lemongrass, galangal or lime leaves; they flavor the broth. Nam sai is lighter and sharper, nam khon is rounder and a little sweeter. Spoon it over rice. Indonesians tend to love it like a spicy-sour sop pedas or seafood soup back home.",idn:"Serai, lengkuas, dan daun jeruk hanya untuk aroma, jadi tidak dimakan. Nam sai lebih ringan dengan rasa asam yang tegas, sedangkan nam khon lebih lembut dan sedikit manis. Enak juga disiram ke nasi. Orang Indonesia biasanya suka, seperti sop pedas atau sop seafood yang asam-pedas."},order:{en:"Say tom yum goong plus clear (nam sai) or creamy (nam khon). You usually order a small or large pot to share.",idn:"Sebut tom yum goong + bening (nam sai) atau creamy (nam khon). Biasanya dipesan per panci kecil atau besar untuk dibagi.",th:"ขอต้มยำกุ้งน้ำข้น ไม่เผ็ดมาก{P}",rom:"khor tom yam goong nam khon mai phet maak {P}"},fact:{en:'The soup became a global Thai icon. The "nam khon" creamy style is more common in restaurants than at street stalls.',idn:'Tom yum goong sudah jadi ikon Thai di seluruh dunia. Gaya creamy "nam khon" lebih umum di restoran daripada di warung kaki lima.'},where:[{name:"Any Thai or seafood restaurant",area:"other",note:{en:"Standard everywhere; seafood restaurants along Yaowarat do big pots with river prawns.",idn:"Menu standar di mana-mana. Restoran seafood di Yaowarat juga menjual panci besar dengan udang galah."}}],imgQuery:"Tom yum goong",imgAlt:"A bowl of tom yum goong with prawns, mushrooms and herbs",mapsQuery:"tom yum goong restaurant Bangkok"},{id:"tom-kha-gai",cat:"soups",name:{en:"Tom Kha Gai",th:"ต้มข่าไก่",idn:"Tom kha gai (sup ayam santan)"},rom:"tom khaa gai",desc:{en:"Chicken simmered in coconut milk with galangal, lemongrass, kaffir lime leaves and mushrooms. Creamy, fragrant and only gently sour, the mild cousin of tom yum.",idn:"Ayam yang direbus dalam santan dengan lengkuas, serai, daun jeruk purut, dan jamur. Creamy, harum, dan asamnya lembut — sepupu tom yum yang lebih kalem."},ingredients:{en:["chicken","coconut milk","galangal","lemongrass","kaffir lime leaves","mushrooms","lime juice","fish sauce","chili"],idn:["Ayam","Santan","Lengkuas","Serai","Daun jeruk purut","Jamur","Air jeruk nipis","Kecap ikan","Cabai"]},spice:2,price:[100,250],allergens:["fish"],pork:"no",seafood:"no",veg:"option",tags:["local-fav","beginner","high-protein","kr-familiar"],beginner:{en:'"Kha" is galangal, a woody root related to ginger; do not eat the big slices. Soothing and milder than tom yum. A vegetarian version with mushrooms or tofu exists but fish sauce is standard, so ask for it without.',idn:'"Kha" adalah lengkuas, kerabat jahe. Jangan makan potongan besarnya. Lebih lembut dari tom yum dan menenangkan perut. Ada versi vegetarian dengan jamur atau tahu, tapi kecap ikan sudah standar, jadi minta tanpa kecap ikan.'},order:{en:"Say tom kha gai. A small bowl is one serving; a pot (mor fai) is for sharing.",idn:"Pesan tom kha gai. Mangkuk kecil untuk satu orang; panci (mor fai) untuk dibagi bersama.",th:"ขอต้มข่าไก่ถ้วยเล็ก{P}",rom:"khor tom khaa gai thuay lek {P}"},fact:{en:"Despite the similar name to tom yum, the key flavor is the sweet creaminess of coconut with galangal, not heat.",idn:"Namanya mirip tom yum, tapi kuncinya bukan pedas, melainkan gurih-manis santan dan aroma lengkuas."},where:[{name:"Any Thai restaurant",area:"other",note:{en:"On nearly every restaurant menu, sold per bowl or per pot.",idn:"Ada di menu hampir semua restoran, dijual per mangkuk atau per panci."}}],imgQuery:"Tom kha gai",imgAlt:"A bowl of tom kha gai coconut soup with chicken and mushrooms",mapsQuery:"tom kha gai restaurant Bangkok"},{id:"green-curry",cat:"soups",name:{en:"Green Curry",th:"แกงเขียวหวาน",idn:"Kari hijau (kaeng khiao wan)"},rom:"kaeng khiao wan",desc:{en:"Chicken, beef or pork in coconut milk with fresh green chili paste, Thai eggplants and Thai basil. Fragrant, creamy, mildly sweet and noticeably hot.",idn:"Ayam, sapi, atau babi dalam santan dengan pasta cabai hijau segar, terung Thai, dan kemangi Thai. Harum, creamy, sedikit manis, tapi cukup pedas."},ingredients:{en:["green curry paste","coconut milk","chicken, beef or pork","Thai eggplants","Thai basil","kaffir lime leaves","fish sauce","palm sugar"],idn:["Pasta kari hijau","Santan","Ayam·sapi·babi","Terung Thai","Kemangi Thai","Daun jeruk purut","Kecap ikan","Gula aren"]},spice:3,price:[80,200],allergens:["shellfish","fish"],pork:"optional",seafood:"optional",veg:"option",tags:["local-fav","kr-familiar"],beginner:{en:'"Wan" means sweet, referring to its gentle sweetness against the heat. It is eaten as a soupy curry with rice, not as a soup on its own. Curry paste contains shrimp paste, so a vegetarian version needs a special request.',idn:'"Wan" artinya manis — maksudnya ada rasa manis lembut di balik pedasnya. Kari berkuah ini disiram ke nasi, bukan dimakan seperti sup. Pasta karinya mengandung terasi, jadi versi vegetarian harus diminta khusus. Kalau kamu suka kari atau gulai, ini pilihan pas untuk mulai.'},order:{en:"Say green curry plus chicken (gai) and ask for rice.",idn:"Sebut kari hijau + ayam (gai), lalu pesan nasi.",th:"ขอแกงเขียวหวานไก่ ไม่เผ็ดมาก กับข้าวสวย{P}",rom:"khor kaeng khiao wan gai mai phet maak gap khao suay {P}"},fact:{en:"Green curry is usually the spiciest of Thailand's coconut curries, because the paste uses lots of fresh green chilies.",idn:"Kari hijau biasanya yang paling pedas di antara kari santan Thailand, karena pastanya pakai banyak cabai hijau segar."},where:[{name:"Any rice-and-curry shop (raan khao gaeng)",area:"other",note:{en:"Point to the pots, choose a curry and get it over rice. Quick and cheap.",idn:"Di warung nasi+lauk, tunjuk pancinya, pilih karinya, lalu disajikan di atas nasi. Cepat dan murah."}}],imgQuery:"Thai green curry",imgAlt:"A bowl of Thai green curry with chicken and eggplants",mapsQuery:"green curry restaurant Bangkok"},{id:"panang-curry",cat:"soups",name:{en:"Panang Curry",th:"พะแนง",idn:"Kari panang"},rom:"pha-naeng",desc:{en:"A thick, rich, less soupy curry of red chili paste, ground peanuts and coconut cream, topped with shredded kaffir lime leaf. Sweet-savory and gently spicy.",idn:"Kari kental dan pekat dari pasta cabai merah, kacang tanah halus, dan krim santan, diberi irisan tipis daun jeruk purut. Manis-gurih dan pedasnya lembut."},ingredients:{en:["panang curry paste","coconut cream","ground peanuts","pork, beef or chicken","kaffir lime leaf","palm sugar","fish sauce"],idn:["Pasta kari panang","Krim santan","Kacang tanah halus","Babi·sapi·ayam","Daun jeruk purut","Gula aren","Kecap ikan"]},spice:2,price:[90,220],allergens:["peanut","shellfish","fish"],pork:"optional",seafood:"no",veg:"option",tags:["local-fav","beginner","kr-familiar"],beginner:{en:"Thicker and richer than green curry with nutty depth and little liquid; good over rice. Peanuts are in the sauce, so tell them if you have an allergy. Beef (nuea) and pork (moo) are the classic proteins.",idn:"Lebih kental dan pekat dari kari hijau, dengan gurih kacang dan kuah yang sedikit — enak diaduk dengan nasi. Sausnya mengandung kacang tanah, jadi beri tahu kalau kamu alergi. Sapi (nuea) dan babi (moo) adalah pilihan klasik."},order:{en:"Say panang plus the meat and order rice.",idn:"Sebut panang + dagingnya, lalu pesan nasi.",th:"ขอพะแนงเนื้อ กับข้าวสวย{P}",rom:"khor pha-naeng nuea gap khao suay {P}"},fact:{en:"Its name is often linked to Penang in Malaysia, but its exact origin is debated.",idn:"Namanya sering dikaitkan dengan Penang di Malaysia, tapi asal-usul pastinya masih diperdebatkan."},where:[{name:"Any Thai restaurant",area:"other",note:{en:"Found on most mid-range Thai menus; ask the staff to lower the spice if needed.",idn:"Ada di menu kebanyakan restoran Thai kelas menengah. Minta staf mengurangi pedasnya kalau perlu."}}],imgQuery:"Phanaeng curry",imgAlt:"Thick red panang curry with beef and kaffir lime strips",mapsQuery:"panang curry restaurant Bangkok"},{id:"massaman-curry",cat:"soups",name:{en:"Massaman Curry",th:"แกงมัสมั่น",idn:"Kari massaman"},rom:"kaeng mat-sa-man",desc:{en:"A mild, sweet, aromatic curry of beef or chicken with potatoes, onions and peanuts, spiced with cinnamon, cardamom and cumin. Rich, tender and not very hot.",idn:"Kari yang lembut, manis, dan harum dari sapi atau ayam dengan kentang, bawang bombai, dan kacang tanah, berbumbu kayu manis, kapulaga, dan jintan. Kaya rasa, empuk, dan tidak terlalu pedas."},ingredients:{en:["beef or chicken","potatoes","onions","peanuts","coconut milk","massaman curry paste","cinnamon","cardamom","tamarind","palm sugar"],idn:["Sapi atau ayam","Kentang","Bawang bombai","Kacang tanah","Santan","Pasta kari massaman","Kayu manis","Kapulaga","Asam jawa","Gula aren"]},spice:1,price:[100,250],allergens:["peanut","shellfish","fish"],pork:"no",seafood:"no",veg:"no",tags:["beginner","high-protein","kr-familiar"],beginner:{en:"The mildest Thai curry and a good first pick for kids and picky eaters. The potato and warm spices feel like an Indonesian kari or gulai with more fragrance. Traditionally made without pork.",idn:"Kari Thai yang paling tidak pedas, jadi bagus untuk pemula. Kentang dan rempah hangatnya mirip kari atau gulai, dengan aroma yang lebih kuat. Secara tradisional dibuat tanpa babi."},order:{en:"Say massaman plus beef (nuea) or chicken (gai) and rice.",idn:"Sebut massaman + sapi (nuea) atau ayam (gai), lalu pesan nasi.",th:"ขอมัสมั่นเนื้อ กับข้าวสวย{P}",rom:"khor mat-sa-man nuea gap khao suay {P}"},fact:{en:"Its roots are Persian and Indian-Muslim trade influences in southern and central Thailand. It was ranked first in a 2011 CNN reader poll of the world's tastiest foods.",idn:"Akarnya dari pengaruh perdagangan Persia dan Muslim India di Thailand selatan dan tengah. Pada 2011, masakan ini menempati peringkat pertama dalam polling pembaca CNN tentang makanan terenak di dunia."},where:[{name:"Any Thai restaurant",area:"other",note:{en:"On most tourist-friendly and mid-range menus; also at halal-friendly Muslim shops.",idn:"Ada di menu kebanyakan restoran ramah turis dan kelas menengah; bisa juga dicoba di warung Muslim yang ramah halal."}}],imgQuery:"Massaman curry",imgAlt:"A bowl of massaman curry with beef, potatoes and peanuts",mapsQuery:"massaman curry restaurant Bangkok"},{id:"yellow-curry",cat:"soups",name:{en:"Yellow Curry",th:"แกงกะหรี่",idn:"Kari kuning (kaeng kari)"},rom:"kaeng ka-ree",desc:{en:"A mild, golden coconut curry colored with turmeric and curry powder, usually with chicken, potato and onion, a little sweet and the closest Thai curry to Indonesian kari ayam or Japanese curry.",idn:"Kari santan kuning yang lembut, diwarnai kunyit dan bubuk kari. Biasanya pakai ayam, kentang, dan bawang bombai, sedikit manis — kari Thai yang paling mirip kari ayam Indonesia atau kari Jepang."},ingredients:{en:["yellow curry paste or curry powder","coconut milk","chicken","potato","onion","turmeric","fish sauce"],idn:["Pasta kari kuning atau bubuk kari","Santan","Ayam","Kentang","Bawang bombai","Kunyit","Kecap ikan"]},spice:1,price:[80,200],allergens:["shellfish","fish"],pork:"no",seafood:"optional",veg:"option",tags:["beginner","local-fav","kr-familiar"],beginner:{en:'Not to be confused with southern "kaeng leuang", a very different, sour-spicy turmeric fish curry. This one is mild and kid-friendly. Crab or shrimp versions (pu / goong pad pong karee) are a separate stir-fry dish.',idn:'Jangan tertukar dengan "kaeng leuang" dari selatan, yaitu sup ikan kunyit yang asam pedas. Kari ini lembut dan ramah anak. Versi kepiting atau udang (pu / goong pad pong karee) adalah masakan tumis yang berbeda.'},order:{en:"Say yellow curry (kaeng kari) with chicken and rice. You can also eat it with roti.",idn:"Pesan kari kuning (kaeng kari) dengan ayam dan nasi. Bisa juga dimakan dengan roti (mirip roti canai).",th:"ขอแกงกะหรี่ไก่ กับข้าวสวย{P}",rom:"khor kaeng ka-ree gai gap khao suay {P}"},fact:{en:"Thai kari reflects the old Indian spice trade, using curry powder rather than the fresh herb paste of green curry.",idn:"Kari ala Thai mencerminkan jejak perdagangan rempah India: memakai bubuk kari, bukan pasta herba segar seperti kari hijau."},where:[{name:"Any rice-and-curry shop or food court",area:"other",note:{en:"Common at khao gaeng shops and mall food courts.",idn:"Umum di warung nasi+lauk (khao gaeng) dan food court mal."}}],imgQuery:"Thai yellow curry",imgAlt:"A bowl of Thai yellow curry with chicken and potatoes",mapsQuery:"yellow curry restaurant Bangkok"},{id:"gaeng-som",cat:"soups",name:{en:"Gaeng Som",th:"แกงส้ม",idn:"Gaeng som (kari asam oranye)"},rom:"kaeng som",desc:{en:"A thin, orange, sour-spicy curry soup without coconut milk, made with tamarind and chili paste and loaded with vegetables and fish or shrimp. Bright, tangy and sharp.",idn:"Sup kari encer berwarna oranye yang asam pedas, tanpa santan, dibuat dari asam jawa dan pasta cabai, penuh sayuran dan ikan atau udang. Segar, asam, dan tajam."},ingredients:{en:["tamarind","chili paste","fish or shrimp","cauliflower","cabbage","morning glory","daikon","egg omelet (cha-om)","palm sugar","fish sauce"],idn:["Asam jawa","Pasta cabai","Ikan atau udang","Kembang kol","Kol","Kangkung","Lobak","Telur dadar cha-om","Gula aren","Kecap ikan"]},spice:4,price:[80,180],allergens:["fish","shellfish"],pork:"no",seafood:"yes",veg:"no",tags:["street","local-fav","high-protein","kr-familiar"],beginner:{en:"Sour is the main flavor, with strong heat. It is eaten over rice with other dishes, not alone. Good if you like sayur asem or a spicy fish soup back home, but expect much more sourness and heat.",idn:"Rasa asamnya dominan dan pedasnya juga kuat. Biasanya dimakan dengan nasi bersama lauk lain. Cocok kalau kamu suka sayur asem atau sop ikan pedas, tapi siap-siap: jauh lebih asam dan pedas."},order:{en:"Point at the pot in a rice-and-curry shop or ask for gaeng som with fish (pla) or shrimp (goong).",idn:"Di warung nasi+lauk, tunjuk pancinya, atau pesan gaeng som + ikan (pla) atau udang (goong).",th:"ขอแกงส้มกุ้ง เผ็ดน้อย{P}",rom:"khor kaeng som goong phet noi {P}"},fact:{en:"The sourness comes from tamarind, not vinegar or lime, and it is common to see it with cha-om omelet (acacia-leaf omelet) at Thai home-style shops.",idn:"Rasa asamnya dari asam jawa, bukan cuka atau jeruk nipis. Di warung masakan rumahan Thai, sering disajikan dengan telur dadar cha-om (daun akasia)."},where:[{name:"Any rice-and-curry shop (raan khao gaeng)",area:"other",note:{en:"Common at lunchtime; it often runs out later in the day.",idn:"Umum saat makan siang, dan sering sudah habis menjelang sore."}}],imgQuery:"Gaeng som",imgAlt:"A bowl of orange sour curry soup with fish and vegetables",mapsQuery:"gaeng som restaurant Bangkok"},{id:"som-tum",cat:"spicy",name:{en:"Som Tum",th:"ส้มตำ",idn:"Som tum (salad pepaya muda)"},rom:"som tam",desc:{en:"Shredded green papaya pounded in a mortar with chilies, garlic, lime, palm sugar and fish sauce, plus tomato, long beans and peanuts. Crunchy, sour, sweet and spicy all at once.",idn:"Pepaya muda serut ditumbuk di cobek dengan cabai, bawang putih, jeruk nipis, gula aren, dan kecap ikan, ditambah tomat, kacang panjang, dan kacang tanah. Renyah, asam, manis, dan pedas sekaligus."},ingredients:{en:["green papaya","bird's-eye chilies","garlic","lime","palm sugar","fish sauce","tomato","long beans","peanuts","dried shrimp"],idn:["Pepaya muda","Cabai rawit","Bawang putih","Jeruk nipis","Gula aren","Kecap ikan","Tomat","Kacang panjang","Kacang tanah","Ebi (udang kering)"]},spice:4,price:[40,80],allergens:["peanut","shellfish","fish"],pork:"no",seafood:"optional",veg:"option",tags:["street","local-fav","post-practice","kr-familiar"],beginner:{en:'Thai-style (som tum thai) is sweeter; the funky Isan version (som tum pla ra) uses fermented fish. Spice is set per order, so say "phet nit noi" or "mai phet". Dried shrimp and fish sauce are standard, so ask for a vegetarian version. Indonesians may find it close to rujak ulek or asinan in spirit.',idn:'Gaya Thai tengah (som tum thai) lebih manis, sedangkan gaya Isan (som tum pla ra) pakai ikan fermentasi dengan aroma yang lebih tajam. Level pedas ditentukan saat memesan, jadi bilang "phet nit noi" atau "mai phet". Ebi dan kecap ikan sudah standar, jadi minta khusus kalau mau versi vegetarian. Rasa asam-manis-pedasnya mirip rujak ulek atau asinan.'},order:{en:'Say som tum thai, the spice level, and "mai sai tua" if no peanuts. Eat with sticky rice (khao niao).',idn:'Sebut som tum thai + level pedas, dan "mai sai tua" kalau tanpa kacang. Makan bareng ketan (khao niao).',th:"ขอส้มตำไทย ไม่เผ็ด ไม่ใส่ถั่ว{P}",rom:"khor som tam thai mai phet mai sai thua {P}"},fact:{en:'Som tum came from Laos and the northeast (Isan) and became a Bangkok staple. The "tok tok" sound of the pestle is a street soundtrack.',idn:'Som tum berasal dari Laos dan Isan (timur laut), lalu jadi makanan wajib di Bangkok. Bunyi "tok tok" ulekan jadi musik latar jalanan.'},where:[{name:"Somtum Der",area:"other",note:{en:"Well-known Isan restaurant near Saladaeng on Convent Road with a long som tum menu.",idn:"Restoran Isan terkenal di Convent Road dekat Saladaeng, dengan menu som tum yang panjang."}},{name:"Somtum Nua",area:"siam",note:{en:"Popular som tum restaurant in the Siam Square area.",idn:"Restoran som tum populer di kawasan Siam Square."}},{name:"Any Isan street stall",area:"other",note:{en:"Look for a woman pounding in a clay mortar.",idn:"Cari penjual yang sedang menumbuk di cobek tanah liat."}}],imgQuery:"Som tam Thai papaya salad",imgAlt:"Green papaya salad with tomatoes, long beans and peanuts",mapsQuery:"som tum Bangkok"},{id:"larb-moo",cat:"spicy",name:{en:"Larb Moo",th:"ลาบหมู",idn:"Larb moo (salad babi cincang)"},rom:"laap moo",desc:{en:"Minced pork tossed with lime, fish sauce, toasted rice powder, chili flakes, shallots and fresh herbs like mint and spring onion. Sour, salty, nutty and herbal, eaten with sticky rice and raw vegetables.",idn:"Babi cincang diaduk dengan jeruk nipis, kecap ikan, bubuk beras sangrai, cabai bubuk, bawang merah, dan herba segar seperti daun mint dan daun bawang. Asam, asin, gurih, dan harum herba; dimakan dengan ketan dan lalapan."},ingredients:{en:["minced pork","lime juice","fish sauce","toasted ground sticky rice (khao khua)","chili flakes","shallots","mint","spring onion","cilantro"],idn:["daging babi cincang","air jeruk nipis","kecap ikan","tepung ketan sangrai (khao khua)","cabai bubuk","bawang merah","daun mint","daun bawang","daun ketumbar"]},spice:4,price:[60,120],allergens:["fish"],pork:"yes",seafood:"no",veg:"no",tags:["local-fav","high-protein","post-practice"],beginner:{en:'Cooked and served lukewarm, not raw. Wrap it in lettuce or cabbage leaves and eat with sticky rice. Ask for "larb mai phet" for a mild batch. Raw versions ("larb dib") exist in the northeast; avoid them unless you know what you are ordering.',idn:'Dimasak matang dan disajikan hangat-hangat kuku, bukan daging mentah. Bungkus dengan selada atau kol, lalu makan bareng ketan. Kalau mau yang nggak terlalu pedas, bilang "larb mai phet". Di Isan ada juga versi daging mentah ("larb dib"), jadi jangan asal pesan kalau kamu nggak yakin. Mirip makan pakai lalapan, jadi gampang cocok buat lidah Indonesia.'},order:{en:"Say larb moo and add sticky rice (khao niao).",idn:"Pesan larb moo + ketan (khao niao).",th:"ขอลาบหมู เผ็ดน้อย กับข้าวเหนียว{P}",rom:"khor laap moo phet noi gap khao niao {P}"},fact:{en:"Larb is a Lao and Isan classic; the toasted rice powder gives the signature nutty crunch.",idn:"Larb adalah hidangan khas Laos dan Isan. Bubuk beras sangrai memberi rasa gurih dan sensasi renyah."},where:[{name:"Any Isan (northeastern) restaurant or street stall",area:"other",note:{en:'Look for signs saying "aahaan Isan" with grilled meats and som tum.',idn:'Cari warung dengan papan "aahaan Isan" (makanan Isan) yang jual daging bakar dan som tum.'}}],imgQuery:"Larb moo",imgAlt:"Minced pork salad larb with herbs and toasted rice powder",mapsQuery:"larb moo Isan restaurant Bangkok"},{id:"nam-tok-moo",cat:"spicy",name:{en:"Nam Tok Moo",th:"น้ำตกหมู",idn:"Nam tok moo (salad babi bakar)"},rom:"nam tok moo",desc:{en:"Sliced grilled pork (usually neck or shoulder) tossed with lime, fish sauce, chili flakes, toasted rice powder and herbs. Juicy, smoky, sour and herbal.",idn:"Irisan babi bakar (biasanya bagian leher atau bahu) diaduk dengan jeruk nipis, kecap ikan, cabai bubuk, bubuk beras sangrai, dan herba. Juicy, beraroma bakaran, asam, dan wangi herba."},ingredients:{en:["grilled pork","lime juice","fish sauce","chili flakes","toasted rice powder","shallots","mint","spring onion"],idn:["daging babi bakar","air jeruk nipis","kecap ikan","cabai bubuk","bubuk beras sangrai","bawang merah","daun mint","daun bawang"]},spice:4,price:[80,150],allergens:["fish"],pork:"yes",seafood:"no",veg:"no",tags:["local-fav","high-protein","post-practice"],beginner:{en:'"Nam tok" means waterfall, for the juices that run from the grilled meat. It is like larb but with sliced grilled pork instead of minced pork. Grilled meat eaten with fresh herbs and leaves will feel familiar to anyone who loves Indonesian lalapan.',idn:'"Nam tok" artinya air terjun, dinamai dari jus daging yang menetes saat dibakar. Mirip larb, tapi pakai irisan babi bakar, bukan daging cincang. Kalau kamu suka daging bakar dengan lalapan, rasanya bakal cocok.'},order:{en:"Say nam tok moo, the spice level and sticky rice.",idn:"Sebut nam tok moo + level pedas + ketan.",th:"ขอน้ำตกหมู เผ็ดน้อย กับข้าวเหนียว{P}",rom:"khor nam tok moo phet noi gap khao niao {P}"},fact:{en:"The dish is Isan in origin and sits between a grilled meat dish and a salad.",idn:"Hidangan asal Isan ini ada di antara daging bakar dan salad."},where:[{name:"Any Isan restaurant or street stall",area:"other",note:{en:"Usually on the menu with grilled pork neck and som tum.",idn:"Biasanya ada di menu bareng leher babi bakar dan som tum."}}],imgQuery:"Nam tok moo",imgAlt:"Grilled pork waterfall salad with herbs and chili",mapsQuery:"nam tok moo Bangkok"},{id:"yum-woon-sen",cat:"spicy",name:{en:"Yum Woon Sen",th:"ยำวุ้นเส้น",idn:"Yum woon sen (salad soun)"},rom:"yam woon sen",desc:{en:"Glass noodle salad tossed in a lime, fish sauce and chili dressing with minced pork, shrimp, squid, celery, tomato and onion, topped with peanuts. Light, tangy and spicy.",idn:"Soun diaduk dengan dressing jeruk nipis, kecap ikan, dan cabai, plus daging babi cincang, udang, cumi, seledri, tomat, dan bawang bombai, lalu ditaburi kacang tanah. Ringan, asam segar, dan pedas."},ingredients:{en:["glass noodles","minced pork","shrimp","squid","celery","tomato","onion","lime","fish sauce","chili","peanuts"],idn:["soun","daging babi cincang","udang","cumi","seledri","tomat","bawang bombai","jeruk nipis","kecap ikan","cabai","kacang tanah"]},spice:4,price:[80,160],allergens:["shellfish","fish","peanut"],pork:"optional",seafood:"yes",veg:"no",tags:["local-fav"],beginner:{en:'Served cold or room temperature. The glass noodles are the same kind as Indonesian soun, but dressed sour and spicy instead. Ask for "mai phet" and the kitchen will use fewer chilies.',idn:'Disajikan dingin atau suhu ruang. Mie-nya sejenis soun yang biasa kita makan di Indonesia, tapi diaduk dengan dressing asam pedas. Kalau nggak mau pedas, bilang "mai phet".'},order:{en:"Say yum woon sen and the protein (talay = seafood).",idn:"Sebut yum woon sen + topping (talay = seafood).",th:"ขอยำวุ้นเส้นทะเล เผ็ดน้อย{P}",rom:"khor yam woon sen ta-lay phet noi {P}"},fact:{en:'"Yum" is the Thai word for spicy-sour dressed salad, a big category with many versions.',idn:'"Yum" adalah sebutan untuk semua salad Thailand berbumbu asam pedas, dan jenisnya banyak banget.'},where:[{name:"Any Thai restaurant or street stall",area:"other",note:{en:"Often found at evening stalls and restaurants as a shared appetizer.",idn:"Sering jadi camilan untuk dimakan bareng di warung malam dan restoran."}}],imgQuery:"Yam woon sen",imgAlt:"Glass noodle salad with shrimp and herbs",mapsQuery:"yum woon sen restaurant Bangkok"},{id:"yum-mama",cat:"spicy",name:{en:"Yum Mama",th:"ยำมาม่า",idn:"Yum mama (salad mie instan)"},rom:"yam ma-ma",desc:{en:"Instant Mama noodles tossed as a salad in lime, fish sauce and chili with minced pork, shrimp, squid, celery and tomato. A salty, sour, crunchy beer snack.",idn:"Mie instan Mama diaduk seperti salad dengan dressing jeruk nipis, kecap ikan, dan cabai, plus daging babi cincang, udang, cumi, seledri, dan tomat. Asin, asam, dan kenyal, cocok jadi camilan teman minum."},ingredients:{en:["instant noodles (Mama)","minced pork","shrimp","squid","celery","tomato","shallot","lime juice","fish sauce","chili"],idn:["mie instan (Mama)","daging babi cincang","udang","cumi","seledri","tomat","bawang merah","air jeruk nipis","kecap ikan","cabai"]},spice:4,price:[70,150],allergens:["gluten","fish","shellfish"],pork:"optional",seafood:"optional",veg:"no",tags:["late-night","local-fav","kr-familiar"],beginner:{en:'A drinking snack (kap klaem), not a soup. Think of a spicy, tangy Indomie goreng served cold-ish. Say "mai phet" if you are not sure; this is usually very spicy.',idn:'Ini bukan makanan berkuah, tapi camilan teman minum (kap klaem). Bayangkan Indomie goreng pedas-asam yang disajikan agak dingin. Kalau ragu, bilang "mai phet". Biasanya cukup pedas.'},order:{en:"Say yum mama, then the toppings and the spice level.",idn:"Sebut yum mama + topping + level pedas.",th:"ขอยำมาม่า เผ็ดน้อย{P}",rom:"khor yam ma-ma phet noi {P}"},fact:{en:'"Mama" became the generic Thai word for instant noodles, like "Kleenex" for tissues. The brand has been sold in Thailand since the early 1970s.',idn:'"Mama" sudah jadi sebutan umum untuk mie instan di Thailand, mirip "Indomie" buat kita. Merek ini sudah dijual sejak awal 1970-an.'},where:[{name:"Any Isan or late-night snack restaurant",area:"other",note:{en:"A bar-snack favorite at open-air eateries that serve beer.",idn:"Camilan favorit di rumah makan terbuka yang menjual bir."}}],imgQuery:"Yam Mama Thai instant noodle salad",imgAlt:"Instant noodle salad with shrimp, squid and herbs",mapsQuery:"yum mama restaurant Bangkok"},{id:"pla-rad-prik",cat:"spicy",name:{en:"Pla Rad Prik",th:"ปลาราดพริก",idn:"Pla rad prik (ikan goreng saus cabai)"},rom:"plaa raat phrik",desc:{en:"A whole deep-fried fish crisp on the outside and tender inside, topped with a sticky sweet-sour-spicy chili, garlic and tamarind sauce. Crunchy fins and bold sauce make it a table centerpiece.",idn:"Ikan utuh digoreng sampai luarnya renyah dan dalamnya lembut, lalu disiram saus kental asam-manis-pedas dari cabai, bawang putih, dan asam jawa. Sirip yang renyah dan sausnya yang mantap bikin hidangan ini jadi bintang di meja."},ingredients:{en:["whole fish (sea bass or tilapia)","chili","garlic","tamarind","palm sugar","fish sauce","shallot","basil"],idn:["ikan utuh (kakap putih atau nila)","cabai","bawang putih","asam jawa","gula aren","kecap ikan","bawang merah","kemangi"]},spice:3,price:[180,450],allergens:["fish"],pork:"no",seafood:"yes",veg:"no",tags:["local-fav","high-protein","post-practice","sweet","kr-familiar"],beginner:{en:"Meant to be shared with rice. Break the fish with the spoon and fork, pull flesh from the bones and add sauce. Fried fish with sweet-sour chili sauce is a taste Indonesians will like, a lot like ikan asam manis. Watch for small bones.",idn:"Dimakan bareng nasi dan dibagi bersama. Pakai sendok dan garpu untuk memisahkan daging ikan dari tulangnya, lalu makan dengan sausnya. Ikan goreng renyah dengan saus asam manis pedas mirip ikan asam manis, jadi pasti cocok di lidah. Hati-hati duri kecil."},order:{en:"Say pla rad prik and ask for the fish type (pla kapong = sea bass). Price depends on fish size.",idn:"Sebut pla rad prik dan pilih jenis ikannya (pla kapong = kakap putih). Harga tergantung ukuran ikan.",th:"ขอปลากะพงราดพริก ตัวเล็ก{P}",rom:"khor plaa ka-phong raat phrik tua lek {P}"},fact:{en:"Thais eat the crispy fins and tail too, and a good version is fried hard enough that the skin stays crunchy under the sauce.",idn:"Orang Thailand juga makan sirip dan ekornya yang renyah. Warung yang jago menggoreng ikannya sampai garing, jadi kulitnya tetap renyah meski disiram saus."},where:[{name:"Any Thai seafood restaurant",area:"other",note:{en:"Most seafood restaurants sell it by fish size; ask staff to confirm the price first.",idn:"Kebanyakan restoran seafood menjualnya berdasarkan ukuran ikan. Tanyakan harganya dulu."}}],imgQuery:"Pla rad prik",imgAlt:"Whole fried fish topped with chili sauce",mapsQuery:"pla rad prik seafood restaurant Bangkok"},{id:"yum-kor-moo-yang",cat:"spicy",name:{en:"Yum Kor Moo Yang",th:"ยำคอหมูย่าง",idn:"Yum kor moo yang (salad leher babi bakar)"},rom:"yam kho moo yaang",desc:{en:"Charcoal-grilled pork neck sliced and tossed with lime, fish sauce, chili, shallots, tomato, cucumber and fresh herbs. Fatty, smoky, sour and spicy.",idn:"Leher babi bakar arang diiris tipis lalu diaduk dengan jeruk nipis, kecap ikan, cabai, bawang merah, tomat, timun, dan herba segar. Berlemak, beraroma bakaran, asam, dan pedas."},ingredients:{en:["grilled pork neck","lime juice","fish sauce","chili","shallots","tomato","cucumber","mint","lettuce"],idn:["leher babi bakar","air jeruk nipis","kecap ikan","cabai","bawang merah","tomat","timun","daun mint","selada"]},spice:4,price:[100,180],allergens:["fish"],pork:"yes",seafood:"no",veg:"no",tags:["local-fav","high-protein","post-practice","late-night"],beginner:{en:"More vegetables and more dressing than nam tok moo. Pork neck is a favorite grilling cut, and wrapping bites in lettuce feels a lot like eating with Indonesian lalapan. Good with sticky rice and beer.",idn:"Sayur dan dressing-nya lebih banyak dibanding nam tok moo. Leher babi adalah potongan favorit untuk dibakar, dan makan pakai selada rasanya mirip makan lalapan. Cocok dengan ketan dan bir."},order:{en:"Say yum kor moo yang and the spice level, plus sticky rice.",idn:"Sebut yum kor moo yang + level pedas + ketan.",th:"ขอยำคอหมูย่าง เผ็ดน้อย กับข้าวเหนียว{P}",rom:"khor yam kho moo yaang phet noi gap khao niao {P}"},fact:{en:"Pork neck (kor moo yang) is also eaten plain grilled with a spicy dipping sauce (jaew), which is a favorite at Isan grill stalls.",idn:"Leher babi bakar (kor moo yang) juga dimakan polos dengan saus cocol pedas (jaew), dan jadi menu favorit di warung bakaran Isan."},where:[{name:"Any Isan grill restaurant or street stall",area:"other",note:{en:"Look for charcoal grills with pork neck and sticky rice baskets.",idn:"Cari warung dengan panggangan arang berisi leher babi dan bakul ketan."}}],imgQuery:"Yam kor moo yang",imgAlt:"Sliced grilled pork neck tossed with herbs, mint and chili dressing",mapsQuery:"yum kor moo yang Isan restaurant Bangkok"},{id:"hoy-tod",cat:"street",name:{en:"Hoy Tod",th:"หอยทอด",idn:"Hoy tod (dadar kerang)"},rom:"hoi thot",desc:{en:"A sizzling pan-fried mussel (or oyster) pancake with egg and a rice-flour batter, crispy at the edges and chewy inside, with bean sprouts and a sweet chili dipping sauce.",idn:"Dadar kerang hijau (atau tiram) dengan telur dan adonan tepung beras, digoreng di wajan panas sampai mendesis. Pinggirannya renyah, bagian dalamnya kenyal, disajikan dengan tauge dan saus sambal manis."},ingredients:{en:["mussels or oysters","egg","rice flour and tapioca batter","bean sprouts","spring onion","sweet chili sauce or Sriracha"],idn:["kerang hijau atau tiram","telur","adonan tepung beras dan tapioka","tauge","daun bawang","saus sambal manis atau Sriracha"]},spice:1,price:[60,120],allergens:["shellfish","egg","soy"],pork:"no",seafood:"yes",veg:"no",tags:["street","late-night","local-fav"],beginner:{en:"Two styles: soft and chewy (hoy tod) and extra crispy (hoy tod grop). Think of it as a crispy seafood dadar (omelet-pancake). Eat while hot. Oyster versions are pricier than mussel ones.",idn:"Ada dua gaya: lembut-kenyal (hoy tod) dan ekstra renyah (hoy tod grop). Bayangkan dadar telur seafood yang garing. Makan selagi panas. Versi tiram lebih mahal daripada kerang hijau."},order:{en:"Say hoy tod with mussels (hoy malaeng phu) or oysters (hoy nang rom) and choose soft or crispy.",idn:"Sebut hoy tod + kerang hijau (hoy malaeng phu) atau tiram (hoy nang rom) + lembut/renyah.",th:"ขอหอยทอดหอยแมลงภู่ กรอบๆ{P}",rom:"khor hoi thot hoi ma-laeng-phu grop grop {P}"},fact:{en:"It is a Thai-Chinese street-food classic, and Chinatown is the best place to find it freshly fried.",idn:"Ini jajanan klasik Thai-Tionghoa, dan Chinatown adalah tempat terbaik untuk makan yang baru digoreng."},where:[{name:"Nai Mong Hoi Thod",area:"yaowarat",note:{en:"Well-known oyster omelet and hoy tod shop on Phlap Phla Chai Road near Yaowarat.",idn:"Kedai omelet tiram dan hoy tod terkenal di Jalan Phlap Phla Chai dekat Yaowarat."}},{name:"Any street stall in Yaowarat",area:"yaowarat",note:{en:"Evening stalls fry it to order.",idn:"Warung malam langsung menggorengnya saat dipesan."}}],imgQuery:"Hoy tod",imgAlt:"Crispy Thai mussel pancake with bean sprouts",mapsQuery:"hoy tod Yaowarat Bangkok"}]});var Ko,Ho=S(()=>{Ko=[{id:"moo-ping",cat:"street",name:{en:"Moo Ping",th:"หมูปิ้ง",idn:"Moo ping (sate babi ala Thailand)"},rom:"moo ping",desc:{en:"Small skewers of thin-sliced pork marinated in garlic, coriander root, pepper and often coconut milk, grilled over charcoal until sweet and smoky. The classic Bangkok breakfast and snack, usually eaten with a bag of sticky rice.",idn:"Tusukan kecil irisan tipis daging babi yang dimarinasi bawang putih, akar ketumbar, merica, santan, dan lainnya, lalu dibakar di atas arang. Menu sarapan dan camilan khas warga Bangkok, biasanya dimakan bareng ketan (khao niao)."},ingredients:{en:["pork","garlic","coriander root","white pepper","soy sauce","coconut milk","palm sugar"],idn:["daging babi","bawang putih","akar ketumbar","merica putih","kecap asin","santan","gula aren"]},spice:0,price:[10,20],allergens:["soy"],pork:"yes",seafood:"no",veg:"no",tags:["street","local-fav","beginner","high-protein","post-practice"],beginner:{en:"Sweet-savory and not spicy at all, so it is the safest first street snack. Each stick is small (usually around 10-20 THB), so people order 5-10 sticks plus a 10 THB bag of sticky rice. Many vendors serve a spicy dipping sauce on the side; skip it if you do not want heat.",idn:"Manis gurih dan sama sekali nggak pedas, jadi pas banget sebagai jajanan kaki lima pertamamu. Satu tusuknya kecil (biasanya 10-20 baht), jadi orang biasanya beli 5-10 tusuk plus sebungkus ketan (sekitar 10 baht). Banyak penjual memberi saus cocol pedas terpisah; nggak usah ambil kalau nggak mau pedas."},order:{en:"Say the number of sticks and ask for sticky rice.",idn:"Sebut jumlah tusuknya dan minta ketan juga.",th:"ขอหมูปิ้งห้าไม้ ข้าวเหนียวหนึ่งถุง{P}",rom:"khor moo ping ha mai, khao niao nueng thung {P}"},fact:{en:"Moo ping stalls often start before sunrise, because for many Bangkokians a bag of sticky rice with moo ping is a grab-and-go breakfast on the way to work or school.",idn:"Banyak lapak moo ping sudah buka sebelum matahari terbit, karena sebungkus ketan dan moo ping adalah sarapan praktis andalan warga Bangkok dalam perjalanan ke kantor atau sekolah."},where:[{name:"Street stalls near BTS/MRT exits and local markets",area:"other",note:{en:"Look for a small charcoal grill and a stack of skewers, mostly in the morning and early evening. Pick the stall with the busiest line.",idn:"Cari panggangan arang dengan tumpukan tusukan sate, kebanyakan ada pagi hari dan sore menjelang malam. Lapak yang antreannya paling panjang biasanya paling aman."}}],imgQuery:"Moo ping",imgAlt:"Grilled pork skewers (moo ping) on a charcoal grill",mapsQuery:"moo ping grilled pork skewers Bangkok"},{id:"gai-tod",cat:"street",name:{en:"Gai Tod (Thai Fried Chicken)",th:"ไก่ทอด",idn:"Gai tod (ayam goreng ala Thailand)"},rom:"gai tod",desc:{en:"Crispy fried chicken pieces, often Hat Yai style: marinated with spices and served heaped with crunchy fried shallots. Usually eaten with sticky rice and sweet chili sauce.",idn:"Ayam berbumbu rempah yang digoreng renyah. Gaya Hat Yai dari selatan ditaburi bawang merah goreng melimpah. Biasanya dimakan dengan ketan dan saus sambal manis."},ingredients:{en:["chicken","garlic","coriander root","white pepper","spices","flour batter","fried shallots"],idn:["daging ayam","bawang putih","akar ketumbar","merica putih","rempah-rempah","adonan tepung","bawang merah goreng"]},spice:0,price:[30,80],allergens:["gluten"],pork:"no",seafood:"no",veg:"no",tags:["street","local-fav","beginner","high-protein","post-practice","kr-familiar"],beginner:{en:"It has a thin, spiced crust, closer to Indonesian ayam goreng than to thick-battered fried chicken. The chicken itself is not spicy; the sweet chili sauce is mild. Pieces are sold individually (wings, thighs, breast), so you can start with one and add more.",idn:"Kulitnya tipis dan wangi rempah, lebih mirip ayam goreng Indonesia daripada fried chicken bertepung tebal. Ayamnya sendiri nggak pedas dan saus sambal manisnya juga ringan. Dijual per potong (sayap, paha, dada), jadi kamu bisa coba satu dulu."},order:{en:"Point at the piece you want and ask for sticky rice too.",idn:"Tunjuk potongan yang kamu mau dan minta ketan juga.",th:"ขอไก่ทอดหนึ่งชิ้น ข้าวเหนียวด้วย{P}",rom:"khor gai tod nueng chin, khao niao duay {P}"},fact:{en:"Hat Yai, a city in southern Thailand, gave the dish its most famous style, and fried chicken with fried shallots is now sold from Bangkok street carts to food courts.",idn:"Hat Yai, kota di Thailand selatan, adalah asal gaya yang paling terkenal. Sekarang ayam goreng ini dijual di mana-mana di Bangkok, dari gerobak kaki lima sampai food court."},where:[{name:"Street stalls and market food courts across Bangkok",area:"other",note:{en:"Look for a glass display of golden chicken with fried shallots on top. Pieces are usually sold hot and fresh in the evening.",idn:"Cari lapak dengan etalase ayam goreng keemasan bertabur bawang merah goreng. Ayam yang baru digoreng biasanya ada di malam hari."}}],imgQuery:"Gai tod Hat Yai fried chicken",imgAlt:"Thai fried chicken topped with crispy fried shallots",mapsQuery:"Hat Yai fried chicken Bangkok"},{id:"crispy-pork",cat:"street",name:{en:"Crispy Pork (Moo Krob)",th:"หมูกรอบ",idn:"Moo krob (samcan babi renyah)"},rom:"moo krop",desc:{en:"Pork belly roasted or fried until the skin puffs into a crackling shell, then chopped and served over rice or with a spicy dipping sauce. A close cousin, moo tod kratiem, is pork fried with garlic and pepper.",idn:"Samcan babi dipanggang atau digoreng sampai kulitnya mengembang dan garing. Dipotong kecil lalu disajikan di atas nasi atau dicocol saus pedas. Kerabat dekatnya, moo tod kratiem, adalah babi goreng bawang putih dan merica."},ingredients:{en:["pork belly","salt","garlic","white pepper","dipping sauce (chili, lime, fish sauce)"],idn:["samcan babi","garam","bawang putih","merica putih","saus cocol (cabai, jeruk nipis, kecap ikan)"]},spice:1,price:[50,100],allergens:[],pork:"yes",seafood:"no",veg:"no",tags:["street","local-fav","high-protein","post-practice"],beginner:{en:"Think pork belly with an extra-crunchy crackling skin, like Chinese-Indonesian babi panggang / siobak (for those who eat pork). It is salty and rich, and the skin can be hard on teeth if it is very thick. A common street order is rice with crispy pork, often with a fried egg, or pad kra pao moo krob (crispy pork stir-fried with holy basil).",idn:"Bayangkan samcan babi dengan kulit ekstra garing, mirip babi panggang atau siobak (buat yang makan babi). Asin dan berlemak. Kalau kulitnya tebal banget, bisa cukup keras di gigi. Pesanan yang umum adalah moo krob di atas nasi (sering ditambah telur ceplok) atau pad kra pao moo krob (babi renyah tumis daun kemangi Thailand)."},order:{en:"Ask for crispy pork over rice, one box.",idn:"Pesan satu kotak nasi babi renyah.",th:"ขอข้าวหมูกรอบหนึ่งกล่อง{P}",rom:"khor khao moo krop nueng klong {P}"},fact:{en:"Chinese-style roast pork hanging in the window is a Yaowarat classic, and Thai cooks later adopted crispy pork into everyday dishes like pad kra pao.",idn:"Babi panggang ala Tionghoa yang digantung di etalase adalah pemandangan khas Yaowarat (Chinatown). Koki Thailand lalu memasukkannya ke masakan sehari-hari seperti pad kra pao, dan jadilah populer."},where:[{name:"Roast-meat and rice shops around Yaowarat",area:"yaowarat",note:{en:"Chinese-Thai shops with hanging roast pork and red pork over rice; usually a lot cheaper than restaurants.",idn:"Kedai Thai-Tionghoa yang menggantung babi panggang dan juga menjual nasi moo daeng (char siu). Jauh lebih murah daripada restoran biasa."}}],imgQuery:"Moo krob crispy pork belly",imgAlt:"Chopped crispy pork belly with crackling skin over rice",mapsQuery:"khao moo krob crispy pork rice Bangkok"},{id:"sai-krok-isan",cat:"street",name:{en:"Sai Krok Isan (Northeastern Sausage)",th:"ไส้กรอกอีสาน",idn:"Sai krok Isan (sosis Isan)"},rom:"sai krok ee-san",desc:{en:"A grilled fermented pork-and-rice sausage from Isan, Thailand's northeast, with a distinctive sour, garlicky tang. Served with raw cabbage, fresh ginger slices and chilies to balance the richness.",idn:"Sosis fermentasi dari Isan, Thailand timur laut. Dibuat dari daging babi dan nasi, rasanya asam dan wangi bawang putih. Disajikan dengan kol mentah, irisan jahe segar, dan cabai untuk menyeimbangkan rasa gurihnya."},ingredients:{en:["pork","cooked rice","garlic","salt","pepper"],idn:["daging babi","nasi","bawang putih","garam","merica"]},spice:1,price:[10,25],allergens:[],pork:"yes",seafood:"no",veg:"no",tags:["street","local-fav"],beginner:{en:"It is sour from fermentation, which surprises first-timers; the taste is closer to a tangy salami than to a hot dog. Take a bite of the sausage, then a bite of raw ginger or cabbage. The chilies served alongside are the spicy part; you do not have to eat them.",idn:"Rasanya asam karena difermentasi, dan ini sering bikin kaget yang baru pertama coba. Rasanya lebih mirip salami asam daripada sosis hot dog. Gigit sosisnya, lalu gigit jahe atau kol, bergantian. Cabai yang disajikan itu bagian pedasnya, jadi nggak wajib dimakan."},order:{en:"Say how many pieces and ask for the vegetables that come with it.",idn:"Sebut berapa potong dan minta sayur pelengkapnya juga.",th:"ขอไส้กรอกอีสานสองอัน ขอผักด้วย{P}",rom:"khor sai krok ee-san song an, khor phak duay {P}"},fact:{en:"In Thai, sai means casing and krok means to stuff; the Isan version is naturally fermented for a day or two, which is where the sour flavor comes from.",idn:"Dalam bahasa Thai, sai artinya selongsong dan krok artinya mengisi. Versi Isan difermentasi alami selama sehari-dua hari, dari situlah rasa asamnya yang khas."},where:[{name:"Isan grill stalls (look for chicken, sausage and sticky rice on a charcoal grill)",area:"other",note:{en:"Often sold alongside grilled chicken (gai yang) and papaya salad (som tam) at Isan food stalls. Evenings are most reliable.",idn:"Di warung Isan sering dijual bareng ayam bakar (gai yang) dan som tum. Paling pasti ada di malam hari."}}],imgQuery:"Sai krok Isan",imgAlt:"Grilled Isan sausages served with cabbage, ginger and chilies",mapsQuery:"sai krok isan Bangkok"},{id:"pla-muek-yang",cat:"street",name:{en:"Thai Grilled Squid (Pla Muek Yang)",th:"ปลาหมึกย่าง",idn:"Pla muek yang (cumi bakar ala Thailand)"},rom:"pla muek yang",desc:{en:"Whole squid or squid tentacles grilled over charcoal until smoky and chewy, sliced into rings and served with a tangy, spicy seafood dipping sauce. A popular evening street snack.",idn:"Cumi utuh atau tentakelnya dibakar di atas arang sampai beraroma asap dan kenyal, lalu diiris bulat dan dicocol saus seafood asam pedas. Jajanan malam yang populer."},ingredients:{en:["squid","seafood dipping sauce (chili, garlic, lime, fish sauce, coriander)"],idn:["cumi","saus seafood (cabai, bawang putih, jeruk nipis, kecap ikan, daun ketumbar)"]},spice:2,price:[40,120],allergens:["shellfish","fish"],pork:"no",seafood:"yes",veg:"no",tags:["street","late-night","high-protein","kr-familiar"],beginner:{en:"Closer to Indonesian cumi bakar than to fried calamari. The dipping sauce is where the heat is, so ask for it on the side if you are unsure. Squid prices vary a lot by size; ask the price before the vendor starts grilling.",idn:"Lebih mirip cumi bakar di Indonesia daripada cumi goreng tepung. Pedasnya ada di saus, jadi kalau khawatir, minta sausnya dipisah. Harga cumi beda jauh tergantung ukurannya, jadi tanyakan harga sebelum mulai dibakar."},order:{en:"Order one squid and ask for the sauce on the side.",idn:"Pesan satu ekor cumi dan minta sausnya dipisah.",th:"ขอปลาหมึกย่างหนึ่งตัว แยกน้ำจิ้ม{P}",rom:"khor pla muek yang nueng tua, yaek nam jim {P}"},fact:{en:"Many carts also sell dried squid: it is grilled, then run through a hand-cranked roller to flatten and tenderize it before being torn into strips.",idn:"Banyak gerobak juga jual cumi kering: dibakar dulu, lalu digiling dengan roller putar tangan sampai pipih dan empuk, kemudian disobek-sobek."},where:[{name:"Night-market and street grill stalls",area:"other",note:{en:"Charcoal-grill carts at night markets and busy evening streets, including Yaowarat's evening food strip.",idn:"Gerobak cumi bakar arang ada di pasar malam dan jalanan yang ramai di malam hari. Di jalur kuliner malam Yaowarat juga banyak."}}],imgQuery:"Grilled squid Thailand street food",imgAlt:"Grilled squid on skewers at a Thai street stall",mapsQuery:"pla muek yang grilled squid Bangkok"},{id:"look-chin-pla",cat:"street",name:{en:"Fish Balls (Look Chin Pla)",th:"ลูกชิ้นปลา",idn:"Look chin pla (bakso ikan Thailand)"},rom:"look chin pla",desc:{en:"Springy balls of ground fish paste sold on skewers (look chin ping), grilled and brushed with sweet chili sauce, or served in noodle soup. Beef, pork and shrimp versions sit next to them at the same stall.",idn:"Bola-bola ikan kenyal dari daging ikan giling. Ditusuk lalu dibakar dan diolesi saus sambal manis, atau disajikan di atas mie. Di lapak yang sama juga ada bakso sapi, babi, dan udang."},ingredients:{en:["fish paste","tapioca starch","salt","pepper","sweet chili sauce"],idn:["adonan daging ikan","tepung tapioka","garam","merica","saus sambal manis"]},spice:1,price:[10,60],allergens:["fish","gluten"],pork:"optional",seafood:"yes",veg:"no",tags:["street","beginner","local-fav","kr-familiar"],beginner:{en:"Like Indonesian bakso ikan or pentol, but bouncier and denser. Skewers are about 10-15 THB each, bowls of fish-ball noodles about 40-60 THB. Many skewer stalls mix fish, beef and pork balls, so ask which is which if you avoid pork.",idn:"Mirip bakso ikan atau pentol di Indonesia, tapi lebih kenyal dan padat. Satu tusuk sekitar 10-15 baht, semangkuk mie bakso ikan sekitar 40-60 baht. Satu lapak sering mencampur bakso ikan, sapi, dan babi, jadi kalau kamu menghindari babi, tanyakan dulu jenisnya (atau bilang \"mai sai moo\")."},order:{en:"Order fish-ball skewers and ask for no chili.",idn:"Pesan sate bakso ikan dan minta tanpa cabai.",th:"ขอลูกชิ้นปลาห้าไม้ ไม่เผ็ด{P}",rom:"khor look chin pla ha mai, mai phet {P}"},fact:{en:"Fish-ball noodles (kuay tiao look chin pla) is a standard cheap lunch across Bangkok, with a clear broth and a splash of vinegar and chili at the table.",idn:"Mie bakso ikan (kuay tiao look chin pla) adalah menu makan siang murah yang ada di seluruh Bangkok. Kuahnya bening, tinggal tambah cuka dan cabai yang tersedia di meja."},where:[{name:"Street skewer carts and noodle shops",area:"other",note:{en:"Found near schools, markets and BTS/MRT exits. Look for the steamed or fried ball display with sauce bottles.",idn:"Banyak ditemukan dekat sekolah, pasar, dan pintu keluar BTS/MRT. Cari lapak dengan etalase bakso dan botol-botol saus."}}],imgQuery:"Look chin Thai fish balls",imgAlt:"Grilled fish ball skewers with sweet chili sauce at a Thai street stall",mapsQuery:"fish ball noodles Bangkok"},{id:"khanom-jeeb",cat:"street",name:{en:"Khanom Jeeb (Thai Steamed Dumplings)",th:"ขนมจีบ",idn:"Khanom jeeb (siomay ala Thailand)"},rom:"kha-nom jeeb",desc:{en:"Thai-style siu mai: steamed pork (often with shrimp) dumplings in a thin yellow wrapper, topped with crispy fried garlic and served with sweet soy sauce and chili.",idn:"Siomay ala Thailand: daging babi (di beberapa tempat ditambah udang) dibungkus kulit kuning tipis lalu dikukus, ditaburi bawang putih goreng renyah, dan disajikan dengan kecap manis dan saus sambal."},ingredients:{en:["ground pork","shrimp (some stalls)","wonton wrapper","fried garlic","sweet soy sauce","chili sauce"],idn:["daging babi cincang","udang (di beberapa kedai)","kulit pangsit","bawang putih goreng","kecap manis","saus sambal"]},spice:1,price:[20,50],allergens:["gluten","soy","shellfish"],pork:"yes",seafood:"optional",veg:"no",tags:["street","beginner","kr-familiar"],beginner:{en:"A small snack, sold in a cup or tray of 4-6 pieces. The dumplings are not spicy; the chili sauce is on the side. Many stalls use pork only, but some add shrimp, so ask if you avoid shellfish.",idn:"Camilan kecil yang dijual per cup atau nampan isi 4-6 buah. Siomaynya nggak pedas, saus sambalnya terpisah. Banyak lapak hanya pakai babi, tapi ada juga yang menambahkan udang, jadi tanyakan dulu kalau kamu menghindari seafood bercangkang."},order:{en:"One cup of dumplings, no chili.",idn:"Satu cup siomay, tanpa cabai.",th:"ขอขนมจีบหนึ่งถ้วย ไม่เอาพริก{P}",rom:"khor kha-nom jeeb nueng thuay, mai ao phrik {P}"},fact:{en:"Khanom jeeb came to Thailand with Chinese immigrants; it is a take on Cantonese siu mai (\"jeeb\" means pleated), but the street version is topped with fried garlic.",idn:"Khanom jeeb dibawa ke Thailand oleh imigran Tionghoa. Asalnya dari siu mai dim sum Kanton ('jeeb' artinya lipatan), tapi versi Thailand ditaburi bawang putih goreng."},where:[{name:"Street steamer carts and Yaowarat stalls",area:"yaowarat",note:{en:"Steamer carts in markets and around Chinatown; some dim sum restaurants also sell it, at higher prices.",idn:"Dijual di gerobak kukusan di pasar dan sekitar Chinatown. Restoran dim sum juga menjualnya, tapi harganya lebih mahal."}}],imgQuery:"Khanom jeeb Thai steamed dumplings",imgAlt:"Steamed Thai pork dumplings in yellow wrappers topped with fried garlic",mapsQuery:"khanom jeeb steamed dumplings Bangkok"},{id:"kluay-tod",cat:"street",name:{en:"Thai Fried Banana (Kluay Tod)",th:"กล้วยทอด",idn:"Kluay tod (pisang goreng Thailand)"},rom:"kluay tod",desc:{en:"Bananas battered with rice flour, coconut and sesame seeds, deep-fried until golden and crunchy outside, soft and sweet inside. Sold in paper bags at carts, often next to fried sweet potato and taro.",idn:"Pisang dibalut tepung beras, kelapa, dan wijen, lalu digoreng renyah. Luarnya garing, dalamnya lembut dan manis. Dijual dalam kantong kertas, dan banyak lapak juga jual ubi goreng dan talas goreng."},ingredients:{en:["banana","rice flour","grated coconut","sesame seeds","sugar"],idn:["pisang","tepung beras","kelapa parut","wijen","gula"]},spice:0,price:[20,50],allergens:["sesame"],pork:"no",seafood:"no",veg:"yes",tags:["street","sweet","local-fav","beginner","kr-familiar"],beginner:{en:"Best eaten straight from the fryer while hot and crisp. They get soft and oily if you wait. The bag usually holds 4-8 pieces and is easy to share with teammates.",idn:"Paling enak dimakan langsung selagi panas dan renyah. Kalau dingin jadi lembek dan berminyak. Satu kantong biasanya isi 4-8 potong, enak dibagi bareng teman satu tim."},order:{en:"Ask for one bag of fried bananas.",idn:"Minta satu kantong pisang goreng.",th:"ขอกล้วยทอดหนึ่งถุง{P}",rom:"khor kluay tod nueng thung {P}"},fact:{en:"Thais usually use small, sweet 'nam wa' bananas for frying, which hold their shape and sweetness better than the large Cavendish bananas eaten raw.",idn:"Untuk digoreng, orang Thailand biasanya pakai pisang 'nam wa' yang kecil dan manis. Bentuk dan rasa manisnya lebih terjaga dibanding pisang Cavendish besar yang dimakan mentah."},where:[{name:"Street fryer carts at markets and near BTS/MRT exits",area:"other",note:{en:"Look for a cart with a wok of oil and trays of fried banana, taro and sweet potato.",idn:"Cari gerobak dengan wajan minyak dan tumpukan pisang, talas, dan ubi goreng."}}],imgQuery:"Kluay tod fried banana Thailand",imgAlt:"Golden fried bananas in a paper bag at a Thai street stall",mapsQuery:"kluay tod fried banana Bangkok"},{id:"roti",cat:"street",name:{en:"Thai Street Roti (Roti Gluay / Roti Saimai)",th:"โรตี",idn:"Roti (roti kaki lima Thailand)"},rom:"ro-ti",desc:{en:"A thin, flaky flatbread stretched and fried on a flat griddle by Thai-Muslim vendors, then filled or topped: egg and condensed milk, banana, chocolate, or served as roti saimai with colorful cotton-candy threads. Some Thai-Muslim restaurants also serve roti with curry.",idn:"Roti tipis yang ditarik lalu dipanggang di atas wajan datar oleh pedagang Muslim Thailand. Isinya bisa telur dan susu kental manis, pisang, atau cokelat, dan ada juga roti saimai yang membungkus benang gula warna-warni mirip gulali. Restoran Muslim Thailand juga menjual roti yang dimakan dengan kari."},ingredients:{en:["flour dough","margarine or butter","egg","condensed milk","sugar","cotton-candy threads (saimai)"],idn:["adonan tepung terigu","margarin atau mentega","telur","susu kental manis","gula","benang gula (saimai)"]},spice:0,price:[25,100],allergens:["gluten","egg","dairy"],pork:"no",seafood:"no",veg:"option",tags:["street","sweet","late-night","local-fav","beginner","kr-familiar"],beginner:{en:"Sweet roti is a dessert snack, not a main meal. It is flaky, buttery and very sweet with condensed milk. Plain roti with egg is less sweet. Roti saimai is sold as thin crepes wrapped around sugar threads. For a savory meal, go to a Thai-Muslim restaurant and order roti with curry. Banana-and-egg roti has its own entry in the desserts section.",idn:"Roti manis lebih cocok jadi camilan pencuci mulut daripada makan berat. Renyah, wangi mentega, dan manis banget karena susu kental manis. Roti isi telur saja nggak terlalu manis. Roti saimai berupa crepe tipis yang membungkus benang gula. Kalau mau makan berat, pesan roti dengan kari di restoran Muslim Thailand. Roti pisang telur punya entri sendiri di bagian hidangan penutup."},order:{en:"Ask for roti with egg and condensed milk.",idn:"Pesan roti isi telur dan susu kental manis.",th:"ขอโรตีใส่ไข่ ใส่นมข้น{P}",rom:"khor ro-ti sai khai, sai nom khon {P}"},fact:{en:"Roti saimai is often linked to Ayutthaya and Thai-Muslim roti makers; saimai means silk thread, and the candy threads look like spun silk.",idn:"Roti saimai erat kaitannya dengan Ayutthaya dan para pembuat roti Muslim Thailand. Saimai artinya benang sutra, karena benang gulanya terlihat seperti sutra."},where:[{name:"Roti Mataba (Phra Athit Road)",area:"other",note:{en:"A long-established Thai-Muslim restaurant in Phra Athit, Old Town, well known for roti and matabaa (stuffed pan-fried bread) with curry.",idn:"Restoran Muslim Thailand legendaris di Jalan Phra Athit, kawasan kota tua Bangkok. Terkenal dengan roti, kari, dan matabaa (roti isi yang digoreng di wajan, mirip martabak telur)."}},{name:"Roti carts at night markets and Khao San Road area",area:"other",note:{en:"Easy to spot by the stretching and flipping on a hot griddle, mostly evenings.",idn:"Gampang dikenali dari penjual yang menarik dan membalik adonan di atas wajan panas. Kebanyakan ada di malam hari."}}],imgQuery:"Roti Thai street food",imgAlt:"A roti vendor cooking sweet roti on a griddle at a Bangkok street cart",mapsQuery:"roti Bangkok street cart"},{id:"moo-kratha",cat:"street",name:{en:"Thai BBQ (Moo Kratha)",th:"หมูกระทะ",idn:"Moo kratha (mookata, BBQ prasmanan ala Thailand)"},rom:"moo kra-tha",desc:{en:"A table-top BBQ and hot-pot hybrid: a domed metal pan sits over charcoal or gas, you grill thin-sliced meat on the dome while soup simmers in the moat around it. Most places run as all-you-can-eat buffets, with a self-service counter of meat, seafood, vegetables and noodles.",idn:"Perpaduan BBQ dan hot pot ala Thailand yang dimasak di meja. Daging dipanggang di atas wajan berbentuk kubah, sementara kuah mendidih di parit sekelilingnya. Kebanyakan berupa prasmanan all-you-can-eat, jadi kamu bisa ambil sendiri daging, seafood, sayur, dan mie di konter swalayan."},ingredients:{en:["thin-sliced pork","chicken","seafood","vegetables","glass noodles","egg","seafood dipping sauce (chili, lime, garlic)"],idn:["daging babi iris tipis","daging ayam","seafood","sayuran","soun","telur","saus seafood (cabai, jeruk nipis, bawang putih)"]},spice:2,price:[199,499],allergens:["soy","fish","shellfish","egg"],pork:"yes",seafood:"optional",veg:"no",tags:["late-night","high-protein","post-practice","local-fav"],beginner:{en:"It looks like the Korean BBQ grills that are popular in Indonesia too, but it works differently. Pork is sliced paper-thin and pre-marinated, you cook it on the dome (rub a piece of pork fat on it first to keep it from sticking), and the juices run down into the soup moat, which makes the broth richer as you go. There is no wrapping in lettuce with ssamjang; people dip meat in a spicy-sour seafood sauce instead. Prices usually run roughly 199-499 THB per person depending on the buffet; time limits are common, and some places charge extra for food left on the table. Halal mookata places exist too; search \"mookata halal\" on Google Maps. Be ready to smell like smoke afterwards.",idn:"Kelihatannya mirip resto Korean BBQ yang juga populer di Indonesia, tapi caranya beda. Daging babi diiris sangat tipis dan sudah dibumbui, lalu dipanggang di atas wajan kubah (olesi dulu pakai potongan lemak supaya nggak lengket). Jus dagingnya mengalir ke kuah di pinggiran, jadi kuahnya makin gurih. Nggak ada budaya bungkus selada dengan ssamjang; dagingnya dicocol saus seafood pedas-asam. Prasmanan biasanya 199-499 baht per orang, sering ada batas waktu, dan beberapa tempat mengenakan biaya tambahan untuk makanan yang tersisa. Ada juga mookata halal, cari \"mookata halal\" di Google Maps. Siap-siap bajumu bau asap setelahnya."},order:{en:"Ask for a buffet for a set number of people.",idn:"Sebut jumlah orang dan pesan paket prasmanan.",th:"ขอหมูกระทะบุฟเฟต์สี่ที่{P}",rom:"khor moo kra-tha buffet si thi {P}"},fact:{en:"Moo kratha literally means pork pan, and it is a casual group meal for friends and families, usually eaten in the evening in open-air or semi-open restaurants.",idn:"Moo kratha secara harfiah artinya wajan babi. Ini makan bareng santai untuk teman dan keluarga, biasanya malam hari di restoran terbuka atau semi-terbuka."},where:[{name:"Moo kratha buffet restaurants across Bangkok",area:"other",note:{en:"Search Google Maps for moo kratha buffet near your hotel or venue. Many open in the evening and stay open late.",idn:"Cari \"moo kratha buffet\" di Google Maps dekat hotel atau venue kamu. Banyak yang buka dari sore dan tutup larut malam."}}],imgQuery:"Moo kratha Thai barbecue",imgAlt:"A domed Thai moo kratha grill with meat and soup on a table",mapsQuery:"moo kratha buffet Bangkok"},{id:"mango-sticky-rice",cat:"desserts",name:{en:"Mango Sticky Rice",th:"ข้าวเหนียวมะม่วง",idn:"Ketan mangga (khao niao mamuang)"},rom:"khao niao ma-muang",desc:{en:"Ripe sweet mango slices beside warm sticky rice cooked in sweetened coconut milk, finished with a drizzle of salty-sweet coconut cream and often crispy mung beans. Thailand's best-known dessert.",idn:"Irisan mangga matang yang manis disajikan bersama ketan hangat yang dimasak dengan santan manis, lalu disiram krim santan gurih-manis dan ditaburi kacang hijau renyah. Hidangan penutup paling terkenal dari Thailand."},ingredients:{en:["ripe mango","glutinous rice","coconut milk","sugar","salt","crispy mung beans"],idn:["mangga matang","beras ketan","santan","gula","garam","kacang hijau renyah"]},spice:0,price:[60,200],allergens:[],pork:"no",seafood:"no",veg:"yes",tags:["street","sweet","local-fav","beginner","kr-familiar"],beginner:{en:"Mango season peaks roughly March to June; outside that window mango is imported or less sweet, so quality varies. A portion is a decent size, so share one between two people after a big dinner. The coconut cream on top is mildly salty, which is intentional.",idn:"Musim mangga kira-kira Maret sampai Juni. Di luar itu mangganya bisa kurang manis atau impor, jadi kualitasnya beda-beda. Porsinya cukup besar, jadi bisa dibagi berdua setelah makan malam yang berat. Krim santan di atasnya memang sengaja dibuat sedikit asin."},order:{en:"Ask for one portion of mango sticky rice.",idn:"Pesan satu porsi ketan mangga.",th:"ขอข้าวเหนียวมะม่วงหนึ่งที่{P}",rom:"khor khao niao ma-muang nueng thi {P}"},fact:{en:"The mango is traditionally a sweet variety such as nam dok mai, and the rice is soaked and steamed before being mixed with coconut milk, which is why it is both sticky and rich.",idn:"Mangganya biasanya varietas manis seperti nam dok mai, dan ketannya direndam lalu dikukus sebelum dicampur santan. Karena itu teksturnya pulen dan rasanya kaya."},where:[{name:"Mae Varee",area:"thonglor",note:{en:"A well-known fruit and mango sticky rice shop on Sukhumvit Soi 55 (Thonglor), famous for ripe mango in season. Expect a line at peak times.",idn:"Toko buah dan ketan mangga terkenal di Sukhumvit Soi 55 (Thonglor), terkenal dengan mangga matang saat musimnya. Siap-siap antre di jam ramai."}},{name:"Market dessert stalls (e.g., Chatuchak Weekend Market)",area:"other",note:{en:"Many stalls sell packaged portions to take away. Price depends on mango size and season.",idn:"Banyak lapak menjual porsi kemasan untuk dibawa pulang. Harga tergantung ukuran mangga dan musim."}}],imgQuery:"Mango sticky rice",imgAlt:"A plate of mango sticky rice with sliced mango and coconut cream",mapsQuery:"mango sticky rice Bangkok",geoQuery:"Mae Varee, Sukhumvit 55, Bangkok"},{id:"coconut-ice-cream",cat:"desserts",name:{en:"Coconut Ice Cream",th:"ไอศกรีมกะทิ",idn:"Es krim kelapa (ice cream kati)"},rom:"ai-sa-khrim ka-ti",desc:{en:"Creamy ice cream made from coconut milk, scooped into a cup, coconut shell or sweet bun, with toppings such as sticky rice, peanuts, sweet corn and red beans. Much lighter and less sugary than most Western ice cream.",idn:"Es krim lembut dari santan, mirip es puter di Indonesia. Disajikan di cup, batok kelapa, atau roti manis, dengan topping seperti ketan, kacang tanah, jagung manis, dan kacang merah. Lebih ringan dan nggak semanis es krim biasa."},ingredients:{en:["coconut milk","sugar","peanuts","sticky rice","sweet corn","red beans"],idn:["santan","gula","kacang tanah","ketan","jagung manis","kacang merah"]},spice:0,price:[30,80],allergens:["peanut","gluten"],pork:"no",seafood:"no",veg:"yes",tags:["street","sweet","local-fav","beginner","kr-familiar"],beginner:{en:"Toppings are optional: the usual set is peanuts, sticky rice, corn and jelly. If you have a peanut allergy, say so clearly; all toppings sit in open trays. The bread-bun version contains wheat. Ice cream melts quickly in the heat, so eat it fast.",idn:"Topping-nya opsional. Biasanya kacang tanah, ketan, jagung, dan jeli. Kalau alergi kacang, bilang dengan jelas; semua topping ditaruh di wadah terbuka. Versi roti mengandung gandum. Es krimnya cepat meleleh karena panas, jadi cepat dimakan ya."},order:{en:"Ask for coconut ice cream with toppings, no peanuts if needed.",idn:"Minta es krim kelapa dengan topping. Kalau perlu, minta tanpa kacang.",th:"ขอไอติมกะทิสองลูก ไม่ใส่ถั่ว{P}",rom:"khor ai-tim ka-ti song luk, mai sai thua {P}"},fact:{en:"In Thailand, 'ai-tim' (from 'ice cream') is the casual word for ice cream, and vendors often scoop it into a hot-dog bun, a unique Thai street style.",idn:"Di Thailand, es krim biasa disebut 'ai-tim'. Es krim yang diselipkan di roti hot dog juga gaya jajanan khas Thailand."},where:[{name:"Chatuchak Weekend Market",area:"other",note:{en:"Coconut ice cream stalls are a regular sight around the market; weekend crowds are big and midday is very hot, so be prepared.",idn:"Lapak es krim kelapa sering terlihat di dalam Pasar Chatuchak. Akhir pekan ramai banget dan siang hari panas, jadi siap-siap ya."}}],imgQuery:"Thai coconut ice cream",imgAlt:"Scoops of Thai coconut ice cream with roasted peanuts",mapsQuery:"coconut ice cream Chatuchak Bangkok"},{id:"khanom-krok",cat:"desserts",name:{en:"Khanom Krok (Coconut Pancakes)",th:"ขนมครก",idn:"Khanom krok (pancake kelapa)"},rom:"kha-nom krok",desc:{en:"Bite-size coconut-rice pancakes cooked in a hot cast-iron mold with half-sphere hollows: crisp and caramelized at the edges, creamy and custardy in the middle. Often topped with scallion, corn or taro.",idn:"Pancake kelapa-beras seukuran sekali gigit yang dimasak di cetakan besi panas berlubang setengah bola. Pinggirannya renyah dan berkaramel, bagian tengahnya lembut seperti custard. Topping yang umum: daun bawang, jagung, atau talas."},ingredients:{en:["rice flour","coconut milk","sugar","scallion","corn or taro (optional)"],idn:["tepung beras","santan","gula","daun bawang","jagung atau talas (opsional)"]},spice:0,price:[20,45],allergens:[],pork:"no",seafood:"no",veg:"yes",tags:["street","sweet","local-fav","beginner","kr-familiar"],beginner:{en:"Usually sold as 6-8 halves, pressed together in pairs. The scallion version is sweet-salty; the plain one is purely sweet. Eat them warm; they harden as they cool.",idn:"Biasanya dijual 6-8 potong setengah bola yang ditangkupkan berpasangan. Versi daun bawang rasanya manis-gurih, versi polos manis saja. Makan selagi hangat; kalau dingin jadi keras."},order:{en:"One box of khanom krok, please.",idn:"Satu kotak khanom krok, ya.",th:"ขอขนมครกหนึ่งกล่อง{P}",rom:"khor kha-nom krok nueng klong {P}"},fact:{en:"Krok means mortar in Thai, named after the shape of the hollowed cooking mold that looks like a stone mortar.",idn:"'Krok' artinya lesung dalam bahasa Thai. Namanya diambil dari cetakan berlubang setengah bola yang mirip lesung batu."},where:[{name:"Street and market stalls",area:"other",note:{en:"Made fresh to order in a small cast-iron mold on a cart. Common in the afternoon and evening.",idn:"Dibuat langsung saat dipesan di cetakan besi kecil di atas gerobak. Banyak ditemui sore dan malam hari."}}],imgQuery:"Khanom krok",imgAlt:"Khanom krok, small coconut-rice pancakes, cooking in a dimpled pan",mapsQuery:"khanom krok Bangkok"},{id:"bua-loy",cat:"desserts",name:{en:"Bua Loy (Rice Balls in Coconut Milk)",th:"บัวลอย",idn:"Bua loy (bola ketan kuah santan)"},rom:"bua loi",desc:{en:"Chewy glutinous rice balls, often colored with pandan or purple sweet potato, floating in warm, lightly sweet and salty coconut milk. Commonly topped with a soft-boiled egg or taro.",idn:"Bola ketan kenyal yang diberi warna dari pandan atau ubi ungu, mengapung di kuah santan hangat yang manis gurih. Sering ditambah telur setengah matang atau talas."},ingredients:{en:["glutinous rice flour","coconut milk","palm sugar","salt","egg (optional)","taro or sweet potato"],idn:["tepung ketan","santan","gula aren","garam","telur (opsional)","talas atau ubi"]},spice:0,price:[30,70],allergens:["egg"],pork:"no",seafood:"no",veg:"yes",tags:["sweet","local-fav","kr-familiar"],beginner:{en:"Served warm, which is a nice change on a cool evening. If you want to avoid egg, ask for no egg: it is usually an optional add-on. The chewy balls are a lot like Indonesian biji salak or candil, but the soup here is lightly salty-sweet coconut milk.",idn:"Disajikan hangat, cocok untuk malam yang sejuk. Kalau nggak mau telur, minta tanpa telur; biasanya itu tambahan opsional. Bola ketannya mirip biji salak atau candil di Indonesia, bedanya kuahnya santan manis gurih."},order:{en:"One bowl of bua loy with egg.",idn:"Satu mangkuk bua loy pakai telur, ya.",th:"ขอบัวลอยใส่ไข่หนึ่งถ้วย{P}",rom:"khor bua-loi sai khai nueng thuay {P}"},fact:{en:"Bua loy literally means floating lotus, because the round balls float up in the soup like lotus blossoms on a pond.",idn:"Bua loy secara harfiah artinya 'teratai mengapung', karena bola-bola bulatnya mengapung di kuah seperti bunga teratai di kolam."},where:[{name:"Dessert shops and market stalls around Yaowarat",area:"yaowarat",note:{en:"Chinatown's dessert shops and food stalls often serve warm sweet soups, including bua loy.",idn:"Toko dessert dan lapak di Chinatown sering menjual dessert kuah hangat yang manis, termasuk bua loy."}}],imgQuery:"Bua loy Thai dessert",imgAlt:"A bowl of colorful bua loy rice balls in coconut milk",mapsQuery:"bua loy Thai dessert Bangkok"},{id:"lod-chong",cat:"desserts",name:{en:"Lod Chong",th:"ลอดช่อง",idn:"Lod chong (cendol ala Thailand)"},rom:"lot chong",desc:{en:"Short green pandan-flavored rice-flour noodles served over shaved ice in sweet coconut milk, usually with palm sugar syrup. Cool, fragrant and slippery.",idn:"Mie tepung beras hijau beraroma pandan (pendek dan kenyal) disajikan dengan es serut dan santan manis, biasanya plus sirup gula aren. Dingin, harum, dan licin."},ingredients:{en:["rice flour","pandan","coconut milk","palm sugar syrup","shaved ice"],idn:["tepung beras","pandan","santan","sirup gula aren","es serut"]},spice:0,price:[25,60],allergens:[],pork:"no",seafood:"no",veg:"yes",tags:["sweet","local-fav","kr-familiar"],beginner:{en:"The noodles are soft, slippery and mildly sweet, closer to a drink with a chew than a noodle dish. If you have tried cendol in Singapore or Malaysia, it is a close cousin.",idn:"Mie-nya lembut, licin, dan manisnya pas, jadi lebih mirip minuman dengan tekstur kenyal daripada hidangan mie. Kalau kamu suka es cendol di Indonesia, ini saudara dekatnya."},order:{en:"One bowl of lod chong, please.",idn:"Satu mangkuk lod chong, ya.",th:"ขอลอดช่องหนึ่งถ้วย{P}",rom:"khor lot-chong nueng thuay {P}"},fact:{en:"Lod chong means to pass through a gap, because the noodles are traditionally pressed through a perforated tool into water to form short strands.",idn:"Lod chong artinya 'melewati celah', karena adonannya ditekan melalui alat berlubang ke dalam air sampai membentuk mie pendek."},where:[{name:"Dessert counters in markets and food courts",area:"other",note:{en:"Often sold in sets with other sweet toppings. Bowls are small, so people often order two desserts.",idn:"Sering dijual satu paket dengan topping manis lainnya. Mangkuknya kecil, jadi banyak orang pesan dua macam dessert."}}],imgQuery:"Lod chong Thai dessert",imgAlt:"Lod chong: green pandan rice-flour noodles in iced coconut milk",mapsQuery:"lod chong Thai dessert Bangkok"},{id:"banana-roti",cat:"desserts",name:{en:"Thai Banana Roti",th:"โรตีกล้วย",idn:"Roti pisang (pancake pisang ala Thailand)"},rom:"ro-ti kluay",desc:{en:"A thin flaky roti folded around sliced banana and egg, fried on a griddle, chopped into pieces and drizzled with sweetened condensed milk. Chocolate or Nutella is a common upgrade.",idn:"Roti tipis renyah diisi irisan pisang dan telur, dilipat dan dipanggang di wajan datar, lalu dipotong-potong dan disiram susu kental manis. Tambahan cokelat atau Nutella juga umum."},ingredients:{en:["roti dough","banana","egg","sweetened condensed milk","chocolate sauce (optional)"],idn:["adonan roti","pisang","telur","susu kental manis","saus cokelat (opsional)"]},spice:0,price:[30,70],allergens:["gluten","egg","dairy"],pork:"no",seafood:"no",veg:"option",tags:["street","sweet","late-night","beginner","local-fav","kr-familiar"],beginner:{en:"A very sweet, warm street dessert; one portion is fine to share between two people. If you do not want egg or chocolate, say so before it is fried. The vendor cooks it to order, so it takes a few minutes. The savory roti-with-curry option is in the street section under Roti.",idn:"Dessert kaki lima yang hangat dan manis banget; satu porsi cukup dibagi berdua. Kalau nggak mau telur atau cokelat, bilang sebelum dimasak. Dimasak saat dipesan, jadi butuh beberapa menit. Roti gurih yang dimakan dengan kari ada di entri Roti di bagian jajanan kaki lima."},order:{en:"Roti with banana and egg, with chocolate if you like.",idn:"Roti isi pisang dan telur, ya. Tambah cokel
