 siang. Nggak ada landmark besar, tapi justru itu daya tariknya. Duduk di dekat jendela dengan secangkir kopi enak dan biarkan sore berjalan pelan. Jauh lebih tenang dan berasa perumahan dibanding Siam atau Sukhumvit. Kekurangannya, spotnya menyebar dan gangnya bisa panas karena minim naungan."},food:[{name:"Soi Ari 1 (Phahon Yothin Soi 7) lunch stalls and shophouse eateries",note:{en:"Local Thai lunch spots popular with office workers; look for the places with a queue at 12:00.",idn:"Deretan tempat makan Thai lokal favorit pekerja kantoran. Pilih yang antre jam 12 siang, dijamin jarang zonk."},mapsQuery:"Soi Ari 1 restaurants Bangkok"},{name:"Soi Ari 4 casual restaurants and bars",note:{en:"A short soi packed with small restaurants and bars that get livelier after sunset.",idn:"Gang berisi restoran dan bar kecil yang makin hidup setelah matahari terbenam."},mapsQuery:"Soi Ari 4 Bangkok restaurants"},{name:"Street food near BTS Ari exits",note:{en:"Grilled meats, noodles and fruit stalls around the station; handy for a cheap, quick bite.",idn:"Ada lapak sate, mi, dan buah di sekitar stasiun. Murah dan pas buat makan cepat."},mapsQuery:"street food BTS Ari Bangkok"}],cafes:[{name:"Specialty coffee shops around Soi Ari 1 and Soi Ari 4",note:{en:"Ari has one of Bangkok's densest clusters of independent coffee roasters and brunch cafés; wander and pick one with natural light.",idn:"Ari punya salah satu konsentrasi roastery independen dan kafe brunch terpadat di Bangkok. Jalan-jalan dan pilih yang pencahayaannya bagus."},mapsQuery:"specialty coffee Ari Bangkok"},{name:"Brunch cafés in converted houses",note:{en:"Several cafés are set in renovated homes with small gardens; great for a quiet laptop session or recovery morning.",idn:"Banyak kafe di rumah yang direnovasi dengan taman kecil. Enak buat kerja pakai laptop atau pagi santai buat recovery."},mapsQuery:"brunch cafe Ari Bangkok"}],shopping:[{name:"Independent boutiques and vintage shops on Soi Ari 4 and nearby sois",note:{en:"Small, low-key fashion and home-goods shops; hours vary, and some open late.",idn:"Toko fashion dan barang dekorasi kecil-kecilan. Jam bukanya beda-beda, ada yang buka agak siang."},mapsQuery:"boutique shops Ari Bangkok"},{name:"Or Tor Kor Market (a short ride away, MRT Kamphaeng Phet)",note:{en:"One of Bangkok's best-known fresh markets, great for tropical fruit and prepared foods. Confirm the route on Google Maps.",idn:"Salah satu pasar segar paling terkenal di Bangkok, juara untuk buah tropis dan lauk siap santap. Cek rutenya di Google Maps."},mapsQuery:"Or Tor Kor Market Bangkok"}],activities:[{en:"Coffee-hop between two or three independent cafés",idn:"Café hopping ke dua atau tiga kafe independen"},{en:"Slow shophouse and mural stroll along Soi Ari 4 and neighboring lanes",idn:"Jalan santai lihat shophouse dan mural di Soi Ari 4 dan gang sekitarnya"},{en:"Late lunch with office-worker crowds at a local Thai restaurant",idn:"Makan siang telat bareng pekerja kantoran di rumah makan Thai lokal"},{en:"Evening drink in the small bars off Soi Ari 4",idn:"Minum malam di bar kecil sekitar Soi Ari 4"}],duration:{en:"Half day (3–4 h)",idn:"Setengah hari (3–4 jam)"},budget:{level:2,text:{en:"≈ 500–1,000 THB per person incl. food & coffee (estimate)",idn:"≈ 500–1.000 THB per orang, termasuk makan & kopi (perkiraan)"}},bestTime:{en:"Late morning to mid-afternoon on a weekday for coffee; early evening for dinner. Some cafés close early, so check hours.",idn:"Kalau tujuannya ngopi, datang hari kerja siang sampai pertengahan sore. Untuk makan malam, lebih enak sore menjelang malam. Ada kafe yang tutup cepat, jadi cek jam bukanya."},stations:[{name:"BTS Ari",line:"BTS Sukhumvit Line"},{name:"BTS Sanam Pao",line:"BTS Sukhumvit Line"}],route:[{en:"Start: BTS Ari, exit toward Phahon Yothin Soi 7 (Soi Ari 1).",idn:"Mulai: BTS Ari, keluar ke arah Phahon Yothin Soi 7 (Soi Ari 1)."},{en:"Walk Soi Ari 1 for breakfast or a first coffee at a shophouse café.",idn:"Susuri Soi Ari 1 untuk sarapan atau kopi pertama di kafe shophouse."},{en:"Cut across to Soi Ari 4 for boutiques, mural corners and a second café.",idn:"Pindah ke Soi Ari 4 untuk butik, sudut mural, dan kafe kedua."},{en:"Lunch at a local Thai spot on one of the sois (follow the lunchtime queue).",idn:"Makan siang di rumah makan Thai lokal di gang (pilih yang antre saat jam makan siang)."},{en:"Optional: BTS to Mo Chit/MRT to Kamphaeng Phet for Or Tor Kor Market (confirm route on Google Maps).",idn:"Opsional: naik BTS ke Mo Chit/MRT ke Kamphaeng Phet untuk Pasar Or Tor Kor (cek rute di Google Maps)."}],knowBefore:{en:"Sois are quiet but have little shade; midday heat can be intense. Footpaths are narrow and uneven, so watch for motorbikes. Many cafés fill up on weekend mornings.",idn:"Gangnya tenang tapi minim naungan, jadi tengah hari cukup panas. Trotoarnya sempit dan nggak rata, dan ada motor lewat, jadi hati-hati. Akhir pekan pagi kafe cepat penuh."},geoQuery:"Ari, Phaya Thai, Bangkok",mapsQuery:"Ari Bangkok",imgQuery:"Ari Bangkok",imgAlt:"A quiet street and cafés in Ari, Bangkok"},{id:"song-wat",name:{en:"Song Wat",idn:"Song Wat",th:"ถนนทรงวาด"},tagline:{en:"Creative cafés inside crumbling century-old Chinese shophouses",idn:"Jalan kafe kreatif di shophouse Tionghoa berusia seabad"},personality:{en:"Song Wat Road runs between Chinatown and the river, a lane of old trading warehouses and narrow Sino-Portuguese shophouses that once served the port. Peeling plaster, tiled facades and heavy wooden doors now share space with specialty coffee, galleries and small design spaces. It is quieter than Yaowarat but not empty, and much of the charm is simply looking up at the architecture. Pavements are tight and traffic can squeeze through at lunchtime, so go slowly.",idn:"Song Wat Road membentang di antara Chinatown dan Sungai Chao Phraya, jalan berisi gudang dagang lama dan shophouse Sino-Portugis sempit yang dulu melayani pelabuhan. Di sela plester yang mengelupas, fasad bertegel, dan pintu kayu yang berat, kini ada kedai specialty coffee, galeri, dan ruang desain kecil. Lebih sepi dari Yaowarat tapi nggak benar-benar kosong, dan keasyikan utamanya adalah mendongak menikmati arsitekturnya. Trotoarnya sempit dan mobil lewat saat jam makan siang, jadi jalan pelan-pelan."},food:[{name:"Old Chinese shophouse eateries along Song Wat Road",note:{en:"Small, no-frills places serving noodles, rice dishes and simple Chinese-Thai plates; many are lunch-focused and close by late afternoon.",idn:"Rumah makan sederhana yang jual mi, nasi rames, dan masakan Tionghoa-Thai simpel. Kebanyakan fokus makan siang, jadi banyak yang tutup sore."},mapsQuery:"restaurants Song Wat Road Bangkok"},{name:"Yaowarat street food (a short walk east)",note:{en:"The famous Chinatown street-food stretch is walkable from Song Wat for dinner.",idn:"Jalan jajanan kaki lima Chinatown yang terkenal bisa dicapai jalan kaki, enak buat makan malam."},mapsQuery:"Yaowarat Road street food Bangkok"},{name:"Riverside snacks near Ratchawong Pier",note:{en:"Small vendors around the pier area sell drinks and quick bites while you wait for a boat.",idn:"Di sekitar Dermaga Ratchawong ada pedagang yang jual minuman dan camilan ringan."},mapsQuery:"Ratchawong Pier Bangkok"}],cafes:[{name:"Specialty coffee shops in renovated Song Wat shophouses",note:{en:"Several independent cafés occupy restored buildings with high ceilings and original tile floors; hours vary, so check before you walk there.",idn:"Ada kafe independen di bangunan yang direstorasi, dengan langit-langit tinggi dan lantai tegel aslinya. Jam bukanya beda-beda, jadi cek sebelum ke sana."},mapsQuery:"cafe Song Wat Road Bangkok"},{name:"Small galleries with a coffee counter",note:{en:"Some creative spaces combine a gallery corner and a café; a calm place to sit out the afternoon heat.",idn:"Ada ruang kecil yang menggabungkan galeri dan kafe. Enak buat istirahat menghindari panas sore."},mapsQuery:"gallery cafe Song Wat Bangkok"}],shopping:[{name:"Sampeng Lane (Soi Wanit 1) wholesale market",note:{en:"A narrow, crowded alley of wholesale trinkets, stationery and accessories; bring small bills, and watch your bag.",idn:"Gang sempit dan ramai berisi grosir pernak-pernik, alat tulis, dan aksesori. Siapkan uang pecahan kecil dan jaga tas kamu."},mapsQuery:"Sampeng Lane Bangkok"},{name:"Small design and craft shops on Song Wat Road",note:{en:"A few boutique shops and workshops; limited and irregular opening hours.",idn:"Ada beberapa toko desain dan kerajinan kecil. Jam bukanya terbatas dan nggak teratur."},mapsQuery:"shop Song Wat Road Bangkok"}],activities:[{en:"Photograph the faded Sino-Portuguese shophouse facades and old warehouse doors",idn:"Foto fasad shophouse Sino-Portugis yang pudar dan pintu gudang tua"},{en:"Spend an afternoon in a café housed in a restored shophouse",idn:"Habiskan sore di kafe shophouse yang direstorasi"},{en:"Walk the street end to end and pop into small galleries",idn:"Susuri jalan dari ujung ke ujung sambil mampir ke galeri kecil"},{en:"Continue on foot to Talat Noi or Yaowarat for the rest of the day",idn:"Lanjut jalan kaki ke Talat Noi atau Yaowarat untuk sisa hari"}],duration:{en:"Half day (2–4 h)",idn:"Setengah hari (2–4 jam)"},budget:{level:2,text:{en:"≈ 400–900 THB per person incl. food & coffee (estimate)",idn:"≈ 400–900 THB per orang, termasuk makan & kopi (perkiraan)"}},bestTime:{en:"Weekday morning to early afternoon, before shops close and before the heat peaks. Many places are closed on Mondays or close by early evening, so check.",idn:"Paling enak hari kerja, pagi sampai siang — sebelum panas memuncak dan sebelum toko-toko tutup. Banyak tempat tutup hari Senin atau tutup sore, jadi cek dulu."},stations:[{name:"Ratchawong Pier",line:"Chao Phraya Express boat; confirm pier and boat line on Google Maps"},{name:"MRT Wat Mangkon",line:"MRT Blue Line (about a 15–20 min walk)"}],route:[{en:"Start: Ratchawong Pier, a short walk to the Song Wat Road entrance.",idn:"Mulai: dari Dermaga Ratchawong jalan kaki sebentar ke ujung Song Wat Road."},{en:"Walk Song Wat Road, looking up at the shophouse facades and old warehouse doors.",idn:"Susuri Song Wat Road sambil mendongak melihat fasad shophouse dan pintu gudang tua."},{en:"Coffee break at a café in a restored building.",idn:"Rehat kopi di kafe dalam bangunan yang direstorasi."},{en:"Detour into Sampeng Lane (Soi Wanit 1) for a market browse.",idn:"Mampir lihat-lihat pasar di Sampeng Lane (Soi Wanit 1)."},{en:"Evening: walk to Yaowarat Road for street food (or on to Talat Noi).",idn:"Malam: jalan kaki ke Yaowarat Road untuk jajanan kaki lima (atau lanjut ke Talat Noi)."}],knowBefore:{en:"Pavements are narrow and shared with trucks and motorbikes; stay alert. Little shade and strong afternoon sun. Many cafés keep irregular hours, and the area quiets down after dark.",idn:"Trotoarnya sempit dan dilewati truk serta motor, jadi tetap waspada. Minim naungan dan matahari sore terik. Jam buka kafe nggak teratur, dan kawasannya jadi sepi setelah gelap."},geoQuery:"Soi Song Wat, Samphanthawong, Bangkok",mapsQuery:"Song Wat Road Bangkok",imgQuery:"Song Wat Road Bangkok",imgAlt:"Old Chinese-style shophouses along Song Wat Road in Bangkok"},{id:"talat-noi",name:{en:"Talat Noi",idn:"Talat Noi",th:"ตลาดน้อย"},tagline:{en:"Street photography, Chinese-Thai shrines and riverside grit",idn:"Foto gang, kelenteng Tionghoa-Thai, dan pesona kasar tepi sungai"},personality:{en:"Talat Noi is one of Bangkok's oldest districts, a tangle of alleys beside the river where Chinese shrines, auto-parts workshops, murals and family-run coffee shops all share the same crooked lanes. Incense drifts from small shrines while mechanics hammer metal next door. It is photogenic, but it is also a working neighborhood, so respect people's homes and shops. The mix of old and new, sacred and greasy, is what makes it special.",idn:"Talat Noi adalah salah satu kawasan tertua di Bangkok. Di gang-gang tepi sungai yang ruwet, kelenteng Tionghoa, bengkel onderdil mobil, mural, dan kedai kopi keluarga bercampur jadi satu. Asap dupa mengepul dari kelenteng kecil, sementara di sebelahnya montir memukul-mukul besi. Fotogenik banget, tapi ini juga tempat orang tinggal dan bekerja, jadi hormati rumah dan toko mereka. Perpaduan lama dan baru, sakral dan berminyak, itulah pesona kawasan ini."},food:[{name:"Old-style Chinese-Thai eateries in the Talat Noi alleys",note:{en:"Family-run places serving noodles, congee and simple rice dishes, often lunch-focused. Point and smile if there is no English menu.",idn:"Rumah makan keluarga yang jual mi, bubur, dan nasi rames sederhana. Kebanyakan fokus makan siang; kalau nggak ada menu bahasa Inggris, tunjuk aja sambil senyum."},mapsQuery:"restaurants Talat Noi Bangkok"},{name:"Yaowarat Road night street food (walkable)",note:{en:"Chinatown's food streets are a short walk away and make a natural dinner follow-up.",idn:"Jalan kuliner Chinatown dekat, jadi enak lanjut makan malam ke sana."},mapsQuery:"Yaowarat Road street food Bangkok"},{name:"Small coffee-shop snacks along Soi Wanit 2 and nearby alleys",note:{en:"Tiny shopfront coffee stalls and traditional sweets; casual and cheap.",idn:"Ada lapak kopi di depan toko kecil dan jajanan tradisional. Santai dan murah."},mapsQuery:"coffee Talat Noi Bangkok"}],cafes:[{name:"Warehouse 30 cafés and creative spaces",note:{en:"A renovated 1940s warehouse complex off Charoen Krung Soi 30 with cafés, design shops and a gallery-like feel. Confirm which tenants are open before you go.",idn:"Kompleks gudang tahun 1940-an di Charoen Krung Soi 30 yang direnovasi, berisi kafe, toko desain, dan nuansa galeri. Cek tenant mana yang buka sebelum ke sana."},mapsQuery:"Warehouse 30 Bangkok"},{name:"Independent cafés in renovated shophouses nearby",note:{en:"A handful of small coffee shops cluster along the alleys; hours are irregular.",idn:"Beberapa kedai kopi kecil berkumpul di sepanjang gang. Jam bukanya nggak teratur."},mapsQuery:"cafe Talat Noi Bangkok"}],shopping:[{name:"Warehouse 30 design shops",note:{en:"Small creative retail and studios inside the warehouse; more browsing than shopping.",idn:"Toko kreatif dan studio kecil di dalam gudang. Lebih buat lihat-lihat daripada belanja."},mapsQuery:"Warehouse 30 Charoen Krung Soi 30 Bangkok"},{name:"Vintage spare-part and antique shops in the alleys",note:{en:"Piles of old auto and machine parts and curios; fun to photograph, rarely practical to buy.",idn:"Toko-toko berisi tumpukan onderdil mobil, mesin tua, dan barang antik. Seru buat difoto, tapi jarang praktis buat dibeli."},mapsQuery:"antique shops Talat Noi Bangkok"}],activities:[{en:"Street photography: murals, rusty parts, shrine details and riverfront light",idn:"Street photography: mural, onderdil berkarat, detail kelenteng, dan cahaya tepi sungai"},{en:"Visit small Chinese-Thai shrines (dress modestly, no loud talking, ask before photographing worshippers)",idn:"Kunjungi kelenteng Tionghoa-Thai kecil (pakaian sopan, jangan berisik, minta izin sebelum memotret orang yang sembahyang)"},{en:"See the Holy Rosary (Kalawar) Church, a historic church near the riverside",idn:"Lihat Gereja Holy Rosary (Kalawar) yang bersejarah, dekat tepi sungai"},{en:"Wander the riverside lanes and watch the boats",idn:"Susuri gang tepi sungai sambil melihat perahu lewat"},{en:"Cross to the other bank for Lhong 1919 or ICONSIAM by boat",idn:"Naik perahu menyeberang ke Lhong 1919 atau ICONSIAM"}],duration:{en:"Half day (2–4 h)",idn:"Setengah hari (2–4 jam)"},budget:{level:1,text:{en:"≈ 300–700 THB per person incl. food & coffee (estimate)",idn:"≈ 300–700 THB per orang, termasuk makan & kopi (perkiraan)"}},bestTime:{en:"Early morning or late afternoon for softer light and cooler air; avoid midday heat. Weekdays are quieter.",idn:"Pagi-pagi atau sore hari untuk cahaya yang lembut dan udara yang lebih sejuk. Hindari tengah hari; hari kerja lebih sepi."},stations:[{name:"Ratchawong Pier",line:"Chao Phraya Express boat; confirm pier on Google Maps"},{name:"MRT Hua Lamphong",line:"MRT Blue Line (about a 15–20 min walk or short ride)"}],route:[{en:"Start: Ratchawong Pier or MRT Hua Lamphong, then walk to Talat Noi.",idn:"Mulai: dari Dermaga Ratchawong atau MRT Hua Lamphong, jalan kaki ke Talat Noi."},{en:"Wander the alley network for murals, old parts shops and small Chinese shrines.",idn:"Keliling gang untuk lihat mural, toko onderdil, dan kelenteng Tionghoa kecil."},{en:"Stop at the Holy Rosary (Kalawar) Church area near the river.",idn:"Mampir ke area Gereja Holy Rosary (Kalawar) dekat sungai."},{en:"Coffee or lunch at a small café or eatery in the lanes.",idn:"Ngopi atau makan siang di kafe atau rumah makan kecil di gang."},{en:"Finish at Warehouse 30, or walk to Song Wat Road and Yaowarat for dinner.",idn:"Tutup di Warehouse 30, atau jalan kaki ke Song Wat Road dan Yaowarat untuk makan malam."}],knowBefore:{en:"Lanes are narrow, uneven and shared with motorbikes and delivery trucks. Dress modestly at shrines, avoid pointing cameras at people, and do not enter workshops uninvited. Heat is intense midday; pack water.",idn:"Gangnya sempit, nggak rata, dan dilewati motor serta truk pengantar barang. Pakai pakaian sopan di kelenteng, jangan asal mengarahkan kamera ke orang, dan jangan masuk bengkel tanpa diundang. Tengah hari panas banget, jadi bawa air minum."},geoQuery:"Talat Noi, Samphanthawong, Bangkok",mapsQuery:"Talat Noi Bangkok",imgQuery:"Talat Noi Bangkok",imgAlt:"Narrow alley with murals and old shophouses in Talat Noi, Bangkok"},{id:"charoen-krung",name:{en:"Charoen Krung",idn:"Charoen Krung",th:"เจริญกรุง"},tagline:{en:"Galleries, design studios and heritage buildings on Bangkok's oldest road",idn:"Galeri dan studio desain di jalan tertua Bangkok"},personality:{en:"Charoen Krung is Bangkok's oldest paved road, and its riverside stretch around Bang Rak is where the city's creative scene has been reclaiming old warehouses, colonial-era buildings and shophouses. You can pass a Catholic cathedral, a grand old post office turned design center and a contemporary gallery within a few blocks. It is less polished than Sukhumvit and less packed than Chinatown, which makes it a rewarding wander if you like art, architecture and quiet corners. Distances are longer than they look on the map.",idn:"Charoen Krung adalah jalan beraspal tertua di Bangkok. Ruas tepi sungainya di sekitar Bang Rak jadi pusat skena kreatif Bangkok yang menghidupkan kembali gudang tua, bangunan era kolonial, dan shophouse. Dalam beberapa blok saja ada katedral Katolik, kantor pos tua yang kini jadi pusat desain, dan galeri kontemporer. Nggak semewah Sukhumvit dan nggak sepadat Chinatown, jadi seru banget dijelajahi kalau kamu suka seni, arsitektur, dan sudut-sudut tenang. Jaraknya lebih jauh daripada kelihatannya di peta."},food:[{name:"Charoen Krung street and shophouse eateries around Soi 28–32",note:{en:"Mixed local lunch spots and street stalls; good for a cheap, unfussy meal between galleries.",idn:"Rumah makan lokal dan lapak kaki lima yang murah dan praktis buat makan di sela kunjungan galeri."},mapsQuery:"restaurants Charoen Krung Soi 28 Bangkok"},{name:"Riverside restaurants near River City and Si Phraya Pier",note:{en:"Mid-range and upscale river-view dining; check the menu prices before sitting down.",idn:"Restoran menengah ke atas dengan view sungai. Cek harga di menu sebelum duduk."},mapsQuery:"restaurants River City Bangkok"},{name:"Bang Rak local noodle and rice shops",note:{en:"The older Bang Rak blocks are full of small shopfront noodle and rice-curry places that locals use daily.",idn:"Blok-blok lama Bang Rak penuh kedai mi dan nasi kecil yang jadi langganan harian warga lokal."},mapsQuery:"noodle shop Bang Rak Bangkok"}],cafes:[{name:"Cafés in Warehouse 30 and the creative lanes off Soi 30",note:{en:"Coffee in industrial-chic spaces; a great escape from the heat.",idn:"Kafe-kafe bernuansa industrial. Pas buat kabur dari panas."},mapsQuery:"cafe Charoen Krung Soi 30 Bangkok"},{name:"Independent coffee shops around Charoen Krung Soi 28–36",note:{en:"A rotating cast of small cafés in old shophouses; opening hours vary, so confirm on Google Maps.",idn:"Kafe kecil di shophouse sering berganti. Cek jam buka di Google Maps."},mapsQuery:"specialty coffee Charoen Krung Bangkok"}],shopping:[{name:"River City Bangkok (art and antiques)",note:{en:"A riverside complex known for antiques, art galleries and auctions; browse-friendly, rarely cheap.",idn:"Kompleks tepi sungai yang terkenal dengan barang antik, galeri seni, dan lelang. Asyik buat lihat-lihat, tapi jarang murah."},mapsQuery:"River City Bangkok"},{name:"Warehouse 30 and nearby design shops",note:{en:"Small studios and shops in the restored warehouse complex.",idn:"Studio dan toko kecil di kompleks gudang yang sudah direstorasi."},mapsQuery:"Warehouse 30 Bangkok"}],activities:[{en:"Gallery-hop between independent art spaces and River City Bangkok",idn:"Keliling galeri seni independen dan River City Bangkok"},{en:"See the Assumption Cathedral, one of Bangkok's best-known Catholic churches",idn:"Lihat Katedral Assumption, salah satu gereja Katolik paling terkenal di Bangkok"},{en:"Visit the Thailand Creative & Design Center in the old Grand Postal Building",idn:"Kunjungi Thailand Creative & Design Center (TCDC) di gedung bekas Kantor Pos Pusat"},{en:"Photograph heritage facades and colonial-era buildings along the road",idn:"Foto fasad bangunan bersejarah dan bangunan era kolonial di sepanjang jalan"},{en:"Take a Chao Phraya Express boat from Si Phraya Pier for a river view",idn:"Naik kapal Chao Phraya Express dari Dermaga Si Phraya buat menikmati pemandangan sungai"}],duration:{en:"Half day (3–4 h)",idn:"Setengah hari (3–4 jam)"},budget:{level:2,text:{en:"≈ 500–1,200 THB per person incl. food & coffee (estimate; gallery entry mostly free to low)",idn:"Sekitar 500–1,200 baht per orang, termasuk makan & kopi (perkiraan; masuk galeri kebanyakan gratis sampai murah)"}},bestTime:{en:"Weekday late morning to afternoon; many galleries close on Mondays and open late. Check hours before you go.",idn:"Paling enak hari kerja, dari menjelang siang sampai sore. Banyak galeri tutup hari Senin dan bukanya agak siang, jadi cek jam buka sebelum pergi."},stations:[{name:"Si Phraya / River City Pier",line:"Chao Phraya Express boat; confirm pier on Google Maps"},{name:"MRT Hua Lamphong",line:"MRT Blue Line (a longer walk or short taxi)"},{name:"BTS Saphan Taksin",line:"BTS Silom Line (for the southern end of the road)"}],route:[{en:"Start: Si Phraya Pier / River City Bangkok for galleries and antiques.",idn:"Mulai: Dermaga Si Phraya / River City Bangkok untuk lihat galeri dan barang antik."},{en:"Walk to Warehouse 30 on Charoen Krung Soi 30 for a café and design shops.",idn:"Ke Warehouse 30 di Charoen Krung Soi 30 untuk café dan toko desain."},{en:"Continue along Charoen Krung to the Grand Postal Building (TCDC).",idn:"Lanjut menyusuri Charoen Krung sampai gedung bekas Kantor Pos Pusat (TCDC)."},{en:"Pass the Assumption Cathedral and stop for a late lunch in Bang Rak.",idn:"Lewati Katedral Assumption, lalu makan siang telat di Bang Rak."},{en:"Finish by boat from the nearby pier or BTS Saphan Taksin (confirm on Google Maps).",idn:"Selesai dengan kapal dari dermaga terdekat atau BTS Saphan Taksin (cek di Google Maps)."}],knowBefore:{en:"The road is long, hot and busy with traffic; use a taxi or Grab between clusters. Opening hours for galleries are irregular, and some are closed on Mondays. Pavements are uneven.",idn:"Jalannya panjang, panas, dan ramai kendaraan. Antar-titik lebih nyaman naik taksi atau Grab. Jam buka galeri tidak menentu dan ada yang tutup hari Senin. Trotoarnya tidak rata."},geoQuery:"Charoen Krung Road, Bang Rak, Bangkok",mapsQuery:"Charoen Krung Road Bangkok",imgQuery:"Charoen Krung Road Bangkok",imgAlt:"Historic buildings along Charoen Krung Road in Bangkok"},{id:"yaowarat",name:{en:"Yaowarat (Chinatown)",idn:"Yaowarat (Chinatown)",th:"เยาวราช"},tagline:{en:"Neon, woks and the most intense street-food night in Bangkok",idn:"Neon, api wajan, dan malam jajanan kaki lima paling seru di Bangkok"},personality:{en:"After sunset Yaowarat Road turns into a river of neon signs, smoke and plastic stools. Stalls spill onto the pavement serving roast duck, grilled seafood, oyster omelets, noodles and Chinese desserts, while gold shops and traditional medicine stores keep their old rhythms. It is touristy at the main stretch, with higher prices and long queues, but the side sois and old-school stalls still feel local. It is loud, hot, crowded and totally worth it.",idn:"Begitu matahari terbenam, Yaowarat Road berubah jadi lautan papan neon, asap, dan kursi plastik. Pedagang tumpah sampai ke trotoar, menjual bebek panggang, seafood bakar, omelet tiram, mi, dan dessert Tionghoa, sementara toko emas dan toko obat tradisional tetap dengan ritme lamanya. Di jalan utamanya banyak turis, harga lebih tinggi dan antrean panjang, tapi soi samping dan lapak lawas masih terasa lokal. Bising, panas, dan padat, tapi sangat layak didatangi."},food:[{name:"Yaowarat Road night street-food stretch",note:{en:"The signature experience: grilled seafood, roast meats, noodles and sweets from the stalls that set up around evening. Check prices before ordering seafood.",idn:"Pengalaman andalan Yaowarat: seafood bakar, daging panggang, mi, dan manisan dari lapak yang mulai buka menjelang malam. Cek harga dulu sebelum pesan seafood."},mapsQuery:"Yaowarat Road street food Bangkok"},{name:"T&K Seafood",note:{en:"A famous open-air seafood restaurant on the Yaowarat stretch, usually busy in the evening; ask for prices before ordering by weight.",idn:"Restoran seafood terbuka yang terkenal di Yaowarat, biasanya ramai saat malam. Untuk menu yang dijual per berat, tanyakan harganya dulu."},mapsQuery:"T&K Seafood Yaowarat Bangkok"},{name:"Nai Mong Hoi Tod (oyster omelet)",note:{en:"A well-known Yaowarat spot for crispy oyster omelets and mussel pancakes.",idn:"Tempat terkenal di Yaowarat untuk omelet tiram renyah dan pancake kerang hijau."},mapsQuery:"Nai Mong Hoi Tod Yaowarat Bangkok"},{name:"Soi Texas (Yaowarat) stalls",note:{en:"A side soi known for old-school street-food stalls, including noodle and congee vendors popular with locals.",idn:"Soi samping dengan lapak jajanan lawas, termasuk penjual mi dan bubur yang populer di kalangan warga lokal."},mapsQuery:"Soi Texas Yaowarat Bangkok"}],cafes:[{name:"Soi Nana cafés and bars (Chinatown)",note:{en:"A trendy side lane with cafés, bars and shophouse restaurants for a slower, cooler break from the main road.",idn:"Gang samping yang trendi, sedikit menjauh dari jalan utama. Ada café, bar, dan restoran ruko, enak buat rehat sejenak."},mapsQuery:"Soi Nana Chinatown Bangkok cafe"},{name:"Traditional Chinese dessert shops",note:{en:"Warm sesame soup, ginkgo sweet soup and herbal jelly; a sweet counterpoint to the savory street food.",idn:"Sup wijen hangat, sup manis ginkgo, dan cincau herbal; penutup manis setelah jajanan gurih."},mapsQuery:"Chinese dessert shop Yaowarat Bangkok"}],shopping:[{name:"Sampeng Lane (Soi Wanit 1)",note:{en:"A narrow wholesale lane for cheap accessories, stationery and souvenirs; extremely crowded, so keep your bag in front.",idn:"Gang grosir sempit untuk aksesori, alat tulis, dan suvenir murah. Super padat, jadi pakai tasmu di depan."},mapsQuery:"Sampeng Lane Bangkok"},{name:"Pahurat Market (Little India fabrics)",note:{en:"A bustling fabric and trimmings market with an Indian flavor, a short walk west of Yaowarat.",idn:"Pasar kain dan pernak-pernik bernuansa India, jalan kaki sebentar ke arah barat dari Yaowarat."},mapsQuery:"Pahurat Market Bangkok"}],activities:[{en:"Eat your way along Yaowarat Road after sunset",idn:"Kulineran menyusuri Yaowarat Road setelah matahari terbenam"},{en:"Visit Wat Mangkon Kamalawat, a major Chinese Buddhist temple",idn:"Kunjungi Wat Mangkon Kamalawat, kuil Buddha Tionghoa utama"},{en:"Take photos at the Chinatown Gate (Odeon Circle) and the glowing signs",idn:"Foto di Gerbang Chinatown (Odeon Circle) dan papan-papan neon yang menyala"},{en:"Browse Sampeng Lane and Pahurat Market for souvenirs",idn:"Lihat-lihat suvenir di Sampeng Lane dan Pasar Pahurat"},{en:"Try late-night sweets before heading back",idn:"Coba dessert tengah malam sebelum pulang"}],duration:{en:"Evening (2–4 h)",idn:"Malam hari (2–4 jam)"},budget:{level:2,text:{en:"≈ 400–1,000 THB per person depending on how much seafood you order (estimate)",idn:"Sekitar 400–1,000 baht per orang, tergantung berapa banyak seafood yang kamu pesan (perkiraan)"}},bestTime:{en:"From about 18:00 into the night, when the street stalls open. Daytime is for temples, markets and fabrics. Weeknights are less packed than weekends.",idn:"Paling seru mulai sekitar pukul 18:00 sampai malam, saat lapak-lapak buka. Siang hari cocoknya untuk kuil, pasar, dan toko kain. Malam hari kerja lebih sepi daripada akhir pekan."},stations:[{name:"MRT Wat Mangkon",line:"MRT Blue Line"},{name:"MRT Hua Lamphong",line:"MRT Blue Line"},{name:"MRT Sam Yot",line:"MRT Blue Line (closer to the Pahurat side)"}],route:[{en:"Start: MRT Wat Mangkon; visit Wat Mangkon Kamalawat.",idn:"Mulai: MRT Wat Mangkon, kunjungi Wat Mangkon Kamalawat."},{en:"Walk down Yaowarat Road toward the Chinatown Gate (Odeon Circle).",idn:"Jalan kaki menyusuri Yaowarat Road ke arah Gerbang Chinatown (Odeon Circle)."},{en:"Dinner: sample street food and dip into Soi Texas for a local noodle stop.",idn:"Makan malam: cicipi jajanan kaki lima dan mampir ke Soi Texas untuk semangkuk mi lokal."},{en:"Cut across to Sampeng Lane (Soi Wanit 1) for a quick market browse.",idn:"Potong jalan ke Sampeng Lane (Soi Wanit 1) untuk lihat-lihat pasar sebentar."},{en:"Continue west to Pahurat Market, then MRT Sam Yot to head home.",idn:"Lanjut ke barat sampai Pasar Pahurat, lalu pulang lewat MRT Sam Yot."}],knowBefore:{en:"Very crowded and hot; pickpockets work busy lanes. Agree prices before ordering seafood sold by weight. Keep to the pavement as scooters squeeze through, and bring small bills.",idn:"Sangat padat dan panas. Waspada copet di gang yang ramai. Untuk seafood yang dijual per berat, sepakati harganya dulu. Tetap di trotoar karena skuter suka menyelip, dan siapkan uang pecahan kecil."},geoQuery:"Yaowarat Road, Samphanthawong, Bangkok",mapsQuery:"Yaowarat Road Bangkok",imgQuery:"Yaowarat Road night",imgAlt:"Neon signs and street food stalls on Yaowarat Road at night in Bangkok"},{id:"banthat-thong",name:{en:"Banthat Thong",idn:"Banthat Thong",th:"บรรทัดทอง"},tagline:{en:"The Thai-Chinese food street the Chula students love",idn:"Jalan kuliner Thai-Tionghoa favorit mahasiswa Chula"},personality:{en:"Banthat Thong Road, a few minutes from Chulalongkorn University, has become one of Bangkok's trendiest eating streets. Old shophouses now hold Thai-Chinese noodle shops, grill restaurants, hot-pot spots and student-friendly cafés, so it fills up at lunch and again after dark. The vibe is young, local and slightly chaotic, with prices lower than Siam but queues that can be long. If you want where Bangkok's students actually eat, this is it.",idn:"Banthat Thong Road, beberapa menit dari Universitas Chulalongkorn, kini jadi salah satu jalan kuliner paling trendi di Bangkok. Ruko-ruko tua sekarang diisi kedai mi Thai-Tionghoa, restoran grill, tempat hot pot, dan café ramah mahasiswa, jadi ramai saat makan siang dan lagi setelah gelap. Suasananya muda, lokal, dan agak semrawut. Harganya lebih murah dari Siam, tapi antreannya bisa panjang. Kalau mau tahu tempat makan mahasiswa Bangkok yang sebenarnya, di sinilah tempatnya."},food:[{name:"Banthat Thong Road Thai-Chinese noodle and rice shops",note:{en:"Roast duck, pork noodles and Chinese-style rice dishes in small shophouse restaurants; follow the queues of students.",idn:"Bebek panggang, mi babi, dan nasi ala Tionghoa di restoran ruko kecil; ikuti saja antrean mahasiswa. Kalau tidak makan babi, bilang 'mai sai moo' atau cari tanda halal."},mapsQuery:"Banthat Thong Road restaurants Bangkok"},{name:"Chula Soi area street food (Chulalongkorn University side)",note:{en:"Cheap, filling dishes aimed at students; a good place to try everyday Thai food at everyday prices.",idn:"Hidangan murah dan mengenyangkan untuk mahasiswa; tempat pas buat coba makanan Thai sehari-hari dengan harga sehari-hari."},mapsQuery:"Chula Soi street food Bangkok"},{name:"Sam Yan Mitrtown and Sam Yan Market food options",note:{en:"Food hall and market stalls a short walk south for variety or a rainy-day option.",idn:"Jalan kaki sebentar ke selatan ada food hall dan lapak pasar. Menunya beragam dan cocok jadi pilihan saat hujan."},mapsQuery:"Sam Yan Market Bangkok"}],cafes:[{name:"Cafés along Banthat Thong Road and Chula's side sois",note:{en:"Cozy student-friendly cafés for coffee, matcha and desserts; many have limited seating.",idn:"Café nyaman favorit mahasiswa untuk kopi, matcha, dan dessert; banyak yang tempat duduknya terbatas."},mapsQuery:"cafe Banthat Thong Bangkok"},{name:"Cafés in and around Sam Yan Mitrtown",note:{en:"Air-conditioned alternatives with more seating if the street cafés are full.",idn:"Alternatif ber-AC dengan tempat duduk lebih banyak kalau café di jalan penuh."},mapsQuery:"cafe Sam Yan Mitrtown Bangkok"}],shopping:[{name:"Samyan Mitrtown",note:{en:"A modern mall and office complex with shops, a food hall and a library; practical rather than glamorous.",idn:"Mal dan kompleks perkantoran modern dengan toko, food hall, dan perpustakaan; lebih praktis daripada glamor."},mapsQuery:"Samyan Mitrtown Bangkok"},{name:"Chamchuri Square",note:{en:"A compact mall beside the university with casual shops and eateries.",idn:"Mal kecil di sebelah kampus dengan toko kasual dan tempat makan."},mapsQuery:"Chamchuri Square Bangkok"}],activities:[{en:"Eat your way along Banthat Thong Road, one shop at a time",idn:"Kulineran menyusuri Banthat Thong Road, satu kedai demi satu kedai"},{en:"Wander the Chulalongkorn University campus (respect signage and dress modestly)",idn:"Jalan-jalan di kampus Universitas Chulalongkorn (patuhi papan petunjuk dan berpakaian sopan)"},{en:"Rest in Chulalongkorn University Centenary Park on Rama IV",idn:"Istirahat di Chulalongkorn University Centenary Park di Jalan Rama IV"},{en:"Try a student-priced coffee or dessert stop",idn:"Mampir ngopi atau makan dessert harga mahasiswa"}],duration:{en:"Half day or evening (2–3 h)",idn:"Setengah hari atau malam (2–3 jam)"},budget:{level:1,text:{en:"≈ 250–600 THB per person incl. food & coffee (estimate)",idn:"Sekitar 250–600 baht per orang, termasuk makan & kopi (perkiraan)"}},bestTime:{en:"Lunch (11:30–13:30) or early evening on weekdays; weekend nights can mean long queues. Hours vary by shop.",idn:"Paling enak saat makan siang (11:30–13:30) atau sore menjelang malam di hari kerja. Malam akhir pekan antreannya bisa panjang. Jam buka beda-beda tiap kedai."},stations:[{name:"MRT Sam Yan",line:"MRT Blue Line"},{name:"BTS National Stadium",line:"BTS Silom Line (walkable to the northern end; confirm on Google Maps)"}],route:[{en:"Start: BTS National Stadium or MRT Sam Yan, then walk to Banthat Thong Road.",idn:"Mulai: BTS National Stadium atau MRT Sam Yan, lalu jalan kaki ke Banthat Thong Road."},{en:"Walk the road and pick a lunch spot with a queue of locals.",idn:"Susuri jalannya dan pilih tempat makan siang yang diantre warga lokal."},{en:"Detour into Chula Soi side lanes for a snack or dessert.",idn:"Belok ke gang-gang Chula Soi untuk camilan atau dessert."},{en:"Stroll to Chulalongkorn University Centenary Park to cool down.",idn:"Jalan santai ke Chulalongkorn University Centenary Park untuk mendinginkan badan."},{en:"Finish at Samyan Mitrtown, then MRT Sam Yan home.",idn:"Selesai di Samyan Mitrtown, lalu pulang lewat MRT Sam Yan."}],knowBefore:{en:"Very busy at lunch and after dark; many shops are small with few seats. Pavements are narrow and vendors often use them. Cash is helpful at stalls; confirm exact opening hours since many shops close in the afternoon.",idn:"Sangat ramai saat makan siang dan malam; banyak kedai kecil dengan kursi terbatas. Trotoarnya sempit dan sering dipakai pedagang. Di lapak lebih praktis bayar tunai. Banyak kedai tutup di sore hari, jadi cek jam bukanya."},geoQuery:"Banthat Thong Road, Pathum Wan, Bangkok",mapsQuery:"Banthat Thong Road Bangkok",imgQuery:"Banthat Thong Road Bangkok",imgAlt:"Street food shops and signs along Banthat Thong Road near Chulalongkorn University"},{id:"thonglor",name:{en:"Thonglor",idn:"Thonglor",th:"ทองหล่อ"},tagline:{en:"Modern lifestyle, polished cafés and Bangkok's stylish side",idn:"Gaya hidup modern, café yang apik, dan sisi stylish Bangkok"},personality:{en:"Thonglor (Sukhumvit Soi 55) is where well-off Bangkok goes to eat, drink coffee and be seen. The long soi is lined with design-conscious cafés, Japanese restaurants, boutique bars and small lifestyle malls, and the area has a polished, expat-and-young-professional feel. It is pricier than most of the city and the sidewalks are patchy, but if you want air-conditioned cafés, good coffee and Instagram-friendly interiors, this is a safe bet. Traffic on the soi can be slow, so BTS plus walking beats a taxi.",idn:"Thonglor (Sukhumvit Soi 55) adalah tempat warga Bangkok yang berada datang untuk makan, ngopi, dan tampil gaya. Di sepanjang soi yang panjang ini berjajar café dengan desain keren, restoran Jepang, bar butik, dan mal gaya hidup kecil, dengan nuansa ekspat dan profesional muda yang kental. Harganya di atas rata-rata Bangkok dan trotoarnya putus-putus, tapi kalau kamu cari café ber-AC, kopi enak, dan interior yang Instagramable, tempat ini pilihan aman. Lalu lintas di soi lambat, jadi BTS plus jalan kaki lebih baik daripada taksi."},food:[{name:"Japanese and modern Thai restaurants along Thonglor Soi 10–17",note:{en:"One of Bangkok's densest stretches of Japanese food, plus upscale Thai and international options; mid to high prices.",idn:"Salah satu kawasan dengan restoran Jepang terpadat di Bangkok, ditambah masakan Thai kelas atas dan internasional; harga menengah ke atas."},mapsQuery:"restaurants Thonglor Bangkok"},{name:"The Commons (Thonglor)",note:{en:"A casual community mall with a mix of restaurants and cafés around a courtyard; relaxed for groups.",idn:"Community mall santai dengan restoran dan café yang mengelilingi halaman; nyaman buat rombongan."},mapsQuery:"The Commons Thonglor Bangkok"},{name:"J Avenue (Thonglor Soi 15)",note:{en:"A small lifestyle mall with restaurants and a supermarket, good for easy air-conditioned dining.",idn:"Mal gaya hidup kecil dengan restoran dan supermarket, pas buat makan santai di ruangan ber-AC."},mapsQuery:"J Avenue Thonglor Bangkok"}],cafes:[{name:"Roast Coffee & Eatery (The Commons)",note:{en:"A well-known Thonglor café for specialty coffee and brunch; often busy at weekends.",idn:"Café terkenal di Thonglor untuk specialty coffee dan brunch; sering ramai di akhir pekan."},mapsQuery:"Roast Coffee and Eatery Thonglor Bangkok"},{name:"Design-forward cafés along Soi Thonglor",note:{en:"Many cafés compete on interiors and latte art; wander between Soi 13 and Soi 17 for the densest cluster.",idn:"Banyak café bersaing soal interior dan latte art; paling padat di antara Soi 13 dan Soi 17."},mapsQuery:"cafe Thonglor Soi 13 Bangkok"},{name:"Dessert and bakery cafés",note:{en:"Patisseries and ice-cream parlors pop up between the cafés; good for a sweet break.",idn:"Toko pastry dan es krim bermunculan di sela-sela café; pas buat rehat manis."},mapsQuery:"dessert cafe Thonglor Bangkok"}],shopping:[{name:"The Commons and J Avenue",note:{en:"Small lifestyle malls with boutiques, a supermarket and cafés; more browsing than big hauls.",idn:"Mal gaya hidup kecil dengan butik, supermarket, dan café; lebih buat lihat-lihat daripada belanja besar."},mapsQuery:"The Commons Thonglor Bangkok"},{name:"Independent design boutiques along Soi Thonglor",note:{en:"Scattered Thai designer and concept shops; look for one-off finds at mid to high prices.",idn:"Toko desainer Thai dan concept store tersebar di sana-sini; cari barang unik dengan harga menengah ke atas."},mapsQuery:"boutique Thonglor Bangkok"}],activities:[{en:"Café-hop along Soi Thonglor with a long, slow lunch",idn:"Café-hopping di sepanjang Soi Thonglor sambil makan siang santai"},{en:"Browse independent boutiques and The Commons courtyard",idn:"Lihat-lihat butik independen dan halaman The Commons"},{en:"Try a Japanese izakaya or omakase-style dinner",idn:"Coba makan malam ala izakaya atau omakase"},{en:"Grab drinks in the small bars after dark",idn:"Minum di bar-bar kecil setelah gelap"}],duration:{en:"Half day (3–4 h)",idn:"Setengah hari (3–4 jam)"},budget:{level:3,text:{en:"≈ 800–2,000 THB per person incl. food & coffee (estimate)",idn:"Sekitar 800–2,000 baht per orang, termasuk makan & kopi (perkiraan)"}},bestTime:{en:"Late morning to mid-afternoon for cafés; early evening for dinner. Traffic on the soi is worst 17:00–20:00.",idn:"Café paling enak menjelang siang sampai sore; makan malam lebih awal. Lalu lintas di soi paling macet pukul 17:00–20:00."},stations:[{name:"BTS Thong Lo",line:"BTS Sukhumvit Line"},{name:"BTS Ekkamai",line:"BTS Sukhumvit Line (next station)"}],route:[{en:"Start: BTS Thong Lo; walk into Soi Thonglor (Sukhumvit 55).",idn:"Mulai: BTS Thong Lo, lalu jalan kaki masuk ke Soi Thonglor (Sukhumvit 55)."},{en:"Coffee at a café near Soi 13 and browse nearby boutiques.",idn:"Ngopi di café dekat Soi 13 dan lihat-lihat butik di sekitarnya."},{en:"Lunch around Soi 10–15 or at J Avenue.",idn:"Makan siang di sekitar Soi 10–15 atau di J Avenue."},{en:"Walk to The Commons for dessert and the courtyard.",idn:"Jalan ke The Commons untuk dessert dan suasana halamannya."},{en:"Optional: BTS one stop to Ekkamai for more indie spots.",idn:"Opsional: naik BTS satu stasiun ke Ekkamai untuk lebih banyak tempat indie."}],knowBefore:{en:"Prices run higher than the Bangkok average. The soi is long, hot and has uneven pavements; use motorbike taxis or a quick Grab for long gaps. Many bars check ID after dark.",idn:"Harga di sini lebih tinggi dari rata-rata Bangkok. Soi-nya panjang, panas, dan trotoarnya tidak rata, jadi untuk jarak jauh lebih enak naik ojek atau Grab. Malam hari banyak bar yang cek kartu identitas."},geoQuery:"Thong Lo, Watthana, Bangkok",mapsQuery:"Thonglor Bangkok",imgQuery:"Thong Lo Bangkok",imgAlt:"Street scene and cafés on Sukhumvit Soi 55 (Thonglor) in Bangkok"},{id:"ekkamai",name:{en:"Ekkamai",idn:"Ekkamai",th:"เอกมัย"},tagline:{en:"Independent shops and restaurants, Thonglor's more relaxed neighbor",idn:"Toko dan restoran independen, tetangga Thonglor yang lebih santai"},personality:{en:"Ekkamai sits next to Thonglor but feels looser and a little more local. It has a mix of independent restaurants, creative shops, Japanese eateries and small bars tucked in the sois, with students and young creatives rather than business crowds. It rewards walking and curiosity rather than a checklist. Some of its best places are down side streets that do not show up on big tourist lists, so use maps and ask around.",idn:"Ekkamai bersebelahan dengan Thonglor, tapi terasa lebih santai dan lebih lokal. Di soi-soinya tersembunyi restoran independen, toko kreatif, tempat makan Jepang, dan bar kecil, dengan lebih banyak mahasiswa dan kreator muda daripada pebisnis. Kawasan ini lebih asyik dijelajahi dengan rasa penasaran daripada pakai checklist. Banyak tempat bagus ada di jalan kecil yang tidak muncul di daftar wisata besar, jadi buka peta dan tanya-tanya sambil jalan."},food:[{name:"Gateway Ekamai food floors",note:{en:"A mall with many Japanese restaurants and food-court options right by the station; easy and air-conditioned.",idn:"Mal persis di sebelah stasiun dengan banyak restoran Jepang dan food court; praktis dan ber-AC."},mapsQuery:"Gateway Ekamai Bangkok"},{name:"Ekkamai Soi 10 restaurants and bars",note:{en:"A strip of independent restaurants and bars, livelier at night; a mix of Thai, Japanese and international.",idn:"Deretan restoran dan bar independen, lebih hidup di malam hari; campuran masakan Thai, Jepang, dan internasional."},mapsQuery:"Ekkamai Soi 10 restaurants Bangkok"},{name:"Neighborhood Thai restaurants in the side sois",note:{en:"Small local places serve everyday Thai dishes at fair prices; look for crowds at lunch.",idn:"Kedai lokal kecil yang menjual masakan Thai sehari-hari dengan harga wajar; pilih yang ramai saat makan siang."},mapsQuery:"Thai restaurant Ekkamai Bangkok"}],cafes:[{name:"Independent cafés around Ekkamai Soi 10 and Soi 12",note:{en:"Small cafés with strong coffee and friendly counters; hours vary and some open late.",idn:"Café kecil dengan kopi kuat dan suasana ramah; jam bukanya beda-beda, ada juga yang baru buka agak siang."},mapsQuery:"cafe Ekkamai Soi 10 Bangkok"},{name:"Cafés inside Gateway Ekamai",note:{en:"Easy, air-conditioned coffee and dessert stops by the BTS exit.",idn:"Tempat kopi dan dessert ber-AC yang praktis, persis di dekat pintu keluar BTS."},mapsQuery:"cafe Gateway Ekamai Bangkok"}],shopping:[{name:"Gateway Ekamai",note:{en:"A compact mall with fashion, lifestyle and a Japanese-leaning dining scene.",idn:"Mal mungil dengan fashion, gaya hidup, dan pilihan kuliner yang condong ke Jepang."},mapsQuery:"Gateway Ekamai Bangkok"},{name:"Independent boutiques on Ekkamai side sois",note:{en:"Small, quirky shops and creative studios scattered around; discover them by walking.",idn:"Toko kecil yang unik dan studio kreatif tersebar di mana-mana; seru ditemukan sambil jalan kaki."},mapsQuery:"boutique shops Ekkamai Bangkok"}],activities:[{en:"Walk the Ekkamai side sois and discover small independent shops",idn:"Susuri soi-soi kecil Ekkamai dan temukan toko independen"},{en:"Coffee and a long lunch at a local café",idn:"Ngopi dan makan siang santai di café lokal"},{en:"Try a Japanese meal at Gateway Ekamai or in the sois",idn:"Coba makan Jepang di Gateway Ekamai atau di soi-soinya"},{en:"Evening drinks and small live-music or bar spots on Soi 10",idn:"Minum malam di bar kecil atau tempat live music di Soi 10"}],duration:{en:"Half day (2–4 h)",idn:"Setengah hari (2–4 jam)"},budget:{level:2,text:{en:"≈ 600–1,500 THB per person incl. food & coffee (estimate)",idn:"Sekitar 600–1,500 baht per orang, termasuk makan & kopi (perkiraan)"}},bestTime:{en:"Lunch to early evening; some shops open late and bars come alive after dark. Check each place's hours.",idn:"Paling pas dari makan siang sampai sore menjelang malam. Ada toko yang baru buka agak siang, dan bar ramai setelah gelap. Cek jam buka tiap tempat."},stations:[{name:"BTS Ekkamai",line:"BTS Sukhumvit Line"},{name:"BTS Thong Lo",line:"BTS Sukhumvit Line (neighboring station)"}],route:[{en:"Start: BTS Ekkamai; walk to Gateway Ekamai.",idn:"Mulai: BTS Ekkamai, jalan kaki ke Gateway Ekamai."},{en:"Wander into Ekkamai Soi 10 for lunch and independent shops.",idn:"Masuk ke Ekkamai Soi 10 untuk makan siang dan lihat-lihat toko independen."},{en:"Coffee at a small café on a side soi.",idn:"Ngopi di café kecil di soi samping."},{en:"Walk or take a short Grab toward Thonglor for more cafés (optional).",idn:"Jalan kaki atau naik Grab sebentar ke arah Thonglor untuk café lain (opsional)."},{en:"Evening: dinner or a drink back on Soi 10.",idn:"Malam: makan atau minum lagi di Soi 10."}],knowBefore:{en:"Pavements are patchy and sois are long; distances between spots can be deceptively far in the heat. Use BTS, Grab or motorbike taxi between clusters. Some places have irregular hours.",idn:"Trotoarnya putus-putus dan soi-nya panjang; saat panas, jarak antar-tempat terasa lebih jauh dari perkiraan. Pakai BTS, Grab, atau ojek antar-kawasan. Beberapa tempat jam bukanya tidak menentu."},geoQuery:"Ekkamai, Watthana, Bangkok",mapsQuery:"Ekkamai Bangkok",imgQuery:"Ekkamai Bangkok",imgAlt:"Street and BTS Ekkamai area in Bangkok"},{id:"phrom-phong",name:{en:"Phrom Phong",idn:"Phrom Phong",th:"พร้อมพงษ์"},tagline:{en:"Premium malls, polished dining and a park to cool off in",idn:"Mal premium, kuliner berkelas, dan taman untuk ngadem"},personality:{en:"Phrom Phong is Bangkok at its most polished. Emporium and EmQuartier face each other across the BTS and are joined by a skywalk, packed with luxury brands, cinemas, food courts and restaurants. Behind Emporium is Benjasiri Park, a small, green pocket where office workers jog and families picnic. The neighborhood has many Japanese expats, and prices run high. If you want clean, air-conditioned, reliable and a bit upscale, this is where to land.",idn:"Phrom Phong adalah sisi Bangkok yang paling rapi dan berkelas. Emporium dan EmQuartier berhadapan di seberang BTS dan terhubung lewat skywalk, penuh merek mewah, bioskop, food court, dan restoran. Di belakang Emporium ada Benjasiri Park, ruang hijau kecil tempat pekerja kantoran jogging dan keluarga piknik. Banyak ekspat Jepang tinggal di sini, jadi harganya tinggi. Kalau kamu mau yang bersih, ber-AC, bisa diandalkan, dan sedikit mewah, di sinilah tempatnya."},food:[{name:"Emporium food court and restaurant floors",note:{en:"A tidy food court and mid-to-upscale restaurants inside Emporium; reliable and air-conditioned.",idn:"Food court rapi dan restoran menengah ke atas di dalam Emporium; bisa diandalkan dan ber-AC."},mapsQuery:"Emporium food court Bangkok"},{name:"EmQuartier dining (Helix Quartier and others)",note:{en:"Many restaurants and a food-hall feel across floors; good for groups with different tastes.",idn:"Banyak restoran di beberapa lantai dengan nuansa food hall; cocok buat rombongan dengan selera berbeda."},mapsQuery:"EmQuartier restaurants Bangkok"},{name:"Japanese restaurants along Sukhumvit Soi 33/1 and Soi 26",note:{en:"The area has a big Japanese community, so ramen, izakaya and sushi shops are plentiful and good quality.",idn:"Komunitas Jepang di kawasan ini besar, jadi kedai ramen, izakaya, dan sushi banyak dan kualitasnya bagus."},mapsQuery:"Japanese restaurants Phrom Phong Bangkok"}],cafes:[{name:"Cafés inside EmQuartier and Emporium",note:{en:"Plenty of coffee and dessert options right at the shopping complexes; reliable air-conditioned breaks.",idn:"Banyak pilihan kopi dan dessert di dalam mal; tempat rehat ber-AC yang bisa diandalkan."},mapsQuery:"cafe EmQuartier Bangkok"},{name:"Cafés on Sukhumvit Soi 33/1 and Soi 24",note:{en:"Small, quiet cafés tucked away from the mall crowds.",idn:"Café kecil yang tenang, jauh dari keramaian mal."},mapsQuery:"cafe Sukhumvit Soi 33/1 Bangkok"}],shopping:[{name:"Emporium",note:{en:"Luxury and designer brands plus Thai fashion; polished and fairly quiet outside peak hours.",idn:"Merek mewah dan desainer plus fashion Thai; cukup tenang di luar jam sibuk."},mapsQuery:"Emporium Bangkok"},{name:"EmQuartier",note:{en:"A large, airy mall with a famous indoor waterfall feature, restaurants and fashion across multiple levels.",idn:"Mal besar yang lapang dengan fitur air terjun indoor yang terkenal, plus restoran dan toko fashion di beberapa lantai."},mapsQuery:"EmQuartier Bangkok"}],activities:[{en:"Shop or window-browse across Emporium and EmQuartier via the skywalk",idn:"Belanja atau window shopping di Emporium dan EmQuartier lewat skywalk"},{en:"Walk or rest in Benjasiri Park behind Emporium",idn:"Jalan santai atau istirahat di Benjasiri Park di belakang Emporium"},{en:"Catch a movie in a mall cinema on a rainy day",idn:"Nonton film di bioskop mal saat hujan"},{en:"Try a Japanese dinner in the side sois",idn:"Coba makan malam Jepang di soi-soi samping"}],duration:{en:"Half day (3–4 h)",idn:"Setengah hari (3–4 jam)"},budget:{level:3,text:{en:"≈ 800–2,500 THB per person excluding shopping (estimate)",idn:"Sekitar 800–2,500 baht per orang, di luar belanja (perkiraan)"}},bestTime:{en:"Weekday afternoons are calm; weekends and evenings fill up. Malls usually open late morning and close around 22:00 (check each mall).",idn:"Sore hari kerja lebih sepi; akhir pekan dan malam hari ramai. Mal biasanya buka menjelang siang dan tutup sekitar pukul 22:00 (cek tiap mal)."},stations:[{name:"BTS Phrom Phong",line:"BTS Sukhumvit Line"}],route:[{en:"Start: BTS Phrom Phong; head into Emporium for the shops and an early lunch.",idn:"Mulai: BTS Phrom Phong, masuk ke Emporium untuk belanja dan makan siang lebih awal."},{en:"Skywalk across to EmQuartier for more shops and dining.",idn:"Lewat skywalk ke EmQuartier untuk lanjut belanja dan makan."},{en:"Walk to Benjasiri Park behind Emporium for fresh air and shade.",idn:"Jalan ke Benjasiri Park di belakang Emporium untuk udara segar dan tempat teduh."},{en:"Late-afternoon coffee at a café in a side soi.",idn:"Ngopi sore di café di soi samping."},{en:"Finish with Japanese dinner on Soi 33/1 or back inside the malls.",idn:"Makan malam Jepang di Soi 33/1 atau kembali ke dalam mal."}],knowBefore:{en:"Higher prices than elsewhere; check bills in restaurants. Malls are strongly air-conditioned. Crowds peak on weekends and in the evening rush hour.",idn:"Harga lebih tinggi dari kawasan lain, jadi cek tagihan di restoran. AC di mal dingin banget. Paling ramai saat akhir pekan dan jam pulang kerja."},geoQuery:"Phrom Phong, Watthana, Bangkok",mapsQuery:"Phrom Phong Bangkok",imgQuery:"EmQuartier Bangkok",imgAlt:"EmQuartier and Emporium shopping malls in Phrom Phong, Bangkok"},{id:"riverside",name:{en:"Chao Phraya Riverside",idn:"Tepi Sungai Chao Phraya",th:"ริมแม่น้ำเจ้าพระยา"},tagline:{en:"Scenic viewpoints, river boats and Wat Arun at golden hour",idn:"Spot pemandangan, kapal sungai, dan Wat Arun saat golden hour"},personality:{en:"The Chao Phraya River is Bangkok's slow, wide spine, and a boat ride is one of the best ways to see the city without sitting in traffic. From the water you get Wat Arun glowing at sunset, old temples, riverside shophouses and skyscrapers all in one view. On the shore, ICONSIAM and Asiatique The Riverfront offer shopping, dining and photo spots with river views. It is touristy and best at golden hour, but the river itself is genuinely beautiful.",idn:"Sungai Chao Phraya adalah tulang punggung Bangkok yang lebar dan tenang, dan naik kapal adalah salah satu cara terbaik melihat kota tanpa terjebak macet. Dari atas air, Wat Arun yang bersinar saat senja, kuil-kuil tua, ruko tepi sungai, dan gedung pencakar langit terlihat dalam satu pemandangan. Di tepiannya ada ICONSIAM dan Asiatique The Riverfront dengan tempat belanja, makan, dan spot foto berlatar sungai. Memang ramai turis dan paling bagus saat golden hour, tapi sungainya sendiri benar-benar indah."},food:[{name:"SookSiam at ICONSIAM",note:{en:"An indoor Thai market-style food area on the ground floor with regional dishes and snacks; air-conditioned and convenient, if somewhat touristy.",idn:"Area makan bergaya pasar Thai di lantai dasar ICONSIAM dengan masakan daerah dan camilan; ber-AC dan praktis, meski agak turistik."},mapsQuery:"SookSiam ICONSIAM Bangkok"},{name:"Asiatique The Riverfront restaurants",note:{en:"Riverside dining and a night-market-style layout; prices are tourist-level, so check menus.",idn:"Restoran tepi sungai dengan tata letak ala pasar malam; harganya harga turis, jadi cek menunya."},mapsQuery:"Asiatique The Riverfront Bangkok"},{name:"River-view restaurants near Tha Tien and Wat Arun",note:{en:"Casual riverside spots facing Wat Arun; ideal for a sunset drink, with mid-range prices.",idn:"Tempat santai di tepi sungai menghadap Wat Arun; pas buat minum sambil menikmati senja, harga menengah."},mapsQuery:"restaurant river view Tha Tien Bangkok"}],cafes:[{name:"Cafés inside ICONSIAM",note:{en:"Plenty of cafés in the mall with river views on certain floors; busy at weekends.",idn:"Banyak café di dalam mal, beberapa lantai punya pemandangan sungai; ramai di akhir pekan."},mapsQuery:"cafe ICONSIAM Bangkok"},{name:"Riverside cafés near Tha Tien",note:{en:"Small cafés and drink stands near the pier and Wat Pho; good for a break before or after temples.",idn:"Café kecil dan kios minuman dekat Dermaga Tha Tien dan Wat Pho; pas buat rehat sebelum atau sesudah ke kuil."},mapsQuery:"cafe near Tha Tien Pier Bangkok"}],shopping:[{name:"ICONSIAM",note:{en:"A huge riverside mall with luxury brands, a floating-market style hall (SookSiam) and views of the river.",idn:"Mal raksasa di tepi sungai dengan merek mewah, area bergaya pasar terapung (SookSiam), dan pemandangan sungai."},mapsQuery:"ICONSIAM Bangkok"},{name:"Asiatique The Riverfront",note:{en:"Open-air riverside complex with market-style shops, restaurants and a Ferris wheel; popular at night.",idn:"Kompleks terbuka di tepi sungai dengan toko bergaya pasar, restoran, dan bianglala; populer di malam hari."},mapsQuery:"Asiatique The Riverfront Bangkok"}],activities:[{en:"Take a Chao Phraya Express boat for a cheap, scenic ride",idn:"Naik kapal Chao Phraya Express untuk menikmati pemandangan sungai dengan murah"},{en:"See Wat Arun glow at sunset from the river or the opposite bank",idn:"Lihat Wat Arun bersinar saat senja dari sungai atau dari tepi seberang"},{en:"Visit ICONSIAM and its river-view terraces",idn:"Kunjungi ICONSIAM dan teras-teras berpemandangan sungainya"},{en:"Spend the evening at Asiatique with dinner and the Ferris wheel",idn:"Habiskan malam di Asiatique dengan makan malam dan naik bianglala"},{en:"Cross the river by small ferry for Wat Arun (confirm the ferry on Google Maps)",idn:"Seberangi sungai dengan perahu penyeberangan kecil ke Wat Arun (cek info perahunya di Google Maps)"}],duration:{en:"Half day to evening (3–5 h)",idn:"Setengah hari sampai malam (3–5 jam)"},budget:{level:2,text:{en:"≈ 500–1,500 THB per person incl. boat fares, meals and drinks (estimate; temple entry extra)",idn:"Sekitar 500–1,500 baht per orang, termasuk ongkos kapal, makan, dan minum (perkiraan; tiket masuk kuil terpisah)"}},bestTime:{en:"Late afternoon into sunset for the best light and cooler air; avoid midday heat. Check the last boat times before you go.",idn:"Sore sampai senja paling bagus: cahayanya cantik dan udaranya lebih adem. Hindari panas tengah hari, dan cek jadwal kapal terakhir sebelum berangkat."},stations:[{name:"BTS Saphan Taksin (Sathorn Pier)",line:"BTS Silom Line; connect to the Chao Phraya boats and the free hotel/mall shuttle boats"},{name:"Tha Tien Pier (Wat Pho / Wat Arun side)",line:"Chao Phraya Express boat; confirm pier and boat line on Google Maps"},{name:"BTS Charoen Nakhon",line:"BTS Gold Line (for ICONSIAM)"}],route:[{en:"Start: BTS Saphan Taksin, walk to Sathorn Pier and board a Chao Phraya Express boat.",idn:"Mulai: BTS Saphan Taksin, jalan kaki ke Dermaga Sathorn dan naik kapal Chao Phraya Express."},{en:"Ride to Tha Tien Pier for Wat Pho and the river views (confirm pier on Google Maps).",idn:"Naik sampai Dermaga Tha Tien untuk Wat Pho dan pemandangan sungai (cek dermaganya di Google Maps)."},{en:"Cross the river by small ferry to Wat Arun and walk the terrace.",idn:"Seberangi sungai dengan perahu kecil ke Wat Arun, lalu jalan menyusuri terasnya."},{en:"Return by boat toward Sathorn Pier at golden hour.",idn:"Kembali naik kapal ke arah Dermaga Sathorn saat golden hour."},{en:"Evening: free shuttle boat from Sathorn Pier to Asiatique or ICONSIAM (check the schedule).",idn:"Malam: kapal shuttle gratis dari Dermaga Sathorn ke Asiatique atau ICONSIAM (cek jadwalnya)."}],knowBefore:{en:"Boats are crowded at rush hour. Wear sun protection, hold your bag on the pier, and watch the gap between boat and pier. Temple entry requires modest dress (covered shoulders and knees). Shuttle boats and ferries have limited hours, so confirm times.",idn:"Kapal penuh saat jam sibuk. Siapkan pelindung matahari, pegang erat tasmu di dermaga, dan hati-hati dengan celah antara kapal dan dermaga. Masuk kuil wajib berpakaian sopan (bahu dan lutut tertutup). Kapal shuttle dan perahu penyeberangan jam operasinya terbatas, jadi cek jadwalnya."},geoQuery:"Chao Phraya River, Bangkok",mapsQuery:"Chao Phraya River Bangkok",imgQuery:"Wat Arun Bangkok sunset",imgAlt:"Wat Arun temple on the Chao Phraya River at sunset in Bangkok"},{id:"bang-krachao",name:{en:"Bang Krachao",idn:"Bang Krachao",th:"บางกะเจ้า"},tagline:{en:"Bangkok's green lung: cycling, shade and a slower pace",idn:"Paru-paru hijau Bangkok: bersepeda, teduh, dan ritme yang lebih santai"},personality:{en:"Bang Krachao is a leafy river peninsula just across from Khlong Toei, with narrow elevated paths, mangroves, orchards and small canals. It feels like another province, which is the point: after the traffic of central Bangkok, cycling through shaded lanes is a genuine reset. It is not a place for big attractions; it is for slow rides, local snacks and fresh air. Bring water, expect mosquitoes, and know that facilities are basic.",idn:"Bang Krachao adalah semenanjung hijau di Sungai Chao Phraya, tepat di seberang Khlong Toei, dengan jalur setapak layang yang sempit, hutan bakau, kebun buah, dan kanal-kanal kecil. Rasanya seperti provinsi lain, dan justru itu daya tariknya: setelah macetnya pusat Bangkok, bersepeda di jalan yang teduh benar-benar bikin segar lagi. Ini bukan tempat atraksi besar, melainkan untuk bersepeda santai, jajan camilan lokal, dan menghirup udara segar. Bawa air, siap-siap digigit nyamuk, dan ingat fasilitasnya seadanya."},food:[{name:"Bang Nam Phueng Floating Market (weekends)",note:{en:"A small, touristy floating market with local snacks and grilled foods; typically open on weekends only, so confirm before going.",idn:"Pasar terapung kecil yang cukup turistik dengan camilan lokal dan makanan bakar; biasanya hanya buka akhir pekan, jadi cek dulu sebelum pergi."},mapsQuery:"Bang Nam Phueng Floating Market Bangkok"},{name:"Local riverside and roadside eateries on Bang Krachao",note:{en:"Simple, family-run noodle and rice places along the cycling routes; expect basic menus and low prices.",idn:"Warung mi dan nasi milik keluarga di sepanjang rute sepeda; menunya sederhana dan harganya murah."},mapsQuery:"local restaurant Bang Krachao Bangkok"},{name:"Fruit and drink stalls along the paths",note:{en:"Fresh coconut, fruit and iced drinks for a cooling break between rides.",idn:"Kelapa muda, buah, dan minuman dingin untuk rehat menyegarkan di sela bersepeda."},mapsQuery:"fruit stall Bang Krachao Bangkok"}],cafes:[{name:"Garden-style cafés along the cycling routes",note:{en:"Several relaxed cafés with plants and open-air seating; opening hours vary, so check on Google Maps.",idn:"Beberapa café santai dengan banyak tanaman dan tempat duduk terbuka; jam bukanya beda-beda, jadi cek di Google Maps."},mapsQuery:"cafe Bang Krachao Bangkok"},{name:"Cafés near Sri Nakhon Khuean Khan Park",note:{en:"Quiet spots near the park and botanical garden for a snack or iced coffee.",idn:"Tempat tenang dekat taman dan kebun raya untuk camilan atau es kopi."},mapsQuery:"cafe near Sri Nakhon Khuean Khan Park Bangkok"}],shopping:[{name:"Bang Nam Phueng Floating Market craft stalls (weekends)",note:{en:"Small souvenir and craft stalls; limited selection compared with central markets.",idn:"Lapak suvenir dan kerajinan kecil; pilihannya lebih sedikit dibanding pasar di pusat kota."},mapsQuery:"Bang Nam Phueng Floating Market Bangkok"}],activities:[{en:"Cycle the shaded elevated paths of the Bang Krachao Green Lung",idn:"Bersepeda menyusuri jalur layang yang teduh di Bang Krachao Green Lung"},{en:"Visit Sri Nakhon Khuean Khan Park and Botanical Garden",idn:"Kunjungi Sri Nakhon Khuean Khan Park and Botanical Garden"},{en:"Cross by small ferry from Wat Khlong Toei Nok pier (confirm on Google Maps)",idn:"Menyeberang dengan perahu kecil dari dermaga Wat Khlong Toei Nok (cek di Google Maps)"},{en:"Stop at Bang Nam Phueng Floating Market on a weekend",idn:"Mampir ke Pasar Terapung Bang Nam Phueng di akhir pekan"},{en:"Rent a bike near the pier and ride at your own pace",idn:"Sewa sepeda dekat dermaga dan gowes sesuai ritmemu"}],duration:{en:"Half day (3–5 h)",idn:"Setengah hari (3–5 jam)"},budget:{level:1,text:{en:"≈ 300–700 THB per person incl. ferry, bike rental and snacks (estimate)",idn:"Sekitar 300–700 baht per orang, termasuk perahu, sewa sepeda, dan camilan (perkiraan)"}},bestTime:{en:"Early morning or late afternoon on a dry day to avoid peak heat; weekends for the floating market. Avoid heavy-rain days.",idn:"Pagi-pagi atau sore hari saat cuaca cerah, biar terhindar dari panas puncak. Datang akhir pekan kalau mau ke pasar terapung. Hindari hari hujan deras."},stations:[{name:"MRT Khlong Toei",line:"MRT Blue Line; then a Grab or motorbike taxi to the pier (confirm on Google Maps)"},{name:"Wat Khlong Toei Nok pier (ferry to Bang Krachao)",line:"Small cross-river ferry; confirm pier and schedule on Google Maps"}],route:[{en:"Start: MRT Khlong Toei, then Grab or motorbike taxi to the Wat Khlong Toei Nok pier.",idn:"Mulai: MRT Khlong Toei, lalu Grab atau ojek ke dermaga Wat Khlong Toei Nok."},{en:"Take the small ferry across to Bang Krachao.",idn:"Naik perahu kecil menyeberang ke Bang Krachao."},{en:"Rent a bike near the landing and ride the shaded elevated paths.",idn:"Sewa sepeda dekat dermaga dan gowes di jalur layang yang teduh."},{en:"Stop at Sri Nakhon Khuean Khan Park and Botanical Garden for a rest.",idn:"Istirahat di Sri Nakhon Khuean Khan Park and Botanical Garden."},{en:"Lunch or snacks at a local eatery, or Bang Nam Phueng on weekends, then ride back to the ferry.",idn:"Makan siang atau jajan di warung lokal, atau mampir ke Pasar Bang Nam Phueng kalau akhir pekan, lalu gowes kembali ke dermaga."}],knowBefore:{en:"Bring water, sunscreen, bug spray and cash (card terminals are rare). Paths can be uneven and slippery after rain. Ferry hours are limited, so check the last return time. It is peaceful, but facilities are basic.",idn:"Bawa air, sunscreen, obat nyamuk, dan uang tunai (mesin kartu jarang ada). Jalurnya bisa tidak rata dan licin setelah hujan. Jam operasi perahu terbatas, jadi cek jadwal perahu terakhir. Suasananya damai, tapi fasilitasnya seadanya."},geoQuery:"Bang Krachao, Phra Pradaeng, Samut Prakan",mapsQuery:"Bang Krachao Bangkok",imgQuery:"Bang Krachao",imgAlt:"Cycling path through the green landscape of Bang Krachao near Bangkok"}]});var Re,aa,Va,Uo=S(()=>{Re=[{id:"seven-eleven",type:"convenience",name:{en:"7-Eleven",idn:"7-Eleven",th:"เซเว่น อีเลฟเว่น"},desc:{en:"Thailand's everywhere-store: drinks, ready meals, toasties, boiled eggs, SIM top-ups, chargers, cold towels and more. You will pass one every few hundred metres.",idn:"Minimarket sejuta umat di Thailand, ada tiap beberapa ratus meter di mana pun di Bangkok. Minuman, makanan siap saji, toastie, telur rebus, charger, sampai isi ulang pulsa SIM, semua ada."},budget:1,why:{en:"Fastest fix for water, electrolytes, a hot snack from the microwave counter or a late-night refuel. Open very late in most locations, often 24 h.",idn:"Cara tercepat dapat air, minuman elektrolit, camilan hangat dari microwave, atau isi tenaga tengah malam. Kebanyakan buka sampai larut, banyak juga yang 24 jam."},transit:{en:"Citywide, including inside many BTS/MRT station buildings and malls. Just search the nearest one on Google Maps.",idn:"Ada di seluruh kota, termasuk di dalam banyak gedung stasiun BTS/MRT dan mal. Cari saja yang terdekat di Google Maps."},korea:{en:"Same convenience idea as Indomaret or Alfamart back home, but staff will microwave your meal and many shops have an All Café coffee counter. Ready-meal choices are Thai (rice dishes, toasties, dumplings). Many stores also sell bottled water, ice and cheap ponchos. The price tag is the price. Buy-one-get-one deals exist too, so look for promo stickers.",idn:"Mirip Indomaret atau Alfamart, tapi stafnya bakal langsung memanaskan makananmu. Di beberapa toko ada juga konter kopi All Café. Menunya ala Thai (nasi lauk, toastie, dimsum, dll.). Ada juga air mineral, es, dan jas hujan murah. Promo beli 1 gratis 1 juga ada, cari saja stiker promonya."},tags:["24h","snacks","hot-food","water","late-night"],mapsQuery:"7-Eleven Bangkok",imgQuery:"7-Eleven Thailand",imgAlt:"A 7-Eleven convenience store storefront in Thailand",imgIllustrative:!0},{id:"lotus-go-fresh",type:"convenience",name:{en:"Lotus's go fresh",idn:"Lotus's go fresh",th:"โลตัส โก เฟรช"},desc:{en:"Lotus's small-format neighborhood supermarket: fresh fruit, ready meals, drinks, toiletries and snacks, usually in a bigger and calmer space than a typical 7-Eleven.",idn:"Supermarket lingkungan versi kecil dari Lotus's: buah, makanan siap saji, minuman, kebutuhan sehari-hari, dan camilan, dengan ruang yang lebih luas dan lebih lega daripada minimarket biasa."},budget:1,why:{en:"Good for stocking the room with water, fruit, yogurt and snacks at supermarket prices without walking into a full hypermarket.",idn:"Pas buat stok air, buah, yoghurt, dan camilan dengan harga supermarket tanpa harus ke hipermarket."},transit:{en:"Scattered across Bangkok, often on busy roads or near BTS/MRT stops. Search the nearest branch on Google Maps; hours vary by branch.",idn:"Tersebar di seluruh Bangkok, banyak di jalan besar atau dekat stasiun. Jam buka beda tiap cabang, jadi cek di peta."},korea:{en:"Think of it as an Indonesian neighborhood minimarket or small supermarket with Thai food and a small hot-food counter. Cheaper per item than 7-Eleven for water and drinks.",idn:"Rasanya seperti minimarket atau supermarket kecil dekat rumah di Indonesia, dengan makanan Thai dan konter deli kecil. Air dan minuman biasanya lebih murah daripada di 7-Eleven."},tags:["supermarket","fruit","water","ready-meals"],mapsQuery:"Lotus's go fresh Bangkok",imgQuery:"Lotus's go fresh",imgAlt:"Lotus's go fresh small supermarket storefront",imgIllustrative:!0},{id:"mini-big-c",type:"convenience",name:{en:"Mini Big C",idn:"Mini Big C",th:"มินิ บิ๊กซี"},desc:{en:"Big C's small convenience chain, often a little cheaper than 7-Eleven for drinks and instant noodles, with a Thai grocery selection.",idn:"Jaringan minimarket kecil milik Big C. Minuman dan mi instan sering sedikit lebih murah daripada di 7-Eleven."},budget:1,why:{en:"Cheap water, snacks, instant noodles and basics when a 7-Eleven is not on the block.",idn:"Air, camilan, mi instan, dan kebutuhan dasar dengan harga murah kalau tidak ada 7-Eleven di dekatmu."},transit:{en:"Neighborhood locations across Bangkok. Search Mini Big C on Google Maps for the closest branch.",idn:"Ada di banyak lingkungan di Bangkok. Cari Mini Big C di Google Maps untuk cabang terdekat."},korea:{en:"Similar to a small Indomaret or Alfamart, but fewer hot meals and rarely 24 h. Good for stocking up on basics rather than late-night food.",idn:"Mirip Indomaret atau Alfamart versi kecil, tapi makanan siap santapnya lebih sedikit dan jarang yang buka 24 jam. Cocok buat belanja kebutuhan dasar."},tags:["cheap","snacks","instant-noodles"],mapsQuery:"Mini Big C Bangkok",imgQuery:"Mini Big C",imgAlt:"A Mini Big C convenience store in Thailand",imgIllustrative:!0},{id:"cj-more",type:"convenience",name:{en:"CJ MORE",idn:"CJ MORE",th:"ซีเจ มอร์"},desc:{en:"A Thai neighborhood convenience chain (the former CJ Express) with a compact range of snacks, drinks and daily basics.",idn:"Jaringan minimarket lingkungan asal Thailand (dulu bernama CJ Express) dengan pilihan camilan, minuman, dan kebutuhan harian yang ringkas."},budget:1,why:{en:"An alternative to 7-Eleven in residential streets, often with competitive drink and snack prices.",idn:"Bisa jadi alternatif 7-Eleven di kawasan perumahan, harga minuman dan camilannya sering bersaing."},transit:{en:"Mostly outside the central mall belt, in residential areas and along main roads. Check the nearest branch on Google Maps.",idn:"Lebih banyak di kawasan perumahan dan jalan besar daripada di pusat belanja. Cek cabang terdekat di peta."},korea:{en:"Despite the name, it is simply a Thai chain: a mini supermarket plus drugstore for everyday basics.",idn:"Jangan bingung dengan namanya: ini jaringan asal Thailand, semacam supermarket mini plus toko obat untuk kebutuhan sehari-hari."},tags:["local","snacks","drinks"],mapsQuery:"CJ MORE Bangkok",imgQuery:"CJ More Thailand",imgAlt:"CJ MORE convenience store in Thailand",imgIllustrative:!0},{id:"siam-paragon",type:"mall",name:{en:"Siam Paragon",idn:"Siam Paragon",th:"สยามพารากอน"},desc:{en:"Bangkok's flagship luxury mall with big-name brands, Gourmet Market food hall, a cinema complex and Siam Ocean World aquarium. Great for AC and a huge range of food.",idn:"Mal mewah andalan Bangkok dengan merek-merek ternama, food hall Gourmet Market, kompleks bioskop, sampai akuarium Siam Ocean World. Pas buat rute indoor yang AC-nya dingin."},budget:3,why:{en:"Shop, eat and cool down in one stop. The ground-floor food hall and Gourmet Market are great for trying Thai bites and picking up gifts.",idn:"Belanja, makan, dan ngadem sekaligus. Food hall di lantai dasar dan Gourmet Market pas buat coba camilan Thai dan beli oleh-oleh."},transit:{en:"BTS Siam station, connected by a skywalk. Siam Center and Siam Discovery are right next door.",idn:"Terhubung langsung lewat skywalk dari BTS Siam. Siam Center dan Siam Discovery ada persis di sebelahnya."},korea:{en:"Feels like Grand Indonesia or Mall Taman Anggrek meets a Ranch Market-style gourmet food hall. Prices on international brands are not always cheaper than at home; sale periods and tourist VAT-refund options exist (rules change, check at the counter).",idn:"Rasanya seperti Grand Indonesia atau Mall Taman Anggrek yang digabung dengan food hall gourmet ala Ranch Market. Harga merek internasional belum tentu lebih murah daripada di Indonesia. Ada periode diskon dan pengembalian PPN untuk turis (Tax refund), tapi aturannya bisa berubah, jadi cek di konter."},tags:["luxury","food-hall","aquarium","cinema","air-conditioned","siam"],geoQuery:"Siam Paragon, Bangkok",mapsQuery:"Siam Paragon Bangkok",imgQuery:"Siam Paragon",imgAlt:"The facade of Siam Paragon shopping mall in Bangkok"},{id:"centralworld",type:"mall",name:{en:"CentralWorld",idn:"CentralWorld",th:"เซ็นทรัลเวิลด์"},desc:{en:"One of Southeast Asia's largest malls, with Zen department store, Thai and global fashion, electronics, a big food court and event plazas.",idn:"Salah satu mal terbesar di Asia Tenggara, dengan department store Zen, fashion Thai dan global, elektronik, food court besar, dan plaza acara."},budget:2,why:{en:"Broad mid-range shopping, a big food court and an easy meet-up point for groups.",idn:"Pilihan belanja kelas menengah yang luas dan food court besar; titik kumpul yang gampang buat rombongan."},transit:{en:"BTS Chit Lom, connected via skywalk (also walkable via skywalk from BTS Siam, roughly 10 min).",idn:"Terhubung lewat skywalk dari BTS Chit Lom. Dari BTS Siam juga bisa jalan kaki lewat skywalk (sekitar 10 menit)."},korea:{en:"Bigger and more sprawling than Plaza Indonesia or Senayan City. K-beauty brands (popular in Indonesia too) and Korean-style cafes are easy to find. A few big events and shows are held on the front plaza.",idn:"Jauh lebih luas dan ramai dari Plaza Indonesia atau Senayan City. Merek K-beauty (yang juga populer di Indonesia) dan café ala Korea gampang ditemukan, dan di plaza depannya kadang ada acara besar atau pertunjukan."},tags:["mid-range","food-court","fashion","electronics","meetup"],geoQuery:"CentralWorld, Bangkok",mapsQuery:"CentralWorld Bangkok",imgQuery:"CentralWorld Bangkok",imgAlt:"CentralWorld shopping complex in Bangkok seen from the street"},{id:"mbk-center",type:"mall",name:{en:"MBK Center",idn:"MBK Center",th:"เอ็มบีเค เซ็นเตอร์"},desc:{en:"A classic, crowded Bangkok mall packed with small stalls: phone accessories, cases, souvenirs, clothes, bags and food on the upper floors. Bargaining is normal at many stalls.",idn:"Mal klasik Bangkok yang padat dengan lapak-lapak kecil: casing dan aksesori HP, suvenir, baju, tas, dan food court di lantai atas. Di banyak lapak, tawar-menawar itu biasa."},budget:1,why:{en:"The cheapest one-stop for souvenirs, phone cases and cables, and gift shopping.",idn:"Tempat paling murah untuk beli suvenir, casing HP, kabel, dan oleh-oleh sekaligus."},transit:{en:"BTS National Stadium, connected directly by skywalk.",idn:"Terhubung langsung lewat skywalk dari BTS National Stadium."},korea:{en:"Feels like Dongdaemun or a Namdaemun market indoors. Prices can often be negotiated, quality varies a lot and tags are not always fixed. Keep an eye on your bag and phone in crowds, and compare a few stalls before buying electronics. Also be careful with fake branded goods.",idn:"Rasanya seperti ITC atau Blok M Square. Banyak lapak yang harganya bisa ditawar dan kualitasnya beda jauh. Ramai orang, jadi jaga tas dan HP, dan bandingkan beberapa lapak sebelum beli elektronik. Hati-hati juga dengan barang bermerek palsu (KW)."},tags:["bargain","souvenirs","phone-accessories","crowded"],geoQuery:"MBK Center, Bangkok",mapsQuery:"MBK Center Bangkok",imgQuery:"MBK Center Bangkok",imgAlt:"MBK Center shopping mall exterior in Bangkok"},{id:"terminal-21-asok",type:"mall",name:{en:"Terminal 21 Asok",idn:"Terminal 21 Asok",th:"เทอร์มินอล 21 อโศก"},desc:{en:"A mid-range mall themed like an airport terminal, with each floor styled after a world city (Tokyo, London, San Francisco...). It has a big food court and a lot of small fashion shops.",idn:"Mal kelas menengah berkonsep terminal bandara, tiap lantainya bertema kota dunia (Tokyo, London, San Francisco, dll.). Ada food court dan banyak toko fashion kecil."},budget:2,why:{en:"Photogenic, affordable, and with a food court that is cheap compared with other central malls.",idn:"Fotogenik, harga bersahabat, dan food court-nya lebih murah dibanding mal lain di pusat kota."},transit:{en:"BTS Asok and MRT Sukhumvit (the mall sits on the Asok intersection, connected by walkways).",idn:"Persis di depan BTS Asok dan MRT Sukhumvit (mal ini ada di persimpangan Asok, terhubung dengan jalur pejalan kaki)."},korea:{en:"Like a fun themed version of Blok M Square or ITC: cheaper clothes and lots of cafes. Food court uses a prepaid card in many cases (top up and get a refund of the leftover balance at the counter).",idn:"Seperti Blok M Square atau ITC yang didandani ala taman hiburan. Bajunya murah dan café-nya banyak. Food court-nya sering pakai kartu prabayar: isi saldo dulu, sisa saldonya bisa diuangkan kembali di konter."},tags:["themed","mid-range","food-court","photo","sukhumvit"],geoQuery:"Terminal 21, Asok, Bangkok",mapsQuery:"Terminal 21 Asok Bangkok",imgQuery:"Terminal 21 Bangkok",imgAlt:"Terminal 21 shopping mall interior with themed decor in Bangkok"},{id:"one-bangkok",type:"mall",name:{en:"One Bangkok",idn:"One Bangkok",th:"วัน แบงค็อก"},desc:{en:"A large new mixed-use district near Lumphini Park and Rama IV Road with offices, hotels, retail and dining, built in phases. Shop and restaurant openings keep changing, so check what is open before going.",idn:"Kawasan terpadu baru berskala besar di Jalan Rama IV dekat Taman Lumphini, dengan perkantoran, hotel, pusat belanja, dan restoran yang dibangun bertahap. Toko dan restoran yang buka terus berubah, jadi cek dulu mana yang sudah buka sebelum pergi."},budget:3,why:{en:"A modern, spacious, calm alternative to the busy Siam malls, good for a design-minded walk.",idn:"Alternatif modern, lapang, dan tenang dari mal-mal Siam yang ramai; pas buat jalan-jalan menikmati desainnya."},transit:{en:"MRT Lumphini. The official site recommends Exit 1, which links via an underground passage to the Parade zone (tunnel and entry hours are limited, so check). Exit 3 on Wireless Road also lets out next to the site.",idn:"MRT Lumphini. Panduan resminya menyarankan Pintu Keluar 1, yang tersambung lewat terowongan bawah tanah ke zona Parade (jam buka terowongan/akses terbatas, jadi cek dulu). Pintu Keluar 3 di Wireless Road juga keluar di sebelah kompleksnya."},korea:{en:"Think of a brand-new mixed-use district in the style of PIK Avenue rather than an old mall. Not everything is open yet, and opening hours differ by shop and zone
