at kalau mau.",th:"ขอโรตีกล้วยใส่ไข่ ใส่ช็อกโกแลต{P}",rom:"khor ro-ti kluay sai khai, sai chok-ko-laet {P}"},fact:{en:"A big-city staple in the evenings: watching the vendor stretch the dough thin, flip it in the air and fold it is part of the experience.",idn:"Kalau malam, bisa ditemukan di seluruh penjuru kota. Melihat penjual menarik adonan tipis, melemparnya ke udara, lalu melipatnya juga bagian dari keseruannya."},where:[{name:"Roti carts around Khao San Road and night markets",area:"other",note:{en:"One of the most common street desserts in tourist areas. Many carts stay open into the evening.",idn:"Salah satu dessert kaki lima paling umum di kawasan wisata. Banyak gerobak buka sampai malam."}}],imgQuery:"Roti kluay banana roti Thailand",imgAlt:"Roti with banana, folded and drizzled with condensed milk",mapsQuery:"banana roti Bangkok"},{id:"thai-shaved-ice",cat:"desserts",name:{en:"Thai Shaved Ice (Nam Kaeng Sai)",th:"น้ำแข็งใส",idn:"Nam khaeng sai (es campur ala Thailand)"},rom:"nam khaeng sai",desc:{en:"A bowl of shaved ice with a choice of toppings (jellies, red beans, sweet corn, taro, palm seed, sweet potato) and flavored syrup, often finished with a drizzle of sweetened condensed milk, a Thai cousin of Indonesian es campur. Café versions also borrow Korean-style bingsu.",idn:"Es serut dengan pilihan topping seperti jeli, kacang merah, jagung manis, talas, kolang-kaling, dan ubi, lalu disiram sirup manis dan susu kental manis. Mirip es campur di Indonesia. Di kafe juga ada versi bingsu ala Korea."},ingredients:{en:["shaved ice","sweet syrup","evaporated or condensed milk","jellies","red beans","sweet corn","taro","palm seed"],idn:["es serut","sirup manis","susu (evaporasi atau kental manis)","jeli","kacang merah","jagung manis","talas","kolang-kaling"]},spice:0,price:[30,200],allergens:["dairy"],pork:"no",seafood:"no",veg:"yes",tags:["sweet","local-fav","kr-familiar"],beginner:{en:"Street-style nam kaeng sai is coarser and cheaper (about 30-70 THB) than the fluffy milk-snow bingsu of Korean-style cafés (trendy in Indonesian malls too), and like es campur it is built around chewy toppings and bright syrups rather than milk-ice. Thai cafés also make Korean-style bingsu (often called bingsu), usually 120-250 THB. They are similar in spirit but not identical. Ice and toppings are the main hygiene question; stick to busy shops.",idn:"Nam khaeng sai versi kaki lima esnya lebih kasar dan lebih murah (30-70 baht) dibanding bingsu salju susu di kafe ala Korea (yang juga lagi tren di mal Indonesia). Seperti es campur, intinya ada di topping kenyal dan sirup warna-warni, bukan es susu. Kafe di Thailand juga menjual bingsu ala Korea (biasanya ditulis 'bingsu') dengan harga sekitar 120-250 baht. Mirip, tapi nggak sama persis. Kalau khawatir soal kebersihan, pilih kedai yang ramai pembeli."},order:{en:"Ask for shaved ice and pick the toppings; ask for less sweet.",idn:"Pesan es serut dan pilih topping-nya. Boleh minta yang nggak terlalu manis.",th:"ขอน้ำแข็งใสหนึ่งถ้วย หวานน้อย{P}",rom:"khor nam-khaeng-sai nueng thuay, wan noi {P}"},fact:{en:"Classic Thai shaved ice is often drizzled with a bright red 'nam daeng' syrup, usually sala-flavored, a sweet taste a bit like cream soda.",idn:"Es serut tradisional Thailand sering disiram sirup merah terang 'nam daeng', biasanya rasa sala, manisnya agak mirip cream soda."},where:[{name:"Dessert cafés and malls around Siam",area:"siam",note:{en:"Siam's shopping malls and Siam Square have many dessert cafés, including bingsu-style shops.",idn:"Mal-mal di Siam dan Siam Square punya banyak kafe dessert, termasuk kedai bergaya bingsu."}},{name:"Market and food-court dessert counters",area:"other",note:{en:"The cheapest, most traditional Thai version, often with a choice of toppings in glass trays.",idn:"Versi Thailand yang paling murah dan tradisional. Pilih topping dari wadah kaca untuk ditaruh di atas es."}}],imgQuery:"Nam khaeng sai Thai shaved ice dessert",imgAlt:"Thai shaved ice dessert with colorful toppings and syrup",mapsQuery:"Thai shaved ice dessert Bangkok"},{id:"thai-milk-tea",cat:"drinks",name:{en:"Thai Milk Tea (Cha Yen)",th:"ชาเย็น",idn:"Cha yen (Thai tea)"},rom:"cha yen",desc:{en:"Strongly brewed black tea spiced with star anise and other spices, sweetened with sugar and condensed milk, poured over ice and topped with evaporated milk. Famously orange, creamy and very sweet.",idn:"Teh hitam yang diseduh kental dengan rempah seperti bunga lawang, diberi gula dan susu kental manis, dituang ke atas es, lalu ditambah susu evaporasi. Warnanya oranye, creamy, dan manis banget."},ingredients:{en:["Thai black tea mix","sugar","condensed milk","evaporated milk","ice"],idn:["campuran teh hitam Thailand","gula","susu kental manis","susu evaporasi","es"]},spice:0,price:[25,80],allergens:["dairy"],pork:"no",seafood:"no",veg:"yes",caffeine:!0,tags:["street","sweet","local-fav","beginner","kr-familiar"],beginner:{en:"Very sweet by default; one cup can have as much sugar as a dessert. Say 'wan noi' (less sweet) or 'mai sai nam tan' (no sugar added; condensed milk still sweetens it). Street cups cost about 25-45 THB, cafés 60-100 THB. The orange color comes largely from the tea mix, which often contains food coloring.",idn:"Default-nya manis banget; satu gelas bisa mengandung gula setara dessert. Bilang 'wan noi' (kurang manis) atau 'mai sai nam tan' (tanpa tambahan gula). Karena ada susu kental manis, rasanya tetap manis. Segelas di pinggir jalan sekitar 25-45 baht, di kafe 60-100 baht. Warna oranyenya sebagian besar berasal dari pewarna di campuran tehnya."},order:{en:"Thai iced tea, less sweet.",idn:"Cha yen, kurang manis ya.",th:"ขอชาเย็นหวานน้อย{P}",rom:"khor cha yen wan noi {P}"},fact:{en:"Thai milk tea is Thailand's best-known drink abroad, and in Bangkok it is poured into tall plastic cups from street carts and sold in sealed plastic bags at many stalls.",idn:"Cha yen adalah minuman Thailand yang paling terkenal di luar negeri (di Indonesia juga hits sebagai \"Thai tea\"). Di Bangkok, banyak dijual di gerobak dalam gelas plastik besar atau kantong plastik."},where:[{name:"Street drink carts and cafés across Bangkok",area:"other",note:{en:"Look for the big plastic tubs of orange tea and a stack of cups.",idn:"Cari gerobak dengan wadah besar berisi teh oranye dan tumpukan gelas."}}],imgQuery:"Thai iced tea",imgAlt:"A glass of orange Thai iced milk tea",mapsQuery:"Thai iced tea Bangkok"},{id:"oliang",cat:"drinks",name:{en:"Oliang (Thai Iced Black Coffee)",th:"โอเลี้ยง",idn:"Oliang (kopi hitam es ala Thailand)"},rom:"o-liang",desc:{en:"Strong Thai-style black coffee, brewed through a cloth filter, sweetened with sugar and served over ice. Traditional blends can include roasted grains, giving it a deep, toasty flavor. No milk by default.",idn:"Kopi hitam ala Thailand yang diseduh kental pakai saringan kain, diberi gula, dan disajikan dengan es. Racikan tradisionalnya kadang dicampur biji-bijian sangrai, jadi rasanya gurih seperti bakaran. Default-nya tanpa susu."},ingredients:{en:["Thai-style coffee blend","sugar","ice"],idn:["racikan kopi Thailand","gula","es"]},spice:0,price:[20,60],allergens:[],pork:"no",seafood:"no",veg:"yes",caffeine:!0,tags:["street","sweet","local-fav","kr-familiar"],beginner:{en:"Not as bitter as an Americano, but very sweet unless you ask. It is the Thai answer to iced black coffee, and the flavor is stronger and earthier than a typical café coffee. Say 'wan noi' or 'mai sai nam tan' for less sugar.",idn:"Nggak sepahit Americano, tapi manis banget kalau nggak minta dikurangi. Ini kopi hitam es versi Thailand, rasanya lebih kuat dan gurih dibanding kopi kafe biasa. Biar nggak terlalu manis, bilang 'wan noi' atau 'mai sai nam tan'."},order:{en:"Oliang, less sweet.",idn:"Oliang, kurang manis ya.",th:"ขอโอเลี้ยงหวานน้อย{P}",rom:"khor o-liang wan noi {P}"},fact:{en:"The name comes from Teochew Chinese for black and cold, reflecting the Chinese-Thai coffee shop culture of old Bangkok.",idn:"Namanya berasal dari bahasa Tionghoa Teochew (潮州) yang berarti 'hitam dan dingin', mencerminkan budaya kedai kopi Tionghoa-Thai di Bangkok tempo dulu."},where:[{name:"Old-style coffee stalls and Chinese-Thai coffee shops",area:"yaowarat",note:{en:"Common in Yaowarat and other older neighborhoods.",idn:"Banyak ditemukan di kawasan lama seperti Yaowarat."}}],imgQuery:"Oliang Thai iced coffee",imgAlt:"A glass of Thai iced black coffee (oliang)",mapsQuery:"oliang Thai iced coffee Bangkok"},{id:"thai-coffee",cat:"drinks",name:{en:"Thai Coffee (Kafae Boran / Kafae Yen)",th:"กาแฟโบราณ / กาแฟเย็น",idn:"Kafae boran / kafae yen (kopi Thailand)"},rom:"ka-fae bo-ran / ka-fae yen",desc:{en:"Old-style Thai coffee is brewed strong through a cloth sock filter and mixed with condensed milk. Kafae boran is the traditional (hot or iced) cup; kafae yen is the iced version you see at every drink cart.",idn:"Kopi Thailand gaya lama diseduh kental pakai saringan kain lalu dicampur susu kental manis. Kafae boran adalah versi tradisional (panas atau es), sedangkan kafae yen adalah versi es yang ada di setiap gerobak minuman."},ingredients:{en:["robusta coffee blend","condensed milk","sugar","evaporated milk","ice"],idn:["racikan kopi robusta","susu kental manis","gula","susu evaporasi","es"]},spice:0,price:[25,80],allergens:["dairy"],pork:"no",seafood:"no",veg:"yes",caffeine:!0,tags:["street","sweet","local-fav","kr-familiar"],beginner:{en:"Strong, sweet and creamy; it has a lot of sugar and caffeine, so one cup in the afternoon is plenty. Say 'wan noi' for less sweet. Café coffees (Americano, latte) are priced much higher (about 70-150 THB) than street cups.",idn:"Kental, manis, dan creamy. Gula dan kafeinnya tinggi, jadi satu gelas di sore hari sudah cukup. Bilang 'wan noi' biar kurang manis. Kopi kafe (Americano, latte) jauh lebih mahal (sekitar 70-150 baht) dibanding kopi gerobak."},order:{en:"Iced Thai coffee, less sweet.",idn:"Kopi Thailand es, kurang manis ya.",th:"ขอกาแฟเย็นหวานน้อย{P}",rom:"khor ka-fae yen wan noi {P}"},fact:{en:"'Boran' means ancient or old-fashioned, referring to the traditional cloth-sock brewing method that coffee shops in Thailand have used for generations.",idn:"'Boran' artinya kuno atau gaya lama, merujuk ke cara seduh dengan saringan kain yang dipakai kedai kopi di Thailand secara turun-temurun."},where:[{name:"Street coffee carts and traditional coffee shops",area:"other",note:{en:"Look for the cloth filter hanging over a metal pot; typical at morning stalls and older shops.",idn:"Cari saringan kain yang tergantung di atas teko logam. Biasa ada di lapak pagi dan kedai lama."}}],imgQuery:"Thai iced coffee",imgAlt:"A glass of Thai iced coffee with condensed milk",mapsQuery:"Thai coffee kafae boran Bangkok"},{id:"coconut-water",cat:"drinks",name:{en:"Coconut Water (Nam Maprao)",th:"น้ำมะพร้าว",idn:"Air kelapa (nam maphrao)"},rom:"nam ma-phrao",desc:{en:"Fresh water from young green coconuts, usually served chilled in the whole coconut, or poured over ice in a cup. Lightly sweet and refreshing in the heat; you can scoop out the soft flesh with a spoon afterwards.",idn:"Air segar dari kelapa muda hijau. Disajikan dingin langsung di buah kelapanya atau dituang ke gelas berisi es. Manisnya ringan dan menyegarkan saat cuaca panas. Setelah habis, daging kelapanya bisa dikerok pakai sendok."},ingredients:{en:["young coconut water","coconut flesh (optional)"],idn:["air kelapa muda","daging kelapa (opsional)"]},spice:0,price:[30,80],allergens:[],pork:"no",seafood:"no",veg:"yes",caffeine:!1,tags:["street","beginner","post-practice","local-fav","kr-familiar"],beginner:{en:"Naturally mildly sweet with no added sugar when fresh from a whole coconut. Bottled or blended versions can be sweetened. Ask for the coconut to be opened so you can eat the flesh. It is a good option for rehydrating in the heat, but it is not an electrolyte-engineered sports drink.",idn:"Kalau langsung dari buah kelapa utuh, rasanya manis alami tanpa tambahan gula. Versi botol atau yang diblender bisa diberi gula. Minta kelapanya dibelah supaya kamu bisa makan dagingnya. Bagus untuk mengganti cairan saat panas, tapi bukan minuman olahraga yang kadar elektrolitnya diatur."},order:{en:"One chilled coconut, please.",idn:"Satu kelapa dingin, ya.",th:"ขอมะพร้าวเย็นหนึ่งลูก{P}",rom:"khor ma-phrao yen nueng luk {P}"},fact:{en:"The aromatic 'nam hom' coconut variety is prized in Thailand for its naturally sweet water and fragrance.",idn:"Di Thailand, kelapa varietas 'nam hom' terkenal karena airnya harum dan manisnya alami."},where:[{name:"Coconut vendors at markets, parks and tourist areas",area:"other",note:{en:"Common at fruit stands and in markets such as Chatuchak. Check the price before ordering at tourist spots.",idn:"Gampang ditemukan di lapak buah dan pasar seperti Chatuchak. Di tempat wisata, cek harga dulu sebelum pesan."}}],imgQuery:"Young coconut water Thailand",imgAlt:"A chilled green coconut with a straw",mapsQuery:"fresh coconut water Bangkok"},{id:"sugarcane-juice",cat:"drinks",name:{en:"Sugarcane Juice (Nam Oi)",th:"น้ำอ้อย",idn:"Jus tebu (nam oi)"},rom:"nam oi",desc:{en:"Fresh sugarcane pressed through a roller on the spot, poured over ice and served in a plastic cup or bag. Naturally sweet, grassy and refreshing.",idn:"Tebu digiling pakai mesin roller langsung di tempat, lalu dituang ke atas es dan disajikan di gelas atau kantong plastik. Manis alami, ada aroma rumput segar, dan menyegarkan."},ingredients:{en:["sugarcane juice","ice","sometimes a pinch of salt or lime"],idn:["Sari tebu","Es","Kadang sejumput garam atau jeruk nipis"]},spice:0,price:[15,40],allergens:[],pork:"no",seafood:"no",veg:"yes",caffeine:!1,tags:["street","sweet","local-fav","kr-familiar"],beginner:{en:"Sweet on its own with no syrup needed, so you cannot make it unsweetened. It is hard to judge portions: a small cup is plenty. Watch it being made and choose a stall with a clean press and fresh ice.",idn:"Sudah manis tanpa sirup, jadi nggak bisa dipesan tanpa gula. Satu gelas kecil sudah cukup. Pilih lapak yang memeras langsung di tempat, dengan mesin dan es yang bersih."},order:{en:"One sugarcane juice, please.",idn:"Satu jus tebu, ya.",th:"ขอน้ำอ้อยหนึ่งแก้ว{P}",rom:"khor nam oi nueng kaew {P}"},fact:{en:"Sugarcane juice stalls are easy to spot from the stacked cane stalks and the noisy roller press next to the cart.",idn:"Gampang dikenali dari tumpukan batang tebu dan bunyi berisik mesin penggiling di samping gerobaknya."},where:[{name:"Street carts at markets and near BTS/MRT exits",area:"other",note:{en:"Usually a cart with cane stalks stacked at the side.",idn:"Biasanya gerobak dengan tumpukan batang tebu di sampingnya."}}],imgQuery:"Sugarcane juice Thailand street",imgAlt:"Fresh sugarcane juice in a plastic cup with ice",mapsQuery:"sugarcane juice Bangkok"},{id:"butterfly-pea-lemonade",cat:"drinks",name:{en:"Butterfly Pea Lemonade",th:"น้ำอัญชันมะนาว",idn:"Limun butterfly pea (nam anchan manao)"},rom:"nam an-chan ma-nao",desc:{en:"A blue herbal drink made from butterfly pea flowers (anchan) that turns purple or pink when lime juice is added. Sweet-sour, light and floral.",idn:"Minuman herbal biru dari bunga telang (anchan). Kalau ditambah air jeruk nipis, warnanya berubah jadi ungu atau pink. Manis-asam, ringan, dan wangi bunga."},ingredients:{en:["butterfly pea flowers","lime juice","sugar syrup","ice"],idn:["Bunga telang","Air jeruk nipis","Sirup gula","Es"]},spice:0,price:[20,120],allergens:[],pork:"no",seafood:"no",veg:"yes",caffeine:!1,tags:["sweet","beginner"],beginner:{en:"Street cups cost about 20-40 THB; café versions with soda or sparkling water cost around 70-120 THB. The flower itself has almost no flavor; the taste comes from the lime and sugar. Often served as a blue drink with a lime wedge so you can change the color yourself.",idn:"Versi gerobak sekitar 20–40 baht, versi kafe dengan soda atau air berkarbonasi sekitar 70–120 baht. Bunganya sendiri hampir nggak berasa; rasanya datang dari jeruk nipis dan gula. Ada juga yang memberi irisan jeruk nipis terpisah supaya kamu bisa mengubah warnanya sendiri."},order:{en:"Butterfly pea lemonade, less sweet.",idn:"Limun butterfly pea, kurang manis ya.",th:"ขอน้ำอัญชันมะนาวหวานน้อย{P}",rom:"khor nam an-chan ma-nao wan noi {P}"},fact:{en:"The color change is real chemistry: the flower's pigment turns pink or purple when it meets the acid in the lime.",idn:"Perubahan warnanya itu reaksi kimia beneran: pigmen bunga berubah jadi pink atau ungu saat ketemu asam dari jeruk nipis."},where:[{name:"Cafés and drink carts across Bangkok",area:"other",note:{en:"A photo-friendly drink that is also sold at ordinary street carts.",idn:"Minuman yang cakep buat difoto, dan dijual juga di gerobak pinggir jalan biasa."}}],imgQuery:"Butterfly pea flower tea lemonade",imgAlt:"A blue and purple butterfly pea flower lemonade in a glass",mapsQuery:"butterfly pea lemonade Bangkok"},{id:"watermelon-smoothie",cat:"drinks",name:{en:"Watermelon Smoothie (Taeng Mo Pan)",th:"แตงโมปั่น",idn:"Taengmo pan (smoothie semangka)"},rom:"taeng-mo pan",desc:{en:"Fresh watermelon blended with ice and a splash of syrup into a slushy, cold drink. One of the most popular fruit shakes on a hot Bangkok day.",idn:"Semangka segar diblender dengan es dan sedikit sirup jadi minuman dingin ala slushy. Salah satu jus buah paling populer saat Bangkok lagi panas-panasnya."},ingredients:{en:["watermelon","ice","sugar syrup"],idn:["Semangka","Es","Sirup gula"]},spice:0,price:[30,60],allergens:[],pork:"no",seafood:"no",veg:"yes",caffeine:!1,tags:["street","sweet","local-fav","beginner","post-practice","kr-familiar"],beginner:{en:"Most stalls add sugar syrup on top of already sweet watermelon. Say 'mai sai nam chueam' (no syrup) and it will still taste sweet. It is mostly water and ice, which makes it a good hydrating option in the heat.",idn:"Kebanyakan lapak menambahkan sirup ke semangka yang sebenarnya sudah manis. Bilang 'mai sai nam chueam' (tanpa sirup), rasanya tetap manis kok. Isinya kebanyakan semangka dan es, jadi bagus buat menghidrasi saat cuaca panas."},order:{en:"Watermelon smoothie, no syrup.",idn:"Smoothie semangka, tanpa sirup ya.",th:"ขอแตงโมปั่นไม่ใส่น้ำเชื่อม{P}",rom:"khor taeng-mo pan mai sai nam-chueam {P}"},fact:{en:"On menus and among travelers it is often written as 'taengmo pan', straight from the Thai name (taeng-mo = watermelon, pan = blended).",idn:"Di menu dan di kalangan traveler, minuman ini sering ditulis 'taengmo pan', langsung dari nama Thai-nya (taeng-mo = semangka, pan = diblender)."},where:[{name:"Fruit-shake carts across Bangkok",area:"other",note:{en:"Found everywhere at fruit stalls, markets and near transport exits.",idn:"Ada di mana-mana: lapak buah, pasar, dan dekat pintu keluar stasiun."}}],imgQuery:"Watermelon smoothie Thailand",imgAlt:"Glass of fresh watermelon juice with watermelon slices",mapsQuery:"watermelon smoothie Bangkok"},{id:"roselle-juice",cat:"drinks",name:{en:"Roselle Juice (Nam Krachiap)",th:"น้ำกระเจี๊ยบ",idn:"Jus rosela (nam krachiap)"},rom:"nam kra-jiap",desc:{en:"A ruby-red drink brewed from dried roselle (hibiscus) petals, sweetened and served cold or warm. Tart, fruity and refreshing, similar to cranberry juice.",idn:"Minuman merah delima dari kelopak rosela (hibiscus) kering yang diseduh, diberi gula, dan disajikan dingin atau hangat. Asam, fruity, dan menyegarkan, mirip jus cranberry."},ingredients:{en:["dried roselle (hibiscus) calyces","water","sugar","ice"],idn:["Kelopak rosela (hibiscus) kering","Air","Gula","Es"]},spice:0,price:[15,40],allergens:[],pork:"no",seafood:"no",veg:"yes",caffeine:!1,tags:["street","sweet"],beginner:{en:"Naturally tart; vendors balance it with plenty of sugar, so say 'wan noi' if you prefer a sharper taste. It has no caffeine and is a good thirst-quencher.",idn:"Aslinya asam, jadi penjual menambah cukup banyak gula. Kalau mau rasa yang lebih asam, bilang 'wan noi'. Tanpa kafein dan ampuh menghilangkan haus."},order:{en:"Roselle juice, less sweet.",idn:"Jus rosela, kurang manis ya.",th:"ขอน้ำกระเจี๊ยบหวานน้อย{P}",rom:"khor nam kra-jiap wan noi {P}"},fact:{en:"Roselle juice is a classic Thai herbal-style drink sold in bottles and bags in markets, often next to chrysanthemum and pandan drinks.",idn:"Jus rosela adalah minuman herbal khas Thailand. Di pasar dijual dalam botol atau kantong, biasanya di sebelah teh krisan dan minuman pandan."},where:[{name:"Market drink stalls",area:"other",note:{en:"Usually part of a line of herbal drinks at markets and street carts.",idn:"Biasanya dijual di pasar dan gerobak sebagai bagian dari deretan minuman herbal."}}],imgQuery:"Roselle juice Thailand",imgAlt:"A glass of red roselle juice with ice",mapsQuery:"roselle juice Bangkok"},{id:"matcha-latte",cat:"drinks",name:{en:"Matcha Latte (Café Culture)",th:"มัทฉะลาเต้",idn:"Matcha latte (budaya kafe Bangkok)"},rom:"mat-cha la-te",desc:{en:"Whisked matcha green tea with milk, served iced or hot. Matcha menus are a big part of Bangkok's café scene, and many cafés offer sweet, creamy and unsweetened options.",idn:"Matcha yang dikocok lalu dicampur susu, disajikan dingin atau panas. Menu matcha jadi bagian besar dari budaya kafe Bangkok, dengan pilihan dari yang manis dan creamy sampai tanpa gula."},ingredients:{en:["matcha powder","milk (dairy or plant-based)","sugar syrup (optional)","ice"],idn:["Bubuk matcha","Susu (biasa atau nabati)","Sirup gula (opsional)","Es"]},spice:0,price:[80,180],allergens:["dairy"],pork:"no",seafood:"no",veg:"yes",caffeine:!0,tags:["sweet"],beginner:{en:"Café prices are much higher than street drinks. Matcha contains caffeine, similar to a moderate cup of coffee, so be careful in the evening. Quality and sweetness differ a lot between cafés; ask for less sweet or no syrup if you want a stronger tea taste.",idn:"Harga di kafe jauh lebih mahal daripada minuman pinggir jalan. Matcha mengandung kafein, kira-kira setara secangkir kopi, jadi hati-hati kalau minum malam-malam. Kualitas dan tingkat manisnya beda jauh antar kafe. Kalau mau rasa teh yang lebih kuat, pesan kurang manis atau tanpa sirup."},order:{en:"Iced matcha latte, not sweet.",idn:"Iced matcha latte, nggak pakai manis ya.",th:"ขอมัทฉะลาเต้เย็น ไม่หวาน{P}",rom:"khor mat-cha la-te yen mai wan {P}"},fact:{en:"Bangkok has a thriving matcha café scene, with many shops specializing in matcha drinks and desserts alongside Japanese- and Korean-style cafés (both popular in Indonesia too).",idn:"Bangkok punya banyak kafe yang khusus menyajikan minuman dan dessert matcha. Kafe-kafe ini populer berdampingan dengan kafe bergaya Jepang dan Korea, yang juga digemari di Indonesia."},where:[{name:"Specialty cafés in Ari and Thonglor",area:"ari",note:{en:"Ari and Thonglor are both full of independent cafés; search for matcha cafés on Google Maps near your location.",idn:"Ari dan Thonglor sama-sama penuh kafe independen. Cari kafe matcha terdekat di Google Maps."}}],imgQuery:"Iced matcha latte",imgAlt:"An iced matcha latte in a clear glass",mapsQuery:"matcha cafe Bangkok"},{id:"chrysanthemum-tea",cat:"drinks",name:{en:"Chrysanthemum Tea (Nam Kek Huay)",th:"น้ำเก๊กฮวย",idn:"Teh krisan (nam kek huai)"},rom:"nam kek-huai",desc:{en:"A light, floral, sweetened chrysanthemum flower tea served cold or hot. Popular in Chinatown and with a clean, honey-like taste.",idn:"Teh bunga krisan yang ringan, wangi, dan manis, disajikan dingin atau hangat. Populer di Chinatown, rasanya bersih seperti madu."},ingredients:{en:["dried chrysanthemum flowers","water","sugar"],idn:["Bunga krisan kering","Air","Gula"]},spice:0,price:[15,40],allergens:[],pork:"no",seafood:"no",veg:"yes",caffeine:!1,tags:["street","sweet"],beginner:{en:"Sweet but light, a good palate cleanser after oily food. If you know teh krisan from Chinese-Indonesian shops back home, this is similar; the Thai street version is often sweeter and usually iced.",idn:"Manis tapi ringan, pas buat menetralkan mulut setelah makan makanan berminyak. Kalau kamu kenal teh krisan dari toko atau resto chinese food di Indonesia, rasanya mirip; versi gerobak di Thailand biasanya lebih manis dan sering disajikan dengan es."},order:{en:"Chrysanthemum tea, less sweet.",idn:"Teh krisan, kurang manis ya.",th:"ขอน้ำเก๊กฮวยหวานน้อย{P}",rom:"khor nam kek-huai wan noi {P}"},fact:{en:"It arrived with Chinese immigrants, and many Thai-Chinese families treat it as a traditional cooling drink for hot weather.",idn:"Minuman ini dibawa imigran Tionghoa, dan banyak keluarga Thai-Tionghoa menganggapnya minuman tradisional penyejuk badan saat cuaca panas."},where:[{name:"Drink stalls around Yaowarat",area:"yaowarat",note:{en:"A staple in Chinatown's drink stalls, sold next to longan and herbal drinks.",idn:"Menu wajib di lapak minuman Chinatown, dijual di samping jus lengkeng dan minuman herbal."}}],imgQuery:"Chrysanthemum tea",imgAlt:"A glass of chrysanthemum tea with flowers",mapsQuery:"chrysanthemum tea Yaowarat Bangkok"},{id:"soy-milk",cat:"drinks",name:{en:"Thai Soy Milk (Nam Tao Hu)",th:"น้ำเต้าหู้",idn:"Nam tao hu (susu kedelai ala Thai)"},rom:"nam tao-hu",desc:{en:"Fresh soy milk, usually sweetened, sold from street carts and market stalls in plastic bags or cups, either warm or iced. Often served with extra toppings like grass jelly, sweet corn or gingko nuts.",idn:"Susu kedelai segar, biasanya manis, dijual di gerobak dan lapak pasar dalam kantong plastik atau gelas, hangat atau pakai es. Sering ditambah topping seperti cincau, jagung manis, atau biji ginkgo."},ingredients:{en:["soybeans","water","sugar","pandan (sometimes)"],idn:["Kedelai","Air","Gula","Pandan (kadang-kadang)"]},spice:0,price:[10,30],allergens:["soy"],pork:"no",seafood:"no",veg:"yes",caffeine:!1,tags:["street","sweet","beginner","kr-familiar"],beginner:{en:"Closer to the sweet soy milk (susu kedelai) sold from street carts in Indonesia than to unsweetened soy milk; ask for less sweet if needed. A popular breakfast drink, often sold alongside fried dough sticks (pa tong ko, similar to cakwe).",idn:"Manisnya mirip susu kedelai gerobakan di Indonesia, beda dengan yang tanpa gula. Kalau perlu, minta kurang manis. Populer sebagai minuman sarapan dan sering dijual bareng pa tong ko (mirip cakwe)."},order:{en:"One soy milk, less sweet.",idn:"Satu susu kedelai, kurang manis ya.",th:"ขอน้ำเต้าหู้หนึ่งแก้ว หวานน้อย{P}",rom:"khor nam tao-hu nueng kaew wan noi {P}"},fact:{en:"Thai soy milk stands are a morning ritual: warm soy milk with fried dough sticks (pa tong ko) is a classic Chinese-Thai breakfast.",idn:"Lapak susu kedelai adalah rutinitas pagi di Thailand: susu kedelai hangat dengan pa tong ko (mirip cakwe) adalah sarapan klasik Thai-Tionghoa."},where:[{name:"Morning market stalls and street carts",area:"other",note:{en:"Especially common in the morning near markets and in Chinatown.",idn:"Paling sering terlihat pagi hari di sekitar pasar dan di Chinatown."}}],imgQuery:"Nam tao hu Thai soy milk",imgAlt:"Soy milk served in a plastic bag at a Thai market",mapsQuery:"Thai soy milk nam tao hu Bangkok"},{id:"passion-fruit-juice",cat:"drinks",name:{en:"Passion Fruit Juice (Nam Sao-wa-rot)",th:"น้ำเสาวรส",idn:"Jus markisa (nam sao-wa-rot)"},rom:"nam sao-wa-rot",desc:{en:"A tart, aromatic passion fruit juice served over ice, usually sweetened with syrup. Bright, tropical and sharply sour.",idn:"Jus markisa yang asam dan harum, biasanya diberi sirup dan disajikan dengan es. Segar, rasa tropis, dan asamnya nendang."},ingredients:{en:["passion fruit pulp","sugar syrup","water","ice"],idn:["Daging buah markisa","Sirup gula","Air","Es"]},spice:0,price:[30,80],allergens:[],pork:"no",seafood:"no",veg:"yes",caffeine:!1,tags:["sweet"],beginner:{en:"Sour first, sweet second. Cafés often serve it as a soda or tea mix at higher prices (about 60-100 THB). The seeds are edible but can be a surprise if you do not expect them. Ask for less sweet if you want the fruit taste to stand out.",idn:"Asam dulu, baru manis. Di kafe sering dicampur soda atau teh dengan harga lebih mahal (sekitar 60–100 baht). Bijinya bisa dimakan, tapi bisa bikin kaget kalau nggak siap. Minta kurang manis kalau mau rasa buahnya lebih menonjol."},order:{en:"Passion fruit juice, less sweet.",idn:"Jus markisa, kurang manis ya.",th:"ขอน้ำเสาวรสหวานน้อย{P}",rom:"khor nam sao-wa-rot wan noi {P}"},fact:{en:"In Thai, passion fruit is sao-wa-rot, a name that often appears on juice carts and café menus.",idn:"Dalam bahasa Thai, markisa disebut sao-wa-rot, nama yang sering muncul di gerobak jus dan menu kafe."},where:[{name:"Fruit-juice stalls and cafés",area:"other",note:{en:"Usually available at fruit-juice stalls with a menu board of many fruit options.",idn:"Biasanya ada di lapak jus buah dengan papan menu berisi banyak pilihan buah."}}],imgQuery:"Passion fruit juice",imgAlt:"Glass of passion fruit juice next to halved passion fruits",mapsQuery:"passion fruit juice Bangkok"},{id:"orange-juice",cat:"drinks",name:{en:"Fresh Orange Juice (Nam Som Khan)",th:"น้ำส้มคั้น",idn:"Jus jeruk peras (nam som khan)"},rom:"nam som khan",desc:{en:"Oranges squeezed to order from street carts, usually the green-skinned sweet 'som khiao wan' variety. Bright and fresh, with a natural sweet-tart taste.",idn:"Jeruk diperas langsung saat dipesan di gerobak pinggir jalan, biasanya pakai jeruk kulit hijau varietas 'som khiao wan'. Segar dan cerah, dengan rasa manis-asam alami."},ingredients:{en:["fresh oranges","ice (optional)","sugar syrup (sometimes)"],idn:["Jeruk segar","Es (opsional)","Sirup gula (kadang-kadang)"]},spice:0,price:[25,60],allergens:[],pork:"no",seafood:"no",veg:"yes",caffeine:!1,tags:["street","beginner","post-practice","kr-familiar"],beginner:{en:"Some vendors add sugar syrup, so ask for none if you want the pure juice. Pure squeezed orange juice often costs more than other street drinks because of the fruit; prices vary with the size of the cup.",idn:"Ada penjual yang menambahkan sirup, jadi minta tanpa sirup kalau mau jus murni. Karena butuh banyak buah, harganya bisa lebih mahal dari minuman pinggir jalan lain, dan tergantung ukuran gelas."},order:{en:"Fresh orange juice, no syrup.",idn:"Jus jeruk peras, tanpa sirup ya.",th:"ขอน้ำส้มคั้นไม่ใส่น้ำเชื่อม{P}",rom:"khor nam som khan mai sai nam-chueam {P}"},fact:{en:"Thai oranges are often green even when ripe, because the tropical climate keeps them from turning orange; do not be put off by the color.",idn:"Karena iklim tropis, jeruk Thailand sering tetap hijau meski sudah matang. Jangan ragu gara-gara warnanya."},where:[{name:"Street juice carts across Bangkok",area:"other",note:{en:"Look for a cart with a pile of oranges and a manual or electric squeezer.",idn:"Cari gerobak dengan tumpukan jeruk dan alat peras."}}],imgQuery:"Fresh orange juice Thailand street",imgAlt:"A street vendor pouring fresh orange juice into a bottle",mapsQuery:"fresh orange juice Bangkok street"}]});var va,za,Wo=S(()=>{va=[{id:"sen-yai",name:{en:"Sen Yai",th:"เส้นใหญ่",idn:"Sen yai (kwetiau lebar)"},rom:"sen yai",desc:{en:"Wide, flat, chewy fresh rice noodles, about as broad as fettuccine. They soak up sauce and char beautifully in a wok.",idn:"Mi beras segar yang lebar, pipih, dan kenyal, kira-kira selebar fettuccine (mirip kwetiau). Menyerap saus dengan baik dan dapat aroma gosong yang mantap di wajan."},look:{en:"Wide white ribbons, soft and slippery, sometimes sold in folded sheets.",idn:"Pita putih lebar, lembut dan licin, kadang dijual dalam lembaran terlipat."},usedIn:[{en:"Pad See Ew",idn:"Pad See Ew"},{en:"Pad Kee Mao (drunken noodles)",idn:"Pad Kee Mao"},{en:"Rad Na",idn:"Rad Na"},{en:"Beef or pork noodle soups",idn:"Mi kuah sapi atau babi"}],imgQuery:"Sen yai wide rice noodles",imgAlt:"Wide flat rice noodles used in Thai noodle dishes"},{id:"sen-lek",name:{en:"Sen Lek",th:"เส้นเล็ก",idn:"Sen lek (mi beras tipis)"},rom:"sen lek",desc:{en:"Thin rice noodles, a little thicker than angel-hair pasta. The default noodle for many classic Thai noodle soups.",idn:"Mi beras tipis, sedikit lebih tebal dari pasta angel hair. Mi standar untuk banyak sup mi Thai klasik."},look:{en:"Thin white strands, soft but with a slight chew.",idn:"Helaian putih tipis, lembut tapi sedikit kenyal."},usedIn:[{en:"Boat noodles (kuay teow reua)",idn:"Boat noodles (kuay teow reua)"},{en:"Tom yum noodles",idn:"Mi tom yum"},{en:"Yen ta fo",idn:"Yen ta fo"},{en:"Clear pork noodle soup",idn:"Sup mi babi kuah bening"}],imgQuery:"Sen lek rice noodles",imgAlt:"Thin Thai rice noodles in a bowl"},{id:"sen-mee",name:{en:"Sen Mee",th:"เส้นหมี่",idn:"Sen mee (bihun beras)"},rom:"sen mee",desc:{en:"Very thin rice vermicelli, finer than sen lek, that cook in seconds. Light and delicate, they work for both soup and dry dishes.",idn:"Bihun beras yang sangat tipis, lebih halus dari sen lek, dan matang dalam hitungan detik. Ringan dan lembut, cocok untuk sup maupun masakan kering."},look:{en:"Hair-thin white strands, often sold dried in bundles.",idn:"Helaian putih setipis rambut, sering dijual kering dalam ikatan."},usedIn:[{en:"Mee krob (crispy sweet noodles)",idn:"Mee krob (mi garing manis)"},{en:"Stir-fried vermicelli dishes",idn:"Tumis bihun"},{en:"Light soup noodles",idn:"Mi kuah ringan"}],imgQuery:"Rice vermicelli Thai",imgAlt:"Thin dried rice vermicelli noodles"},{id:"ba-mee",name:{en:"Ba Mee",th:"บะหมี่",idn:"Ba mee (mi telur)"},rom:"ba mee",desc:{en:"Yellow wheat-and-egg noodles with a springy bite, like Chinese egg noodles. Different from the rice noodles above and sold fresh at noodle shops.",idn:"Mi kuning dari terigu dan telur yang kenyal, mirip mi telur ala Tionghoa seperti bakmi. Beda dengan mi beras di atas, dan biasanya dijual segar di warung mi."},look:{en:"Yellow, wavy or straight, with a firm bouncy texture.",idn:"Kuning, keriting atau lurus, teksturnya padat dan kenyal."},usedIn:[{en:"Ba mee moo daeng (red roast pork)",idn:"Ba mee moo daeng (mi babi panggang merah)"},{en:"Ba mee giew (wonton noodles)",idn:"Ba mee giew (mi pangsit)"},{en:"Khao soi",idn:"Khao soi"},{en:"Dry noodles with crispy pork",idn:"Mi kering dengan babi garing"}],imgQuery:"Ba mee egg noodles Thailand",imgAlt:"Thai egg noodles with roast pork and greens"},{id:"woon-sen",name:{en:"Woon Sen",th:"วุ้นเส้น",idn:"Woon sen (soun kacang hijau)"},rom:"woon sen",desc:{en:"Glass noodles made from mung bean starch. They turn clear when cooked and take on the flavor of whatever they are cooked with. Gluten-free.",idn:"Soun dari pati kacang hijau. Jadi bening saat matang dan menyerap rasa kuah atau saus yang dimasak bersamanya. Bebas gluten."},look:{en:"Translucent, springy, slippery strands.",idn:"Helaian bening, kenyal, dan licin."},usedIn:[{en:"Yum Woon Sen (spicy salad)",idn:"Yum woon sen"},{en:"Suki (Thai hot pot)",idn:"Suki"},{en:"Gaeng Jued (clear soup)",idn:"Gaeng jued"},{en:"Goong ob woon sen (baked prawns with glass noodles)",idn:"Goong ob woon sen (udang panggang dengan soun)"}],imgQuery:"Glass noodles mung bean Thailand",imgAlt:"Cooked translucent glass noodles"},{id:"mama",name:{en:"Mama (Instant Noodles)",th:"มาม่า",idn:"Mama (mi instan Thai)"},rom:"ma-ma",desc:{en:`Thailand's instant noodle brand, so popular that "mama" means instant noodles in general. Thais eat them as soup with an egg, as a spicy salad (yum mama) or stir-fried, as a cheap fast meal or drinking snack.`,idn:'Merek mi instan andalan Thailand, saking populernya "mama" jadi sebutan untuk semua mi instan (seperti "Indomie" di Indonesia). Dimakan sebagai mi kuah dengan telur, salad pedas (yum mama), atau digoreng, sebagai makanan murah-cepat atau camilan teman nongkrong.'},look:{en:"Wavy dried wheat noodle block with seasoning sachets, sold in many flavors including pork and tom yum shrimp.",idn:"Balok mi kering bergelombang dengan sachet bumbu. Rasanya macam-macam, termasuk babi dan tom yum udang."},usedIn:[{en:"Yum Mama (instant noodle salad)",idn:"Yum mama"},{en:"Instant noodle soup with egg and vegetables",idn:"Mi instan kuah dengan telur dan sayur"},{en:"Mama pad (stir-fried instant noodles)",idn:"Mama pad (mi instan goreng)"}],imgQuery:"Mama instant noodles Thailand",imgAlt:"Packs of Mama instant noodles in a Thai shop"}],za=[{step:{en:"Learn the formula: noodle type + broth style + meat. Thais say them in that order, as one string.",idn:"Ingat rumusnya: jenis mi + gaya kuah + daging. Orang Thai menyebutnya berurutan dalam satu tarikan."},th:"ขอเส้นเล็กน้ำใสหมู หนึ่งชาม{P}",rom:"khor sen lek nam sai moo neung chaam {P}"},{step:{en:"Pick the noodle: sen yai (wide), sen lek (thin), sen mee (vermicelli), ba mee (egg noodle) or woon sen (glass noodle).",idn:"Pilih mi: sen yai (lebar), sen lek (tipis), sen mee (bihun), ba mee (mi telur), woon sen (soun)."},th:"ขอเส้นใหญ่{P}",rom:"khor sen yai {P}"},{step:{en:'Soup or dry? "Nam" is soup; "haeng" is dry, mixed with sauce, usually with a small bowl of broth on the side.',idn:'Kuah atau kering? "Nam" artinya berkuah; "haeng" artinya kering, diaduk dengan saus, biasanya dengan mangkuk kecil kuah terpisah.'},th:"ขอแห้ง{P}",rom:"khor haeng {P}"},{step:{en:"Choose the broth: nam sai (clear), nam tok (dark, with blood), tom yum (sour-spicy) or yen ta fo (pink, sweet-sour).",idn:"Pilih kuah: nam sai (bening), nam tok (gelap, pakai darah), tom yum (asam pedas), yen ta fo (pink, asam manis)."},th:"ขอต้มยำ{P}",rom:"khor tom yam {P}"},{step:{en:"Pick the meat: moo (pork), nuea (beef), gai (chicken), look chin (meatballs) or pla (fish). Tell them what you do not want.",idn:"Pilih daging: moo (babi), nuea (sapi), gai (ayam), look chin (bakso), pla (ikan). Sebutkan yang nggak mau kamu makan; kalau nggak makan babi, bilang 'mai sai moo'."},th:"ขอลูกชิ้นไก่ ไม่ใส่เลือด{P}",rom:"khor look chin gai mai sai leuat {P}"},{step:{en:'Choose the size: "tham-ma-da" is regular and "phi-set" is special (bigger portion or more toppings). Boat noodle bowls are tiny, so order several.',idn:'Pilih porsi: "tham-ma-da" itu biasa, "phi-set" itu spesial (porsi lebih besar atau topping lebih banyak). Mangkuk boat noodles kecil, jadi pesan beberapa.'},th:"ขอพิเศษ{P}",rom:"khor phi-set {P}"},{step:{en:"Set the spice level when you order, and say if you want no cilantro. You can season later.",idn:"Atur level pedas saat pesan, dan bilang kalau nggak mau ketumbar. Bumbu bisa ditambah nanti."},th:"ไม่เผ็ด ไม่ใส่ผักชี{P}",rom:"mai phet mai sai phak-chee {P}"},{step:{en:"Use the condiment caddy on the table: sugar (nam tan), fish sauce (nam pla), chili in vinegar (prik nam som) and chili flakes (prik pon). Thais often add a spoon of sugar and a little vinegar-chili. Taste first, then adjust.",idn:"Pakai set bumbu di meja: gula (nam tan), kecap ikan (nam pla), cabai dalam cuka (prik nam som), dan cabai bubuk (prik pon). Orang Thai sering menambah sesendok gula dan sedikit cuka cabai. Cicipi dulu, baru sesuaikan."},th:"ขอน้ำตาลกับพริกน้ำส้มหน่อย{P}",rom:"khor nam taan gap phrik nam som noi {P}"},{step:{en:"Pay at the counter or when the staff comes, and finish by saying thanks.",idn:"Bayar di kasir atau saat staf datang, lalu tutup dengan ucapan terima kasih."},th:"คิดเงินด้วย{P} ขอบคุณ{P}",rom:"khit ngoen duay {P} khop khun {P}"}]});var Oo,qo=S(()=>{Oo=[{id:"cafe-ari-hopping",group:"cafe",title:{en:"Café-hopping in Ari: Soi Ari 1 & Soi Ari 4 stretch",idn:"Kafe-hopping di Ari: Soi Ari 1 & Soi Ari 4"},desc:{en:"Ari is the neighborhood Bangkok locals pick for a slow café afternoon. Two short side streets (Soi Ari 1 and Soi Ari 4) are packed with specialty coffee bars, bakeries, brunch spots and small interior-design shops within walking distance of the BTS station.",idn:'Ari adalah kawasan pilihan warga Bangkok untuk "hari ngafe". Di Soi Ari 1 dan Soi Ari 4, yang bisa dicapai jalan kaki dari stasiun BTS, berjejer kedai specialty coffee, bakery, tempat brunch, dan toko desain interior kecil.'},special:{en:"Low-key, walkable and very photogenic without feeling like a tourist trap. You can do 2–3 cafés in one lazy afternoon and the whole area feels like a calm break from Sukhumvit and Siam.",idn:"Santai, enak buat jalan kaki, dan fotogenik tanpa terasa seperti jebakan turis. Kamu bisa mampir ke 2–3 kafe dalam satu sore yang santai, pas buat rehat dari hiruk-pikuk Siam dan Sukhumvit."},bestTime:["morning","afternoon"],timeText:{en:"10:00–17:00; many cafés open around 8:00–10:00 and some close early evening (check Google Maps for current hours)",idn:"Rekomendasi 10:00–17:00. Banyak kafe buka sekitar 8:00–10:00 dan ada yang tutup sore hari, jadi cek jam buka di Google Maps"},cost:{min:150,max:450},costNote:{en:"Specialty coffee ≈ 90–150 THB, matcha/latte drinks ≈ 120–200 THB, a pastry or cake ≈ 100–250 THB (estimates).",idn:"Specialty coffee sekitar 90–150 baht, matcha/latte 120–200 baht, pastry atau kue 100–250 baht (perkiraan)."},duration:[2,4],area:"ari",locationText:{en:"Soi Ari 1 and Soi Ari 4, Phaya Thai district",idn:"Soi Ari 1 dan Soi Ari 4, distrik Phaya Thai"},transit:{en:"BTS Ari (Sukhumvit Line), then walk into Soi Ari 1 or Soi Ari 4. (Confirm exit on Google Maps.)",idn:"BTS Ari (Sukhumvit Line), lalu jalan kaki masuk ke Soi Ari 1 atau Soi Ari 4. (Cek pintu keluar di Google Maps.)"},indoor:"indoor",crowd:"both",energy:1,tags:["relaxing","photo","date-night","after-practice","rainy-day"],tips:{en:"Weekends get busy from late morning; go on a weekday morning or after 15:00 for seats. Most cafés are air-conditioned, so this is a great rainy-day plan. Cards are common but keep some cash/QR for small shops.",idn:"Akhir pekan mulai ramai sejak menjelang siang, jadi datang di pagi hari kerja atau setelah pukul 15:00 biar dapat tempat duduk. Kebanyakan kafe ber-AC, jadi cocok juga buat rencana saat hujan. Banyak yang terima kartu, tapi siapkan uang tunai atau QR (QRIS bisa dipakai di merchant yang mendukung) untuk toko kecil."},geoQuery:"Ari, Phaya Thai, Bangkok",mapsQuery:"cafes in Soi Ari 1 Bangkok",imgQuery:"Ari Bangkok street",imgAlt:"A quiet street in the Ari neighborhood of Bangkok with small shops and cafés",imgIllustrative:!0},{id:"cafe-song-wat-riverside",group:"cafe",title:{en:"Song Wat Road: old shophouse coffee by the river",idn:"Song Wat Road: ngopi di ruko tua tepi sungai"},desc:{en:"Song Wat Road runs parallel to the Chao Phraya River in the old Chinatown trading quarter. Century-old shophouses have been turned into small coffee shops, bakeries and design studios, side by side with rice and spice traders that still work.",idn:"Song Wat Road membentang sejajar Sungai Chao Phraya di kawasan dagang Chinatown lama. Ruko berusia lebih dari 100 tahun disulap jadi kedai kopi kecil, bakery, dan studio desain, berdampingan dengan pedagang grosir beras dan rempah yang masih beroperasi."},special:{en:"You get Bangkok heritage architecture, quiet lanes and a coffee in one stroll. It feels very different from the malls and is one of the most atmospheric café zones in the city.",idn:"Arsitektur warisan Bangkok, gang-gang sepi, dan kopi dalam satu kali jalan. Suasananya beda banget dari mal, dan termasuk kawasan kafe paling berkarakter di Bangkok."},bestTime:["morning","afternoon"],timeText:{en:"10:00–16:00; the street is quiet on weekday mornings. Many small shops close early or on certain days (check Google Maps for current hours)",idn:"Rekomendasi 10:00–16:00. Paling sepi di pagi hari kerja. Toko kecil bisa tutup lebih awal atau libur di hari tertentu, jadi cek jam buka di Google Maps"},cost:{min:100,max:400},costNote:{en:"Coffee ≈ 80–150 THB, a pastry ≈ 80–200 THB (estimates). Add a boat ticket if you come by river.",idn:"Kopi sekitar 80–150 baht, roti 80–200 baht (perkiraan). Tambah ongkos perahu kalau datang lewat sungai."},duration:[1.5,3],area:"song-wat",locationText:{en:"Song Wat Road, Samphanthawong (near Ratchawong Pier)",idn:"Song Wat Road, Samphanthawong (dekat Dermaga Ratchawong)"},transit:{en:"Chao Phraya Express Boat to Ratchawong Pier, then walk; or MRT Wat Mangkon / MRT Hua Lamphong plus a taxi or Grab. (Confirm route on Google Maps.)",idn:"Naik Chao Phraya Express Boat ke Dermaga Ratchawong, lalu jalan kaki; atau MRT Wat Mangkon / Hua Lamphong lalu taksi atau Grab. (Cek rute di Google Maps.)"},indoor:"both",crowd:"both",energy:1,tags:["photo","hidden-gem","relaxing","date-night"],weather:{en:"The street itself is outdoors with little shade. Go before 11:00 or late afternoon in hot season and duck into a café when it rains.",idn:"Jalannya terbuka dan nggak banyak teduhan. Saat panas, datang sebelum pukul 11:00 atau sore hari, dan berteduh di kafe kalau hujan."},tips:{en:"Watch for trucks and motorbikes squeezing through the narrow street, and do not block working shop doors when taking photos. Combine with Yaowarat street food in the evening.",idn:"Hati-hati dengan truk dan motor yang lewat di jalan sempit. Saat foto, jangan halangi pintu toko yang sedang buka. Malamnya, gabungkan dengan jajanan kaki lima di Yaowarat."},geoQuery:"Song Wat Road, Bangkok",mapsQuery:"cafe Song Wat Road Bangkok",imgQuery:"Song Wat Road Bangkok",imgAlt:"Old Chinese-style shophouses along Song Wat Road in Bangkok",imgIllustrative:!1},{id:"cafe-talat-noi-alleys",group:"cafe",title:{en:"Talat Noi alley cafés: coffee between shrines and garages",idn:"Kafe gang Talat Noi: ngopi di antara kuil dan bengkel"},desc:{en:"Talat Noi is an old Chinese-Thai riverside community of tiny alleys, auto-parts workshops and shrines. A handful of cafés have opened inside old houses and warehouses, so you can sip a cold brew in a courtyard right next to a mechanic.",idn:"Talat Noi adalah kawasan tepi sungai lama dengan gang-gang sempit, bengkel suku cadang, dan kuil Tionghoa. Beberapa kafe buka di dalam rumah dan gudang tua, jadi kamu bisa menyeruput cold brew di halaman tepat di sebelah bengkel."},special:{en:"Gritty-meets-cozy is the whole vibe. It is one of the best places in Bangkok to combine coffee, street photography and a sense of how the old city really works.",idn:"Perpaduan rustic dan cozy adalah daya tariknya. Tempat terbaik untuk menikmati kopi, street photography, dan kehidupan sehari-hari Bangkok lama sekaligus."},bestTime:["morning","afternoon"],timeText:{en:"10:00–16:30 (light is good before noon and again late afternoon); check Google Maps for current hours",idn:"10:00–16:30. Cahaya bagus sebelum pukul 12 siang dan sore hari. Cek jam buka di Google Maps"},cost:{min:100,max:350},costNote:{en:"Coffee and a snack ≈ 150–300 THB (estimate).",idn:"Kopi plus camilan sekitar 150–300 baht (perkiraan)."},duration:[1.5,3],area:"talat-noi",locationText:{en:"Talat Noi, Samphanthawong, along Soi Wanit 2 and nearby alleys",idn:"Talat Noi, Samphanthawong, di sepanjang Soi Wanit 2 dan gang sekitarnya"},transit:{en:"Boat to Ratchawong Pier then walk, or MRT Hua Lamphong then a ~20 min walk / short Grab. (Confirm route on Google Maps.)",idn:"Perahu ke Dermaga Ratchawong lalu jalan kaki, atau MRT Hua Lamphong lalu jalan kaki sekitar 20 menit / naik Grab sebentar. (Cek rute di Google Maps.)"},indoor:"both",crowd:"both",energy:2,tags:["hidden-gem","photo","adventurous","relaxing"],weather:{en:"Alleys are outdoors and hot by midday; carry water. Streets can flood briefly in heavy rain.",idn:"Gangnya terbuka dan cukup panas di siang hari. Bawa air minum. Saat hujan deras, jalan bisa tergenang sebentar."},tips:{en:"Alleys are narrow and shared with motorbikes and workers; keep bags in front. Be respectful at shrines (no flash, no loud talking). Ask before photographing people.",idn:"Gangnya sempit dan dipakai bareng motor dan pekerja, jadi taruh tas di depan. Di kuil, hindari flash dan suara keras, dan selalu minta izin dulu sebelum memotret orang."},geoQuery:"Talat Noi, Bangkok",mapsQuery:"cafe Talat Noi Bangkok",imgQuery:"Talat Noi Bangkok",imgAlt:"A narrow alley in Talat Noi, Bangkok, with old buildings and shrines",imgIllustrative:!1},{id:"cafe-charoen-krung-bakery-coffee",group:"cafe",title:{en:"Charoen Krung creative district: coffee, bakeries & galleries",idn:"Kawasan kreatif Charoen Krung: kopi, bakery, galeri"},desc:{en:"Charoen Krung is Bangkok's oldest road and now a creative district. Between Soi Charoen Krung 30 (home to Warehouse 30) and the old Bang Rak streets you will find third-wave coffee shops, bakeries, small galleries and design stores in converted shophouses.",idn:"Charoen Krung adalah jalan tertua di Bangkok dan kini jadi kawasan kreatif. Dari Soi Charoen Krung 30 (lokasi Warehouse 30) sampai jalan-jalan lama Bang Rak, ruko yang direnovasi diisi kedai kopi third-wave, bakery, galeri kecil, dan toko desain."},special:{en:"It pairs a good coffee with art and design in one walkable stretch, with far fewer tourists than Siam. Perfect for a slow half-day away from the mall circuit.",idn:"Kopi enak plus seni dan desain dalam satu rute jalan kaki, dengan turis jauh lebih sedikit dibanding Siam. Pas buat setengah hari santai di luar rute mal."},bestTime:["morning","afternoon"],timeText:{en:"10:00–17:00; many galleries and shops are closed on Mondays or have short hours (check Google Maps)",idn:"Rekomendasi 10:00–17:00. Galeri dan toko bisa tutup atau buka sebentar saja di hari Senin (cek Google Maps)"},cost:{min:150,max:500},costNote:{en:"Coffee ≈ 90–160 THB, bakery items ≈ 80–250 THB; most small galleries are free or low-cost (estimates).",idn:"Kopi sekitar 90–160 baht, bakery 80–250 baht; kebanyakan galeri kecil gratis atau murah (perkiraan)."},duration:[2,4],area:"charoen-krung",locationText:{en:"Charoen Krung Road around Soi Charoen Krung 30, Bang Rak",idn:"Charoen Krung Road sekitar Soi Charoen Krung 30, Bang Rak"},transit:{en:"BTS Saphan Taksin plus a short taxi/Grab, or a Chao Phraya Express boat to a nearby pier and a walk. (Confirm route on Google Maps.)",idn:"BTS Saphan Taksin lalu taksi/Grab sebentar, atau Chao Phraya Express Boat ke dermaga terdekat lalu jalan kaki. (Cek rute di Google Maps.)"},indoor:"both",crowd:"both",energy:1,tags:["relaxing","photo","hidden-gem","date-night"],weather:{en:"Walking between spots is outdoors and sunny; plan short hops or take Grab between clusters in the heat.",idn:"Perpindahan antar tempat di luar ruangan dan terik. Kalau panas, naik Grab antar titik."},tips:{en:"This is a spread-out area, so pick 2–3 stops on Google Maps first. Pair it with Warehouse 30 for a full creative-district afternoon.",idn:"Lokasinya menyebar, jadi tandai 2–3 tempat dulu di Google Maps. Gabungkan dengan Warehouse 30 untuk sore kreatif yang lengkap."},geoQuery:"Charoen Krung Road, Bang Rak, Bangkok",mapsQuery:"cafe Charoen Krung Soi 30 Bangkok",imgQuery:"Charoen Krung Road Bangkok",imgAlt:"Charoen Krung Road in Bangkok with old buildings and street life",imgIllustrative:!0},{id:"cafe-ekkamai-hopping",group:"cafe",title:{en:"Ekkamai café run: specialty coffee & brunch around Sukhumvit 63",idn:"Kafe-hopping Ekkamai: specialty coffee & brunch di Sukhumvit 63"},desc:{en:"Ekkamai (Sukhumvit 63) is a trendy neighborhood with a dense mix of specialty coffee bars, brunch cafés, bakeries and design shops, many in stylish converted houses. It is a quick BTS hop from Siam or Thonglor.",idn:"Ekkamai (Sukhumvit 63) adalah kawasan hits yang padat dengan kedai specialty coffee, kafe brunch, bakery, dan toko desain, banyak di antaranya di rumah-rumah yang direnovasi dengan gaya unik. Cuma sebentar naik BTS dari Siam atau Thonglor."},special:{en:"A very Bangkok-local taste of café culture with more interesting interiors than the mall chains, and lots of seating and Wi-Fi if you need a laptop break.",idn:"Interiornya jauh lebih menarik daripada kafe jaringan di mal, dengan banyak tempat duduk dan Wi-Fi, jadi enak juga buat buka laptop. Kamu bisa merasakan budaya kafe lokal Bangkok yang sebenarnya."},bestTime:["morning","afternoon"],timeText:{en:"9:00–17:00 for brunch and coffee (check Google Maps for current hours)",idn:"Rekomendasi 9:00–17:00 untuk brunch dan ngopi (cek jam buka di Google Maps)"},cost:{min:200,max:600},costNote:{en:"Coffee ≈ 100–170 THB; brunch plates ≈ 200–400 THB (estimates).",idn:"Kopi sekitar 100–170 baht, menu brunch 200–400 baht (perkiraan)."},duration:[2,3],area:"ekkamai",locationText:{en:"Sukhumvit 63 (Ekkamai) and nearby sois, Watthana",idn:"Sukhumvit 63 (Ekkamai) dan soi sekitarnya, Watthana"},transit:{en:"BTS Ekkamai (Sukhumvit Line); cafés are a short walk or Grab ride along the soi. (Confirm exit on Google Maps.)",idn:"BTS Ekkamai (Sukhumvit Line). Kafe bisa dicapai jalan kaki menyusuri soi atau naik Grab sebentar. (Cek pintu keluar di Google Maps.)"},indoor:"indoor",crowd:"both",energy:1,tags:["relaxing","photo","after-practice","rainy-day","date-night"],tips:{en:"Cafés in houses can be a 10–15 min walk from the BTS in the heat; take a motorbike taxi or Grab for longer distances. Weekend brunch is busy, so arrive before 11:00.",idn:"Beberapa kafe berjarak 10–15 menit jalan kaki dari BTS, jadi kalau panas naik ojek motor atau Grab. Brunch akhir pekan ramai, jadi datang sebelum pukul 11:00."},geoQuery:"Ekkamai, Watthana, Bangkok",mapsQuery:"specialty coffee Ekkamai Bangkok",imgQuery:"Ekkamai Bangkok",imgAlt:"A street in the Ekkamai area of Bangkok with modern buildings",imgIllustrative:!0},{id:"cafe-thonglor-dessert-crawl",group:"cafe",title:{en:"Thonglor dessert crawl: cakes, bingsu & honey toast",idn:"Dessert crawl di Thonglor: kue, bingsu, honey toast"},desc:{en:"Thonglor (Sukhumvit 55) is Bangkok's dessert-and-brunch playground: patisseries, Japanese- and Korean-style bingsu spots, soft-serve bars and café-restaurants with polished interiors. Thai dessert chains such as After You (famous for its honey toast) also have branches in malls around the city.",idn:"Thonglor (Sukhumvit 55) adalah surganya dessert dan brunch di Bangkok: patisserie, kedai bingsu ala Jepang dan Korea, soft-serve bar, dan kafe-restoran dengan interior cantik. After You, jaringan dessert Thailand yang terkenal dengan honey toast-nya, juga punya cabang di banyak mal di kota."},special:{en:"The best sweet-tooth night out: share 3–4 desserts across a few spots instead of one big meal. Korean-style bingsu (trendy in Indonesian malls too) will feel familiar, with Thai twists like mango and coconut.",idn:"Pas banget buat malam yang manis: berbagi 3–4 dessert di beberapa tempat sebagai ganti satu kali makan besar. Bingsu ala Korea (yang juga lagi tren di mal-mal Indonesia) bakal terasa familiar, tapi dengan sentuhan Thai seperti mangga dan kelapa."},bestTime:["afternoon","evening","night"],timeText:{en:"14:00–22:00; many dessert places stay open until about 22:00 (check Google Maps for current hours)",idn:"14:00–22:00. Toko dessert biasanya buka sampai sekitar pukul 22:00 (cek jam buka di Google Maps)"},cost:{min:200,max:700},costNote:{en:"Bingsu or cake ≈ 150–300 THB each; honey toast ≈ 200–350 THB to share (estimates).",idn:"Bingsu atau kue sekitar 150–300 baht per porsi; honey toast ukuran sharing sekitar 200–350 baht (perkiraan)."},duration:[1.5,3],area:"thonglor",locationText:{en:"Sukhumvit 55 (Thonglor) and nearby sois, Watthana",idn:"Sukhumvit 55 (Thonglor) dan soi sekitarnya, Watthana"},transit:{en:"BTS Thong Lo (Sukhumvit Line), then Grab or a short walk/motorbike taxi into the soi. (Confirm exit on Google Maps.)",idn:"BTS Thong Lo (Sukhumvit Line), lalu Grab, ojek motor, atau jalan kaki masuk ke soi. (Cek pintu keluar di Google Maps.)"},indoor:"indoor",crowd:"group",energy:1,tags:["team-bonding","date-night","after-practice","photo","rainy-day","relaxing"],tips:{en:"Thonglor soi is long; do not try to walk it end to end in the heat. Pick 2–3 spots near each other on Google Maps. Share plates to taste more.",idn:"Soi Thonglor panjang, jadi jangan coba jalan dari ujung ke ujung saat panas. Pilih 2–3 tempat yang berdekatan di Google Maps. Berbagi piring biar bisa cicip lebih banyak."},geoQuery:"Thonglor, Watthana, Bangkok",mapsQuery:"dessert cafe Thonglor Bangkok",imgQuery:"Bingsu dessert",imgAlt:"A bowl of shaved-ice bingsu dessert with fruit toppings",imgIllustrative:!0},{id:"cafe-siam-matcha-dessert",group:"cafe",title:{en:"Siam matcha & dessert break between shopping",idn:"Rehat matcha & dessert di sela belanja di Siam"},desc:{en:"Siam is full of mall cafés and dessert counters in Siam Paragon, Siam Center, Siam Discovery and CentralWorld, plus small cafés on the Siam Square sois. Matcha lattes, Japanese-style parfaits, bingsu and bubble tea are everywhere, all in air-conditioning.",idn:"Siam penuh kafe dan konter dessert di Siam Paragon, Siam Center, Siam Discovery, dan CentralWorld, plus kafe kecil di gang-gang Siam Square. Matcha latte, parfait ala Jepang, bingsu, dan bubble tea ada di mana-mana, semuanya adem ber-AC."},special:{en:"The easiest, most convenient café plan in the city. It works any time, requires no planning, and is walkable from everything else in Siam.",idn:"Rencana ngafe paling gampang dan praktis di kota. Bisa kapan saja, nggak perlu rencana, dan bisa jalan kaki ke mana saja di Siam."},bestTime:["afternoon","evening"],timeText:{en:"11:00–21:00 inside malls (mall hours are typically around 10:00–22:00; check Google Maps)",idn:"11:00–21:00 di dalam mal (mal biasanya buka 10:00–22:00, cek Google Maps)"},cost:{min:120,max:400},costNote:{en:"Matcha latte ≈ 120–200 THB, parfait or bingsu ≈ 150–300 THB (estimates).",idn:"Matcha latte sekitar 120–200 baht, parfait atau bingsu 150–300 baht (perkiraan)."},duration:[1,2],area:"siam",locationText:{en:"Siam Square, Siam Center, Siam Paragon, Siam Discovery",idn:"Siam Square, Siam Center, Siam Paragon, Siam Discovery"},transit:{en:"BTS Siam (Sukhumvit and Silom lines interchange); skywalks connect to the main malls. (Confirm exit on Google Maps.)",idn:"BTS Siam (stasiun transit jalur Sukhumvit dan Silom). Skywalk terhubung langsung ke mal-mal utama. (Cek pintu keluar di Google Maps.)"},indoor:"indoor",crowd:"both",energy:1,tags:["rainy-day","after-practice","team-bonding","photo","relaxing"],tips:{en:"Weekend afternoons are crowded; popular counters have queues. Malls have strong AC, so bring a light layer.",idn:"Sore akhir pekan ramai dan konter populer antre panjang. AC mal cukup dingin, jadi bawa luaran tipis."},geoQuery:"Siam Square, Bangkok",mapsQuery:"matcha cafe Siam Bangkok",imgQuery:"Matcha latte",imgAlt:"A matcha latte in a glass",imgIllustrative:!0},{id:"cafe-phrom-phong-emquartier",group:"cafe",title:{en:"Phrom Phong café afternoon: EmQuartier, Emporium & Benjasiri Park",idn:"Sore ngafe di Phrom Phong: EmQuartier, Emporium & Benjasiri Park"},desc:{en:"Phrom Phong has two big malls (EmQuartier and Emporium) with plenty of cafés, bakeries and dessert counters, a tidy park (Benjasiri Park) for a stroll, and quieter specialty cafés on the sois off Sukhumvit.",idn:"Phrom Phong punya dua mal besar, EmQuartier dan Emporium, dengan banyak kafe, bakery, dan konter dessert, plus Benjasiri Park yang rapi buat jalan santai, dan kafe specialty yang lebih tenang di soi-soi sekitar Sukhumvit."},special:{en:"A polished, comfortable area with plenty of options familiar to Indonesians (Japanese and Korean chains included) and easy transit. Good if you want café time plus shopping without leaving the BTS line.",idn:"Kawasan yang rapi dan nyaman, dengan banyak pilihan yang familiar buat lidah Indonesia. Kamu bisa ngafe dan belanja sekaligus tanpa keluar dari jalur BTS."},bestTime:["afternoon","evening"],timeText:{en:"12:00–20:00 (malls usually 10:00–22:00; check Google Maps for current hours)",idn:"Rekomendasi 12:00–20:00 (mal biasanya 10:00–22:00, cek Google Maps)"},cost:{min:150,max:500},costNote:{en:"Coffee and a dessert ≈ 250–450 THB at mall cafés (estimate). The park is free.",idn:"Kopi plus dessert di kafe mal sekitar 250–450 baht (perkiraan). Tamannya gratis."},duration:[2,3],area:"phrom-phong",locationText:{en:"Phrom Phong: EmQuartier, Emporium, Benjasiri Park",idn:"Phrom Phong: EmQuartier, Emporium, Benjasiri Park"},transit:{en:"BTS Phrom Phong (Sukhumvit Line); malls connect via the station skywalk. (Confirm exit on Google Maps.)",idn:"BTS Phrom Phong (Sukhumvit Line). Mal terhubung langsung lewat skywalk stasiun. (Cek pintu keluar di Google Maps.)"},indoor:"both",crowd:"both",energy:1,tags:["relaxing","rainy-day","after-practice","date-night","team-bonding"],weather:{en:"Benjasiri Park is outdoors; skip it at midday heat or in rain and stay in the malls.",idn:"Benjasiri Park ada di luar ruangan, jadi saat siang terik atau hujan, tetap di mal saja."},tips:{en:"It is a short BTS ride from Siam or Thonglor, so it combines easily with other plans. Weekends are busy at brunch time.",idn:"Cuma sebentar naik BTS dari Siam atau Thonglor, jadi gampang digabung dengan rencana lain. Jam brunch akhir pekan ramai."},geoQuery:"Phrom Phong, Bangkok",mapsQuery:"cafe Phrom Phong EmQuartier Bangkok",imgQuery:"EmQuartier Bangkok",imgAlt:"The EmQuartier shopping mall in Phrom Phong, Bangkok",imgIllustrative:!1},{id:"photo-talat-noi-film-walk",group:"photo",title:{en:"Film photo walk: Talat Noi & old Charoen Krung",idn:"Jalan-jalan foto film: Talat Noi & Charoen Krung lama"},desc:{en:"Bring a film camera, or just your phone, for a walking loop through Talat Noi's narrow lanes, old workshops, shrines, murals and the old Charoen Krung shophouses. It is one of the most photogenic areas in Bangkok.",idn:"Bawa kamera film, atau HP saja, dan susuri gang-gang sempit Talat Noi, bengkel tua, kuil, mural, dan ruko-ruko lama Charoen Krung. Salah satu kawasan paling fotogenik di Bangkok."},special:{en:"Textures, colors and light you will not find in the malls: rusty metal, tiled walls, shrine incense, street art. Mornings give the softest light and fewest people.",idn:"Tekstur dan warna yang nggak bakal kamu temukan di mal: besi berkarat, dinding keramik, dupa kuil, sampai street art. Pagi hari cahayanya paling lembut dan orangnya paling sedikit."},bestTime:["morning","afternoon"],timeText:{en:"08:30–11:00 for soft light and few people, or 16:00–17:30 for golden hour",idn:"08:30–11:00 untuk cahaya lembut dan suasana sepi, atau 16:00–17:30 untuk golden hour"},cost:{min:0,max:300},costNote:{en:"Walking is free; budget for coffee and a snack or film (estimate).",idn:"Jalan kaki gratis; cukup siapkan budget untuk kopi, camilan, atau film (perkiraan)."},duration:[2,3],area:"talat-noi",locationText:{en:"Talat Noi and Charoen Krung Road, Samphanthawong",idn:"Talat Noi dan Charoen Krung Road, Samphanthawong"},transit:{en:"Boat to Ratchawong Pier then walk, or MRT Hua Lamphong plus a ~20 min walk/short Grab. (Confirm route on Google Maps.)",idn:"Perahu ke Dermaga Ratchawong lalu jalan kaki, atau MRT Hua Lamphong lalu jalan kaki sekitar 20 menit / Grab. (Cek rute di Google Maps.)"},indoor:"outdoor",crowd:"both",energy:2,tags:["photo","hidden-gem","adventurous","relaxing"],weather:{en:"Fully outdoors with little shade and heat from late morning. Go early, carry water, and avoid the rain; wet alleys get slippery.",idn:"Semuanya di luar ruangan dengan sedikit teduhan, dan mulai panas sejak menjelang siang. Datang pagi dan bawa air. Saat hujan, gang jadi licin."},tips:{en:"Narrow lanes are shared with workers and motorbikes. Ask before photographing people, be quiet at shrines, and do not block doorways. Keep your camera strap on and bag in front.",idn:"Gang sempit dipakai bareng pekerja dan motor. Minta izin sebelum memotret orang, jaga suara di kuil, dan jangan menghalangi pintu masuk. Kalungkan strap kamera dan taruh tas di depan."},geoQuery:"Talat Noi, Bangkok",mapsQuery:"Talat Noi street art Bangkok",imgQuery:"Talat Noi",imgAlt:"Colorful old buildings and shrine details in the Talat Noi neighborhood of Bangkok",imgIllustrative:!1},{id:"photo-mahanakhon-skywalk",group:"photo",title:{en:"Skyline shots at Mahanakhon SkyWalk",idn:"Foto skyline di Mahanakhon SkyWalk"},desc:{en:"Mahanakhon is one of Bangkok's tallest towers, with an indoor observation deck, a rooftop bar area and a glass-floor SkyWalk. You get a 360-degree view of the Bangkok skyline, from Silom's towers to the river.",idn:"Mahanakhon adalah salah satu gedung tertinggi di Bangkok, dengan dek observasi indoor, area rooftop bar, dan SkyWalk berlantai kaca. Skyline Bangkok terbentang 360 derajat, dari gedung-gedung Silom sampai sungai."},special:{en:'The glass-floor shot is the iconic Bangkok skyline photo, and sunset or blue hour is stunning. Good for a "we were here" group photo.',idn:'Foto di lantai kaca adalah foto skyline Bangkok yang ikonik, dan saat sunset atau blue hour cantik banget. Pas buat foto squad "kami pernah ke sini".'},bestTime:["evening"],timeText:{en:"Arrive ~45–60 min before sunset (sunset is about 17:45–18:15 in Nov–Jan); check Google Maps for current hours",idn:"Datang 45–60 menit sebelum matahari terbenam (sunset sekitar 17:45–18:15 di bulan Nov–Jan). Cek jam buka di Google Maps"},cost:{min:800,max:1500},costNote:{en:"Tickets are the priciest item in this list; indoor deck vs rooftop SkyWalk tiers differ (estimate; check the official booking page for current prices).",idn:"Ini termasuk yang paling mahal di daftar ini. Harga tiket dek observasi indoor dan rooftop SkyWalk berbeda (perkiraan; cek harga terbaru di halaman pemesanan resmi)."},duration:[1.5,2.5],area:"other",locationText:{en:"King Power Mahanakhon, Silom / Sathorn area",idn:"King Power Mahanakhon, kawasan Silom / Sathorn"},transit:{en:"BTS Chong Nonsi, then a short walk. (Confirm exit on Google Maps.)",idn:"BTS Chong Nonsi, lalu jalan kaki sebentar. (Cek pintu keluar di Google Maps.)"},indoor:"both",crowd:"both",energy:2,tags:["photo","date-night","adventurous","team-bonding"],weather:{en:"The SkyWalk is open-air rooftop and can close in heavy rain or strong wind. Check conditions and bring a light layer for the breeze.",idn:"SkyWalk ada di rooftop terbuka dan bisa ditutup saat hujan deras atau angin kencang. Cek cuaca dan bawa luaran tipis untuk angin."},tips:{en:"Book ahead through the official channel to avoid sell-outs. Wear comfortable shoes and clothes; you may be asked to put on shoe covers for the glass floor. Fear of heights is common here; no pressure.",idn:"Pesan dulu lewat kanal resmi supaya nggak kehabisan. Di lantai kaca kamu mungkin diminta memakai pelindung sepatu. Kalau takut ketinggian, jangan dipaksakan."},geoQuery:"King Power Mahanakhon, Bangkok",mapsQuery:"King Power Mahanakhon SkyWalk Bangkok",imgQuery:"Mahanakhon Bangkok",imgAlt:"The Mahanakhon tower in Bangkok with its pixelated spiral facade",imgIllustrative:!1},{id:"photo-wat-arun-sunset-river",group:"photo",title:{en:"Wat Arun at sunset from the river",idn:"Sunset Wat Arun dari Sungai Chao Phraya"},desc:{en:"Wat Arun, the Temple of Dawn, glows at sunset across the Chao Phraya River. Ride the cross-river ferry from Tha Tien Pier to the temple, or shoot from the Tha Tien side and from river-view terraces with the temple's silhouette.",idn:"Wat Arun, Kuil Fajar, bersinar keemasan saat matahari terbenam di seberang Sungai Chao Phraya. Naik feri penyeberangan dari Dermaga Tha Tien ke kuil, atau foto siluetnya dari sisi Tha Tien dan teras-teras berpemandangan sungai."},special:{en:"One of Bangkok's most iconic photos, and the river breeze makes the golden hour comfortable. Easy to combine with Wat Pho and Chinatown nearby.",idn:"Salah satu foto paling ikonik di Bangkok, dan angin sungai bikin golden hour terasa nyaman. Gampang digabung dengan Wat Pho dan Chinatown di dekatnya."},bestTime:["afternoon","evening"],timeText:{en:"Arrive ~16:30 for golden hour; sunset is around 17:45–18:15 in Nov–Jan. Check Google Maps for the temple's current hours and entry rules",idn:"Datang sekitar 16:30 untuk golden hour; sunset sekitar 17:45–18:15 di bulan Nov–Jan. Cek jam buka dan aturan masuk kuil di Google Maps"},cost:{min:0,max:350},costNote:{en:"The cross-river ferry is only a few baht; the temple entry for foreign visitors is typically around 100–200 THB, and riverside drinks cost extra (estimates, check on arrival).",idn:"Feri penyeberangan cuma beberapa baht; tiket masuk kuil untuk turis asing biasanya sekitar 100–200 baht, minuman di tepi sungai terpisah (perkiraan, cek di lokasi)."},duration:[1.5,3],area:"riverside",locationText:{en:"Wat Arun and Tha Tien Pier, Chao Phraya River",idn:"Wat Arun dan Dermaga Tha Tien, Sungai Chao Phraya"},transit:{en:"Chao Phraya Express Boat to Tha Tien Pier (near Wat Pho), then cross-river ferry to Wat Arun; or MRT Sanam Chai plus a ~10 min walk to Tha Tien. (Confirm route on Google Maps.)",idn:"Chao Phraya Express Boat ke Dermaga Tha Tien (dekat Wat Pho), lalu feri penyeberangan ke Wat Arun; atau MRT Sanam Chai lalu jalan kaki sekitar 10 menit ke Tha Tien. (Cek rute di Google Maps.)"},indoor:"outdoor",crowd:"both",energy:2,tags:["photo","date-night","team-bonding","adventurous"],weather:{en:"Outdoors, hot and humid with little shade until late afternoon. Bring water and sunscreen; river conditions can be rough in heavy rain.",idn:"Di luar ruangan, panas dan lembap dengan sedikit teduhan sampai sore. Bawa air dan sunscreen. Saat hujan deras, sungai bisa bergelombang."},tips:{en:"Temples require covered shoulders and knees; carry a light scarf or long pants. Follow signs for restricted areas and be respectful (no climbing where it is not allowed). Watch your bag on crowded ferries.",idn:"Di kuil, bahu dan lutut harus tertutup; bawa syal tipis atau celana panjang. Patuhi tanda area terlarang dan jangan memanjat di tempat yang dilarang. Jaga tas di feri yang padat."},geoQuery:"Wat Arun, Bangkok",mapsQuery:"Wat Arun Bangkok",imgQuery:"Wat Arun sunset",imgAlt:"Wat Arun temple at sunset seen across the Chao Phraya River",imgIllustrative:!1},{id:"photo-warehouse-30",group:"photo",title:{en:"Warehouse 30: creative complex on Charoen Krung",idn:"Warehouse 30: kompleks kreatif di Charoen Krung"},desc:{en:"Warehouse 30 is a cluster of old WWII-era warehouses on Soi Charoen Krung 30 that were turned into a creative complex with cafés, design and lifestyle shops, galleries and event spaces. The industrial brick-and-steel structure is very photogenic.",idn:"Warehouse 30 adalah kumpulan gudang tua era Perang Dunia II di Soi Charoen Krung 30 yang disulap jadi kompleks kreatif berisi kafe, toko desain dan lifestyle, galeri, dan ruang acara. Struktur bata dan bajanya masih utuh, jadi fotogenik banget."},special:{en:"It combines architecture, café time and local design in a single stop, so it is an easy first pick in the Charoen Krung area. Works any time of day.",idn:"Arsitektur, ngopi, dan desain lokal dalam satu tempat, jadi pilihan pertama paling gampang di kawasan Charoen Krung. Cocok didatangi kapan saja."},bestTime:["morning","afternoon"],timeText:{en:"10:00–18:00 is a good range; individual shops have their own hours, so check Google Maps",idn:"Sekitar 10:00–18:00 paling pas. Tiap toko punya jam buka sendiri, jadi cek di Google Maps"},cost:{min:0,max:400},costNote:{en:"Entry to the complex is free; budget for a coffee or a small shop item (estimate).",idn:"Masuk gratis; cukup siapkan budget untuk kopi atau barang kecil (perkiraan)."},duration:[1,2.5],area:"charoen-krung",locationText:{en:"Warehouse 30, Soi Charoen Krung 30, Bang Rak",idn:"Warehouse 30, Soi Charoen Krung 30, Bang Rak"},transit:{en:"BTS Saphan Taksin plus a short taxi/Grab, or a river boat to a nearby pier and a walk. (Confirm route on Google Maps.)",idn:"BTS Saphan Taksin lalu taksi/Grab sebentar, atau perahu sungai ke dermaga terdekat lalu jalan kaki. (Cek rute di Google Maps.)"},indoor:"both",crowd:"both",energy:1,tags:["photo","hidden-gem","relaxing","rainy-day","date-night"],weather:{en:"Courtyards are outdoors, but covered areas and shops give shelter from rain and sun.",idn:"Halamannya terbuka, tapi ada area beratap dan toko untuk berteduh dari hujan dan panas."},tips:{en:"Tenants change over time, so treat any specific shop as unconfirmed and check Google Maps first. Combine with a Charoen Krung café or gallery walk.",idn:"Tenant bisa berganti, jadi cek toko tertentu di Google Maps dulu. Enak digabung dengan jalan-jalan kafe dan galeri di Charoen Krung."},geoQuery:"Warehouse 30, Bangkok",mapsQuery:"Warehouse 30 Charoen Krung Bangkok",imgQuery:"Warehouse 30 Bangkok",imgAlt:"The renovated warehouse complex Warehouse 30 on Charoen Krung Road in Bangkok",imgIllustrative:!1},{id:"photo-bacc-gallery",group:"photo",title:{en:"Bangkok Art and Culture Centre (BACC)",idn:"Bangkok Art and Culture Centre (BACC)"},desc:{en:"BACC is a public contemporary art center in a spiral-ramp building right next to BTS National Stadium. It hosts rotating exhibitions, shops from local designers and a few cafés and bookstores on the lower floors.",idn:"BACC adalah pusat seni kontemporer di gedung berlorong spiral, tepat di sebelah BTS National Stadium. Pamerannya terus berganti, dan di lantai bawah ada toko desainer lokal, kafe, dan toko buku."},special:{en:'Free or low-cost, air-conditioned and ten minutes from Siam: the easiest "art" stop in Bangkok. The spiral interior is itself a great photo backdrop.',idn:'Gratis atau murah, ber-AC, dan 10 menit dari Siam: tempat "seni" paling gampang di Bangkok. Interior spiralnya sendiri jadi latar foto yang keren.'},bestTime:["afternoon"],timeText:{en:"Typically open from about 10:00 to evening and often closed on Mondays; check Google Maps and the current exhibition schedule",idn:"Biasanya buka dari sekitar 10:00 sampai malam dan sering tutup hari Senin. Cek Google Maps dan jadwal pameran terbaru"},cost:{min:0,max:200},costNote:{en:"Many exhibitions are free; some special shows may charge a small fee (estimate).",idn:"Kebanyakan pameran gratis; beberapa pameran khusus mungkin memungut biaya kecil (perkiraan)."},duration:[1,2.5],area:"siam",locationText:{en:"Bangkok Art and Culture Centre, Pathum Wan",idn:"Bangkok Art and Culture Centre, Pathum Wan"},transit:{en:"BTS National Stadium, direct walk from the station. (Confirm exit on Google Maps.)",idn:"BTS National Stadium, bisa langsung jalan kaki dari stasiun. (Cek pintu keluar di Google Maps.)"},indoor:"indoor",crowd:"both",energy:1,tags:["rainy-day","photo","relaxing","after-practice","date-night"],tips:{en:"Photography rules differ by exhibition. Look for signs or ask staff before shooting art. Pair with a Siam Square or MBK stop on the same day.",idn:"Aturan foto beda-beda tiap pameran. Cek tanda atau tanya staf sebelum memotret karya. Enak digabung dengan Siam Square atau MBK di hari yang sama."},geoQuery:"Bangkok Art and Culture Centre, Bangkok",mapsQuery:"Bangkok Art and Culture Centre",imgQuery:"Bangkok Art and Culture Centre",imgAlt:"The curved-ramp building of the Bangkok Art and Culture Centre",imgIllustrative:!1},{id:"photo-yaowarat-neon-night",group:"photo",title:{en:"Yaowarat neon street photography at night",idn:"Street photography neon malam di Yaowarat"},desc:{en:"Yaowarat Road, Bangkok's Chinatown, lights up after dark with neon shop signs, steaming street-food carts and busy sidewalks. It is one of the best places in the city for moody night street photography.",idn:"Yaowarat Road, Chinatown-nya Bangkok, menyala setelah gelap dengan papan neon, gerobak jajanan yang mengepul, dan trotoar yang ramai. Salah satu tempat terbaik di kota untuk street photography malam yang moody."},special:{en:"High energy and plenty of color: you can shoot, snack and people-watch in one loop. Great as the last stop of a day trip.",idn:"Penuh energi dan warna: foto, jajan, dan lihat-lihat orang dalam satu putaran. Pas jadi penutup hari."},bestTime:["evening","night"],timeText:{en:"Start around 18:00–19:00 when carts open; most street food runs until about 23:00 or later (check Google Maps)",idn:"Mulai sekitar 18:00–19:00 saat gerobak-gerobak mulai buka. Kebanyakan jajanan kaki lima buka sampai sekitar jam 23:00 atau lebih (cek Google Maps)"},cost:{min:0,max:400},costNote:{en:"Photography is free; snacks cost about 40–120 THB each (estimates).",idn:"Foto-foto gratis, camilan sekitar 40–120 THB per porsi (perkiraan)."},duration:[1.5,3],area:"yaowarat",locationText:{en:"Yaowarat Road, Samphanthawong (Chinatown)",idn:"Yaowarat Road, Samphanthawong (Chinatown)"},transit:{en:"MRT Wat Mangkon, then a short walk to Yaowarat Road. (Confirm exit on Google Maps.)",idn:"MRT Wat Mangkon, lalu jalan kaki sebentar ke Yaowarat Road. (Cek pintu keluar di Google Maps.)"},indoor:"outdoor",crowd:"both",energy:3,tags:["photo","late-night","adventurous","team-bonding"],weather:{en:"Evenings are cooler, but sidewalks are crowded and humid. Streets can flood briefly in heavy rain.",idn:"Malam lebih sejuk daripada siang, tapi trotoar padat dan lembap. Saat hujan deras, jalan bisa tergenang sebentar."},tips:{en:"Crowds are tight, so keep your phone and wallet secure and carry a small bag in front. Photograph people only with permission, and do not block carts or traffic.",idn:"Ramai dan sempit, jadi jaga HP dan dompet, dan pakai tas kecil di depan badan. Foto orang hanya kalau sudah diizinkan, dan jangan menghalangi gerobak atau lalu lintas."},geoQuery:"Yaowarat Road, Bangkok",mapsQuery:"Yaowarat Road Bangkok",imgQuery:"Yaowarat Road night",imgAlt:"Neon signs and street stalls on Yaowarat Road in Bangkok at night",imgIllustrative:!1},{id:"photo-pak-khlong-talat-flowers",group:"photo",title:{en:"Pak Khlong Talat flower market and Memorial Bridge",idn:"Pasar bunga Pak Khlong Talat & Memorial Bridge"},desc:{en:"Pak Khlong Talat is Bangkok's big wholesale flower market, with mountains of marigolds, orchids and roses just by the river and the Memorial Bridge. It is lively day and night, and a very photogenic spot.",idn:"Pak Khlong Talat adalah pasar grosir bunga terbesar di Bangkok, dengan tumpukan marigold, anggrek, dan mawar yang menggunung tepat di samping sungai dan Memorial Bridge. Ramai siang dan malam, dan spot foto yang keren banget."},special:{en:"Super colorful photos for very little money, and flowers are really cheap. Pair with the river sunset at Wat Arun or an evening stroll by the Memorial Bridge.",idn:"Foto penuh warna dengan modal sangat kecil, dan bunganya murah banget. Gabungkan dengan sunset di Wat Arun atau jalan-jalan sore di sekitar Memorial Bridge."},bestTime:["morning","evening","night"],timeText:{en:"Busiest at night and early morning; many stalls open nearly around the clock, but check Google Maps for current hours",idn:"Paling ramai malam hari dan pagi buta. Banyak lapak buka hampir 24 jam, tapi cek jam buka terbaru di Google Maps"},cost:{min:0,max:200},costNote:{en:"Walking is free; a small bouquet is typically around 50–150 THB (estimate).",idn:"Jalan-jalan gratis, buket kecil biasanya sekitar 50–150 THB (perkiraan)."},duration:[1,2],area:"riverside",locationText:{en:"Pak Khlong Talat, near Memorial Bridge (Phra Phuttha Yodfa)",idn:"Pak Khlong Talat, dekat Memorial Bridge (Phra Phuttha Yodfa)"},transit:{en:"MRT Sanam Chai then a ~10–15 min walk; or Chao Phraya Express Boat to Saphan Phut Pier. (Confirm route on Google Maps.)",idn:"MRT Sanam Chai lalu jalan kaki sekitar 10–15 menit, atau naik Chao Phraya Express Boat dan turun di Dermaga Saphan Phut. (Cek rute di Google Maps.)"},indoor:"outdoor",crowd:"both",energy:2,tags:["photo","hidden-gem","late-night","adventurous"],weather:{en:"Mostly covered walkways but hot and humid; wet floors in the rain, so wear non-slip shoes.",idn:"Sebagian besar jalurnya beratap, tapi panas dan lembap. Lantai licin saat hujan, jadi pakai sepatu antiselip."},tips:{en:"Watch for hand carts and delivery bikes; keep to the side of walkways. Ask before photographing vendors and avoid blocking sellers.",idn:"Hati-hati gerobak dorong dan motor pengantar barang, jalanlah di pinggir. Minta izin dulu sebelum memotret pedagang, dan jangan menghalangi lapak."},geoQuery:"Pak Khlong Talat, Bangkok",mapsQuery:"Pak Khlong Talat flower market Bangkok",imgQuery:"Pak Khlong Talat",imgAlt:"Piles of marigolds and flowers at the Pak Khlong Talat flower market in Bangkok",imgIllustrative:!1},{id:"photo-jim-thompson-house",group:"photo",title:{en:"Jim Thompson House: teak house, garden & art",idn:"Jim Thompson House: rumah jati, taman & seni"},desc:{en:"The Jim Thompson House is a museum of traditional Thai teak houses assembled by an American silk en
