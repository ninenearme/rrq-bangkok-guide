ari Lantai 2 Terminal 2. Kereta menuju Krung Thep Aphiwat, tempat kamu bisa pindah ke MRT Blue Line."},pay:{en:"Distance-based; the operator lists 1.50 THB per km. Hours reported 05:00-24:00. Confirm payment options.",idn:"Tarif per jarak; operator mencantumkan 1,50 THB per km. Jam operasional dilaporkan 05:00-24:00. Pastikan opsi pembayarannya."},watchOut:{en:"Need a second ticket for the MRT; walkway is long with big cases.",idn:"Perlu tiket terpisah untuk MRT; lorongnya panjang kalau bawa case besar."}},{mode:{en:"BMTA buses A1-A4",idn:"Bus bandara A1-A4"},how:{en:"From the Service Hall, Level 1: A1 to Mo Chit, A2 to Victory Monument, A3 to Lumphini Park, A4 to Sanam Luang (per the Nov 2026 guide).",idn:"Dari Service Hall Lantai 1: A1 ke Mo Chit, A2 ke Victory Monument, A3 ke Taman Lumphini, A4 ke Sanam Luang (menurut panduan Nov 2026)."},pay:{en:"Cash; reported 30 THB for A1/A2 and 50 THB for A3/A4.",idn:"Tunai; dilaporkan 30 THB untuk A1/A2 dan 50 THB untuk A3/A4."},watchOut:{en:"Schedules differ between sources; A2 changed its route in 2024.",idn:"Jadwal beda-beda antarsumber; rute A2 berubah di 2024."}},{mode:{en:"Pre-booked van or Grab XL",idn:"Van pesanan atau Grab XL"},how:{en:"Arrange a vehicle in advance or book a larger Grab car in the app.",idn:"Atur kendaraan dari jauh hari atau pesan mobil Grab yang lebih besar di aplikasi."},pay:{en:"Booking terms or app price.",idn:"Tergantung ketentuan pemesanan atau harga di aplikasi."},watchOut:{en:"Confirm size and luggage space.",idn:"Pastikan ukuran mobil dan ruang bagasinya."}}],steps:[{en:"After immigration and baggage claim, exit to the Arrivals area of Terminal 1 (international) or Terminal 2.",idn:"Setelah imigrasi dan ambil bagasi, keluar ke area Kedatangan Terminal 1 (internasional) atau Terminal 2."},{en:"Choose: Red Line (walkway from T2 Level 2), A1-A4 bus (Service Hall Level 1), taxi queue or Grab.",idn:"Pilih: Red Line (lorong dari Lantai 2 T2), bus A1-A4 (Service Hall Lantai 1), antrean taksi, atau Grab."},{en:"Taxi: take a queue ticket at Gate 8 (T1) or the car-park ground floor (T2) and wait for your number.",idn:"Taksi: ambil nomor antrean di Gate 8 (T1) atau lantai dasar gedung parkir (T2), lalu tunggu nomormu."},{en:"Show your Thai destination, ask for the meter, and expect the 50 THB surcharge and tolls.",idn:"Tunjukkan tujuan dalam bahasa Thai, minta argo, dan siap-siap ada biaya tambahan 50 THB dan tol."},{en:"Red Line: walk to the station, check the platform for Krung Thep Aphiwat, then change to the MRT Blue Line with a new fare.",idn:"Red Line: jalan ke stasiun, cek peron arah Krung Thep Aphiwat, lalu pindah ke MRT Blue Line dengan tarif baru."},{en:"Groups with equipment: use Grab XL or a pre-booked van; avoid buses and long walkways with big cases.",idn:"Rombongan yang bawa peralatan: pakai Grab XL atau van pesanan; hindari bus dan lorong panjang kalau bawa case besar."}],scams:[{en:"Drivers who refuse the meter or ask for a fixed price from the arrivals curb.",idn:"Sopir di depan area kedatangan yang menolak argo dan minta harga borongan."},{en:"Touts offering rides before you reach the official queue.",idn:"Calo yang menawarkan tumpangan sebelum kamu sampai di antrean resmi."},{en:"Claims that the airport surcharge is more than the official 50 THB.",idn:"Klaim bahwa biaya tambahan bandara lebih dari 50 THB resmi."}],official:{name:"Don Mueang Airport transport page",url:"https://www.donmueangairport.com/en/transportation"}}],Ua={terms:[{en:"Exit",th:"ทางออก",rom:"thang ok",idn:"Pintu keluar",meaning:{en:"Look for an exit number on signs and maps.",idn:"Cari nomor pintu keluar di papan petunjuk dan peta."}},{en:"Platform",th:"ชานชาลา",rom:"chan-cha-la",idn:"Peron",meaning:{en:"Where you wait for the train.",idn:"Tempat menunggu kereta."}},{en:"Buy a ticket",th:"ซื้อตั๋ว",rom:"sue tua",idn:"Beli tiket",meaning:{en:"Use this when asking where to buy a ticket.",idn:"Pakai ini saat tanya tempat beli tiket."}},{en:"Top up",th:"เติมเงิน",rom:"toem ngoen",idn:"Isi saldo",meaning:{en:"Add value to a card.",idn:"Menambah saldo kartu."}},{en:"Next station",th:"สถานีต่อไป",rom:"sa-tha-ni to-pai",idn:"Stasiun berikutnya",meaning:{en:"Announced on the train before each stop.",idn:"Diumumkan di kereta sebelum tiap pemberhentian."}},{en:"Change line",th:"เปลี่ยนสาย",rom:"plian sai",idn:"Transit",meaning:{en:"Interchange to another line.",idn:"Pindah ke jalur lain."}},{en:"Terminus",th:"ปลายทาง",rom:"plai thang",idn:"Stasiun terakhir",meaning:{en:"End of the line.",idn:"Ujung jalur."}},{en:"Ticket machine",th:"เครื่องจำหน่ายตั๋ว",rom:"khrueang cham-nai tua",idn:"Mesin tiket",meaning:{en:"Self-service ticket machine.",idn:"Mesin tiket swalayan."}},{en:"Ticket office",th:"ห้องจำหน่ายตั๋ว",rom:"hong cham-nai tua",idn:"Loket tiket",meaning:{en:"Staffed counter for tickets and help.",idn:"Loket berpetugas untuk tiket dan bantuan."}},{en:"Single-journey ticket",th:"ตั๋วเที่ยวเดียว",rom:"tua thiao diao",idn:"Tiket sekali jalan",meaning:{en:"One-trip ticket.",idn:"Tiket untuk satu kali perjalanan."}},{en:"Rabbit card",th:"บัตรแรบบิท",rom:"bat rae-bit",idn:"Kartu Rabbit",meaning:{en:"BTS stored-value card.",idn:"Kartu saldo BTS."}},{en:"Elevator",th:"ลิฟต์",rom:"lip",idn:"Lift",meaning:{en:"Useful with luggage and equipment cases.",idn:"Berguna kalau bawa koper dan case peralatan."}},{en:"Escalator",th:"บันไดเลื่อน",rom:"ban-dai luean",idn:"Eskalator",meaning:{en:"Stand on one side so others can pass.",idn:"Berdiri di satu sisi supaya orang lain bisa lewat."}},{en:"Station staff",th:"เจ้าหน้าที่สถานี",rom:"chao-na-thi sa-tha-ni",idn:"Petugas stasiun",meaning:{en:"Ask for help at the gate or counter.",idn:"Minta bantuan di gerbang atau loket."}},{en:"Exit number",th:"ทางออกหมายเลข",rom:"thang ok mai-lek",idn:"Nomor pintu keluar",meaning:{en:"Say the number you need.",idn:"Sebutkan nomor yang kamu butuhkan."}},{en:"Monk seat",th:"ที่นั่งพระภิกษุ",rom:"thi-nang phra-phik-su",idn:"Kursi khusus biksu",meaning:{en:"Priority seat for monks; do not sit there.",idn:"Kursi prioritas untuk biksu; jangan duduk di situ."}}],interchanges:[{place:"Siam",lines:{en:"BTS Sukhumvit Line and BTS Silom Line",idn:"BTS Sukhumvit Line dan Silom Line"},note:{en:"The two BTS lines meet inside the paid area, so no new fare. Malls (Siam Paragon, Siam Center, CentralWorld) connect by skywalk.",idn:"Kedua jalur BTS bertemu di dalam area berbayar, jadi nggak perlu bayar lagi. Mal (Siam Paragon, Siam Center, CentralWorld) terhubung lewat skywalk."}},{place:"Asok / Sukhumvit",lines:{en:"BTS Asok and MRT Sukhumvit",idn:"BTS Asok dan MRT Sukhumvit"},note:{en:"Walking transfer between two systems with separate gates and fares; check the exit.",idn:"Transit jalan kaki antara dua sistem dengan gerbang dan tarif terpisah; cek pintu keluarnya."}},{place:"Mo Chit / Chatuchak Park",lines:{en:"BTS Mo Chit and MRT Chatuchak Park (and nearby MRT Kamphaeng Phet)",idn:"BTS Mo Chit dan MRT Chatuchak Park (dan MRT Kamphaeng Phet di dekatnya)"},note:{en:"Separate gates; useful for Chatuchak market and for DMK bus A1.",idn:"Gerbangnya terpisah; berguna ke Pasar Chatuchak dan bus A1 ke DMK."}},{place:"Phaya Thai",lines:{en:"BTS Phaya Thai and Airport Rail Link",idn:"BTS Phaya Thai dan Airport Rail Link"},note:{en:"Easy change from the airport to the BTS; separate fare.",idn:"Gampang pindah dari bandara ke BTS; tarif terpisah."}},{place:"Sala Daeng / Si Lom",lines:{en:"BTS Sala Daeng and MRT Si Lom",idn:"BTS Sala Daeng dan MRT Si Lom"},note:{en:"Walking link for Silom and Lumphini area; separate fares.",idn:"Terhubung jalan kaki di area Silom dan Lumphini; tarif terpisah."}},{place:"Phetchaburi / Makkasan",lines:{en:"MRT Phetchaburi and Airport Rail Link Makkasan",idn:"MRT Phetchaburi dan Airport Rail Link Makkasan"},note:{en:"Reported to link by a skywalk; separate fares.",idn:"Kabarnya terhubung lewat skywalk; tarif terpisah."}},{place:"Saphan Taksin / Sathorn Pier",lines:{en:"BTS Saphan Taksin and Chao Phraya boat at Sathorn",idn:"BTS Saphan Taksin dan perahu Chao Phraya di Sathorn"},note:{en:"Walk to the pier for river boats.",idn:"Jalan kaki ke dermaga untuk naik perahu sungai."}},{place:"Krung Thep Aphiwat",lines:{en:"SRT Red Line and MRT Blue Line",idn:"SRT Red Line dan MRT Blue Line"},note:{en:"Change here if you came from Don Mueang on the Red Line.",idn:"Transit di sini kalau kamu datang dari Don Mueang naik Red Line."}}],payment:[{operator:"BTS Skytrain",accepts:{en:"Rabbit card, single-journey card, QR purchase at ticket machines",idn:"Kartu Rabbit, kartu sekali jalan, beli pakai QR di mesin tiket"},note:{en:"Reports say bank cards are not accepted at the gates yet; confirm at the station.",idn:"Kabarnya kartu bank belum bisa dipakai di gerbang; pastikan di stasiun."}},{operator:"MRT Blue and Purple (BEM)",accepts:{en:"EMV contactless Visa/Mastercard/UnionPay (credit cards incl. foreign; debit limited to certain Thai issuers)",idn:"Visa/Mastercard/UnionPay contactless EMV (kartu kredit termasuk luar negeri; kartu debit hanya dari bank Thailand tertentu)"},note:{en:"Use one card, same in and out. Stored-value cards ended June 2026 per news.",idn:"Pakai satu kartu yang sama saat masuk dan keluar. Menurut berita, kartu saldo dihentikan Juni 2026."}},{operator:"MRT Yellow (EBM)",accepts:{en:"EMV contactless; foreign credit and debit cards accepted per the operator page",idn:"Contactless EMV; kartu kredit dan debit luar negeri diterima menurut halaman operator"},note:{en:"Transfer discount from Blue Line Lat Phrao with the same card within 30 min.",idn:"Ada diskon transit dari Blue Line Lat Phrao dengan kartu yang sama dalam 30 menit."}},{operator:"MRT Pink",accepts:{en:"Not confirmed on an official page",idn:"Belum terkonfirmasi di halaman resmi"},note:{en:"Test at the station or ask staff.",idn:"Coba di stasiun atau tanya petugas."}},{operator:"Airport Rail Link",accepts:{en:"Contactless debit/credit (reported from 8 Nov 2025), tokens, Smart Pass",idn:"Debit/kredit contactless (dilaporkan sejak 8 Nov 2025), token, Smart Pass"},note:{en:"Foreign card acceptance not detailed.",idn:"Belum ada detail soal kartu luar negeri."}},{operator:"SRT Red Line",accepts:{en:"Check at the station",idn:"Cek di stasiun"},note:{en:"Distance-based fare per the operator.",idn:"Tarif per jarak, menurut operator."}},{operator:"Chao Phraya Express Boat",accepts:{en:"Pay at the pier or on board",idn:"Bayar tunai di dermaga atau di perahu"},note:{en:"Confirm fares at the pier.",idn:"Pastikan tarif di dermaga."}},{operator:"BMTA buses",accepts:{en:"Cash to the conductor",idn:"Tunai ke kondektur"},note:{en:"Card/mobile payment only on some buses.",idn:"Kartu/pembayaran mobile hanya di sebagian bus."}},{operator:"Taxi / Grab / Bolt",accepts:{en:"Taxi: cash; Grab/Bolt: in app",idn:"Taksi: tunai; Grab/Bolt: di aplikasi"},note:{en:"Add and test your card in the app before arrival.",idn:"Daftarkan dan coba kartumu di aplikasi sebelum tiba."}}],rules:[{en:"BTS, MRT, ARL and the Red Line use separate tickets and fares; changing systems means leaving the gates and paying again.",idn:"BTS, MRT, ARL, dan Red Line pakai tiket dan tarif terpisah; pindah sistem berarti keluar gerbang dan bayar lagi."},{en:"Tap out with the same card you tapped in with.",idn:"Tap keluar dengan kartu yang sama saat tap masuk."},{en:"Check the exit number before you leave the station.",idn:"Cek nomor pintu keluar sebelum meninggalkan stasiun."},{en:"Let people off first, stand on one side of the escalator and move away from the doors.",idn:"Dahulukan yang turun, berdiri di satu sisi eskalator, dan menjauh dari pintu."},{en:"Do not eat or drink on trains or in the paid area.",idn:"Jangan makan atau minum di kereta atau di area berbayar."},{en:"Respect monk seats and priority seating.",idn:"Hormati kursi biksu dan kursi prioritas."},{en:"Plan around rush hours and avoid big cases on crowded trains.",idn:"Hindari jam sibuk dan jangan bawa case besar di kereta yang penuh."},{en:"Carry small notes and coins and a backup payment method for each system.",idn:"Bawa uang kecil, koin, dan cara bayar cadangan untuk tiap sistem."}]},Ja=[{name:{en:"Siam Paragon",idn:"Siam Paragon"},th:"สยามพารากอน",rom:"sa-yam pa-ra-gon",hint:{en:"Luxury mall at BTS Siam.",idn:"Mal mewah di BTS Siam."}},{name:{en:"CentralWorld",idn:"CentralWorld"},th:"เซ็นทรัลเวิลด์",rom:"sen-tran woen",hint:{en:"Huge mall near BTS Chit Lom and Siam.",idn:"Mal raksasa dekat BTS Chit Lom dan Siam."}},{name:{en:"Siam Center",idn:"Siam Center"},th:"สยามเซ็นเตอร์",rom:"sa-yam sen-toe",hint:{en:"Fashion mall next to Siam Paragon.",idn:"Mal fashion di sebelah Siam Paragon."}},{name:{en:"MBK Center",idn:"MBK Center"},th:"เอ็มบีเค เซ็นเตอร์",rom:"em-bi-khe sen-toe",hint:{en:"Budget mall by BTS National Stadium.",idn:"Mal murah di samping BTS National Stadium."}},{name:{en:"ICONSIAM",idn:"ICONSIAM"},th:"ไอคอนสยาม",rom:"ai-khon sa-yam",hint:{en:"Riverside mall; boat from Sathorn pier.",idn:"Mal tepi sungai; bisa naik perahu dari dermaga Sathorn."}},{name:{en:"Terminal 21 Asok",idn:"Terminal 21 Asok"},th:"เทอร์มินอล 21 อโศก",rom:"toe-mi-non yi-sip-et a-sok",hint:{en:"At BTS Asok and MRT Sukhumvit.",idn:"Langsung terhubung ke BTS Asok dan MRT Sukhumvit."}},{name:{en:"EmQuartier",idn:"EmQuartier"},th:"เอ็มควอเทียร์",rom:"em-khwa-tia",hint:{en:"Mall at BTS Phrom Phong.",idn:"Mal di BTS Phrom Phong."}},{name:{en:"Emporium",idn:"Emporium"},th:"เอ็มโพเรียม",rom:"em-pho-ri-am",hint:{en:"Mall at BTS Phrom Phong.",idn:"Mal di BTS Phrom Phong."}},{name:{en:"Central Embassy",idn:"Central Embassy"},th:"เซ็นทรัล เอ็มบาสซี",rom:"sen-tran em-bat-si",hint:{en:"Luxury mall near BTS Phloen Chit.",idn:"Mal mewah dekat BTS Phloen Chit."}},{name:{en:"One Bangkok",idn:"One Bangkok"},th:"วัน แบงค็อก",rom:"wan baeng-khok",hint:{en:"Large new district near MRT Lumphini.",idn:"Kawasan baru yang luas dekat MRT Lumphini."}},{name:{en:"Yaowarat (Chinatown)",idn:"Yaowarat (Chinatown)"},th:"เยาวราช",rom:"yao-wa-rat",hint:{en:"Street food area; MRT Wat Mangkon.",idn:"Kawasan jajanan kaki lima; dekat MRT Wat Mangkon."}},{name:{en:"Suvarnabhumi Airport",idn:"Bandara Suvarnabhumi"},th:"สนามบินสุวรรณภูมิ",rom:"sa-nam-bin su-wan-na-phum",hint:{en:"BKK; main international airport.",idn:"BKK; bandara internasional utama."}},{name:{en:"Don Mueang Airport",idn:"Bandara Don Mueang"},th:"สนามบินดอนเมือง",rom:"sa-nam-bin don-mueang",hint:{en:"DMK; north of the city.",idn:"DMK; di utara kota."}},{name:{en:"Chatuchak Weekend Market",idn:"Pasar Akhir Pekan Chatuchak"},th:"ตลาดนัดจตุจักร",rom:"ta-lat nat ja-tu-jak",hint:{en:"Near BTS Mo Chit and MRT Chatuchak Park.",idn:"Dekat BTS Mo Chit dan MRT Chatuchak Park."}},{name:{en:"Benjakitti Park",idn:"Taman Benjakitti"},th:"สวนเบญจกิติ",rom:"suan ben-ja-ki-ti",hint:{en:"Park near MRT QSNCC.",idn:"Taman dekat MRT QSNCC."}},{name:{en:"Asiatique The Riverfront",idn:"Asiatique The Riverfront"},th:"เอเชียทีค เดอะ ริเวอร์ฟร้อนท์",rom:"e-chia-thek doe ri-woe-fron",hint:{en:"Riverside night market; boat from Sathorn pier.",idn:"Pasar malam tepi sungai; naik perahu dari dermaga Sathorn."}},{name:{en:"Wat Arun",idn:"Wat Arun"},th:"วัดอรุณราชวราราม",rom:"wat a-run",hint:{en:"Riverside temple; take the express boat to Wat Arun pier, or the cross-river ferry from Tha Tien.",idn:"Kuil di tepi sungai; naik perahu ekspres ke dermaga Wat Arun, atau feri penyeberangan dari Tha Tien."}},{name:{en:"Grand Palace",idn:"Grand Palace"},th:"พระบรมมหาราชวัง",rom:"phra bo-rom-ma-ha-ra-cha-wang",hint:{en:"Dress code applies.",idn:"Ada aturan berpakaian."}},{name:{en:"Khao San Road",idn:"Khao San Road"},th:"ถนนข้าวสาร",rom:"tha-non khao-san",hint:{en:"Backpacker street in the Old Town.",idn:"Jalan backpacker di Kota Tua."}},{name:{en:"Lumphini Park",idn:"Taman Lumphini"},th:"สวนลุมพินี",rom:"suan lum-phi-ni",hint:{en:"Central park at MRT Si Lom/Lumphini.",idn:"Taman di pusat kota, dekat MRT Si Lom/Lumphini."}},{name:{en:"Victory Monument",idn:"Victory Monument"},th:"อนุสาวรีย์ชัยสมรภูมิ",rom:"a-nu-sa-wa-ri chai-sa-mo-ra-phum",hint:{en:"BTS station and bus hub.",idn:"Stasiun BTS dan pusat transit bus."}},{name:{en:"BTS Asok",idn:"BTS Asok"},th:"สถานีอโศก",rom:"sa-tha-ni a-sok",hint:{en:"Interchange with MRT Sukhumvit.",idn:"Transit ke MRT Sukhumvit."}},{name:{en:"BTS Mo Chit",idn:"BTS Mo Chit"},th:"สถานีหมอชิต",rom:"sa-tha-ni mo-chit",hint:{en:"Near MRT Chatuchak Park.",idn:"Dekat MRT Chatuchak Park."}},{name:{en:"BTS Phrom Phong",idn:"BTS Phrom Phong"},th:"สถานีพร้อมพงษ์",rom:"sa-tha-ni phrom-phong",hint:{en:"For EmQuartier and Emporium.",idn:"Untuk ke EmQuartier dan Emporium."}},{name:{en:"MRT QSNCC",idn:"MRT QSNCC"},th:"สถานีศูนย์การประชุมแห่งชาติสิริกิติ์",rom:"sa-tha-ni sun kan-pra-chum haeng-chat si-ri-kit",hint:{en:"For Benjakitti Park.",idn:"Untuk ke Taman Benjakitti."}},{name:{en:"MRT Hua Lamphong",idn:"MRT Hua Lamphong"},th:"สถานีหัวลำโพง",rom:"sa-tha-ni hua-lam-phong",hint:{en:"Gateway to Chinatown.",idn:"Pintu masuk ke Chinatown."}}]});var We,ta,Xa,Za,Zo=S(()=>{We=[{id:"emergency-numbers",topic:{en:"Emergency numbers & who to call",idn:"Nomor darurat & siapa yang harus dihubungi"},icon:"siren",body:{en:"Thailand uses its own emergency numbers (not Indonesia’s 110 / 112 / 113 / 118–119). Police 191, ambulance 1669, fire 199. For anything involving a tourist (scam, theft, lost passport, language trouble) call the Tourist Police on 1155, which has interpreters on standby.",idn:"Nomor darurat Thailand beda dengan Indonesia (110 / 112 / 113 / 118–119). Polisi 191, ambulans 1669, pemadam kebakaran 199. Untuk masalah yang melibatkan turis (penipuan, pencurian, paspor hilang, kendala bahasa), hubungi Polisi Pariwisata di 1155 yang punya penerjemah siaga."},tips:[{en:"Dial the number exactly as written — no +66 and no area code — from a Thai SIM, eSIM or Indonesian roaming phone.",idn:"Tekan nomornya persis seperti tertulis — tanpa +66 dan tanpa kode area — dari SIM Thailand, eSIM, atau HP roaming Indonesia."},{en:"Say your location first (hotel / mall / BTS station name). Screenshot your hotel’s name and address in Thai so you can read it out or show it.",idn:"Sebutkan lokasimu dulu (nama hotel / mal / stasiun BTS). Screenshot nama dan alamat hotelmu dalam bahasa Thai supaya bisa kamu bacakan atau tunjukkan."},{en:"English can be limited on 191 and 1669. If you can’t be understood, switch to 1155 (Tourist Police) or ask a hotel/restaurant staff member to call for you.",idn:"Di 191 dan 1669 bahasa Inggris bisa terbatas. Kalau nggak nyambung, beralih ke 1155 (Polisi Pariwisata) atau minta staf hotel/restoran menelepon untukmu."},{en:"TAT 1672 is an information/assistance line, not an emergency dispatch — check its hours before relying on it late at night.",idn:"TAT 1672 adalah layanan informasi/bantuan wisata, bukan nomor darurat — cek jam operasionalnya sebelum mengandalkannya larut malam."}],source:{name:"TAT News – Tourist Police 1155 / TAT 1672 (older page; 191/199/1669 are standard Thai national numbers)",url:"https://tatnews.org/?p=25686"},type:"fact"},{id:"indonesian-embassy",topic:{en:"Indonesian Embassy (KBRI) & 24h consular help",idn:"KBRI Bangkok & bantuan konsuler 24 jam"},icon:"landmark",body:{en:"The Embassy of the Republic of Indonesia in Bangkok (KBRI Bangkok) is at 600-602 Phetchaburi Road, Ratchathewi, Bangkok 10400. Main line +66-2-252-3135 (office hours, Mon–Fri). 24h consular emergency hotline for Indonesian citizens (WhatsApp/phone): +66-92-903-1103 (alternate +66-96-192-3237). The Kemlu RI Citizen Protection hotline (Jakarta) is +62-812-9007-0027 (WhatsApp), also reachable via the Safe Travel app’s emergency button — an international call/message.",idn:"Kedutaan Besar Republik Indonesia di Bangkok (KBRI Bangkok) beralamat di 600-602 Phetchaburi Road, Ratchathewi, Bangkok 10400. Nomor utama +66-2-252-3135 (jam kerja, Senin–Jumat). Hotline darurat konsuler 24 jam untuk WNI (WhatsApp/telepon): +66-92-903-1103 (alternatif +66-96-192-3237). Hotline Pelindungan WNI Kemlu RI (Jakarta) +62-812-9007-0027 (WhatsApp), juga bisa lewat tombol darurat di aplikasi Safe Travel — panggilan/pesan internasional."},tips:[{en:"Lost or stolen passport: get a police report (Tourist Police / local station) first, then contact the embassy about a new passport or emergency travel document. Keep a photo of your passport page in cloud storage.",idn:"Paspor hilang atau dicuri: minta surat laporan polisi dulu (Polisi Pariwisata / kantor polisi setempat), lalu hubungi KBRI untuk paspor baru atau Surat Perjalanan Laksana Paspor (SPLP). Simpan foto halaman paspormu di cloud."},{en:"The call center also offers emergency interpretation and urgent overseas remittance help (per the embassy page).",idn:"Untuk tinggal lama, daftarkan dirimu di portal Peduli WNI (peduliwni.kemlu.go.id) supaya KBRI bisa menghubungimu saat darurat."},{en:"Save these numbers offline in your phone before you travel; mobile data may not work in an emergency.",idn:"Simpan nomor-nomor ini di kontak HP sebelum berangkat; data seluler bisa saja nggak jalan saat darurat."},{en:"Hours and numbers can change — confirm on the embassy’s official page (kemlu.go.id/bangkok).",idn:"Jam operasional dan nomor bisa berubah — cek lagi di halaman resmi KBRI (kemlu.go.id/bangkok)."}],source:{name:"Embassy of the Republic of Indonesia in Bangkok (KBRI Bangkok / Kemlu RI) – emergency contacts",url:"https://overseas.mofa.go.kr/th-ko/brd/m_22304/view.do?seq=43"},checked:"2026-11-17",type:"fact"},{id:"sim-esim",topic:{en:"SIM & eSIM",idn:"SIM & eSIM"},icon:"smartphone",body:{en:"Tourist SIMs and eSIMs are easy to get at the airport, 7-Eleven-type shops and telecom stores, but Thai rules require ID registration. Expect to show your passport (and a face/selfie check) for a physical SIM. Check the current rules with the operator or NBTC, because registration rules were tightened recently.",idn:"SIM dan eSIM turis gampang didapat di bandara, minimarket seperti 7-Eleven, dan gerai operator, tapi aturan Thailand mewajibkan registrasi identitas. Siap-siap menunjukkan paspor (dan verifikasi wajah/selfie) untuk SIM fisik. Cek aturan terbaru ke operator atau NBTC, karena aturan registrasi baru saja diperketat."},tips:[{en:"Bring your original passport (not a photo) when buying a physical SIM.",idn:"Bawa paspor asli (bukan foto) saat membeli SIM fisik."},{en:"eSIM: check your phone is unlocked and eSIM-compatible, and install it on hotel/airport Wi-Fi before you need it.",idn:"eSIM: pastikan HP-mu nggak terkunci operator dan mendukung eSIM, lalu pasang lewat Wi-Fi hotel/bandara sebelum dibutuhkan."},{en:"Tourist SIMs often have a validity cap (reports say 60 days) and can’t always be topped up — confirm with the seller.",idn:"SIM turis biasanya punya batas masa aktif (kabarnya 60 hari) dan nggak selalu bisa diisi ulang — tanyakan ke penjual."},{en:"Keep your Indonesian SIM safe if you swap physical SIMs (m-banking OTP and WhatsApp), or use eSIM so both stay active.",idn:"Kalau ganti SIM fisik, simpan baik-baik SIM Indonesiamu (buat OTP m-banking dan WhatsApp). Pakai eSIM supaya kedua nomor tetap aktif."}],source:{name:"NBTC (Thailand telecom regulator) – check current SIM rules",url:"https://www.nbtc.go.th/"},type:"advice"},{id:"internet-wifi",topic:{en:"Internet & Wi-Fi",idn:"Internet & Wi-Fi"},icon:"wifi",body:{en:"Mobile data is fast and cheap across Bangkok, and free Wi-Fi is common in malls, cafes and hotels. Mall/cafe Wi-Fi usually needs a phone number or a code from the receipt; hotel Wi-Fi is fine for browsing but not ideal for competitive play.",idn:"Data seluler di Bangkok cepat dan murah, dan Wi-Fi gratis banyak di mal, kafe, dan hotel. Wi-Fi mal/kafe biasanya butuh nomor HP atau kode dari struk; Wi-Fi hotel cukup buat browsing tapi kurang ideal buat main kompetitif."},tips:[{en:"Use a VPN or avoid banking on public Wi-Fi.",idn:"Pakai VPN atau hindari m-banking di Wi-Fi publik."},{en:"Download offline Google Maps for Bangkok and key translations before you go out.",idn:"Unduh peta offline Google Maps untuk Bangkok dan paket bahasa aplikasi penerjemah sebelum keluar."},{en:"Carry a power bank — navigation, Grab and translation drain batteries fast in the heat.",idn:"Bawa power bank — peta, Grab, dan penerjemah bikin baterai cepat habis di cuaca panas."}],source:{name:"TAT – Tourism Authority of Thailand",url:"https://www.tourismthailand.org/"},type:"advice"},{id:"currency",topic:{en:"Currency & exchange",idn:"Mata uang & penukaran"},icon:"banknote",body:{en:"Thai baht (THB, ฿). Notes come in 20, 50, 100, 500 and 1,000. Well-known exchange counters in Bangkok (e.g. Superrich) usually beat airport counters and hotels, but compare rates. Exchange rates vary daily, so always check the live rate.",idn:"Mata uang Thailand adalah baht (THB, ฿). Uang kertasnya 20, 50, 100, 500, dan 1.000. Money changer terkenal di Bangkok (misalnya SuperRich) biasanya lebih untung daripada konter bandara dan hotel, tapi kurs berubah tiap hari, jadi selalu bandingkan dan cek kurs terbaru."},tips:[{en:"Bring clean, undamaged large-denomination notes if exchanging cash (small or torn notes may get worse rates).",idn:"Kalau menukar uang tunai, bawa uang pecahan besar yang bersih dan nggak rusak (uang kecil atau sobek bisa dapat kurs lebih jelek)."},{en:"Carry small notes (20/50/100) — street stalls, tuk-tuks and markets often can’t break 1,000.",idn:"Bawa uang kecil (20/50/100) — pedagang kaki lima, tuk-tuk, dan pasar sering nggak punya kembalian untuk 1.000."},{en:"Count change before leaving a counter. Keep exchange receipts.",idn:"Hitung uangnya sebelum meninggalkan konter, dan simpan struk penukaran."},{en:"Prices shown in this guide are typical-range estimates, not live prices.",idn:"Harga di panduan ini adalah perkiraan kisaran umum, bukan harga real-time."}],source:{name:"Bank of Thailand",url:"https://www.bot.or.th/en/home.html"},type:"advice"},{id:"cash-vs-cards",topic:{en:"Cash vs cards",idn:"Tunai vs kartu"},icon:"credit-card",body:{en:"Malls, hotels, chains and many cafes take Visa/Mastercard (tap-to-pay is common). Street food, markets, tuk-tuks, motorbike taxis and small shops are mostly cash. Plan on carrying cash every day.",idn:"Mal, hotel, jaringan toko, dan banyak kafe menerima Visa/Mastercard (tap-to-pay sudah umum). Jajanan kaki lima, pasar, tuk-tuk, ojek, dan toko kecil kebanyakan tunai. Rencanakan untuk selalu bawa uang tunai tiap hari."},tips:[{en:"If a terminal asks “THB or IDR?”, choose THB — Dynamic Currency Conversion usually gives a worse rate.",idn:"Kalau mesin EDC tanya “THB or IDR?”, pilih THB (baht). Pembayaran dalam rupiah (DCC) biasanya kursnya lebih jelek."},{en:"Some small shops add a card surcharge — ask before paying.",idn:"Beberapa toko kecil menambahkan biaya kartu — tanya dulu sebelum bayar."},{en:"Tell your Indonesian card issuer you’re travelling, and keep a backup card in a separate place.",idn:"Kabari bank penerbit kartumu bahwa kamu ke luar negeri, dan simpan kartu cadangan di tempat terpisah."}],source:{name:"TAT – Tourism Authority of Thailand",url:"https://www.tourismthailand.org/"},type:"advice"},{id:"atm-fees",topic:{en:"ATM withdrawals & fees",idn:"Tarik tunai ATM & biaya"},icon:"landmark",body:{en:"Thai ATMs charge a per-withdrawal fee on foreign cards, widely reported at around 220 THB (some operators differ), on top of your own bank’s overseas fees. The machine usually shows the fee before you confirm. Withdraw larger amounts less often.",idn:"ATM Thailand mengenakan biaya per penarikan untuk kartu luar negeri, umumnya sekitar 220 THB (bisa beda per bank/mesin), belum termasuk biaya luar negeri dari bank Indonesia-mu. Mesin biasanya menampilkan biayanya sebelum kamu konfirmasi. Tarik dalam jumlah besar tapi lebih jarang."},tips:[{en:"Decline “conversion into IDR” if the ATM offers it; choose to be charged in THB.",idn:"Kalau ATM menawarkan konversi ke rupiah, tolak dan tarik tunai dalam baht (THB)."},{en:"Use ATMs inside banks/malls in daylight; cover the keypad, and check for skimmers.",idn:"Pakai ATM di dalam bank/mal pada siang hari, tutupi tombol PIN dengan tangan, dan cek apakah ada skimmer."},{en:"Check your card’s Thai ATM limit and your Indonesian bank’s fee beforehand — amounts above are estimates, not official.",idn:"Sebelum berangkat, cek limit ATM kartumu di Thailand dan biaya dari bank Indonesia-mu. Nominal di atas hanya perkiraan, bukan angka resmi."}],source:{name:"Wise – Money & ATMs in Thailand (secondary source)",url:"https://wise.com/au/blog/money-and-banks-in-thailand"},type:"estimate"},{id:"qr-payment",topic:{en:"QR payments & PromptPay for tourists",idn:"Pembayaran QR & PromptPay"},icon:"qr-code",body:{en:"Thais pay with PromptPay QR almost everywhere. Good news: Indonesia and Thailand have a cross-border QR link (live since 2022), so Indonesian payment apps connected to QRIS from participating banks/e-wallets can scan Thai QR / PromptPay codes at merchants that support it — look for the cross-border/PromptPay signage. The per-transaction limit follows the domestic QRIS limit (Rp10,000,000). Not every QR will work, so still carry cash.",idn:"Orang Thailand bayar pakai QR PromptPay hampir di mana-mana. Kabar baiknya: Indonesia dan Thailand sudah punya koneksi QR lintas negara (aktif sejak 2022), jadi aplikasi pembayaran Indonesia yang terhubung ke QRIS dari bank/e-wallet peserta bisa scan QR Thailand / PromptPay di merchant yang mendukung — cari tanda cross-border/PromptPay. Limit per transaksi mengikuti limit QRIS domestik (Rp10.000.000). Tidak semua QR bisa dipakai, jadi tetap bawa uang tunai."},tips:[{en:"Not every bank or e-wallet in Indonesia supports cross-border QRIS yet — check your app (and its fees and exchange rate) before travel.",idn:"Belum semua bank atau e-wallet Indonesia mendukung QRIS lintas negara. Sebelum berangkat, cek di aplikasimu (termasuk biaya dan kursnya)."},{en:"Street stalls with a personal PromptPay QR often won’t work with foreign apps (QRIS included) — carry cash.",idn:"Pedagang kaki lima yang pakai QR PromptPay pribadi sering tidak bisa dibayar dengan aplikasi luar negeri (termasuk QRIS), jadi siapkan uang tunai."}],source:{name:"Wise – PromptPay for foreigners (secondary source)",url:"https://wise.com/en-th/blog/promptpay-for-foreigners"},type:"advice"},{id:"outlets",topic:{en:"Power outlets & voltage",idn:"Stopkontak & tegangan listrik"},icon:"plug",body:{en:"Thailand runs on about 220–230 V / 50 Hz. Sockets are commonly Types A, B, C (plus the Thai Type O style) — many are universal “multi-hole” sockets. Indonesian plugs (Type C/F, two round pins) usually fit Thai sockets. Indonesia is 230 V, so most Indonesian chargers and devices work without a transformer (check fast-charge wattage).",idn:"Listrik di Thailand sekitar 220–230 V / 50 Hz. Stopkontaknya banyak yang tipe A, B, C (termasuk tipe O khas Thailand), dan stopkontak universal juga umum. Indonesia juga 230 V, jadi sebagian besar charger dan perangkat dari Indonesia bisa dipakai tanpa trafo, dan colokan dua pin bulat (tipe C/F) biasanya pas. Kalau longgar, pakai adaptor universal."},tips:[{en:"Bring a universal adapter + a multi-port USB charger for the team’s many devices.",idn:"Karena perangkatnya banyak, bawa adaptor universal dan charger USB multi-port."},{en:"Check your device label for “100–240V” — hair tools and old chargers may be single-voltage.",idn:"Cek label perangkatmu, ada tulisan “100–240V” atau tidak. Hair dryer/catokan atau charger lama mungkin hanya satu tegangan."},{en:"Loose sockets happen in older buildings; don’t force plugs.",idn:"Di gedung tua stopkontak bisa longgar, jadi jangan memaksa mencolokkan."}],source:{name:"CIA World Factbook – Thailand travel facts (voltage/plug types)",url:"https://www.cia.gov/the-world-factbook/static/5bd6c7d4b6e4990888c7ff4b4ec99f3d/TH-travel-facts.pdf"},type:"fact"},{id:"heat-sun",topic:{en:"Heat & sun safety",idn:"Atasi panas & sinar matahari"},icon:"sun",body:{en:"Bangkok is hot and humid all year; the hottest stretch is roughly March–May. Even in the cooler season (about Nov–Feb) midday sun is strong. Heat exhaustion happens fast if you walk a lot, skip water or drink alcohol in the sun.",idn:"Bangkok panas dan lembap sepanjang tahun. Masa terpanas kira-kira Maret–Mei, dan bahkan di musim yang lebih sejuk (sekitar Nov–Feb) matahari siang tetap terik. Kalau banyak jalan kaki, jarang minum, atau minum alkohol di bawah terik, heat exhaustion bisa datang dengan cepat."},tips:[{en:"Drink water regularly and add electrolytes (sports drinks) on long, sweaty days; pale urine = good sign.",idn:"Minum air sesering mungkin, dan di hari yang bikin banyak keringat tambah elektrolit lewat minuman isotonik. Urine berwarna pucat = tanda bagus."},{en:"Wear SPF 50, a cap and breathable clothes; plan outdoor sightseeing before ~11:00 or after ~16:00.",idn:"Pakai sunscreen SPF 50, topi, dan baju yang adem; jadwalkan kegiatan luar ruangan sebelum jam 11 atau setelah jam 16."},{en:"Warning signs: dizziness, headache, nausea, stopped sweating, confusion → move to shade/AC, cool down, and seek medical help.",idn:"Kalau pusing, sakit kepala, mual, keringat berhenti, atau linglung, segera ke tempat teduh/ber-AC, dinginkan badan, dan cari pertolongan medis."},{en:"Malls, BTS stations and 7-Elevens are great AC refuges. Bring a light jacket — indoors can be freezing.",idn:"Mal, stasiun BTS, dan 7-Eleven adalah tempat ngadem ber-AC yang pas. Di dalam ruangan bisa dingin banget, jadi bawa jaket tipis."}],source:{name:"Thai Meteorological Department",url:"https://www.tmd.go.th/en"},type:"advice"},{id:"rainy-season",topic:{en:"Rainy season",idn:"Musim hujan"},icon:"cloud-rain",body:{en:"Bangkok’s rainy season runs roughly May to October, peaking around Aug–Oct. Rain usually comes as short, heavy afternoon/evening downpours. Streets can flood quickly and taxis/Grab get scarce.",idn:"Musim hujan di Bangkok kira-kira Mei–Oktober, paling deras sekitar Agustus–Oktober. Biasanya hujan turun singkat tapi deras di sore/malam hari; jalan cepat tergenang dan taksi/Grab jadi susah didapat."},tips:[{en:"Carry a compact umbrella or poncho and put electronics in a dry bag.",idn:"Bawa payung lipat atau jas hujan ponco, dan simpan gadget di dry bag."},{en:"Wet tiles and metal covers are slippery — wear shoes with grip, not smooth-soled sandals.",idn:"Ubin basah dan tutup gorong-gorong besi itu licin. Pakai sepatu yang solnya mencengkeram, bukan sandal yang solnya licin."},{en:"Leave extra time for transport; BTS/MRT is more reliable than road traffic in heavy rain.",idn:"Sisihkan waktu perjalanan ekstra; saat hujan deras, BTS/MRT lebih bisa diandalkan daripada jalan raya."}],source:{name:"Thai Meteorological Department",url:"https://www.tmd.go.th/en"},type:"estimate"},{id:"pm25",topic:{en:"PM2.5 air quality",idn:"Kualitas udara PM2.5"},icon:"wind",body:{en:"Bangkok’s smog season is generally the cool, dry months — roughly December to March, with some years starting earlier or lasting into April. Bad days can reach unhealthy levels; others are fine. Check the daily reading instead of assuming.",idn:"Musim polusi di Bangkok umumnya di bulan-bulan sejuk dan kering, kira-kira Desember–Maret; di beberapa tahun mulai lebih awal atau berlanjut sampai April. Di hari buruk, kadarnya bisa sampai level tidak sehat, tapi ada juga hari yang aman, jadi cek angkanya setiap hari."},tips:[{en:"Check Air4Thai (official PCD site/app) or IQAir before outdoor plans.",idn:"Sebelum kegiatan luar ruangan, cek Air4Thai (situs/aplikasi resmi Departemen Pengendalian Polusi Thailand) atau IQAir."},{en:"On bad days: swap outdoor activities for malls/museums and wear an N95/KF94 mask.",idn:"Di hari buruk, ganti kegiatan luar ruangan dengan ke mal/museum dan pakai masker N95/KF94."},{en:"Hard training outdoors on a high-PM2.5 day isn’t recommended — move it indoors.",idn:"Di hari dengan kadar PM2.5 tinggi, hindari latihan berat di luar ruangan dan pindahkan ke dalam ruangan."},{en:"Bring N95/KF94 masks from home; local pharmacies/7-Elevens also sell masks.",idn:"Bawa masker N95/KF94 dari rumah. Apotek lokal dan 7-Eleven juga jual masker."}],source:{name:"Air4Thai – Pollution Control Department",url:"https://air4thai.pcd.go.th/"},type:"estimate"},{id:"drinking-water",topic:{en:"Drinking water",idn:"Air minum"},icon:"droplet",body:{en:"Don’t drink Bangkok tap water; stick to sealed bottled water (cheap everywhere) or filtered refill machines at your hotel. Restaurant ice is generally commercially made (cylinders with a hole) and widely considered fine.",idn:"Jangan minum air keran di Bangkok; minum air kemasan bersegel (murah di mana-mana) atau isi ulang dari mesin air filter di hotel. Es di restoran umumnya buatan pabrik (bentuk tabung berlubang) dan banyak dianggap aman."},tips:[{en:"Brushing teeth with tap water is fine for most people; use bottled water if you have a sensitive stomach.",idn:"Sikat gigi pakai air keran umumnya aman, tapi kalau perutmu sensitif, pakai air kemasan."},{en:"Check the bottle seal; carry a reusable bottle and refill at hotel/gym filters.",idn:"Cek segel tutup botol, dan bawa tumbler untuk diisi ulang dari filter air di hotel/gym."},{en:"Roadside crushed ice/ice shavings from unknown sources — pass if unsure.",idn:"Es serut dari pedagang pinggir jalan yang asalnya tidak jelas — kalau ragu, skip saja."}],source:{name:"TAT – Tourism Authority of Thailand",url:"https://www.tourismthailand.org/"},type:"advice"},{id:"food-safety",topic:{en:"Food safety & stomach care",idn:"Kebersihan makanan & sakit perut"},icon:"utensils",body:{en:"Street food is a highlight and generally safe if you pick busy stalls with high turnover, food cooked fresh in front of you and hot. Spice, new bacteria and heat can still upset your stomach — most “Bangkok belly” is mild and short.",idn:"Jajanan kaki lima adalah highlight Bangkok, dan umumnya aman kalau kamu pilih lapak yang ramai pembeli, dimasak langsung di depanmu, dan disajikan panas. Tapi rasa pedas, bakteri baru, dan cuaca panas tetap bisa bikin sakit perut — biasanya ringan dan cepat sembuh."},tips:[{en:"Pick busy stalls; avoid food sitting out in the heat, raw shellfish and unwashed salads when unsure.",idn:"Pilih lapak yang ramai; kalau ragu, hindari makanan yang lama terpapar panas, kerang mentah, dan salad yang belum jelas dicuci."},{en:"Ask for “mai phet” (not spicy) the first days, and build up gradually.",idn:"Di hari-hari pertama, pesan “mai phet” (tidak pedas), lalu naikkan level pedasnya pelan-pelan."},{en:"Pack your Indonesian favorites — oral rehydration salts (Oralit), probiotics, anti-diarrheal basics (e.g. Diapet), Tolak Angin, minyak kayu putih; Thai pharmacies also have equivalents.",idn:"Bawa obat andalan dari Indonesia: oralit, probiotik, obat diare (mis. Diapet), Tolak Angin, minyak kayu putih. Apotek di Thailand juga punya padanannya."},{en:"Allergies: show the allergy card in this guide — fish sauce, shrimp paste, oyster sauce and peanuts are in many dishes.",idn:"Kalau punya alergi, tunjukkan kartu alergi di panduan ini. Banyak masakan yang pakai kecap ikan, terasi, saus tiram, dan kacang tanah."},{en:"Severe or bloody diarrhea, fever or dehydration → see a doctor.",idn:"Kalau diare parah, berdarah, atau disertai demam/dehidrasi, segera ke dokter."}],source:{name:"TAT – Tourism Authority of Thailand",url:"https://www.tourismthailand.org/"},type:"advice"},{id:"etiquette",topic:{en:"Everyday etiquette: wai, head & feet",idn:"Etiket dasar — wai, kepala & kaki"},icon:"hand",body:{en:"Thai culture values calm and respect. The “wai” (palms together, slight bow) is a polite greeting; a smile and “sawatdee khrap/kha” is enough for tourists. The head is considered the highest and most respected part of the body, and feet the lowest.",idn:"Budaya Thailand menjunjung ketenangan dan rasa hormat. “Wai” (kedua telapak tangan dirapatkan sambil sedikit menunduk) adalah salam yang sopan; buat turis, senyum dan “sawatdee khrap/kha” sudah cukup. Kepala dianggap bagian tubuh paling tinggi dan terhormat, sedangkan kaki paling rendah."},tips:[{en:"Don’t touch people’s heads (including kids) or ruffle hair as a joke.",idn:"Jangan sentuh kepala orang (termasuk anak-anak) atau mengacak-acak rambut sebagai candaan."},{en:"Don’t point your feet at people or Buddha images, don’t step over people/food, and take your shoes off where there’s a shoe rack.",idn:"Jangan arahkan kaki ke orang atau patung Buddha, jangan melangkahi orang/makanan, dan lepas sepatu kalau ada rak sepatu."},{en:"Stay calm in conflict — raising your voice or losing your temper in public causes “loss of face” and rarely helps.",idn:"Tetap tenang saat ada masalah. Meninggikan suara atau marah di depan umum bikin orang “kehilangan muka” dan malah jarang membantu."},{en:"Monks: women should not touch a monk or hand things to him directly. Give way and keep a respectful distance.",idn:"Biksu: perempuan sebaiknya tidak menyentuh biksu atau menyerahkan barang langsung kepadanya. Beri jalan dan jaga jarak dengan sopan."},{en:"Public displays of heavy affection and loud behavior can offend, especially in temples and with elders.",idn:"Bermesraan berlebihan atau berisik di depan umum bisa dianggap tidak sopan, terutama di kuil dan di depan orang tua."}],source:{name:"TAT – Tourism Authority of Thailand",url:"https://www.tourismthailand.org/"},type:"advice"},{id:"monarchy-law",topic:{en:"Monarchy respect & lèse-majesté law",idn:"Hormati monarki & hukum lèse-majesté"},icon:"scale",body:{en:"The Thai monarchy is deeply revered and Thailand’s lèse-majesté law (Section 112) criminalises defaming or insulting the king, queen, heir or regent — foreigners can be prosecuted too. Don’t joke about, criticise or post disrespectful content about the royal family, in person or online.",idn:"Monarki Thailand sangat dihormati, dan hukum lèse-majesté (Pasal 112 KUHP) menghukum fitnah atau penghinaan terhadap raja, ratu, putra mahkota, atau wali raja — orang asing juga bisa dituntut. Jangan bercanda, mengkritik, atau mengunggah konten tidak sopan tentang keluarga kerajaan, baik langsung maupun online."},tips:[{en:"Stand when the royal anthem plays before cinema screenings, and pause when the national anthem plays at 08:00/18:00 in some public places (e.g. stations, parks).",idn:"Berdirilah saat lagu kerajaan diputar sebelum film di bioskop, dan berhenti sejenak saat lagu kebangsaan diputar jam 08:00/18:00 di beberapa tempat umum (mis. stasiun, taman)."},{en:"Never step on or deface Thai banknotes/coins (they carry the king’s portrait) — if one falls, don’t stamp on it.",idn:"Uang kertas dan koin bergambar raja, jadi jangan diinjak atau dicoret. Kalau jatuh, jangan diinjak dengan kaki."},{en:"Treat royal portraits (common on streets and buildings) respectfully; no memes, no sarcasm.",idn:"Hormati foto-foto kerajaan yang dipajang di jalan dan gedung; jangan dijadikan meme atau bahan sindiran."},{en:"Treat Buddha images with respect: no posing disrespectfully, no climbing, no tattoos/prints of Buddha used as decoration in a careless way.",idn:"Jangan berpose tidak sopan di depan patung Buddha atau memanjatnya, dan hati-hati dengan baju/tato bergambar Buddha yang dipakai sekadar hiasan."}],source:{name:"TAT – Tourism Authority of Thailand",url:"https://www.tourismthailand.org/"},type:"fact"},{id:"temple-dress",topic:{en:"Temple & Grand Palace dress code",idn:"Aturan berpakaian di kuil & Grand Palace"},icon:"church",body:{en:"Temples and the Grand Palace require modest dress: shoulders and knees covered, no see-through, ripped or very short clothes, no sleeveless tops, no flip-flops at some sites. Rules are strictly enforced at the Grand Palace.",idn:"Kuil dan Grand Palace mewajibkan pakaian sopan yang menutup bahu dan lutut. Baju tembus pandang, sobek, terlalu pendek, atau tanpa lengan tidak boleh, dan di beberapa tempat sandal jepit juga dilarang. Di Grand Palace aturannya sangat ketat."},tips:[{en:"Bring a light scarf/long pants or a sarong; shop stalls near some sites rent or sell cover-ups (price estimates vary).",idn:"Bawa syal tipis atau celana panjang, atau sarung. Di dekat beberapa tempat wisata ada yang menyewakan/menjual kain penutup (harganya bervariasi)."},{en:"Take off shoes before entering a temple hall, don’t point feet at Buddha statues, step over thresholds rather than on them.",idn:"Lepas sepatu sebelum masuk ke aula kuil, jangan arahkan kaki ke patung Buddha, dan langkahi ambang pintu — jangan diinjak."},{en:"Be quiet, no flash photos during worship, and ask before photographing monks.",idn:"Jaga ketenangan, matikan flash saat ibadah berlangsung, dan minta izin dulu sebelum memotret biksu."},{en:"Check opening hours and dress rules on the official site/signs the day you go.",idn:"Di hari kunjungan, cek jam buka dan aturan berpakaian di situs resmi atau papan informasi di lokasi."}],source:{name:"Grand Palace official (Bureau of the Royal Household)",url:"https://www.royalgrandpalace.th/en/home"},type:"advice"},{id:"transport-safety",topic:{en:"Transport & road safety",idn:"Transportasi & keselamatan jalan"},icon:"car-taxi-front",body:{en:"BTS/MRT are the safest, most predictable way to get around. Use Grab/Bolt or insist on the meter for taxis. Traffic drives on the LEFT; motorbikes weave and ignore pedestrian space. Thai road accident rates are high, so be extra careful at crossings.",idn:"BTS/MRT adalah cara keliling paling aman dan bisa diprediksi. Untuk taksi, pakai Grab/Bolt atau minta argo dinyalakan. Kendaraan berjalan di lajur KIRI (sama seperti di Indonesia), dan motor sering naik ke trotoar. Angka kecelakaan lalu lintas di Thailand tinggi, jadi tetap waspada meski di zebra cross."},tips:[{en:"Look RIGHT first when crossing (traffic comes from the right) and use overpasses where possible.",idn:"Saat menyeberang, lihat KANAN dulu (kendaraan datang dari kanan). Kalau bisa, pakai jembatan penyeberangan."},{en:"Motorbike taxis (“win”): you must ask for a helmet; many tourists get injured — check your travel insurance covers motorbike use.",idn:"Ojek motor (“win”): wajib minta helm. Banyak turis yang cedera — cek apakah asuransi perjalananmu menanggung naik motor."},{en:"Rent a scooter only if you have a valid license and insurance — many policies refuse claims without them.",idn:"Sewa skuter hanya kalau kamu punya SIM yang berlaku dan asuransi. Tanpa itu, klaim asuransi sering ditolak."},{en:"In Grab: check plate and driver photo, share your trip; do not get into a car that doesn’t match.",idn:"Di Grab, cek pelat nomor dan foto pengemudi, lalu nyalakan fitur bagikan perjalanan. Jangan naik mobil yang datanya tidak cocok."},{en:"Chao Phraya boats/Express: stay seated, hold bags, watch the gap at piers.",idn:"Di perahu Chao Phraya, tetap duduk, pegang tas erat-erat, dan hati-hati dengan celah di dermaga."}],source:{name:"Department of Land Transport – Thailand",url:"https://www.dlt.go.th/en/"},type:"advice"},{id:"scams",topic:{en:"Common tourist scams",idn:"Penipuan turis yang sering terjadi"},icon:"shield-alert",body:{en:"Most Bangkok visits are trouble-free, but a few repeat scams target tourists: the gem/“government sale” scam, the “temple is closed today” tuk-tuk redirect, taxis refusing the meter, and over-priced bar bills. Walk away calmly — you never owe anyone anything.",idn:"Kebanyakan perjalanan ke Bangkok lancar, tapi ada beberapa modus penipuan berulang yang mengincar turis: penipuan permata/“diskon pemerintah”, sopir tuk-tuk yang bilang “kuil tutup hari ini”, taksi yang menolak pakai argo, dan tagihan bar yang dimahalkan. Tinggal pergi dengan tenang — kamu tidak wajib bayar apa pun ke siapa pun."},tips:[{en:"Gem scam: a friendly stranger or tuk-tuk driver says a “special government gem sale” is on — it never is. Skip it.",idn:"Penipuan permata: kalau orang asing yang ramah atau sopir tuk-tuk bilang ada “obral permata khusus dari pemerintah”, itu 100% penipuan. Jangan ikut."},{en:"“Closed temple” scam: someone says the Grand Palace/temple is closed today and offers a cheap tuk-tuk tour. Check opening hours yourself on the official site.",idn:"Penipuan “kuil tutup”: ada yang bilang Grand Palace/kuil tutup hari ini lalu menawarkan tur tuk-tuk murah. Cek sendiri jam bukanya di situs resmi."},{en:"Taxis: if the driver refuses the meter or quotes a flat price, get out and take another or use Grab. Don’t accept “meter broken.”",idn:"Taksi: kalau sopir menolak argo atau minta tarif borongan, turun dan cari taksi lain atau pakai Grab. Jangan terima alasan “argonya rusak”."},{en:"Jet-ski/boat rental scams (more common at beach resorts like Pattaya/Phuket than Bangkok): staff claim “damage” you didn’t cause and demand cash. Take photos/video before and after; never leave your passport as deposit.",idn:"Penipuan sewa jet ski/perahu (lebih sering di pantai seperti Pattaya/Phuket daripada di Bangkok): petugas mengklaim ada “kerusakan” yang bukan ulahmu dan minta uang tunai. Ambil foto/video sebelum dan sesudah sewa, dan jangan pernah jadikan paspor sebagai jaminan."},{en:"Bars/clubs: check the menu prices before ordering, never hand over your card, and verify the bill. Bar “ping-pong show” touts often push inflated bills.",idn:"Bar/klub: cek harga di menu sebelum pesan, jangan serahkan kartumu, dan periksa tagihan dengan teliti. Tempat yang pakai calo sering memberi tagihan yang digelembungkan."},{en:"Fake “friendly student/guide” offers near big sights, and fake ticket sellers — only buy tickets at official counters.",idn:"Waspadai “pelajar/pemandu ramah” atau penjual tiket palsu di dekat tempat wisata besar; beli tiket hanya di loket resmi."},{en:"If scammed: note the plate/place, call Tourist Police 1155.",idn:"Kalau kena tipu, catat pelat nomor/lokasinya dan lapor ke Polisi Pariwisata 1155."}],source:{name:"TAT – Tourist safety & Tourist Police",url:"https://www.tourismthailand.org/"},type:"advice"},{id:"nightlife-safety",topic:{en:"Nightlife, bags & personal safety",idn:"Kehidupan malam & keamanan barang bawaan"},icon:"moon",body:{en:"Bangkok is generally safe for visitors, but petty theft, drink spiking and bag snatching happen in crowded areas and nightlife districts. Keep valuables close and your wits about you.",idn:"Bangkok umumnya aman untuk wisatawan, tapi di tempat ramai dan kawasan hiburan malam bisa terjadi copet, minuman dicampur obat, dan jambret tas. Simpan barang berharga dekat badan dan tetap waspada."},tips:[{en:"Never leave your drink unattended; open drinks from strangers are a bad idea.",idn:"Jangan tinggalkan minumanmu tanpa diawasi, dan jangan minum minuman yang diberikan orang tak dikenal."},{en:"Keep phones out of back pockets and bags in front in markets (Chatuchak) and BTS rush hour.",idn:"Di Pasar Chatuchak dan saat jam sibuk BTS, jangan taruh HP di saku belakang dan pakai tas di depan badan."},{en:"Use the hotel safe for passport/spare cash; carry a photo/copy of the passport.",idn:"Simpan paspor dan uang cadangan di brankas hotel, dan bawa fotokopi atau foto paspor."},{en:"Go home in groups at night and use Grab rather than street touts.",idn:"Kalau malam, pulang rame-rame dan pakai Grab, bukan calo di jalan."}],source:{name:"TAT – Tourist safety",url:"https://www.tourismthailand.org/"},type:"advice"},{id:"pharmacies-hospitals",topic:{en:"Pharmacies & hospitals",idn:"Apotek & rumah sakit"},icon:"cross",body:{en:"Pharmacies are everywhere (look for the green cross; chains like Boots and Watsons are common). Bangkok has internationally known private hospitals such as Bumrungrad International, Bangkok Hospital, Samitivej and the public Chulalongkorn Hospital. Private hospitals are costly; travel insurance is strongly recommended.",idn:"Apotek ada di mana-mana (cari tanda salib hijau; jaringan seperti Boots dan Watsons juga banyak). Bangkok punya RS swasta bertaraf internasional seperti Bumrungrad International, Bangkok Hospital, Samitivej, dan RS negeri Chulalongkorn Hospital. RS swasta mahal, jadi asuransi perjalanan sangat disarankan."},tips:[{en:"Pharmacists can often help with minor issues; write the generic drug name (not the Indonesian brand name) in English.",idn:"Untuk keluhan ringan, kamu bisa konsultasi ke apoteker. Sebutkan nama generik obatnya dalam bahasa Inggris, bukan nama merek Indonesia."},{en:"Prescription/controlled meds (e.g. ADHD, sleep or strong painkillers): bring the original packaging, a prescription and an English doctor’s letter, and check Thai rules before you travel.",idn:"Untuk obat resep/obat yang diawasi (mis. obat ADHD, obat tidur, atau pereda nyeri keras), bawa kemasan asli, resep, dan surat keterangan dokter berbahasa Inggris, dan cek aturan Thailand sebelum berangkat."},{en:"Major private hospitals often have international patient/interpreter services; Indonesian-language support is unlikely, but English is standard at international hospitals — ask when you call.",idn:"Banyak RS swasta besar punya layanan pasien internasional/penerjemah. Layanan bahasa Indonesia kemungkinan kecil ada, tapi bahasa Inggris standar di RS internasional — tanyakan saat menelepon."},{en:"Save your hotel’s Thai address, your insurance number and allergies on your phone.",idn:"Simpan alamat hotel dalam bahasa Thailand, nomor polis asuransi, dan info alergimu di HP."},{en:"Emergency: call 1669 or ask someone nearby to take you to the closest ER.",idn:"Dalam keadaan darurat, telepon 1669 atau minta orang di sekitar mengantarmu ke IGD terdekat."}],source:{name:"Bumrungrad International Hospital (example private hospital)",url:"https://www.bumrungrad.com/"},type:"advice"},{id:"alcohol-rules",topic:{en:"Alcohol rules",idn:"Aturan alkohol"},icon:"wine",body:{en:"Legal drinking/purchase age is 20. Since 29 May 2026, alcohol may generally be sold from 11:00 to 24:00 (the old 14:00–17:00 afternoon ban is gone), with different hours for airports, hotels and licensed entertainment venues. Sales or drinking are restricted in temples, government offices, petrol stations, public parks and public transport, and on some official/religious days.",idn:"Usia legal minum/membeli alkohol adalah 20 tahun. Sejak 29 Mei 2026, alkohol pada umumnya boleh dijual pukul 11:00–24:00 (larangan jual pukul 14:00–17:00 yang lama sudah dihapus); bandara, hotel, dan tempat hiburan berizin punya jam berbeda. Penjualan atau minum alkohol dibatasi di kuil, kantor pemerintah, SPBU, taman umum, transportasi umum, dan pada beberapa hari libur resmi/keagamaan."},tips:[{en:"Carry your passport or ID photo — young-looking visitors are often asked for ID.",idn:"Kalau kelihatan muda, kamu sering diminta tunjukkan identitas, jadi siapkan fotokopi atau foto paspor."},{en:"Sales can be banned on some election and major Buddhist holidays — plan ahead.",idn:"Di hari pemilu dan hari besar Buddha tertentu, penjualan alkohol bisa dilarang — rencanakan dari awal."},{en:"Don’t drink and ride/drive. Don’t drink in the heat without water.",idn:"Jangan menyetir mobil/motor setelah minum, dan kalau minum di cuaca panas, selingi dengan air putih."},{en:"Rules change; hotel and venue staff know current hours.",idn:"Aturan bisa berubah, jadi tanyakan jam terbaru ke staf hotel atau tempat tujuan."}],source:{name:"TAT News – Alcohol sales and consumption rules updated in Thailand (May 2026)",url:"https://www.tatnews.org/2026/05/alcohol-sales-and-consumption-rules-updated-in-thailand/"},checked:"2026-11-17",type:"fact"},{id:"vaping-smoking",topic:{en:"Vaping, e-cigarettes & smoking",idn:"Aturan vape, rokok elektrik & merokok"},icon:"cigarette-off",body:{en:"E-cigarettes, vapes, shisha and e-shisha are illegal in Thailand (ban since 2014); TAT advises visitors not to bring devices, accessories or e-liquid. Tourists have been fined or arrested; later 2026 reports mention a possible policy debate but we found no confirmed change — treat vaping as banned. Smoking is also banned in many indoor spaces, public transport, beaches, parks, markets and airport terminals.",idn:"Rokok elektrik, vape, shisha, dan e-shisha ilegal di Thailand (dilarang sejak 2014); TAT meminta wisatawan tidak membawa perangkat, aksesori, maupun liquid. Sudah ada turis yang didenda atau ditangkap. Beberapa laporan 2026 menyebut ada wacana perubahan kebijakan, tapi kami tidak menemukan perubahan yang pasti — anggap saja tetap dilarang. Merokok juga dilarang di sebagian besar ruang tertutup, transportasi umum, pantai, taman, pasar, dan terminal bandara."},tips:[{en:"Do NOT bring vapes or pods — even in a carry-on or transiting. They can be confiscated and you may be fined or arrested.",idn:"JANGAN bawa vape atau pod sama sekali — baik di bagasi kabin maupun saat transit. Barangnya bisa disita dan kamu bisa didenda atau ditangkap."},{en:"Airports’ terminals are smoke-free; use designated outdoor smoking areas only (fine up to 5,000 THB per violation was announced for airport public areas).",idn:"Terminal bandara bebas asap rokok; merokok hanya di area merokok luar ruangan yang ditentukan (denda hingga 5.000 baht per pelanggaran diumumkan untuk area publik bandara)."},{en:"Beaches, parks, zoos, markets and sports venues are smoke-free zones too.",idn:"Pantai, taman, kebun binatang, pasar, dan fasilitas olahraga juga kawasan tanpa rokok."},{en:"Dispose of cigarette butts in bins; littering is fined.",idn:"Buang puntung rokok ke tempat sampah. Buang sampah sembarangan bisa didenda."}],source:{name:"TAT News – Anti-smoking laws in Thailand",url:"https://www.tatnews.org/2019/11/tat-highlights-anti-smoking-laws-in-thailand/"},checked:"2026-11-17",type:"fact"},{id:"drug-laws",topic:{en:"Drugs & cannabis",idn:"Aturan narkoba & ganja"},icon:"ban",body:{en:"Thailand has strict drug laws. Cannabis flower has been a controlled substance since late June 2025: recreational use was never legal, and tourists can’t use, buy, carry or transport it without a valid Thai prescription (max 30 days supply). Walk-in shop products may be unlicensed. Other drugs carry severe penalties, including long jail terms.",idn:"Hukum narkoba di Thailand sangat ketat. Bunga ganja menjadi zat yang diawasi sejak akhir Juni 2025, dan penggunaan rekreasional tidak pernah legal. Turis tidak boleh memakai, membeli, membawa, atau mengangkutnya tanpa resep Thailand yang sah (maksimal untuk 30 hari). Produk yang dijual di toko bisa saja tidak berizin. Narkoba lain diancam hukuman berat, termasuk penjara bertahun-tahun."},tips:[{en:"Indonesia has some of the world’s strictest drug laws, and Thailand has tightened cannabis rules — avoid all of it.",idn:"Indonesia punya hukum narkoba yang termasuk paling ketat di dunia, dan Thailand sudah memperketat aturan ganja — jauhi semuanya."},{en:"Don’t carry anything for strangers; don’t accept edibles/gummies/vapes from others.",idn:"Jangan bawakan barang titipan orang tak dikenal, dan jangan terima camilan/permen jeli/vape dari orang lain."},{en:"Your own prescription medicines are fine if legal in Thailand — carry the original packaging and prescription; check Thai FDA rules for controlled drugs.",idn:"Obat resep milikmu sendiri boleh dibawa selama legal di Thailand. Bawa kemasan asli dan resepnya, dan untuk obat yang diawasi cek aturan FDA Thailand."},{en:"Questions: Thai FDA hotline 1556.",idn:"Pertanyaan: hotline FDA Thailand 1556."}],source:{name:"TAT News – Cannabis flower now strictly regulated in Thailand (June 2025)",url:"https://www.tatnews.org/2025/06/cannabis-flower-now-strictly-regulated-in-thailand-important-notice-for-tourists/"},checked:"2026-11-17",type:"fact"},{id:"tipping",topic:{en:"Tipping",idn:"Budaya tip"},icon:"hand-coins",body:{en:"Tipping is not mandatory in Thailand. In restaurants, check whether a ~10% service charge is already on the bill; if not, rounding up or leaving small change is appreciated. Amounts below are typical estimates, not rules.",idn:"Di Thailand, tip tidak wajib. Di restoran, cek apakah tagihan sudah termasuk service charge (biasanya sekitar 10%); kalau belum, membulatkan tagihan atau meninggalkan uang kembalian akan dihargai. Nominal di bawah ini perkiraan umum, bukan aturan."},tips:[{en:"Street food stalls: no tip expected.",idn:"Lapak kaki lima: tidak perlu tip."},{en:"Taxis: round up the fare to the nearest 10 THB (estimate). Grab: optional.",idn:"Taksi: bulatkan tarif ke kelipatan 10 baht (perkiraan). Grab: opsional."},{en:"Massage / spa: about 50–100 THB for a standard session (estimate).",idn:"Pijat/spa: sekitar 50–100 baht untuk sesi standar (perkiraan)."},{en:"Hotel porters or housekeeping: 20–50 THB is a common gesture (estimate).",idn:"Porter/housekeeping hotel: 20–50 baht sudah umum (perkiraan)."}],source:{name:"TAT – Tourism Authority of Thailand",url:"https://www.tourismthailand.org/"},type:"estimate"},{id:"vat-refund",topic:{en:"VAT refund for tourists",idn:"Pengembalian PPN untuk turis"},icon:"receipt",body:{en:"Foreign tourists can reclaim VAT on goods from shops showing the “VAT REFUND FOR TOURISTS” sign if they spend at least 2,000 THB (incl. VAT) at one shop on one day and at least 5,000 THB in total. Show your passport at purchase so the shop issues form P.P.10, attach original tax invoices, and take the goods out of Thailand within 60 days.",idn:"Turis asing bisa klaim pengembalian PPN (VAT refund) untuk barang dari toko bertanda “VAT REFUND FOR TOURISTS” kalau belanja minimal 2.000 baht (termasuk PPN) di satu toko pada hari yang sama, dan minimal 5.000 baht secara total. Tunjukkan paspor saat membeli supaya toko menerbitkan formulir P.P.10, lampirkan faktur pajak asli, dan bawa barangnya keluar dari Thailand dalam 60 hari sejak tanggal pembelian."},tips:[{en:"Before check-in, show the goods and P.P.10 to Customs; luxury items (jewellery, watches, glasses, pens, etc.) need a second inspection at the VAT refund office after passport control.",idn:"Sebelum check-in, tunjukkan barang dan P.P.10 ke Bea Cukai. Barang mewah (perhiasan, jam tangan, kacamata, pulpen, dll.) perlu diperiksa lagi di kantor VAT refund setelah pemeriksaan imigrasi."},{en:"Keep goods unpacked/accessible in carry-on or until Customs inspects them; arrive at the airport early.",idn:"Simpan barangnya supaya mudah dikeluarkan sampai diperiksa Bea Cukai, dan datang ke bandara lebih awal."},{en:"Payout options and any fees are explained at the refund counter and on the Revenue Department site — check there for the current method.",idn:"Cara pencairan dan biayanya bisa dicek di loket refund dan situs Revenue Department (Direktorat Pajak Thailand) untuk info terbaru."}],source:{name:"Revenue Department – VAT Refund for Tourists",url:"https://vrtmap.rd.go.th/gps/en/Conditions.aspx"},checked:"2026-11-17",type:"fact"},{id:"lost-stolen",topic:{en:"Lost or stolen items & police reports",idn:"Barang hilang/dicuri"},icon:"search",body:{en:"For theft or loss, ask the Tourist Police (1155) or go to the nearest station for a police report — you’ll need it for insurance and a passport replacement. For items lost on transit or in a taxi, contact the operator or Grab support.",idn:"Kalau kecurian atau kehilangan barang, minta surat laporan polisi dari Polisi Pariwisata (1155) atau kantor polisi terdekat — kamu butuh ini untuk klaim asuransi dan penggantian paspor. Untuk barang yang tertinggal di transportasi umum/taksi, hubungi operatornya atau customer service Grab."},tips:[{en:"Block lost cards immediately via your card issuer’s overseas number.",idn:"Kalau kartu hilang, segera blokir lewat nomor layanan luar negeri bank penerbit kartumu."},{en:"Take photos of your passport, visa/entry stamp and insurance papers and store them in the cloud.",idn:"Foto paspor, cap masuk/visa, dan dokumen asuransi, lalu simpan di cloud."},{en:"Phone lost? Use Find My / Find My Device before wiping.",idn:"HP hilang? Coba fitur Find My / Find My Device dulu sebelum menghapus data."}],source:{name:"Embassy of the Republic of Indonesia in Bangkok (KBRI Bangkok / Kemlu RI)",url:"https://overseas.mofa.go.kr/th-ko/brd/m_22304/view.do?seq=43"},type:"advice"},{id:"travel-insurance",topic:{en:"Travel insurance & medical costs",idn:"Asuransi perjalanan & biaya medis"},icon:"badge-check",body:{en:"Private Bangkok hospitals can be expensive for foreigners, so take travel insurance covering medical care, evacuation and motorbike/sports use if relevant. Pay upfront and file claims later unless the hospital has direct billing with your insurer.",idn:"RS swasta di Bangkok bisa mahal untuk orang asing, jadi ambil asuransi perjalanan yang menanggung biaya medis, evakuasi darurat, dan (kalau perlu) naik motor/olahraga. Kalau RS tidak punya kerja sama direct billing dengan asuransimu, bayar dulu lalu klaim belakangan."},tips:[{en:"Keep itemized receipts and a medical report (English) for claims.",idn:"Untuk klaim, simpan kuitansi rinci dan laporan medis berbahasa Inggris."},{en:"Check whether esports/competition injuries and pre-existing conditions are covered.",idn:"Cek apakah cedera saat turnamen/olahraga dan penyakit bawaan ikut ditanggung."},{en:"Save your insurer’s 24h emergency number in your phone.",idn:"Simpan nomor darurat 24 jam asuransimu di HP."}],source:{name:"Embassy of the Republic of Indonesia in Bangkok (KBRI Bangkok) – consular guidance",url:"https://overseas.mofa.go.kr/th-ko/index.do"},type:"advice"}],ta=Object.assign([{num:"191",label:{en:"Police",idn:"Polisi"}},{num:"1669",label:{en:"Medical emergency / ambulance",idn:"Darurat medis / ambulans"}},{num:"199",label:{en:"Fire",idn:"Pemadam kebakaran"}},{num:"1155",label:{en:"Tourist Police",idn:"Polisi Pariwisata"}},{num:"1672",label:{en:"TAT tourism information",idn:"Info wisata TAT"}}],{note:{en:"Dial these numbers exactly as written (no +66, no area code) from a Thai SIM/eSIM or an Indonesian roaming phone. Indonesia’s 110 / 112 / 113 / 118–119 are NOT used in Thailand. 1155 (Tourist Police) has interpreters on standby; English can be limited on 191/1669. 1672 is an information line, not emergency dispatch — check its hours. KBRI Bangkok 24h consular hotline (WhatsApp/phone): +66-92-903-1103. Kemlu RI Citizen Protection hotline (WhatsApp, Jakarta): +62-812-9007-0027.",idn:"Dari SIM/eSIM Thailand maupun HP roaming Indonesia, cukup tekan nomornya apa adanya tanpa +66 atau kode area. Nomor darurat Indonesia (110 / 112 / 113 / 118–119) tidak dipakai di Thailand. 1155 (Polisi Pariwisata) punya penerjemah yang siaga, sedangkan di 191/1669 bahasa Inggris bisa terbatas. 1672 adalah layanan informasi, bukan panggilan darurat — cek jam operasionalnya. Hotline konsuler KBRI Bangkok (24 jam, WhatsApp/telepon): +66-92-903-1103. Hotline Perlindungan WNI Kemlu RI (WhatsApp, Jakarta): +62-812-9007-0027."}}),Xa=ta.note,Za=[{id:"help",en:"Help me!",idn:"Tolong!",th:"ช่วยด้วย{P}",rom:"chuai duai {P}"},{id:"ambulance",en:"Please call an ambulance.",idn:"Tolong panggilkan ambulans.",th:"ช่วยเรียกรถพยาบาลหน่อย{P}",rom:"chuai riak rot pha-ya-baan noi {P}"},{id:"hospital",en:"Please take me to the hospital.",idn:"Tolong antar saya ke rumah sakit.",th:"ช่วยพาไปโรงพยาบาลหน่อย{P}",rom:"chuai phaa pai rong-pha-ya-baan noi {P}"},{id:"police",en:"Please call the police.",idn:"Tolong panggilkan polisi.",th:"ช่วยเรียกตำรวจหน่อย{P}",rom:"chuai riak tam-ruat noi {P}"},{id:"tourist-police",en:"I need the Tourist Police (1155).",idn:"Saya perlu menghubungi Polisi Pariwisata (1155).",th:"ขอติดต่อตำรวจท่องเที่ยว{P}",rom:"khor tit-tor tam-ruat thong-thiao {P}"},{id:"fire",en:"Fire! Please call the fire department.",idn:"Kebakaran! Tolong hubungi pemadam kebakaran.",th:"ไฟไหม้{P} ช่วยเรียกรถดับเพลิงหน่อย{P}",rom:"fai mai {P} chuai riak rot dap-phloeng noi {P}"},{id:"allergy",en:"I am allergic to ____. Does this dish contain ____?",idn:"Saya alergi ____. Apakah makanan ini mengandung ____?",th:"แพ้ ____ {P} จานนี้มี ____ ไหม{Q}",rom:"phae ____ {P} jaan nee mee ____ mai {Q}",extra:[{en:"Peanut",idn:"Kacang tanah",th:"ถั่วลิสง",rom:"thua li-song"},{en:"Shrimp / shellfish",idn:"Udang / kerang-kerangan",th:"กุ้ง / อาหารทะเลเปลือกแข็ง",rom:"kung / aa-haan tha-le pluek khaeng"},{en:"Egg",idn:"Telur",th:"ไข่",rom:"khai"},{en:"Milk",idn:"Susu",th:"นม",rom:"nom"},{en:"Gluten / wheat",idn:"Gluten /  Wat Thepthidaram and Mahakan Fort. Expect krathong floating, cultural shows and crafts. Site-by-site dates differ slightly between announcements, so check the venue on the day.`,idn:"Loy Krathong 2026 jatuh pada 24 November, saat bulan purnama. Program resmi Pemkot Bangkok (BMA) bertema “Rattanakosin Waterways” digelar 17–29 November di lima lokasi, termasuk Jembatan Rama VIII dan Benteng Phra Sumen, plus rute yang menghubungkan Wat Saket, Wat Ratchanatdaram, Wat Thepthidaram, dan Benteng Mahakan. Kamu bisa sekaligus menikmati menghanyutkan krathong, pertunjukan tradisional, dan workshop kerajinan. Tanggal di tiap lokasi sedikit berbeda antar pengumuman, jadi cek lagi sebelum berangkat."},dates:"2026-11-17 to 2026-11-29",where:{en:"Rama VIII Bridge, Phra Sumen Fort, Wat Saket / Mahakan Fort area (Old Town), and other BMA sites",idn:"Jembatan Rama VIII, Benteng Phra Sumen, area Wat Saket / Benteng Mahakan (Kota Tua), dan lokasi lain"},kind:"festival",source:{name:"TAT News — Loi Krathong 2026 lights up Thailand's rivers and historic cities",url:"https://www.tatnews.org/2026/11/loi-krathong-2026-lights-up-thailands-rivers-and-historic-cities/"},checked:"2026-11-17",mapsQuery:"Mahakan Fort Bangkok"},{id:"enchanting-waterways-mahakan-fort",title:{en:"The Enchanting Waterways of Rattanakosin (Mahakan Fort)",idn:"The Enchanting Waterways of Rattanakosin (Benteng Mahakan)"},blurb:{en:'A BMA-organised Loy Krathong evening event, 23–25 Nov, 17:00–22:00. It features khon and likay performances, krathong and flower-garland workshops, a recreated period-style market, photo spots and food stalls. Free Thai-style outfits ("Chud Thai") are offered for visitors who want to dress up.',idn:"Acara malam Loy Krathong yang digelar Dinas Kebudayaan, Olahraga & Pariwisata Pemkot Bangkok, 23–25 November, setiap hari 17:00–22:00. Ada pertunjukan khon dan likay, workshop membuat krathong dan untaian bunga, area pasar tempo dulu, spot foto, dan lapak makanan. Katanya pengunjung bisa pinjam baju tradisional Thailand (“Chud Thai”) gratis. Pas banget buat foto bareng tim."},dates:"2026-11-23 to 2026-11-25",where:{en:"Mahakan Fort, Wat Saket, Wat Ratchanatdaram and Wat Thepthidaram (Old Town, Phra Nakhon)",idn:"Benteng Mahakan, Wat Saket, Wat Ratchanatdaram, Wat Thepthidaram (Kota Tua, Phra Nakhon)"},kind:"event",source:{name:"The Nation Thailand — Bangkok plans Loy Krathong at 5 sites from November 17",url:"https://www.nationthailand.com/news/tourism/40072970"},checked:"2026-11-17",mapsQuery:"Mahakan Fort Bangkok"},{id:"vijit-chao-phraya-2026",title:{en:"Vijit Chao Phraya 2026 — riverside light festival",idn:"Vijit Chao Phraya 2026 — Festival cahaya tepi sungai"},blurb:{en:"A free light festival along both banks of the Chao Phraya, running nightly 18:00–22:00 at 19 sites between Rama VIII Bridge and Rama III Bridge. Venues include Wat Arun, ICONSIAM and Asiatique Charoen Nakhon Pier. Fireworks and drone shows (800+ drones at Wat Arun) happen on selected dates only, so check the programme before planning around them.",idn:"Festival cahaya gratis di 19 lokasi di kedua tepi Sungai Chao Phraya (antara Jembatan Rama VIII dan Jembatan Rama III), setiap malam 18:00–22:00. Lokasinya termasuk Wat Arun, ICONSIAM, dan Dermaga Asiatique Charoen Nakhon. Kembang api dan drone show (800+ drone di Wat Arun) hanya di tanggal tertentu, jadi cek jadwalnya dulu. Cocok buat jalan-jalan sore di tepi sungai sambil foto-foto."},dates:"2026-11-13 to 2026-12-13",where:{en:"19 riverside sites between Rama VIII Bridge and Rama III Bridge (Wat Arun, ICONSIAM, Asiatique pier)",idn:"19 lokasi tepi sungai antara Jembatan Rama VIII dan Jembatan Rama III (Wat Arun, ICONSIAM, Dermaga Asiatique, dll.)"},kind:"festival",source:{name:"The Nation Thailand — Vijit Chao Phraya opens as TAT targets over 1.4m visitors",url:"https://www.nationthailand.com/news/40073491"},checked:"2026-11-17",mapsQuery:"Wat Arun Bangkok"},{id:"kings-birthday-fathers-day-2026",title:{en:"King Bhumibol's Birthday / Father's Day (5 Dec) — public holiday",idn:"Hari Lahir Raja Bhumibol · Hari Ayah (5/12) — libur nasional"},blurb:{en:"Thailand's National Day, King Bhumibol's Birthday and Father's Day fall on 5 Dec, a Saturday in 2026; the holiday listing shows Monday 7 Dec as the observed day. Expect closed government offices and banks, and a respectful, patriotic mood with yellow decorations and tributes. Check opening hours of shops and venues in advance; a specific 2026 illumination schedule could not be confirmed, so none is listed.",idn:"5 Desember adalah Hari Nasional Thailand sekaligus Hari Lahir Raja Bhumibol dan Hari Ayah. Di tahun 2026 jatuh pada hari Sabtu, dan daftar hari libur mencantumkan Senin 7 Desember sebagai libur pengganti. Kantor pemerintah dan bank tutup, dan kamu mungkin melihat dekorasi kuning serta suasana penghormatan di berbagai sudut kota. Cek jam buka toko dan tempat wisata lebih dulu. Jadwal iluminasi khusus tahun ini belum terkonfirmasi, jadi tidak dicantumkan."},dates:"2026-12-05 to 2026-12-07",where:{en:"Nationwide, tributes concentrated in Old Town / Ratchadamnoen area",idn:"Seluruh negeri (di Bangkok terpusat di Kota Tua / kawasan Ratchadamnoen)"},kind:"event",source:{name:"OfficeHolidays — King Bhumibol's Birthday in Thailand 2026",url:"https://www.officeholidays.com/countries/thailand/king-bhumibols-birthday.php"},checked:"2026-11-17",mapsQuery:"Ratchadamnoen Avenue Bangkok"},{id:"one-bangkok-christmas-2026",title:{en:"Onederous Christmas 2026 at One Bangkok",idn:"Onederous Christmas 2026 di One Bangkok"},blurb:{en:"One Bangkok's festive season runs until 4 Jan 2027 with a giant Christmas tree, a Christmas train, hot-air-balloon and tunnel installations. Onederous Christmas Market is at One Bangkok Park 1–25 Dec and at The Storeys Square 5 Dec–3 Jan, with live jazz Thu–Sun 18:00–22:00 from 19 Nov to 13 Dec.",idn:"Musim liburan di One Bangkok berlangsung sampai 4 Januari 2027, dengan pohon Natal raksasa, kereta Natal, serta instalasi balon udara dan terowongan untuk foto. Onederous Christmas Market ada di One Bangkok Park 1–25 Desember dan di The Storeys Square 5 Desember–3 Januari, plus live jazz Kamis–Minggu 18:00–22:00 dari 19 November sampai 13 Desember. Spot malam yang enak buat jalan santai habis latihan."},dates:"2026-11-13 to 2027-01-04",where:{en:"One Bangkok, Wireless Road (Lumphini / Phloen Chit area)",idn:"One Bangkok (Wireless Road, dekat Lumphini / Phloen Chit)"},kind:"event",source:{name:"The Nation Thailand (press release) — Onederous Christmas 2026: A Onederous Voyage",url:"https://www.nationthailand.com/pr-news/40073448"},checked:"2026-11-17",mapsQuery:"One Bangkok"},{id:"amazing-thailand-countdown-iconsiam",title:{en:"Amazing Thailand Countdown 2027 at ICONSIAM",idn:"Amazing Thailand Countdown 2027 (ICONSIAM)"},blurb:{en:"TAT and ICONSIAM announced a five-day New Year celebration, 27–31 Dec, at ICONSIAM's River Park on the Chao Phraya. Organisers promise a 1,400 m fireworks display, 200+ Thai and international performers and regional Thai food. Riverside areas get very crowded on 31 Dec, so go early.",idn:"Perayaan Tahun Baru lima hari yang diumumkan TAT dan ICONSIAM, 27–31 Desember di ICONSIAM River Park, tepi Sungai Chao Phraya. Penyelenggara menjanjikan kembang api sepanjang 1.400 m, 200+ penampil Thailand dan internasional, serta kuliner Thailand dari berbagai daerah. Tanggal 31 Desember tepi sungai bakal padat banget, jadi datang lebih awal."},dates:"2026-12-27 to 2026-12-31",where:{en:"ICONSIAM River Park, Khlong San (Chao Phraya riverside)",idn:"ICONSIAM River Park, Khlong San (tepi Sungai Chao Phraya)"},kind:"event",source:{name:"Pattaya Mail (NNT) — Bangkok prepares for spectacular five-day Amazing Thailand Countdown 2027",url:"https://www.pattayamail.com/thailandnews/bangkok-prepares-for-spectacular-five-day-amazing-thailand-countdown-2027-571818"},checked:"2026-11-17",mapsQuery:"ICONSIAM Bangkok"},{id:"one-bangkok-countdown-2027",title:{en:"One Bangkok Countdown Celebration 2027",idn:"One Bangkok Countdown 2027"},blurb:{en:"On the evening of 31 Dec 2026, One Bangkok plans live concerts by Thai and international acts, followed by a panoramic fireworks display over the skyline. The line-up had not been announced as of the source (13 Nov 2026).",idn:"Pada malam 31 Desember, One Bangkok berencana menggelar konser live artis Thailand dan internasional, disusul kembang api di atas skyline. Daftar penampil belum diumumkan per tanggal sumber (13 November 2026). Bakal ramai banget, jadi rencanakan rute perjalananmu dari awal."},dates:"2026-12-31 to 2026-12-31",where:{en:"One Bangkok, Wireless Road",idn:"One Bangkok (Wireless Road)"},kind:"event",source:{name:"The Nation Thailand (press release) — Onederous Christmas 2026: A Onederous Voyage",url:"https://www.nationthailand.com/pr-news/40073448"},checked:"2026-11-17",mapsQuery:"One Bangkok"},{id:"cool-season-2026",title:{en:"Cool season has started — milder, drier Bangkok weather",idn:"Musim sejuk Bangkok dimulai — lebih adem dan tidak terlalu lembap"},blurb:{en:"The Thai Meteorological Department says winter officially began on 9 Nov 2026, with Bangkok forecast to cool by 1–3°C. An earlier forecast expected Bangkok lows of about 19–21°C, with the coolest stretch from late December to early February, but a strengthening El Niño may keep the season warmer than usual. It is still sunny by day, so pack sunscreen plus a light layer for evenings.",idn:"Departemen Meteorologi Thailand (TMD) mengumumkan musim dingin (musim sejuk) resmi dimulai sejak 9 November, dengan suhu Bangkok diperkirakan turun 1–3°C. Prakiraan sebelumnya menyebut suhu terendah Bangkok sekitar 19–21°C, dengan periode paling sejuk dari akhir Desember sampai awal Februari, tapi El Niño yang menguat bisa membuat musim ini lebih hangat dari biasanya. Siang hari tetap terik, jadi bawa sunscreen dan jaket tipis untuk malam."},dates:"2026-11-09 to 2027-02-15",where:{en:"Bangkok and upper Thailand",idn:"Bangkok serta Thailand utara & tengah"}
